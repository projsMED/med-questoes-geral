# Questão 01
- tipo: ME
  enunciado: Qual é a duração habitual da febre durante a fase febril da dengue?
  alternativas:
    - A): De dois a sete dias
      comentario: "A fase febril caracteriza-se por febre alta de início abrupto que dura tipicamente entre dois e sete dias."
    - B): De oito a quatorze dias
      comentario: "Períodos febris superiores a uma semana costumam afastar o curso típico da fase febril da dengue."
    - C): De um a dois dias
      comentario: "Uma duração tão curta é atípica e costuma corresponder à febre observada na infecção por Zika."
    - D): De dez a vinte dias
      comentario: "Uma febre com essa duração prolongada sugere outras etiologias infecciosas e não a fase febril da dengue."
  gabarito: A

# Questão 02
- tipo: ME
  enunciado: |-
    Paciente de 32 anos apresenta febre há 4 dias, acompanhada de dor abdominal intensa e contínua, vômitos persistentes e hepatomegalia a 3 cm do rebordo costal.
    
    Diante do quadro, em qual grupo de risco o paciente deve ser classificado?
  alternativas:
    - A): Grupo C
      comentario: "A presença de dor abdominal intensa e vômitos persistentes caracteriza a dengue com sinais de alarme, enquadrando o paciente no Grupo C."
    - B): Grupo A
      comentario: "O Grupo A destina-se a casos sem sinais de alarme, comorbidades ou risco social."
    - C): Grupo B
      comentario: "O Grupo B contempla pacientes com sangramento espontâneo ou induzido ou comorbidades, mas sem sinais de alarme."
    - D): Grupo D
      comentario: "O Grupo D é reservado aos casos de dengue grave com choque manifestado, sangramento grave ou disfunção grave de órgãos."
  gabarito: A

# Questão 03
- tipo: ME
  enunciado: Qual exame laboratorial complementar é de realização obrigatória para todos os pacientes classificados no Grupo B?
  alternativas:
    - A): Hemograma completo
      comentario: "O hemograma completo é obrigatório no Grupo B para avaliar a hemoconcentração e determinar se o manejo prosseguirá como Grupo B ou C."
    - B): Dosagem de transaminases
      comentario: "A dosagem de transaminases é um exame obrigatório para pacientes dos Grupos C e D, não sendo exigido de rotina para o Grupo B."
    - C): Radiografia de tórax
      comentario: "A radiografia de tórax é um exame recomendado na investigação de derrames cavitários em grupos de maior gravidade."
    - D): Dosagem de albumina sérica
      comentario: "A dosagem de albumina sérica é indicada prioritariamente no monitoramento do extravasamento plasmático nos Grupos C e D."
  gabarito: A

# Questão 04
- tipo: ME
  enunciado: |-
    Paciente masculino de 25 anos é diagnosticado com dengue sem sinais de alarme, sem comorbidades ou risco social.
    
    Qual é a orientação de hidratação oral diária adequada para este paciente?
  alternativas:
    - A): 60 mL/kg/dia
      comentario: "Para adultos no Grupo A, recomenda-se a prescrição de 60 mL/kg/dia de líquidos, sendo um terço com sais de reidratação oral."
    - B): 30 mL/kg/dia
      comentario: "Esse volume representa metade do necessário para manter a hidratação adequada e prevenir complicações na fase febril."
    - C): 100 mL/kg/dia
      comentario: "Volumes dessa magnitude são indicados para crianças na faixa de 10 a 20 kg, e não para adultos."
    - D): 10 mL/kg/dia
      comentario: "Este valor corresponde à taxa horária de reposição venosa inicial no Grupo C e não ao volume oral diário."
  gabarito: A

# Questão 05
- tipo: ME
  enunciado: Qual das seguintes manifestações clínicas é classificada como sinal de alarme na dengue?
  alternativas:
    - A): Hepatomegalia maior que 2 cm
      comentario: "A hepatomegalia dolorosa maior do que 2 cm abaixo do rebordo costal é formalmente reconhecida como sinal de alarme."
    - B): Exantema maculopapular pruriginoso
      comentario: "O exantema é uma manifestação clínica comum da fase febril ou de recuperação, sem conotação de alarme."
    - C): Artralgia moderada a intensa
      comentario: "A artralgia faz parte das manifestações clássicas da doença, sendo ainda mais proeminente na chikungunya."
    - D): Febre de início abrupto
      comentario: "A febre alta de início abrupto é o sintoma inicial característico da fase febril da dengue e não sinal de alarme."
  gabarito: A

# Questão 06
- tipo: ME
  enunciado: |-
    Paciente de 40 anos, classificado no Grupo C, inicia tratamento na unidade hospitalar.
    
    Qual deve ser o volume de soro fisiológico a 0,9% infundido na primeira hora da reposição volêmica?
  alternativas:
    - A): 10 mL/kg
      comentario: "A conduta inicial no Grupo C estabelece a reposição volêmica com 10 mL/kg de soro fisiológico a 0,9% na primeira hora."
    - B): 20 mL/kg em 20 minutos
      comentario: "A expansão rápida de 20 mL/kg em até 20 minutos é o esquema reservado ao tratamento do choque no Grupo D."
    - C): 25 mL/kg em 6 horas
      comentario: "Essa infusão de 25 mL/kg em 6 horas corresponde à primeira etapa da fase de manutenção após a expansão."
    - D): 60 mL/kg em 24 horas
      comentario: "Este volume refere-se à reidratação por via oral recomendada para adultos do Grupo A."
  gabarito: A

# Questão 07
- tipo: ME
  enunciado: Qual é o esquema de expansão volêmica rápida parenteral indicado na abordagem inicial do Grupo D?
  alternativas:
    - A): 20 mL/kg em 20 minutos
      comentario: "Pacientes em choque (Grupo D) exigem ressuscitação volêmica imediata com 20 mL/kg de soro fisiológico em até 20 minutos."
    - B): 10 mL/kg em 1 hora
      comentario: "O volume de 10 mL/kg em 1 hora é a conduta adotada para a fase de expansão do Grupo C."
    - C): 25 mL/kg em 6 horas
      comentario: "A infusão em 6 horas é parte da manutenção volêmica após a estabilização do extravasamento."
    - D): 50 mL/kg em 2 horas
      comentario: "Essa velocidade e volume excedem os parâmetros padronizados de expansão rápida no choque."
  gabarito: A

# Questão 08
- tipo: ME
  enunciado: |-
    Gestante com 28 semanas de idade gestacional dá entrada com suspeita de dengue. Durante a avaliação no leito, queixas de tontura ocorrem ao se deitar.
    
    Qual posição de decúbito deve ser recomendada para evitar a compressão da veia cava inferior?
  alternativas:
    - A): Decúbito lateral esquerdo
      comentario: "O decúbito lateral esquerdo afasta o útero gravídico da veia cava inferior, otimizando o retorno venoso e o débito cardíaco."
    - B): Decúbito dorsal horizontal
      comentario: "A posição supina acentua a compressão da veia cava pelo útero a partir da 20ª semana de gestação."
    - C): Posição de Trendelenburg
      comentario: "A posição de Trendelenburg não alivia a compressão mecânica exercida pelo útero sobre a veia cava inferior."
    - D): Decúbito lateral direito
      comentario: "O decúbito lateral direito pode manter a compressão parcial da veia cava em virtude da anatomia vascular à direita."
  gabarito: A

# Questão 09
- tipo: ME
  enunciado: Até qual dia de início dos sintomas deve ser realizada a coleta de sangue para exames diretos de detecção viral (RT-PCR ou antígeno NS1)?
  alternativas:
    - A): Até o quinto dia
      comentario: "A pesquisa direta do vírus por RT-PCR ou antígeno NS1 deve ser realizada até o quinto dia do início dos sintomas, período correspondente à viremia."
    - B): A partir do sexto dia
      comentario: "A partir do sexto dia, a viremia diminui substancialmente, sendo indicada a sorologia para anticorpos IgM."
    - C): A partir do décimo dia
      comentario: "No décimo dia, os testes de detecção direta perdem a sensibilidade, restando a avaliação sorológica."
    - D): Entre oitavo e décimo dia
      comentario: "Nessa janela tardia, a resposta imune humoral já predomina, tornando a pesquisa de antígenos ou RNA viral inadequada."
  gabarito: A

# Questão 10
- tipo: ME
  enunciado: |-
    Paciente coronariopata em uso de dupla antiagregação plaquetária (DAPT com AAS e clopidogrel) por stent farmacológico colocado há 2 meses apresenta dengue. O hemograma revela plaquetas de 40 x 10⁹/L.
    
    Qual é a conduta adequada em relação à DAPT e ao acompanhamento?
  alternativas:
    - A): Manter medicações e observar
      comentario: "Com plaquetas entre 30x10⁹/L e 50x10⁹/L em paciente com stent recente, a DAPT deve ser mantida em leito de observação com controle diário de plaquetas."
    - B): Suspender imediatamente os antiagregantes
      comentario: "A suspensão da DAPT só é indicada quando a contagem plaquetária se encontra abaixo de 30x10⁹/L."
    - C): Trocar DAPT por anticoagulante oral
      comentario: "Não há indicação de substituir antiagregantes plaquetários por anticoagulantes no manejo da trombocitopenia."
    - D): Dar alta para acompanhamento ambulatorial
      comentario: "A contagem de plaquetas abaixo de 50x10⁹/L exige admissão em leito de observação e impede a alta imediata."
  gabarito: A

# Questão 11
- tipo: ME
  enunciado: Qual conduta deve ser adotada para paciente portador de prótese valvar metálica em uso de varfarina que apresenta contagem de plaquetas inferior a 30 x 10⁹/L?
  alternativas:
    - A): Suspender varfarina e internar
      comentario: "Diante de plaquetometria <30x10⁹/L, suspende-se a varfarina com internação para monitoramento diário do TAP e contagem de plaquetas."
    - B): Substituir por heparina venosa
      comentario: "A substituição por heparina venosa é indicada para a faixa plaquetária situando-se entre 30x10⁹/L e 50x10⁹/L."
    - C): Manter a varfarina ambulatorialmente
      comentario: "O nível plaquetário inferior a 30x10⁹/L contraindica a manutenção da varfarina pelo elevado risco de sangramento grave."
    - D): Reverter com vitamina K
      comentario: "A reversão da anticoagulação não deve ser realizada profilaticamente, devendo ser reservada a casos com sangramento manifesto."
  gabarito: A

# Questão 12
- tipo: ME
  enunciado: |-
    Paciente idoso com insuficiência cardíaca congestiva (NYHA classe III) e dengue evolui com oligúria e má perfusão periférica, sem sinais de congestão pulmonar.
    
    Qual é a dose de expansão volêmica recomendada com soro fisiológico a 0,9%?
  alternativas:
    - A): 10 mL/kg em 30 minutos
      comentario: "Para cardiopatas classe III da NYHA sem congestão pulmonar, a dose de expansão volêmica é de 10 mL/kg em 30 minutos sob monitorização estrita."
    - B): 15 mL/kg em 30 minutos
      comentario: "A dose de 15 mL/kg em 30 minutos é destinada aos pacientes cardiopatas em classe funcional II da NYHA."
    - C): 20 mL/kg em 20 minutos
      comentario: "Esta taxa é a reposição rápida padrão para o Grupo D em pacientes sem insuficiência cardíaca grave."
    - D): 25 mL/kg a cada 12h
      comentario: "Esta posologia corresponde à hidratação de manutenção e não à fase de expansão em pacientes oligúricos."
  gabarito: A

# Questão 13
- tipo: ME
  enunciado: A partir de qual dia do início dos sintomas é indicada a coleta de amostra de soro para confirmação laboratorial de dengue por IgM?
  alternativas:
    - A): Sexto dia de sintomas
      comentario: "A pesquisa de anticorpos IgM por ELISA é recomendada a partir do sexto dia do início dos sintomas, quando os títulos sorológicos se tornam detectáveis."
    - B): Primeiro dia de sintomas
      comentario: "No primeiro dia da doença, os anticorpos IgM ainda não foram produzidos em níveis detectáveis."
    - C): Terceiro dia de sintomas
      comentario: "No terceiro dia, os testes indicados são os de detecção viral direta (NS1 ou PCR), pois a IgM é habitualmente negativa."
    - D): Décimo quinto dia apenas
      comentario: "Apesar de positiva no 15º dia, a sorologia IgM já apresenta sensibilidade adequada a partir do 6º dia."
  gabarito: A

# Questão 14
- tipo: ME
  enunciado: |-
    Paciente em manejo do Grupo C evolui para estado de choque com congestão pulmonar e pressão arterial sistólica inferior a 100 mmHg a despeito da reposição volêmica.
    
    Qual classe terapêutica deve ser associada de imediato?
  alternativas:
    - A): Aminas vasoativas
      comentario: "A presença de hipotensão, má perfusão e congestão pulmonar indica o uso de aminas vasoativas para suporte hemodinâmico sem hiper-hidratação."
    - B): Diuréticos de alça
      comentario: "O uso isolado de diuréticos em paciente hipotenso agravaria a instabilidade hemodinâmica."
    - C): Corticosteroides intravenosos
      comentario: "Corticosteroides não têm indicação no manejo hemodinâmico do choque na dengue."
    - D): Coloides sintéticos isolados
      comentario: "O aporte adicional de volume líquido em paciente com congestão pulmonar pode precipitar edema agudo de pulmão."
  gabarito: A

# Questão 15
- tipo: ME
  enunciado: Quais são os prazos mínimos de estabilização hemodinâmica e de ausência de febre exigidos entre os critérios para alta hospitalar?
  alternativas:
    - A): 48 horas e 24 horas
      comentario: "Os critérios de alta hospitalar exigem estabilização hemodinâmica por pelo menos 48 horas e ausência de febre por no mínimo 24 horas."
    - B): 24 horas e 12 horas
      comentario: "Apenas 24 horas de estabilidade hemodinâmica é tempo insuficiente para garantir o fim da fase de extravasamento."
    - C): 72 horas e 48 horas
      comentario: "Estes prazos excedem os parâmetros oficiais estabelecidos pelas diretrizes de conduta hospitalar."
    - D): 12 horas e 24 horas
      comentario: "Um período de 12 horas de estabilização hemodinâmica é insuficiente para descartar instabilidade volêmica residual."
  gabarito: A

# Questão 16
- tipo: ME
  enunciado: |-
    Paciente hipertenso em tratamento regular desenvolve dengue grave com extravasamento plasmático acentuado e queda de 40% nos níveis de pressão arterial sistólica.
    
    Qual conduta deve ser adotada em relação aos medicamentos anti-hipertensivos em uso?
  alternativas:
    - A): Suspender prontamente os hipotensores
      comentario: "Diante de um quadro de dengue grave com extravasamento plasmático e hipotensão relativa, os medicamentos hipotensores devem ser prontamente suspensos."
    - B): Manter as doses habituais
      comentario: "Manter anti-hipertensivos em um paciente hipotenso agravaria a hipoperfusão tecidual e a evolução do choque."
    - C): Dobrar a dose diária
      comentario: "Aumentar a medicação provocaria uma piora drástica dos níveis pressóricos e da perfusão orgânica."
    - D): Associar diurético intravenoso
      comentario: "A adição de diuréticos reduziria ainda mais o volume intravascular, acentuando a hipotensão."
  gabarito: A
