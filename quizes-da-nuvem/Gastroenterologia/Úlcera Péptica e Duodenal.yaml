          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>A alternativa correta é a <strong>D</strong>.</p>

          <p>A úlcera péptica é uma erosão que ocorre na mucosa do trato gastrointestinal, principalmente no estômago e no duodeno. Para resolver a questão, é essencial compreender as causas, características e complicações associadas a essa condição.</p>

          <p><strong>Justificativa da alternativa correta:</strong></p>

          <p><span style="color:orange;">Alternativa D:</span> A úlcera péptica não é provocada pela doença de Crohn. A doença de Crohn é uma doença inflamatória crônica que afeta qualquer parte do trato gastrointestinal, mas não causa úlceras pépticas. Ela é caracterizada pela inflamação transmural (afetando todas as camadas da parede intestinal) e pode causar ulcerações, mas são de natureza diferente das úlceras pépticas.</p>

          <p><strong>Comentários sobre as alternativas incorretas:</strong></p>

          <p><span style="color:blue;">Alternativa A:</span> Correta. As úlceras pépticas são, de fato, mais graves que as gastrites, pois podem levar a complicações graves como perfurações e sangramentos.</p>

          <p><span style="color:blue;">Alternativa B:</span> Correta. Quando a úlcera péptica acomete o estômago, ela é chamada de úlcera gástrica. No caso de acometer o duodeno, é chamada de úlcera duodenal.</p>

          <p><span style="color:blue;">Alternativa C:</span> Correta. A úlcera péptica é motivada pela ação corrosiva do suco gástrico, que é composto principalmente por ácido clorídrico e pepsina, sobre a mucosa do estômago, duodeno ou esôfago.</p>

          <p><span style="color:blue;">Alternativa E:</span> Correta. A infecção pelo <i>Helicobacter pylori</i> e o uso prolongado de anti-inflamatórios não esteroides (AINEs) são causas bem estabelecidas de úlceras pépticas.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

