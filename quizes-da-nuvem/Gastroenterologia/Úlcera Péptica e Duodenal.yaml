        enunciado: 'A prevenção de recorrência de úlcera péptica deve ser realizada com:'
        alternativas:
          - id: alt_A
            texto: evitação do uso de cocaína e bloqueadores de produção de prostaglandinas gástricas
          - id: alt_B
            texto: evitação de antiinflamatórios não-esteroidais e erradicação de H. pylori
          - id: alt_C
            texto: uso de inibidores da bomba de sódio e potássio
          - id: alt_D
            texto: uso de antiácidos e aspirina
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b>Alternativa Correta: B - evitação de antiinflamatórios não-esteroidais e erradicação de <i>H. pylori</i></b></p>

          <p>A prevenção da recorrência de úlcera péptica é um tema importante em Gastroenterologia, pois envolve medidas que visam reduzir a inflamação e evitar a persistência de fatores que podem agravar a condição. Vamos analisar as alternativas para entender melhor o porquê da alternativa B ser a correta.</p>

          <p><b><span style="color: darkorange;">Alternativa B</span></b>: <u>Evitação de antiinflamatórios não-esteroidais (AINEs) e erradicação de <i>H. pylori</i></u></p>
          <p>Esta é a alternativa correta. A úlcera péptica é comumente associada ao uso de AINEs e à infecção pela bactéria <i>Helicobacter pylori</i>. Os AINEs podem causar lesão na mucosa gástrica, contribuindo para a formação de úlceras. Além disso, a infecção por <i>H. pylori</i> aumenta a produção de ácido gástrico e reduz a defesa da mucosa gástrica, facilitando o desenvolvimento de úlceras. Portanto, evitar o uso de AINEs e erradicar a infecção por <i>H. pylori</i> são medidas essenciais para prevenir a recorrência das úlceras pépticas.</p>

          <p><b><span style="color: darkblue;">Alternativa A</span></b>: <u>Evitação do uso de cocaína e bloqueadores de produção de prostaglandinas gástricas</u></p>
          <p>Embora a cocaína possa causar efeitos adversos no trato gastrointestinal, ela não é um fator primário na recorrência de úlcera péptica. Os bloqueadores de produção de prostaglandinas (como os inibidores de COX-2) não são recomendados para a prevenção de úlceras, pois as prostaglandinas têm um papel protector na mucosa gástrica. Portanto, esta alternativa não está correta.</p>

          <p><b><span style="color: darkblue;">Alternativa C</span></b>: <u>Uso de inibidores da bomba de sódio e potássio</u></p>
          <p>Os inibidores da bomba de sódio e potássio não são usados no tratamento ou prevenção de úlcera péptica. O correto seria mencionar os inibidores da bomba de prótons (IBPs), que são eficazes na redução da secreção ácida gástrica e ajudam na cicatrização das úlceras. Contudo, apenas o uso de IBPs sem tratar a causa subjacente (como a infecção por <i>H. pylori</i>) não é suficiente para prevenir a recorrência.</p>

          <p><b><span style="color: darkblue;">Alternativa D</span></b>: <u>Uso de antiácidos e aspirina</u></p>
          <p>Antiácidos podem proporcionar alívio sintomático temporário, mas não são eficazes na prevenção de úlceras a longo prazo. Além disso, a aspirina, que é um AINE, pode aumentar o risco de desenvolvimento de úlceras pépticas, especialmente quando usada cronicamente. Portanto, esta alternativa está incorreta.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A questão aborda a prevenção de recorrência de úlcera péptica, que é uma condição na qual há lesões no estômago ou no duodeno. A resposta correta é a alternativa B - evitação de antiinflamatórios não esteroidais (AINEs) e erradicação de Helicobacter pylori (H. pylori). Os AINEs são conhecidos por prejudicarem a mucosa gástrica, facilitando o desenvolvimento de úlceras. O H. pylori é uma bactéria que coloniza o estômago humano e pode causar inflamação crônica da mucosa gástrica, levando à formação de úlceras. A erradicação dessa bactéria, geralmente com um tratamento de combinação de antibióticos e inibidores da bomba de prótons, é eficaz na prevenção da recorrência de úlceras pépticas. As outras alternativas não são recomendadas: a alternativa A inclui uma substância recreativa e uma classe de medicamentos que não são indicados para esta condição; a alternativa C menciona inibidores de uma bomba iônica que não tem relação direta com o tratamento de úlceras pépticas; e a alternativa D sugere o uso de antiácidos e aspirina, onde a aspirina, sendo um AINE, pode agravar a condição, contradizendo o que é recomendado para prevenção.
          </div>

