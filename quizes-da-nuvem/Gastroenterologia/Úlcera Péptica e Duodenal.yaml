        enunciado: "Leia as afirmativas abaixo sobre a úlcera péptica e marque V para verdadeiro e F para falso.\n\n(\_ \_) A úlcera duodenal é menos frequente e costuma ocorrer na parte inferior do estômago.\n\n(\_ \_) A úlcera penetra no revestimento gástrico ou duodeno (primeiro segmento do intestino delgado). O tamanho da úlcera pode variar de vários milímetros a vários centímetros.\n\n(\_ \_) O desconforto causado por úlceras vai e vem e tende a estar relacionado com as refeições (às vezes melhora após comer e às vezes piora após comer).\n\n(\_ \_) Medicamentos são administrados para reduzir a acidez do estômago e antibióticos são administrados para eliminar a bactéria Staphylococcus aureus.\n\nAssinale a alternativa que contém a sequência correta."
        alternativas:
          - id: alt_A
            texto: V – F – F -V
          - id: alt_B
            texto: F – V – F – V
          - id: alt_C
            texto: V – V – F – F
          - id: alt_D
            texto: F – V – V – F
          - id: alt_E
            texto: V – V – V – V
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Olá, aluno! Vamos entender a questão sobre úlcera péptica e analisar cada afirmativa.</p>

          <p><strong>Alternativa correta: D - F – V – V – F</strong></p>

          <p>Vamos agora discorrer sobre cada uma das afirmativas:</p>

          <p><span style="color:darkorange;"><strong>( ) A úlcera duodenal é menos frequente e costuma ocorrer na parte inferior do estômago.</strong></span></p>

          <p>Esta afirmativa é <strong>falsa</strong>. Na verdade, a úlcera duodenal é mais frequente que a úlcera gástrica e ocorre no duodeno, que é a primeira parte do intestino delgado, e não na parte inferior do estômago.</p>

          <p><span style="color:darkorange;"><strong>( ) A úlcera penetra no revestimento gástrico ou duodeno (primeiro segmento do intestino delgado). O tamanho da úlcera pode variar de vários milímetros a vários centímetros.</strong></span></p>

          <p>Esta afirmativa é <strong>verdadeira</strong>. As úlceras pépticas realmente afetam o revestimento do estômago ou do duodeno e podem variar significativamente em tamanho, indo de milímetros a centímetros.</p>

          <p><span style="color:darkorange;"><strong>( ) O desconforto causado por úlceras vai e vem e tende a estar relacionado com as refeições (às vezes melhora após comer e às vezes piora após comer).</strong></span></p>

          <p>Esta afirmativa é <strong>verdadeira</strong>. De fato, os sintomas de úlcera péptica podem flutuar e estão frequentemente relacionados às refeições. Por exemplo, a dor da úlcera duodenal costuma melhorar com a ingestão de alimentos, enquanto a úlcera gástrica pode causar piora da dor após comer.</p>

          <p><span style="color:darkorange;"><strong>( ) Medicamentos são administrados para reduzir a acidez do estômago e antibióticos são administrados para eliminar a bactéria Staphylococcus aureus.</strong></span></p>

          <p>Esta afirmativa é <strong>falsa</strong>. Os antibióticos usados no tratamento da úlcera péptica são destinados a eliminar a bactéria <em>Helicobacter pylori</em>, e não <em>Staphylococcus aureus</em>. Além disso, são administrados medicamentos para reduzir a acidez gástrica.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A questão apresenta quatro afirmativas a respeito da úlcera péptica, das quais apenas a segunda e a terceira são verdadeiras. A primeira afirmativa é falsa porque a úlcera duodenal é mais comum do que a úlcera gástrica e ocorre no duodeno, que é a primeira parte do intestino delgado, e não na parte inferior do estômago. A segunda afirmativa é verdadeira, pois a úlcera péptica de fato penetra no revestimento gástrico ou duodenal, e seu tamanho pode variar amplamente. A terceira afirmativa é verdadeira porque o desconforto associado com a úlcera péptica geralmente flutua e pode ter relação com as refeições, melhorando ou piorando após comer. Por fim, a quarta afirmativa é falsa, pois os antibióticos usados no tratamento de úlceras pépticas têm o objetivo de eliminar a bactéria Helicobacter pylori, e não o Staphylococcus aureus. Portanto, a sequência correta é F (falso) para a primeira afirmativa, V (verdadeiro) para a segunda, V (verdadeiro) para a terceira e F (falso) para a quarta, o que corresponde à alternativa D.
          </div>

      - tipo: ME
        id: 131026-0258-22-ovIcrD
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: Um paciente de 68 anos apresenta sangramento digestivo alto há 06 horas. A endoscopia digestiva alta revela uma úlcera péptica em atividade com sangramento em placa aderente. A paciente apresenta sinais vitais estáveis e está hemodinamicamente compensado. De acordo com a classificação de Forrest, qual a classificação mais provável da lesão?
        alternativas:
          - id: alt_A
            texto: Ia
          - id: alt_B
            texto: Ib
          - id: alt_C
            texto: IIa
          - id: alt_D
            texto: IIb
          - id: alt_E
            texto: III
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:darkorange;">Tema central:</b> A questão aborda a <u>Classificação de Forrest</u>, fundamental para a estratificação do risco de ressangramento e definição de conduta em pacientes com úlcera péptica hemorrágica.</p>

          <p><b style="color:darkblue;">Justificativa da alternativa correta (D - IIb):</b></p>
          <p>Na endoscopia, o achado de "<span style="color:darkorange;">sangramento em placa aderente</span>" corresponde, de acordo com a <b>Classificação de Forrest</b>, à categoria <b style="color:darkblue;">IIb</b>. Essa categoria é definida como <b style="color:darkorange;">coágulo aderido</b> sobre a base da úlcera e representa risco intermediário de ressangramento (cerca de 25-30%).</p>
          <p>Segundo o <i>Harrison’s Principles of Internal Medicine</i> e consensos internacionais, “a identificação de coágulo aderido sugere necessidade de conduta ativa, buscando remover o coágulo e tratar possíveis vasos subjacentes” (tradução livre, edição 20). O manejo geralmente envolve terapia endoscópica.</p>
          <p>Reconhecer o padrão endoscópico corretamente é essencial na prova: <b style="color:darkorange;">placa aderente = coágulo aderido = Forrest IIb</b>.</p>

          <p><b style="color:darkorange;">Análise das alternativas incorretas:</b></p>
          <ul>
              <li><b>A) Ia:</b> Sangramento arterial ativo (“jato”). Não há descrição de sangue em jato ou importante sangramento ativo na endoscopia.</li>
              <li><b>B) Ib:</b> Sangramento em babação (“sangramento lento, contínuo”). O texto destaca “placa aderente” e não sangramento ativo visível.</li>
              <li><b>C) IIa:</b> Vaso visível sem sangramento, classicamente descrito como “vaso não coberto” sobre a úlcera. O achado informado é diferente.</li>
              <li><b>E) III:</b> Base limpa, sem sinais de sangramento ou coágulo. O paciente tem coágulo aderido, logo não é essa classificação.</li>
          </ul>

          <p><b style="color:darkblue;">Dica de leitura e interpretação:</b></p>
          <p>Mantenha atenção a <span style="color:darkorange;">termos-chave</span> como “coágulo”, “vaso visível”, “sangramento ativo” ou “base limpa”. Palavras como “placa aderente” e “coágulo” são armadilhas frequentes caso o aluno não domine a correlação terminológica com a classificação endoscópica.</p>
          <p>Em provas, a <b>Classificação de Forrest</b> costuma ser abordada para definir risco e conduta: coágulo aderido (IIb) indica intervenção endoscópica, diferentemente de base limpa (III), que não demanda tratamento endoscópico, conforme discussão em <i>UpToDate</i> (revisto em 2023).</p>

          <p><span style="color:darkorange;"><b>Resumo:</b></span> Associação do achado endoscópico (“placa aderente”) à <b>Forrest IIb</b> é questão clássica de concurso, sendo decisivo memorizar a correspondência entre os achados visuais e os subgrupos da classificação.</p>

          <p><i>Gostou do comentário? Deixe sua avaliação aqui embaixo!</i></p>
          </div>

