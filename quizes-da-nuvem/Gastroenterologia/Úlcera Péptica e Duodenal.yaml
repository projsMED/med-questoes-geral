        enunciado: |-
          Mulher de 50 anos procura gastroenterologista por diarreia crônica, dor epigástrica e retroesternal em queimação.

          História patológica pregressa: úlcera péptica duodenal há 6 meses, hipertensão, diabetes e hiperplasia da paratireiode (realizada paratireoidectomia). Exame físico normal. Solicitada endoscopia digestiva alta: pregas gástricas espessadas, vários pequenos nódulos mucosos e 2 úlceras ativas em duodeno. As biópsias dos nódulos são compatíveis com tumor neuroendócrino. Nível sérico de gastrina em jejum é 950 pg/mL (normal < 100 pg/mL) e pH gástrico menor que 2.

          Qual é a terapia mais apropriada para esse paciente?
        alternativas:
          - id: alt_A
            texto: Terapia com altas doses de IBP.
          - id: alt_B
            texto: Gastrectomia.
          - id: alt_C
            texto: Pancreatectomia.
          - id: alt_D
            texto: Ressecção endoscópica dos nódulos mucosos.
          - id: alt_E
            texto: Quimioterapia.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color: #1c3f87;">Comentário orientado – Síndrome de Zollinger-Ellison (SZE) na Endoscopia</b></p>

          <p><b>1. Tema central e diagnóstico:</b><br>
          A questão aborda <span style="color: #e06a18;"><b>hipersecreção gástrica</b></span> causada por <u>gastrinoma</u> (Síndrome de Zollinger-Ellison), caracterizada por diarreia crônica, dor epigástrica, úlceras duodenais múltiplas e níveis elevados de gastrina. Esse diagnóstico se apoia em: <span style="color: #1c3f87;"><b>gastrinemia elevada (&gt;10x o valor normal), pH gástrico &lt;2</b></span>, e achados endoscópicos de ulcerações e nódulos neuroendócrinos.</p>

          <p><b>2. Terapia mais apropriada: justificativa da alternativa correta</b> <span style="color: #e06a18;"><b>(A) Terapia com altas doses de IBP</b></span>:</p>
          <p>O manejo inicial da SZE é focado em controlar a produção ácida gástrica excessiva. <b>Inibidores da Bomba de Prótons (IBPs)</b>, em doses altas, <span style="color: #e06a18;"><b>são fundamentais para prevenir complicações como úlcera, perfuração ou hemorragia</b></span>. Citando referência farmacológica: <i>“Os IBPs são especialmente indicados em pacientes com hipergastrinemia e síndrome de Zollinger-Ellison”</i> (Boletim Farmacoterapêutico, Conselho Federal de Farmácia, 2022).</p>

          <p>Diretrizes da literatura médica, como o <b style="color: #1c3f87;">“Harrison’s Principles of Internal Medicine”</b>, confirmam que o <u>controle ácido é indispensável antes de qualquer intervenção específica nos gastrinomas</u>. O objetivo é garantir alívio sintomático e cicatrização das lesões, por meio do bloqueio sustentado da bomba de prótons.</p>

          <p><b>3. Análise das alternativas incorretas:</b></p>
          <p>
          <b>B) Gastrectomia:</b> <span style="color: #1c3f87;">Opção radical, atualmente reservada apenas para casos refratários</span> a IBP ou complicações graves.<br>
          <b>C) Pancreatectomia:</b> Não é recomendada como abordagem de primeira escolha, já que os gastrinomas podem estar em outros locais e muitos são múltiplos.<br>
          <b>D) Ressecção endoscópica dos nódulos mucosos:</b> Pode ser cogitada para tumores localizados, mas <span style="color: #e06a18;"><b>não resolve a hipersecreção ácida nem é abordagem primária</b></span>.<br>
          <b>E) Quimioterapia:</b> Indicada para doença metastática avançada, não sendo conduta inicial.<br>
          </p>

          <p><b>4. Estratégia para provas:</b><br>
          Atenção para: descrições de múltiplas úlceras duodenais, <span style="color: #e06a18;"><b>gastrinemia muito elevada</b></span> (<i>alta especificidade</i>) e pH gástrico persistentemente baixo – todos juntos direcionam para SZE e para IBP como primeira escolha.</p>

          <p><b>Resumo final:</b><br>
          Para Síndrome de Zollinger-Ellison, o <span style="color: #1c3f87;"><b>tratamento inicial de escolha é IBP em altas doses</b></span>, conforme as recomendações das principais diretrizes médicas.</p>

          <p><i>Gostou do comentário? Deixe sua avaliação aqui embaixo!</i></p>
          </div>

