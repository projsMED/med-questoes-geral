        enunciado: |-
          A úlcera péptica era, até recentemente, considerada uma doença de etiologia desconhecida, de evolução em geral crônica, com surtos de ativação e períodos de acalmia.

          Entretanto, atualmente, é correto afirmar que etiologia em torno de 95% dos casos de úlcera duodenal e 80% dos portadores de úlcera gástrica está relacionada:
        alternativas:
          - id: alt_A
            texto: À infecção pelo Helicobacter pylori (HP).
          - id: alt_B
            texto: Ao uso de anti-inflamatórios não hormonais.
          - id: alt_C
            texto: A manifestações iniciais de neoplasias (carcinoma, linfoma, leiomioma, leiomiosarcoma).
          - id: alt_D
            texto: À associação com gastrinoma (Síndrome de Zollinger-Ellisson).
          - id: alt_E
            texto: À associação à forma duodenal de doença de Crohn.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Para resolver essa questão sobre a etiologia da úlcera péptica, é importante entender que, <strong>atualmente</strong>, a maior parte dos casos de úlceras gástricas e duodenais está relacionada a infecções bacterianas, mais especificamente pela bactéria <em>Helicobacter pylori</em>.</p>

          <p><strong><span style="color:darkorange;">Alternativa Correta: A - À infecção pelo <em>Helicobacter pylori</em> (HP).</span></strong></p>

          <p>O <em>Helicobacter pylori</em> é uma bactéria que coloniza o estômago e é comprovadamente responsável pela maioria dos casos de úlcera gástrica e duodenal. Essa descoberta revolucionou o entendimento sobre a úlcera péptica, que antes era considerada uma doença de origem desconhecida. Atualmente, sabe-se que essa bactéria provoca inflamação na mucosa do estômago, levando ao desenvolvimento de úlceras.</p>

          <p><u>Abaixo estão as justificativas de por que as outras alternativas estão incorretas:</u></p>

          <p><strong>B - Ao uso de anti-inflamatórios não hormonais.</strong> Embora os anti-inflamatórios não esteroides (AINEs) estejam associados à formação de úlceras devido à inibição da síntese de prostaglandinas protetoras da mucosa gástrica, eles não são responsáveis pela maioria dos casos de úlcera, como é o caso do <em>Helicobacter pylori</em>.</p>

          <p><strong>C - A manifestações iniciais de neoplasias (carcinoma, linfoma, leiomioma, leiomiosarcoma).</strong> Neoplasias não são causas comuns de úlceras pépticas e representam uma fração mínima dos casos, portanto, não explicam a maioria dos casos de úlceras pépticas.</p>

          <p><strong>D - À associação com gastrinoma (Síndrome de Zollinger-Ellison).</strong> A Síndrome de Zollinger-Ellison é uma condição rara causada por um tumor produtor de gastrina que aumenta a secreção de ácido no estômago, levando à formação de úlceras. No entanto, essa condição é muito menos comum que a infecção por <em>Helicobacter pylori</em>.</p>

          <p><strong>E - À associação à forma duodenal de doença de Crohn.</strong> A doença de Crohn pode afetar várias partes do trato gastrointestinal, mas sua associação com úlceras pépticas não é a principal causa nos casos de úlcera gástrica ou duodenal.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            <strong><em>⚕️QUESTÃO SOBRE ETIOLOGIA DA ÚLCERA PÉPTICA</em></strong>

            <strong><em>✅ALTERNATIVA CORRETA:</em></strong>

            <strong>A) À infecção pelo Helicobacter pylori (HP).</strong>

            <strong><em>✏️JUSTIFICATIVA.</em></strong>

            Atualmente, a infecção pelo&nbsp;<strong>Helicobacter pylori (HP)</strong>&nbsp;é reconhecida como a principal causa da úlcera péptica, estando presente em cerca de&nbsp;<strong>95% dos casos de úlcera duodenal</strong>&nbsp;e&nbsp;<strong>80% dos casos de úlcera gástrica</strong>. O HP promove inflamação da mucosa gástrica e duodenal, levando à formação de úlceras. Além disso, o tratamento da infecção por HP reduz significativamente a recorrência das úlceras.

            <strong><em>⚠️ANÁLISE DAS DEMAIS ALTERNATIVAS</em></strong>

            ❌ [B]: O uso de anti-inflamatórios não hormonais (AINH) é uma causa importante de úlcera péptica, mas não é a principal etiologia na maioria dos casos. Ele está mais associado a úlceras gástricas do que duodenais.

            ❌ [C]: Neoplasias como carcinoma, linfoma e sarcomas podem causar úlceras, mas são causas raras e não explicam a maioria dos casos de úlcera péptica.

            ❌ [D]: A síndrome de Zollinger-Ellison (gastrinoma) é uma causa rara de úlcera péptica, associada à hipersecreção de ácido gástrico.

            ❌ [E]: A doença de Crohn pode afetar o trato gastrointestinal, mas a forma duodenal é rara e não está relacionada à maioria dos casos de úlcera péptica.

            <strong><em>⏳RESUMO:</em></strong>

            A infecção pelo&nbsp;<strong>Helicobacter pylori</strong>&nbsp;é a principal causa de úlcera péptica, estando presente na maioria dos casos de úlcera duodenal e gástrica. As demais alternativas descrevem causas menos frequentes ou raras.

            <strong><em>‼️PONTOS CHAVE</em></strong>

            ◊ O Helicobacter pylori é responsável por 95% das úlceras duodenais e 80% das úlceras gástricas.

            ◊ O uso de AINH é uma causa importante, mas não a principal.

            ◊ Neoplasias e gastrinoma são causas raras de úlcera péptica.

            ◊ A doença de Crohn duodenal é rara e não está associada à maioria dos casos de úlcera péptica.
          </div>

