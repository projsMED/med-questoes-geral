            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: A</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> A decisão depende de reconhecer dois pontos da base médica: a suspeição de úlcera péptica em dispepsia associada a AINEs ou Helicobacter pylori, e o fato de que a complicação mais frequente é hemorragia digestiva, não perfuração; por isso, o item II se mantém como verdadeiro e o item III como falso, restando o item I aceito como correto na lógica da questão.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Úlcera péptica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre complicação mais dramática ou mais lembrada e complicação mais frequente: na úlcera péptica, a mais incidente é hemorragia digestiva, não perfuração.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em úlcera péptica, diferencie apresentação típica de apresentação real de prova: ausência de dor não exclui o diagnóstico.</li><li>Dispepsia ganha peso para suspeita de úlcera quando aparece associada a AINEs ou H. pylori.</li><li>Ao analisar complicações, não marque a mais grave ou mais chamativa sem checar qual é a mais frequente: aqui, é sangramento.</li></ul></div></div>
