          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b><span style="color:#0B3D91">Tema central:</span></b> Hemorragia digestiva alta por <u>úlcera duodenal</u>, com ênfase na <b>classificação de Forrest</b> (estigmas endoscópicos e risco de ressangramento), diferenciação da <b>classificação de Sakita</b> e manejo inicial.</p>

          <p><b><span style="color:#FF8C00">Gabarito: D — F • F • F • V</span></b></p>

          <p><b>(1) Falsa.</b> “Sangramento em babação” corresponde a <b>Forrest Ib</b> (oozing). A <b>classificação de Sakita</b> descreve <u>fases evolutivas da úlcera</u> (A1, A2, H1, H2, S1, S2), <u>não</u> estigmas de sangramento. Além disso, rotular “IB” dentro de Sakita é incorreto. Estratégia: associe “babação/oozing” → <b>Forrest Ib</b>, nunca Sakita.</p>

          <p><b>(2) Falsa.</b> A principal causa de <u>úlcera duodenal</u> é <b><span style="color:#0B3D91">Helicobacter pylori</span></b>; AINEs são causa predominante de <u>úlcera gástrica</u> e de complicações em usuários crônicos. Embora na hemorragia com estigmas de alto risco (Forrest Ia/Ib/IIa/IIb) a <b>hemostasia endoscópica</b> seja indicada, a afirmativa erra ao dizer que AINE é a principal causa da <u>úlcera duodenal</u>. (Harrison’s; UpToDate; Diretrizes ACG/ESGE).</p>

          <p><b>(3) Falsa.</b> Forrest <b>Ia</b> é <u>jato arterial</u> (spurting) e apresenta <b>alto</b> risco de ressangramento (≈50–90% sem terapia). O enunciado descreve “babação” (oozing), incompatível com Ia, e o risco “20–30%” não se aplica a Ia.</p>

          <p><b>(4) Verdadeira.</b> “Sangramento em babação” = <b>Forrest Ib</b>. O risco de ressangramento clássico para Ib situa-se ~<b>10–30%</b>, justificando <b>terapia endoscópica</b> e <b>IBP IV em alta dose</b> subsequente. Portanto, a correlação tipo–descrição–risco está correta. </p>

          <p><b><span style="color:#FF8C00">Como interpretar na prova</span>:</b> Palavras-chave guiam o estigma: <u>jato</u> → Ia; <u>babação/oozing</u> → Ib; <u>vaso visível</u> → IIa; <u>coágulo aderido</u> → IIb; <u>hematina</u> → IIc; <u>fundo limpo</u> → III. Lembre: <b>Sakita ≠ Forrest</b> (estrutura/epitelização vs sangramento).</p>

          <p><b>Conduta resumida no cenário:</b> reanimação (via aérea se necessário, cristaloides, hemotransfusão conforme hemoglobina e instabilidade), <b>IBP IV</b> (bolus + infusão por 72h em alto risco), <b>endoscopia precoce</b> com hemostasia para Forrest Ia/Ib/IIa (e IIb selecionados; remover coágulo e tratar base), teste e <b>erradicação de H. pylori</b>, <u>suspender AINE</u> e avaliar necessidade de gastroproteção se reinício for inevitável. (ACG 2021/2024; ESGE 2021; UpToDate).</p>

          <p><b>Referências rápidas:</b> Harrison’s Principles of Internal Medicine; ACG Clinical Guideline: Upper GI and Ulcer Bleeding; ESGE Guideline on Non-variceal Upper GI Hemorrhage; UpToDate.</p>

