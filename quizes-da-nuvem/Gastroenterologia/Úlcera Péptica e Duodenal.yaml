        enunciado: |-
          Sobre úlcera péptica, analise as afirmativas a seguir.

          I. A maioria das úlceras são secundárias à infecção pelo Helicobacter pylori.

          II. Uma queixa frequente é a dor noturna, acordando o paciente à noite.

          III.O tratamento da infecção por Helicobacter pylori deve ser feito com um tipo de antibiótico e um inibidor de bomba de prótons por cerca de cinco dias.

          IV.O principal mecanismo de toxicidade dos anti-inflamatórios não esteroides envolve o aumento da síntese de prostaglandinas.

          Está correto o que se afirma apenas em
        alternativas:
          - id: alt_A
