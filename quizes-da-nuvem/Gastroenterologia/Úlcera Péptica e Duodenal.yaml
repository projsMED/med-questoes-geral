        gabarito: A

      - tipo: ME
        id: 131026-0258-32-WUjWsj
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: "Analise as afirmativas a seguir sobre a úlcera péptica.\n\nI-\_ A maioria das úlceras é secundária à infecção pelo Helicobacter pylori.\n\nII-\_ A queixa frequente é a dor noturna, que acorda o paciente.\n\nIII- O tratamento da infecção por Helicobacter pylori deve ser realizado com um tipo de antibiótico e um inibidor de bomba de protons, por cerca de cinco dias.\n\nIV- O principal mecanismo de toxicidade dos anti-inflamatórios não esteroides envolve o aumento da síntese de prostaglandinas.\n\nEstá CORRETO o que se afirma apenas em"
        alternativas:
          - id: alt_A
            texto: I e II.
          - id: alt_B
            texto: I e III.
          - id: alt_C
            texto: I e IV.
          - id: alt_D
            texto: II e IV.
          - id: alt_E
            texto: III e IV.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>O tema central desta questão é a <b>úlcera péptica</b>, uma condição comum no trato gastrointestinal, caracterizada por lesões na mucosa gástrica ou duodenal. Vamos analisar cada uma das afirmações para entender por que a alternativa correta é a <b>A - I e II</b>.</p>

          <p><span style="color: darkorange;"><b>I- A maioria das úlceras é secundária à infecção pelo <i>Helicobacter pylori</i>.</b></span></p>
          <p>Esta afirmação está correta. O <i>Helicobacter pylori</i> é uma bactéria gram-negativa que coloniza o estômago e é um dos principais fatores etiológicos das úlceras pépticas. De acordo com diretrizes, como as do <i>Harrison's Principles of Internal Medicine</i>, cerca de 70-90% das úlceras duodenais e 50-70% das úlceras gástricas são associadas a esta infecção.</p>

          <p><span style="color: darkorange;"><b>II- A queixa frequente é a dor noturna, que acorda o paciente.</b></span></p>
          <p>Esta afirmação também está correta. A dor epigástrica que acorda o paciente durante a noite é uma característica clássica das úlceras duodenais. Essa dor noturna ocorre devido ao jejum prolongado, aumentando a exposição da mucosa ao ácido gástrico.</p>

          <p><span style="color: blue;"><b>III- O tratamento da infecção por <i>Helicobacter pylori</i> deve ser realizado com um tipo de antibiótico e um inibidor de bomba de prótons, por cerca de cinco dias.</b></span></p>
          <p>Esta afirmação está incorreta. O tratamento padrão para erradicação do <i>H. pylori</i> envolve geralmente uma terapia tripla, que inclui dois antibióticos (por exemplo, claritromicina e amoxicilina ou metronidazol) combinados com um inibidor de bomba de prótons (IBP), por um período de 10 a 14 dias, não apenas cinco.</p>

          <p><span style="color: blue;"><b>IV- O principal mecanismo de toxicidade dos anti-inflamatórios não esteroides envolve o aumento da síntese de prostaglandinas.</b></span></p>
          <p>Esta afirmação está incorreta. O mecanismo de toxicidade dos anti-inflamatórios não esteroides (AINEs) está relacionado à <b>inibição da síntese de prostaglandinas</b>, não ao aumento. Os AINEs inibem a enzima ciclooxigenase (COX), reduzindo a síntese de prostaglandinas, que são protetoras da mucosa gástrica. Esta inibição leva a um aumento da acidez gástrica e diminuição da proteção da mucosa, contribuindo para a formação de úlceras.</p>

          <p>Portanto, as afirmações corretas são I e II, justificando a escolha da alternativa A.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            <strong><em>⚕️QUESTÃO SOBRE ÚLCERA PÉPTICA E HELICOBACTER PYLORI</em></strong>

            <strong><em>✅ALTERNATIVA CORRETA: A) I e II.</em></strong>

            <strong><em>✏️JUSTIFICATIVA:</em></strong>

            A úlcera péptica é uma condição comum, frequentemente associada à infecção por&nbsp;<em>Helicobacter pylori</em>&nbsp;(afirmativa I correta). A dor noturna que acorda o paciente é uma queixa clássica, especialmente em úlceras duodenais (afirmativa II correta). Já o tratamento para&nbsp;<em>H. pylori</em>&nbsp;requer uma combinação de&nbsp;<strong>dois antibióticos</strong>&nbsp;e um inibidor de bomba de prótons (IBP) por&nbsp;<strong>7 a 14 dias</strong>, e não apenas um antibiótico por cinco dias (afirmativa III incorreta). Além disso, os anti-inflamatórios não esteroides (AINEs) causam dano à mucosa gástrica pela&nbsp;<strong>inibição da síntese de prostaglandinas</strong>, e não pelo aumento (afirmativa IV incorreta). Portanto, apenas as afirmativas I e II estão corretas.

            <strong><em>⏳RESUMO:</em></strong>

            A úlcera péptica está frequentemente associada à infecção por&nbsp;<em>Helicobacter pylori</em>&nbsp;e apresenta como queixa comum a dor noturna. O tratamento adequado para&nbsp;<em>H. pylori</em>&nbsp;envolve dois antibióticos e um IBP por 7 a 14 dias, e os AINEs causam dano gástrico pela inibição de prostaglandinas.

            <strong><em>‼️PONTOS CHAVE:</em></strong>

            ◊ A infecção por&nbsp;<em>Helicobacter pylori</em>&nbsp;é a principal causa de úlcera péptica.

            ◊ A dor noturna é uma queixa frequente em pacientes com úlcera duodenal.

            ◊ O tratamento para&nbsp;<em>H. pylori</em>&nbsp;requer dois antibióticos e um IBP por 7 a 14 dias.

            ◊ Os AINEs causam dano gástrico pela inibição da síntese de prostaglandinas.
          </div>

      - tipo: ME
        id: 131026-0258-33-YwpCxD
