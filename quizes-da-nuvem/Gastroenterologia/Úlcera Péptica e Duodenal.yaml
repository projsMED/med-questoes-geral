            <p>A alternativa correta é a <strong style="color:darkorange;">A</strong>.</p>

          <p><strong>Tema central da questão:</strong> A questão aborda <span style="color:darkblue;">úlcera péptica</span>, uma condição que afeta a mucosa do trato digestivo, especialmente o estômago e o duodeno. É essencial compreender as causas, o diagnóstico e o tratamento dessa condição, com destaque para a infecção pela bactéria <em>Helicobacter pylori</em> e seu manejo clínico.</p>

          <p><strong>Justificativa para a alternativa A:</strong> A alternativa A afirma corretamente que a principal causa da úlcera péptica é a infecção pelo <em><span style="color:darkblue;">Helicobacter pylori</span></em>, uma bactéria Gram-negativa. Quando diagnosticada, especialmente na presença de úlcera péptica, é indicada a erradicação da bactéria. O tratamento recomendado consiste em um esquema tríplice: <span style="color:darkorange;">Claritromicina</span>, <span style="color:darkorange;">Amoxicilina</span>, e o uso de um <span style="color:darkorange;">inibidor da bomba de prótons</span>. Este tratamento é amplamente aceito na prática clínica e reflete o manejo padrão da condição.</p>

          <p><strong>Análise das alternativas incorretas:</strong></p>

          <p><strong>B:</strong> A alternativa B está incorreta porque caracteriza erroneamente a relação das úlceras com a produção de ácido. Na verdade, as úlceras gástricas tipos II e III e as úlceras duodenais estão associadas à <span style="color:darkblue;">hipercloridria</span> (aumento de ácido), e não hipocloridria (diminuição de ácido).</p>

          <p><strong>C:</strong> A alternativa C está incorreta porque descreve incorretamente a associação entre a dor epigástrica e o tipo de úlcera. Tipicamente, a dor associada à <span style="color:darkblue;">úlcera duodenal</span> ocorre 2 a 3 horas após as refeições, enquanto a dor de uma <span style="color:darkblue;">úlcera gástrica</span> pode ocorrer logo após a alimentação.</p>

          <p><strong>D:</strong> A alternativa D está incorreta ao indicar o uso de sorologia como método para avaliar a erradicação do <em>Helicobacter pylori</em>. A sorologia não é adequada para controle de cura, pois os anticorpos podem persistir mesmo após a erradicação da bactéria. O uso de testes como o <span style="color:darkorange;">teste respiratório de ureia</span> ou a <span style="color:darkorange;">endoscopia com biópsia</span> são mais adequados para confirmar a erradicação.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-18-MqMq6D
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: O second-look endoscópico tem sido sugerido para melhorar os resultados em pacientes com úlcera péptica hemorrágica e estigmas de alto risco. Sendo assim, assinale a alternativa correta sobre o papel dessa endoscopia e o manejo do ressangramento após tratamento endoscópico inicial.
        alternativas:
          - id: alt_A
            texto: O second-look endoscópico rotineiro é recomendado em todos os pacientes com úlcera péptica hemorrágica, independentemente do tipo de tratamento endoscópico inicial utilizado.
          - id: alt_B
            texto: O second-look endoscópico tem mostrado benefícios significativos em termos de redução da mortalidade em todos os estudos clínicos randomizados.
          - id: alt_C
            texto: Em pacientes tratados com altas doses de IBP após hemostasia endoscópica, o second-look endoscópico mostrou benefícios limitados. Pode ser considerado nos casos em que a hemostasia inicial foi subótima ou quando ocorreu ressangramento clínico significativo.
          - id: alt_D
            texto: A cirurgia imediata é recomendada para todos os pacientes que apresentam ressangramento após o tratamento endoscópico inicial.
          - id: alt_E
            texto: O uso de epinefrina isolada para hemostasia endoscópica é suficiente para prevenir ressangramento em todos os casos de úlcera péptica com estigmas de alto risco.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><strong>Tema Central da Questão:</strong></p>
          <p>O tema central desta questão é o papel do <span style="color:darkorange;"><i>second-look</i> endoscópico</span> no manejo de úlcera péptica hemorrágica, especialmente em pacientes com estigmas de alto risco. A questão aborda quando esse procedimento deve ser considerado após o tratamento endoscópico inicial.</p>

          <p><strong>Justificativa para a Alternativa Correta (C):</strong></p>
          <p>A alternativa C é a correta porque, de acordo com as diretrizes atuais, o <i>second-look</i> endoscópico não é recomendado rotineiramente para todos os pacientes com úlcera péptica hemorrágica. Estudos mostram que, em pacientes que recebem tratamento com altas doses de inibidores da bomba de prótons (IBP) após hemostasia endoscópica, os benefícios de um <i>second-look</i> são limitados. <span style="color:darkblue;">No entanto, ele pode ser considerado se a hemostasia inicial foi subótima ou se houver ressangramento clínico significativo.</span> Essa prática se alinha com diretrizes internacionais, como as do American College of Gastroenterology, que orientam uma abordagem baseada no risco de ressangramento.</p>

          <p><strong>Análise das Alternativas Incorretas:</strong></p>
          <p><span style="color:darkorange;">A -</span> A afirmação de que o <i>second-look</i> endoscópico é recomendado para todos os pacientes é incorreta. Diretrizes clínicas não endossam essa prática de maneira universal devido à eficácia do tratamento com IBPs e à baixa taxa de ressangramento com manejo adequado.</p>

          <p><span style="color:darkorange;">B -</span> A declaração de que o <i>second-look</i> endoscópico reduz a mortalidade em todos os estudos não é suportada por evidências. Estudos randomizados não demonstram redução significativa de mortalidade com o uso rotineiro do <i>second-look</i> em comparação com o tratamento padrão com IBPs.</p>

          <p><span style="color:darkorange;">D -</span> A cirurgia imediata para todos que ressangram após tratamento endoscópico é um erro. A abordagem cirúrgica é considerada apenas em casos onde a terapia endoscópica e médica falham, ou em situações de ressangramento incontrolável.</p>

          <p><span style="color:darkorange;">E -</span> O uso de epinefrina isolada não é suficiente para prevenir ressangramento em todos os casos. Estudos e diretrizes recomendam a combinação de epinefrina com outras modalidades hemostáticas, como clips ou termocoagulação, para melhorar a eficácia do tratamento.</p>

          <p><strong>Conclusão:</strong></p>
          <p>Entender o papel do <i>second-look</i> endoscópico e as diretrizes de manejo para úlcera péptica hemorrágica é crucial para a prática clínica eficaz e segura. <span style="color:darkblue;">É essencial basear decisões em evidências e diretrizes atualizadas para otimizar o cuidado ao paciente.</span></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: VF
        id: 131026-0258-19-AADS91
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2025'
        enunciado: "Em relação a úlceras pépticas, julgue o item a seguir.\_\_\n\nNo caso de úlcera péptica cursando com hemorragia digestiva alta, o manejo inicial envolve estabilização hemodinâmica, administração de inibidor de bomba de prótons em alta dose e realização de endoscopia digestiva alta dentro das primeiras 24 horas do evento; o tratamento endoscópico poderá ser indicado conforme a classificação de Sakita, que associa características morfológicas da úlcera a taxas de ressangramento."
        gabarito: F
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkblue;"><strong>Gabarito: E (errado)</strong></span></p>

          <p><strong>Tema central:</strong> manejo da <u>hemorragia digestiva alta (HDA) por úlcera péptica</u> e a <span style="color:darkorange;"><strong>classificação endoscópica que guia a hemostasia</strong></span>.</p>

          <p><strong>Por que é errado?</strong> Embora o início do enunciado esteja alinhado às diretrizes (estabilização hemodinâmica, <u>IPP em dose alta</u> e <u>endoscopia em até 24 h</u>), a indicação de tratamento endoscópico NÃO se baseia na <strong><span style="color:darkorange;">classificação de Sakita</span></strong>. A classificação correta que correlaciona os <em>estigmas endoscópicos</em> com risco de ressangramento e define necessidade de terapia é a <strong><span style="color:darkblue;">classificação de Forrest</span></strong>.</p>

          <p><strong>Conduta inicial recomendada (resumo prático):</strong></p>
          <p>- Reanimação: 2 acessos calibrosos, cristaloide, monitorização; hemotransfusão em geral se Hb ≤7 g/dL (individualizar em cardiopatas).<br>
          - IPP: dose alta endovenosa (p.ex., <u>80 mg em bolus + infusão 8 mg/h por 72 h</u> ou esquemas intermitentes equivalentes).<br>
          - Endoscopia: ideal <u>em até 24 h</u> (mais precoce se choque/alto risco).<br>
          - Avaliar risco: Glasgow-Blatchford (pré-endoscopia) e Rockall (pós-endoscopia).<br>
          - Erradicar <em>H. pylori</em> e suspender AINEs/antiagregantes quando possível.</p>

          <p><strong>Classificação correta para guiar a hemostasia: <span style="color:darkblue;">Forrest</span></strong></p>
          <p>- <strong>Ia</strong> (jato) / <strong>Ib</strong> (sangramento babando) / <strong>IIa</strong> (vaso visível): <span style="color:darkorange;"><u>alto risco</u></span> → hemostasia endoscópica indicada.<br>
          - <strong>IIb</strong> (coágulo aderido): tentar remover coágulo; se estigma de alto risco por baixo, tratar.<br>
          - <strong>IIc</strong> (mancha) e <strong>III</strong> (base limpa): baixo risco → hemostasia geralmente não indicada, apenas IPP.</p>
          <p>Modalidades endoscópicas: injeção (epinefrina) associada a método térmico e/ou mecânico (clips) é superior ao uso isolado. Após hemostasia, manter <strong>IPP em alta dose por 72 h</strong> reduz ressangramento.</p>

          <p><strong>Por que Sakita não se aplica?</strong> <span style="color:darkorange;">Sakita</span> classifica fases de cicatrização da úlcera (A: ativa; H: healing; S: scar) e é <u>descritiva</u>, não validada para <u>predizer ressangramento agudo</u> nem para <u>guiar hemostasia</u>. Portanto, sua citação no contexto de HDA é a falha do item.</p>

          <p><strong>Pegadinha de prova:</strong> atenção ao nome das classificações. <span style="color:darkblue;">Forrest = sangramento/estigmas</span> (guia tratamento); <span style="color:darkorange;">Sakita = fases de cicatrização</span>.</p>

          <p><strong>Análise das alternativas:</strong><br>
          - <strong>C (certo):</strong> incorreta porque atribui à <em>Sakita</em> o papel da <em>Forrest</em>. Apesar do resto estar adequado, esse erro invalida o item.<br>
          - <strong>E (errado):</strong> correta, pois a proposição contém erro conceitual crucial.</p>

          <p><strong>Referências:</strong> ACG Guideline: Upper GI and Ulcer Bleeding (2021); ESGE Guideline Non-variceal Upper GI Hemorrhage (2021); UpToDate: Management of nonvariceal upper GI bleeding; Harrison’s Principles of Internal Medicine, 21ª ed.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-20-huwewi
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2025'
        enunciado: |-
          Paciente de 50 anos, com histórico de úlcera péptica, apresenta dor abdominal súbita e intensa, acompanhada de náuseas e febre. No exame físico apresenta abdome em tábua, com peritonismo difuso e a radiografia de abdome apontou pneumoperitônio.

          A partir do exposto, qual é a abordagem terapêutica indicada?
        alternativas:
          - id: alt_A
            texto: Antibioticoterapia e observação clínica.
          - id: alt_B
            texto: Reposição volêmica e administração de inibidores de bomba de prótons intravenosos.
          - id: alt_C
            texto: Cirurgia de emergência para correção da perfuração.
          - id: alt_D
            texto: Realizar drenagem percutânea do pneumoperitônio.
          - id: alt_E
            texto: Solicitar tomografia de abdome antes de qualquer intervenção.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Esta questão aborda o manejo de uma <span style="color: darkorange;"><strong>perfuração gastrointestinal</strong></span>, um tema crucial em Cirurgia Geral. O cenário clínico descrito é típico de uma perfuração de úlcera péptica, evidenciada pela presença de dor abdominal súbita, peritonismo, e pneumoperitônio na radiografia.</p>

          <p><span style="color: darkblue;"><strong>Justificativa para a alternativa correta (C): Cirurgia de emergência para correção da perfuração.</strong></span></p>

          <p>Quando um paciente apresenta sinais de peritonite aguda, como abdome em tábua, e achados radiográficos de pneumoperitônio, isso sugere fortemente uma <span style="color: darkorange;"><strong>perfuração do trato gastrointestinal</strong></span>. A abordagem padrão é a intervenção cirúrgica imediata para reparar a perfuração e prevenir complicações sérias, como sepse e choque séptico. Segundo diretrizes de referência, como as do <em>UpToDate</em>, a cirurgia é indicada para fechar a perfuração e tratar a causa subjacente, como uma úlcera péptica.</p>

          <p><span style="color: darkblue;"><strong>Análise das alternativas incorretas:</strong></span></p>

          <p><strong>A - Antibioticoterapia e observação clínica.</strong> Esta abordagem é inadequada porque a perfuração gastrointestinal não se resolve apenas com antibióticos e observação. A intervenção cirúrgica é necessária para reparar a perfuração, pois a simples observação pode levar a complicações fatais.</p>

          <p><strong>B - Reposição volêmica e administração de inibidores de bomba de prótons intravenosos.</strong> Embora a reposição volêmica e o controle ácido sejam parte do manejo, eles não substituem a necessidade de correção cirúrgica da perfuração, que é o passo mais crítico e imediato.</p>

          <p><strong>D - Realizar drenagem percutânea do pneumoperitônio.</strong> A drenagem percutânea não é um tratamento para perfuração gastrointestinal. Essa técnica é utilizada em abscessos intra-abdominais, e não corrigiria a perfuração ou o risco de peritonite.</p>

          <p><strong>E - Solicitar tomografia de abdome antes de qualquer intervenção.</strong> Embora a tomografia possa fornecer informações adicionais, o diagnóstico de pneumoperitônio já foi feito pela radiografia. A situação clínica exige intervenção imediata e a espera para imagens adicionais poderia atrasar um tratamento necessário.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

