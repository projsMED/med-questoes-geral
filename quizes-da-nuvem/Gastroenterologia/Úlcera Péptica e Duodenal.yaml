      - tipo: ME
        id: 131026-0258-9-8U0TXy
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Homem de 60 anos, tabagista, com história de uso continuado de anti-inflamatórios não esteroides (AINEs), apresenta hematêmese volumosa e instabilidade hemodinâmica. Endoscopia mostra úlcera duodenal com vaso visível não sangrante em fundo fibrinoso.

          Nesse caso, a conduta mais adequada será a
        alternativas:
          - id: alt_A
            texto: alta hospitalar com IBP oral, além de acompanhamento ambulatorial.
            comentario: Está errada porque Forrest IIa após hematêmese volumosa e instabilidade hemodinâmica contraindica manejo ambulatorial. IBP oral isolado não trata o estigma endoscópico de alto risco e não substitui hemostasia endoscópica terapêutica com internação.
          - id: alt_B
            texto: radioterapia gástrica.
            comentario: Está errada porque radioterapia gástrica não tem papel no tratamento de hemorragia digestiva alta por úlcera péptica. O mecanismo do sangramento aqui é erosão vascular por úlcera, cuja abordagem é hemostasia endoscópica, não terapia oncológica.
          - id: alt_C
            texto: gastrectomia parcial imediata.
            comentario: Está errada porque gastrectomia parcial imediata não é a primeira linha quando a lesão é endoscopicamente tratável. Mesmo com gravidade clínica, a sequência correta é controle endoscópico inicial; cirurgia fica como resgate em falha da endoscopia, ressangramento refratário ou impossibilidade de controle endoscópico.
          - id: alt_D
            texto: angiografia apenas diagnóstica, sem intervenção.
            comentario: Está errada porque angiografia apenas diagnóstica não oferece hemostasia. Neste contexto, após a endoscopia já identificar uma lesão de alto risco tratável, o passo adequado é terapia endoscópica; quando a angiografia entra, seu papel é terapêutico de resgate, geralmente por embolização, e não só diagnóstico.
          - id: alt_E
            texto: hemostasia endoscópica com injeção ou clipagem associada a IBP endovenoso.
            comentario: A alternativa E está correta porque a endoscopia mostrou uma úlcera duodenal com vaso visível não sangrante, achado que define Forrest IIa e implica alto risco de ressangramento. Nesse cenário, a conduta padrão inicial é tratamento hemostático endoscópico por método terapêutico disponível, como injeção ou clipagem, associado a IBP endovenoso para reduzir ressangramento e estabilizar o coágulo após o procedimento. O fato de não haver sangramento ativo no momento do exame não retira a indicação de intervenção.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: E</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Forrest IIa, definido por vaso visível não sangrante em úlcera péptica, é estigma endoscópico de alto risco de ressangramento; por isso, no contexto de hematêmese volumosa e instabilidade hemodinâmica, a conduta indicada é hemostasia endoscópica terapêutica associada a IBP endovenoso.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Hemorragia digestiva alta por úlcera péptica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre ausência de sangramento ativo e baixo risco. Aqui o achado decisivo não é o fundo fibrinoso nem o fato de estar "não sangrante", e sim o vaso visível, que classifica a úlcera como Forrest IIa e mantém indicação de hemostasia endoscópica.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em úlcera péptica hemorrágica, valorize o estigma endoscópico: vaso visível não sangrante = Forrest IIa = alto risco de ressangramento.</li><li>Se houver lesão ulcerosa de alto risco na endoscopia, não aceite alta com tratamento apenas clínico; procure hemostasia endoscópica associada a IBP endovenoso.</li><li>Cirurgia e angiografia não são primeira escolha quando a endoscopia consegue identificar e potencialmente tratar a fonte do sangramento.</li><li>A ausência de sangramento ativo no exame não exclui intervenção quando existe vaso visível.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-10-nWyYaY
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: Uma paciente de 45 anos apresenta-se à emergência com hematêmese em sangue vivo e é submetida a uma endoscopia nas primeiras 12 horas, na qual se encontra uma úlcera duodenal com vaso visível e pulsátil. Qual é a conduta endoscópica mais apropriada?
        alternativas:
          - id: alt_A
            texto: Injeção isolada de adrenalina na base da lesão.
            comentario: Está errada porque adrenalina isolada não é tratamento endoscópico definitivo adequado para úlcera com vaso visível/pulsátil. Ela pode reduzir o sangramento temporariamente, mas não trata de forma duradoura o vaso exposto, com maior risco de ressangramento.
          - id: alt_B
            texto: Aplicação exclusiva de coagulação térmica bipolar.
            comentario: Está errada na lógica específica da questão porque, embora a coagulação térmica bipolar seja método efetivo de hemostasia, o padrão clássico cobrado para estigma ulceroso de alto risco com vaso visível e pulsátil é a terapia combinada, e não monoterapia.
          - id: alt_C
            texto: Hemostasia mecânica isolada utilizando clipe endoscópico.
            comentario: Está errada porque a clipagem endoscópica é eficaz, mas o gabarito oficial considera mais apropriada a combinação de injeção com terapia definitiva diante de vaso visível e pulsátil, e não uma modalidade isolada.
          - id: alt_D
            texto: Combinação de injeção com terapia térmica ou mecânica.
            comentario: A alternativa D está correta porque a úlcera duodenal com vaso visível e pulsátil exige tratamento endoscópico ativo. A injeção ajuda no controle inicial, mas o método térmico ou mecânico é necessário para hemostasia mais duradoura e menor risco de ressangramento do que a adrenalina isolada.
          - id: alt_E
            texto: Não há indicação de intervenção endoscópica terapêutica nessa situação.
            comentario: Está errada porque vaso visível e pulsátil em úlcera péptica é marcador de alto risco e constitui indicação de hemostasia endoscópica. A ausência de sangramento em jato no exame não autoriza conduta expectante.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: D</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O achado decisivo é a úlcera duodenal com vaso visível e pulsátil, estigma de alto risco de ressangramento. Nessa situação, há indicação de hemostasia endoscópica; a adrenalina isolada não é terapia definitiva, devendo ser associada a método térmico ou mecânico, o que torna a alternativa D a correta.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Hemostasia endoscópica na úlcera péptica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre efeito inicial da adrenalina e tratamento definitivo, além da ideia errada de que a ausência de sangramento em jato afasta a necessidade de intervenção. O achado que define a questão é o vaso visível e pulsátil.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em úlcera péptica hemorrágica, vaso visível ou pulsátil deve ser lido como estigma de alto risco e indicação de hemostasia endoscópica.</li><li>Se a alternativa trouxer adrenalina isolada para lesão ulcerosa de alto risco, elimine-a como terapia definitiva.</li><li>Quando a prova opõe monoterapia a combinação em HDA não varicosa por úlcera de alto risco, a resposta clássica favorece injeção associada a método térmico ou mecânico.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-11-fhVlaX
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: "Um adolescente de 14 anos apresenta dor epigástrica recorrente, anemia ferropriva e história de uso intermitente de AINEs por cefaleia. Endoscopia mostra úlcera duodenal, e teste respiratório com ureia marcada é positivo para Helicobacter pylori.\_Acerca do caso, a conduta terapêutica CORRETA deve ser:"
        alternativas:
          - id: alt_A
            texto: Suspender AINEs e manter IBP isoladamente.
            comentario: Está errada porque suspender AINEs e usar IBP isoladamente não erradica o H. pylori. O uso de AINEs é fator agravante real e deve ser evitado, mas o teste positivo em paciente com úlcera duodenal impõe tratamento da infecção; IBP sozinho pode cicatrizar temporariamente, sem resolver a causa bacteriana.
          - id: alt_B
            texto: Iniciar terapia tripla com IBP, amoxicilina e claritromicina por 14 dias.
            comentario: 'A alternativa B está correta porque é a única que trata a causa comprovada da úlcera duodenal: a infecção por H. pylori. O IBP participa do tratamento ao reduzir a acidez e favorecer cicatrização, mas a resolução etiológica depende da associação com antibióticos; entre as opções dadas, o esquema com IBP, amoxicilina e claritromicina por 14 dias é o único tratamento erradicador apropriado para esse cenário.'
          - id: alt_C
            texto: Realizar ressecção endoscópica da úlcera.
            comentario: Está errada porque ressecção endoscópica não é tratamento de úlcera duodenal por H. pylori. O enunciado descreve lesão ulcerosa com etiologia infecciosa comprovada, sem dado de neoplasia ou outra indicação de retirada da lesão; portanto, a proposta é desproporcional ao quadro.
          - id: alt_D
            texto: Utilizar probióticos como tratamento exclusivo.
            comentario: 'Está errada porque probióticos como tratamento exclusivo não erradicam adequadamente H. pylori. O critério aqui é terapêutico: a bactéria exige esquema com antimicrobianos; medida sem antibiótico não trata a etiologia da úlcera.'
          - id: alt_E
            texto: Indicar gastrectomia parcial profilática.
            comentario: Está errada porque gastrectomia parcial profilática não tem indicação no manejo habitual de úlcera duodenal associada a H. pylori sem complicações cirúrgicas descritas. Além de não tratar de forma apropriada o cenário apresentado, representa intervenção invasiva desproporcional diante de uma condição cuja conduta correta é erradicação medicamentosa.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O ponto definidor é a presença de úlcera duodenal com teste respiratório positivo para H. pylori, situação que exige erradicação bacteriana com IBP associado a antibióticos; IBP isolado não resolve a etiologia, o que sustenta a alternativa B.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Erradicação do H. pylori</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a tendência de supervalorizar o antecedente de AINEs e aceitar IBP isolado. O dado que realmente muda a conduta é a confirmação de H. pylori em úlcera duodenal, porque isso exige tratamento erradicador.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em úlcera péptica com H. pylori comprovado, procure a alternativa que trate a infecção com IBP associado a antibióticos.</li><li>Não confunda melhora sintomática ou cicatrização com IBP com tratamento definitivo quando a etiologia bacteriana está documentada.</li><li>AINE pode coexistir como fator de lesão, mas não substitui a necessidade de erradicação se o teste para H. pylori vier positivo.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-12-ZQRZSa
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Um homem de 65 anos apresenta hematêmese e melena. Após estabilização hemodinâmica inicial na sala de emergência, é submetido à endoscopia digestiva alta que revela uma úlcera duodenal de parede posterior com vaso visível não sangrante.

          Qual é a conduta terapêutica mais adequada para prevenir ressangramento?
        alternativas:
          - id: alt_A
            texto: Observação clínica sem intervenção adicional, devido ao fato do sangramento ser autolimitado.
          - id: alt_B
            texto: Início de inibidor da bomba de prótons (IBP) intravenoso em dose alta.
          - id: alt_C
            texto: Terapia endoscópica definitiva, como coagulação térmica ou aplicação de clipes hemostáticos e IBP intravenoso.
          - id: alt_D
            texto: Injeção de adrenalina intralesional e uso de drogas vasoativas.
          - id: alt_E
            texto: Cirurgia imediata por via laparoscópica para sutura hemostática da úlcera duodenal.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:darkblue;">Tema central:</b> Hemorragia digestiva alta por <u>úlcera duodenal</u> com <b>vaso visível não sangrante</b> (Forrest IIa). Trata-se de estigma de <b style="color:darkorange;">alto risco</b> de ressangramento, especialmente em parede posterior (proximidade da artéria gastroduodenal).</p>

          <p><b style="color:darkblue;">Alternativa correta: C</b> – <u>Terapia endoscópica definitiva</u> (coagulação térmica ou clipes) associada a <b>IBP intravenoso</b>. Diretrizes ACG/ESGE e UpToDate recomendam <b>hemostasia endoscópica</b> para Forrest Ia/Ib/IIa. Para vaso visível, usar <b>método mecânico (clipe)</b> ou <b>térmico</b> (sonda térmica, coagulação) — muitas vezes precedido de <i>injeção de adrenalina</i> apenas como facilitadora — e manter <b style="color:darkorange;">IBP EV em dose alta</b> por 72 horas (ex.: bolus 80 mg + infusão 8 mg/h) para reduzir falha hemostática e ressangramento. Evidências mostram menor rebleed, necessidade de cirurgia e mortalidade quando comparado a manejo isolado com IBP ou observação (ACG 2021; ESGE 2021; Harrison’s; UpToDate).</p>

          <p><b style="color:darkblue;">Raciocínio clínico:</b> “Vaso visível” = artéria exposta pela erosão da úlcera; mesmo sem sangramento ativo, o risco de ressangrar é alto. Logo, <u>é obrigatória a hemostasia endoscópica</u> + supressão ácida intensiva.</p>

          <p><b style="color:darkblue;">Análise das alternativas incorretas</b></p>
          <ul>
            <li><b>A</b> – Observação: inadequada. Vaso visível tem risco de ressangramento elevado (até 40–50% sem terapia endoscópica). Não segue diretrizes.</li>
            <li><b>B</b> – IBP EV isolado: <u>insuficiente</u> em lesão de alto risco. IBP é <b>adjuvante</b> após hemostasia, não substitui a terapia endoscópica (ACG/ESGE).</li>
            <li><b>D</b> – Adrenalina + drogas vasoativas: a <b>adrenalina isolada</b> não é definitiva (efeito transitório). “Drogas vasoativas” (octreotídeo/terlipressina) são para <b style="color:darkorange;">sangramento varicoso</b>, não para úlcera péptica.</li>
            <li><b>E</b> – Cirurgia imediata: reservada a <u>falha da endoscopia</u> ou instabilidade refratária. Antes, considerar <b>embolização angiográfica</b> como alternativa. Não é primeira linha em paciente estabilizado.</li>
          </ul>

          <p><b style="color:darkblue;">Estratégia de prova:</b> Identifique os <u>estigmas de alto risco</u> (Forrest Ia: jato; Ib: sangramento em babação; IIa: vaso visível; IIb: coágulo aderido). Nessas situações, pense sempre em <b>hemostasia endoscópica</b> + <b>IBP EV em dose alta</b>. “Drogas vasoativas” sugerem varizes; “observação” e “IBP isolado” indicam baixo risco (Forrest IIc/III), o que <u>não</u> é o caso.</p>

          <p><b style="color:darkblue;">Pontos práticos pós-hemostasia:</b> IBP EV por 72 h, teste e erradicação de <i>H. pylori</i>, suspensão de AINEs/antiagregantes quando possível e plano de reintrodução se necessário.</p>

          <p><i>Referências: ACG Clinical Guideline: Upper GI and Ulcer Bleeding (2021); ESGE Guideline on Nonvariceal Upper GI Hemorrhage (2021); Harrison’s Principles of Internal Medicine; UpToDate – Management of nonvariceal upper GI bleeding.</i></p>

          <p><b style="color:darkorange;">Gabarito: C</b></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-13-X5wKTm
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: "Homem de 35 anos, com úlcera duodenal recidivada, apesar de IBP em dose plena e erradicação\_do H. pylori comprovada por teste da ureia expirada negativo. Negou uso de AINE ou aspirina.\nDosagem de gastrina sérica: 850 pg/mL (normal <100). O que deve ser feito?"
        alternativas:
          - id: alt_A
            texto: Cintilografia com octreotídeo para tumor neuroendócrino.
            comentario: Incorreta. Cintilografia com octreotídeo é exame de localização de tumor neuroendócrino, não etapa inicial para resolver hipergastrinemia medida sob uso de IBP. O erro é pular a validação bioquímica e assumir que úlcera recidivante mais gastrina elevada já bastam para diagnosticar gastrinoma.
          - id: alt_B
            texto: Ressonância de abdome.
            comentario: 'Incorreta. A ressonância abdominal também é exame de localização/estadiamento e não responde ao problema central do caso: a gastrina pode estar falsamente elevada pelo IBP. Antes de imagem abdominal, é preciso confirmar que a hipergastrinemia é inapropriada e não farmacológica.'
          - id: alt_C
            texto: Suspender IBP e repetir gastrina.
            comentario: 'A alternativa C está correta porque a principal limitação diagnóstica do caso é farmacológica: a gastrina foi dosada sob efeito de um medicamento que eleva esse hormônio. Em paciente com úlcera recidivada, a suspeita de gastrinoma existe, mas a sequência diagnóstica correta exige primeiro excluir hipergastrinemia secundária ao IBP. Por isso, o passo inicial é suspender o IBP e repetir a gastrina, idealmente com correlação com a acidez gástrica quando necessário, antes de concluir que há síndrome de Zollinger-Ellison ou partir para exames de localização.'
          - id: alt_D
            texto: Endoscopia com biópsia de duodeno e antro.
            comentario: Incorreta. Endoscopia com biópsia de duodeno e antro não esclarece a dúvida principal entre hipergastrinemia induzida por IBP e gastrinoma. O enunciado já informa erradicação de H. pylori, e a questão não é de histologia mucosa, mas de interpretação hormonal em contexto de uso de fármaco.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> A gastrina de 850 pg/mL foi medida durante uso de IBP, e esse fármaco pode elevar a gastrina por supressão ácida e feedback compensatório. Assim, o valor isolado não confirma gastrinoma; o passo inicial é suspender o IBP, quando viável, e repetir a gastrina antes de exames de localização tumoral.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Hipergastrinemia em uso de IBP</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a tendência de supervalorizar gastrina alta em paciente com úlcera recidivante e esquecer que o próprio IBP pode elevar significativamente esse exame, tornando prematura a investigação tumoral por imagem.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em hipergastrinemia, sempre verifique se a dosagem foi feita durante uso de IBP antes de concluir gastrinoma.</li><li>Úlcera recidivada sem H. pylori e sem AINE aumenta a suspeita de Zollinger-Ellison, mas não elimina a necessidade de confirmar adequadamente a hipergastrinemia.</li><li>Exames de imagem para tumor neuroendócrino entram após validação bioquímica, não como primeiro passo diante de gastrina potencialmente alterada por medicamento.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-14-DLUZsg
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Homem de 45 anos relata dor epigástrica noturna há alguns meses, com melhora após ingestão alimentar. Não refere perda de peso nem vômitos recorrentes.
          Realizou endoscopia digestiva alta, que evidenciou úlcera de 1,5 cm no bulbo duodenal. O teste da urease foi positivo para Helicobacter pylori.

          Assinale a alternativa correta em relação ao caso.
        alternativas:
          - id: alt_A
            texto: Toda úlcera duodenal deve ser biopsiada para excluir malignidade.
          - id: alt_B
            texto: O tabagismo reduz o risco de recorrência por estimular secreção alcalina.
          - id: alt_C
            texto: A infecção antral pelo H. pylori reduz a somatostatina, levando à hipergastrinemia e ao aumento da secreção ácida.
          - id: alt_D
            texto: O tratamento deve durar 7 dias, com controle endoscópico precoce obrigatório.
          - id: alt_E
            texto: A dor que melhora após alimentação sugere fortemente úlcera gástrica.
        gabarito: C

      - tipo: ME
        id: 131026-0258-15-l7ZInW
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Paciente de 41 anos, sexo masculino, apresenta dor epigástrica em queimação há seis meses, com melhora após a alimentação e recorrência durante o jejum. A endoscopia digestiva alta evidenciou úlcera duodenal em atividade. A pesquisa para Helicobacter pylori foi positiva.

          Em relação ao mecanismo fisiopatológico que explica a hipersecreção ácida observada nesses pacientes, assinale a afirmativa correta.
        alternativas:
          - id: alt_A
            texto: A infecção antral reduz a atividade das células D, diminuindo a produção de somatostatina e aumentando a liberação de gastrina.
          - id: alt_B
            texto: A infecção aumenta diretamente a secreção de histamina pelas células enterocromafins-símiles independentemente da gastrina.
          - id: alt_C
            texto: A bactéria estimula as células parietais por meio da produção local de urease, aumentando diretamente a secreção de ácido.
          - id: alt_D
            texto: A infecção promove destruição seletiva das células G, levando à hiperplasia compensatória das células parietais.
          - id: alt_E
            texto: A colonização gástrica aumenta a produção de prostaglandinas, estimulando a secreção de ácido clorídrico.
        gabarito: A

      - tipo: ME
        id: 131026-0258-16-hZhNpw
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: Paciente do sexo feminino, 67 anos, feodérmica, vinha sendo tratada de úlcera péptica com inibidor de bomba de prótons após tratamento adequado do H. pylori, que foi negativado. Mesmo assim, ela evoluiu com estenose pilórica, incluindo o bulbo duodenal, conseguindo alimentar-se apenas com dieta líquida sem resíduos. Assinale a alternativa que apresenta o tratamento adequado para essa paciente.
        alternativas:
          - id: alt_A
            texto: Dilatação endoscópica piloro duodenal com o uso de balão e velas.
            comentario: Está errada porque dilatação endoscópica não corresponde ao tratamento mais adequado para estenose péptica cicatricial avançada, extensa e com comprometimento do bulbo duodenal, além de limitação alimentar importante. O ponto excludente é que a lesão é orgânica e fixa após erradicação do H. pylori e uso de IBP; dilatar não remove o segmento doente e tende a menor resolutividade, com possibilidade de recidiva e necessidade de múltiplas sessões.
          - id: alt_B
            texto: Piloroplastia à Heineke-Mikulicz por laparoscopia.
            comentario: Está errada porque a piloroplastia de Heineke-Mikulicz é uma plastia de ampliação para estreitamento curto, e o enunciado descreve doença cicatricial mais extensa, envolvendo piloro e bulbo duodenal. O erro da alternativa é propor ampliação local de um segmento que, pelo padrão anatômico e pela cronicidade, deve ser ressecado.
          - id: alt_C
            texto: Hemigastrectomia e restabelecimento do trânsito com o duodeno.
            comentario: Está errada porque a formulação é inespecífica e não corresponde com precisão ao procedimento clássico indicado para esse cenário. A base destaca que o alvo anatômico decisivo é o segmento antropilórico estenosado; chamar a operação de hemigastrectomia introduz ressecção mais ampla do que a necessária e perde a especificidade da antropilorectomia com gastroduodenostomia.
          - id: alt_D
            texto: Gastrojejunostomia laterolateral com a curvatura gástrica maior.
            comentario: 'Está errada porque gastrojejunostomia é procedimento derivativo: desvia o trânsito, mas não remove a área antropilórica ulcerosa e estenosada. Neste caso, o critério cirúrgico decisivo é tratamento definitivo com ressecção do foco doente quando isso é factível, e não simples derivação que perpetua a patologia local.'
          - id: alt_E
            texto: Antropilorectomia e anastomose gastroduodenal terminoterminal.
            comentario: 'A alternativa E está correta porque é a única que trata o problema anatômico central descrito: estenose cicatricial do antro/piloro com extensão bulbar e obstrução clinicamente relevante. A antropilorectomia remove o segmento estenosado pela doença ulcerosa péptica, e a anastomose gastroduodenal restabelece o trânsito de forma fisiológica quando o duodeno pode ser utilizado. Esse é o procedimento clássico para obstrução de saída gástrica benigna fixa e avançada nesse contexto.'
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: E</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O critério que decide a questão é obstrução de saída gástrica benigna por estenose péptica fibrocicatricial fixa e extensa, com repercussão alimentar importante, após tratamento etiológico e clínico já realizado; como o enunciado descreve estenose envolvendo piloro e bulbo duodenal, com tolerância apenas a dieta líquida sem resíduos, a conduta adequada é cirurgia definitiva que resseque o segmento antropilórico doente e reconstrua o trânsito, correspondendo à antropilorectomia com gastroduodenostomia.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Estenose antropilórica péptica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre desobstruir e tratar definitivamente: alternativas menos invasivas ou derivativas parecem resolver a passagem alimentar, mas o caso descreve estenose fibrocicatricial extensa e fixa, em que o correto é ressecar o segmento antropilórico doente, não apenas dilatar, plastiar ou desviar o trânsito.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se a estenose persiste após erradicação do H. pylori e tratamento com IBP, pense em lesão fibrocicatricial orgânica, não em edema reversível.</li><li>Quando há acometimento de piloro e bulbo duodenal com limitação alimentar importante, procure a alternativa que remove o segmento doente e reconstrói o trânsito.</li><li>Diferencie procedimentos dilatadores, plastias e derivações de cirurgia definitiva com ressecção: em estenose péptica extensa, a ressecção é o critério decisivo.</li><li>Entre opções parcialmente parecidas, prefira a descrição anatomicamente precisa da operação clássica, em vez de formulações vagas ou excessivamente amplas.</li></ul></div></div>
          </div>

      - tipo: VF
        id: 131026-0258-17-hT2s2m
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: "Em relação a úlceras pépticas, julgue o item a seguir.\_\_\n\nA infecção por Helicobacter pylori é responsável pela grande maioria dos casos de úlcera duodenal e, para o tratamento de primeira linha dessa bactéria em pacientes que não apresentam alergia a fármacos, no Brasil está indicada a terapia tríplice com inibidor de bomba de prótons, claritromicina e amoxicilina durante 7 dias."
        gabarito: F
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b><span style="color:#003366">Gabarito: E – errado.</span></b></p>

          <p><b>Tema central:</b> úlcera péptica por <i>Helicobacter pylori</i> e esquemas de erradicação. De fato, o <i>H. pylori</i> responde pela maioria das úlceras duodenais (junto de AINEs), pois a infecção antral aumenta gastrina e a secreção ácida. O ponto-chave da questão é o <u>esquema de primeira linha</u> e a <u>duração do tratamento</u>.</p>

          <p><b>Por que a assertiva está errada?</b></p>
          <p>- Embora a primeira frase (relação H. pylori–úlcera duodenal) seja correta, o enunciado erra ao dizer que a terapia de primeira linha no Brasil é a <b>tríplice</b> com IBP + <span style="color:#cc5500">claritromicina</span> + amoxicilina por <b>7 dias</b>.</p>
          <p>- <b>Diretrizes atuais</b> (Maastricht VI/Florence 2022; ACG 2024; UpToDate) desaconselham a tríplice empírica com claritromicina em locais com resistência ≥15% (situação observada amplamente no Brasil) e recomendam <b>14 dias</b> de tratamento. O esquema de <b>primeira linha</b> preferido é a <span style="color:#003366"><b>quadrúpla com bismuto</b></span> por 14 dias: IBP + bismuto + tetraciclina + metronidazol. Alternativa: <b>quadrúpla concomitante</b> (IBP + amoxicilina + claritromicina + metronidazol) por 10–14 dias.</p>
          <p>- A <b>tríplice com claritromicina</b> só é aceitável se houver <u>susceptibilidade comprovada</u> à claritromicina e por <b>14 dias</b>, não 7.</p>

          <p><b>Análise das alternativas</b></p>
          <p>- <b>C – certo</b>: <span style="color:#cc5500"><b>Incorreta</b></span>. Erra no <u>esquema de primeira linha</u> (tríplice com claritromicina não é a recomendação empírica atual no Brasil) e na <u>duração</u> (7 dias é insuficiente; recomenda-se 14 dias).</p>
          <p>- <b>E – errado</b>: <span style="color:#003366"><b>Correta</b></span>. Reconhece que a afirmação global está incorreta por propor terapia desatualizada quanto a escolha e duração.</p>

          <p><b>Dicas de prova</b></p>
          <ul>
            <li>Quando ler “primeira linha” para <i>H. pylori</i>, pense em <b>quadrúpla com bismuto por 14 dias</b> em cenários de alta resistência à claritromicina.</li>
            <li>Desconfie de <b>7 dias</b>: a maioria das diretrizes atuais recomenda <b>14 dias</b> para maior taxa de erradicação.</li>
            <li>Se alergia à penicilina: prefira <b>quadrúpla com bismuto</b>. Evite claritromicina se resistência alta ou desconhecida.</li>
            <li>Sempre <u>confirmar erradicação</u> (teste respiratório ureia ou antígeno fecal) ≥4 semanas após tratamento e ≥2 semanas sem IBP.</li>
          </ul>

          <p><b>Referências rápidas:</b> Maastricht VI/Florence Consensus Report (2022); ACG Clinical Guideline: Treatment of Helicobacter pylori (atualização 2024); UpToDate (acesso 2024); princípios gerais em Harrison’s Principles of Internal Medicine.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-18-xgIENp
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: "Homem 62 anos, uso crônico de AAS 100 mg/dia por DAC, chega com melena e hematêmese. PA 95/60, FC 118.\_Hb 7,6 g/dL. Após reposição volêmica e transfusão conforme alvo clínico, EDA evidencia úlcera duodenal com vaso visível (Forrest IIa), tratada endoscopicamente com hemostasia adequada. Considerando prevenção de ressangramento e necessidade do antiagregante, a conduta mais adequada é:"
        alternativas:
          - id: alt_A
            texto: Suspender definitivamente o AAS, pois o risco de ressangramento supera o benefício cardiovascular em todos os casos.
          - id: alt_B
            texto: Manter AAS suspenso por 30 dias e reiniciar sem IBP para evitar interação farmacológica.
          - id: alt_C
            texto: Reiniciar AAS precocemente (em 3–5 dias ou antes, conforme risco), associado a IBP, pois reduz mortalidade cardiovascular apesar de pequeno aumento de ressangramento.
          - id: alt_D
            texto: Trocar AAS por clopidogrel isolado, sem IBP, por menor risco gastrointestinal e mesma proteção cardiovascular.
          - id: alt_E
            texto: Não usar IBP após hemostasia endoscópica em úlcera duodenal, pois aumenta risco de infecção e não reduz ressangramento.
        gabarito: C

      - tipo: ME
        id: 131026-0258-19-YcGxP9
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: Homem, 70 anos, tabagista, hipertenso e diabético tipo 2, faz uso regular de AINEs para dor lombar. Relata melena recente, sem hematêmese. Refere episódios ocasionais de tontura, porém sem sinais de instabilidade hemodinâmica. Foi submetido à endoscopia digestiva alta, que evidenciou úlcera duodenal com coágulo aderido, sem sangramento ativo. Assinale a alternativa que corresponde à classificação de Forrest do achado endoscópico descrito no caso acima.
        alternativas:
          - id: alt_A
            texto: Ia.
            comentario: Forrest Ia significa sangramento ativo em jato. Isso é incompatível com a descrição de ausência de sangramento ativo e presença de coágulo aderido.
          - id: alt_B
            texto: IIa.
            comentario: Forrest IIa corresponde a vaso visível não sangrante. O enunciado não descreve vaso visível; descreve coágulo aderido, que define IIb e exclui IIa.
          - id: alt_C
            texto: IIb.
            comentario: A alternativa C está correta porque Forrest IIb é a categoria da úlcera péptica com coágulo aderido. O dado decisivo é o aspecto visual do leito ulceroso na endoscopia, e não melena, tontura, comorbidades, uso de AINEs ou estabilidade hemodinâmica. Como o estigma descrito é coágulo aderido, a correspondência técnica é IIb.
          - id: alt_D
            texto: III.
            comentario: Forrest III é úlcera com base limpa, sem estigmas recentes de sangramento. A presença de coágulo aderido não corresponde a base limpa.
          - id: alt_E
            texto: IV.
            comentario: A classificação de Forrest usual para úlcera péptica hemorrágica inclui Ia, Ib, IIa, IIb, IIc e III. Não há categoria IV nessa classificação, então a alternativa é incorreta.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Na classificação de Forrest, o achado "coágulo aderido" corresponde a Forrest IIb; como a endoscopia descreve úlcera duodenal com coágulo aderido e sem sangramento ativo, a alternativa correta é C.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Classificação de Forrest</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre ausência de sangramento ativo e Forrest III, quando o achado classificatório real é o coágulo aderido, que define Forrest IIb; também pode induzir troca entre IIa e IIb.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Classifique Forrest pelo achado endoscópico descrito no leito da úlcera, não pelos sintomas ou pela estabilidade hemodinâmica.</li><li>Separe os subtipos: vaso visível não sangrante é IIa, coágulo aderido é IIb, base limpa é III.</li><li>Se houver coágulo aderido, a classificação é IIb, não III.</li><li>Desconfie de alternativas com categorias fora da nomenclatura clássica da escala.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-20-aRUNC2
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Mulher de 75 anos, com histórico de hipertensão e artrite, em uso prolongado de anti-inflamatórios e tabagista, foi internada por sangramento intestinal baixo associado a tontura.
          Apresenta estabilidade hemodinâmica e nega hematêmese. Foi realizada uma Endoscopia Digestiva Alta (EDA), que identificou uma úlcera duodenal. Diferentemente de quadros com estigmas de sangramento recente ou ativo, a lesão apresentava-se com uma base clara, sem qualquer evidência de vasos expostos, coágulos ou pontos pigmentados. Diante da estabilidade do achado, não houve necessidade de intervenção endoscópica terapêutica. De acordo com a descrição endoscópica, qual é a classificação de Forrest para essa úlcera?
        alternativas:
          - id: alt_A
            texto: Ic.
          - id: alt_B
            texto: IIa.
          - id: alt_C
            texto: IIb.
          - id: alt_D
            texto: III.
        gabarito: D

      - tipo: ME
        id: 131026-0258-21-YyDUVu
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Mulher de 38 anos, com deficiência congênita de IgA, é atendida em ambulatório de clínica médica devido a insucesso terapêutico no tratamento de infecção por Helicobacter pylori.
          Apresentava diagnóstico de úlcera duodenal, tendo sido prescrito omeprazol, amoxicilina e claritromicina. Apesar da melhora clínica, observou-se persistência da infecção em teste respiratório com C13. Atribuiu-se o insucesso terapêutico ao uso recorrente de macrolídeos e fluoroquinolonas.

          Nesse caso, deve-se prescrever
        alternativas:
          - id: alt_A
            texto: pantoprazol, amoxicilina e levofloxacino por 7 dias.
            comentario: Está errada porque usa levofloxacino apesar da exposição recorrente prévia a fluoroquinolonas, o que sugere resistência e torna inadequado esse antibiótico no resgate empírico. Além disso, 7 dias é duração curta para tratamento de resgate, menos adequada do que 14 dias no contexto de falha prévia.
          - id: alt_B
            texto: omeprazol, claritromicina e levofloxacino por 14 dias.
            comentario: 'Está errada por dois motivos excludentes: repete claritromicina após falha de um esquema que já continha claritromicina, o que não deve ser feito empiricamente, e ainda inclui levofloxacino em paciente com uso recorrente prévio de fluoroquinolonas. Aumentar a duração para 14 dias não corrige o problema central de provável resistência antibiótica.'
          - id: alt_C
            texto: omeprazol, subcitrato de bismuto coloidal, doxiciclina e metronidazol por 14 dias.
            comentario: A alternativa C é a melhor resposta entre as opções porque evita claritromicina e levofloxacino, fármacos desfavoráveis neste caso pela falha prévia e pela suspeita de resistência associada ao uso recorrente de macrolídeos e fluoroquinolonas. Assim, o esquema com omeprazol, subcitrato de bismuto coloidal, doxiciclina e metronidazol por 14 dias corresponde ao resgate mais adequado dentre os listados. A melhora clínica inicial não muda a conclusão, pois o teste respiratório com C13 positivo confirmou persistência da infecção.
          - id: alt_D
            texto: pantoprazol, subcitrato de bismuto coloidal, furazolidona e levofloxacino por 10 dias.
            comentario: Está errada porque, embora contenha bismuto, mantém levofloxacino em um cenário em que o próprio enunciado sugere resistência por uso recorrente prévio de fluoroquinolonas. A presença de bismuto não neutraliza a inadequação do antibiótico escolhido. Além disso, 10 dias é menos robusto que 14 dias para resgate após falha terapêutica.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Falha documentada após esquema com claritromicina, associada a uso recorrente de macrolídeos e fluoroquinolonas, favorece evitar claritromicina e levofloxacino no resgate.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Resgate do H. pylori</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca mistura um elemento distrator, a deficiência de IgA, com o dado realmente decisivo: falha confirmada no teste respiratório e provável resistência por uso prévio de macrolídeos e quinolonas. Outra pegadinha é fazer parecer que levofloxacino seria automaticamente segunda linha, quando a exposição prévia à classe o torna inadequado.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em falha de esquema com claritromicina, não reutilize claritromicina empiricamente no resgate.</li><li>História de uso prévio recorrente de fluoroquinolonas pesa contra levofloxacino como opção de resgate.</li><li>Teste respiratório persistente positivo confirma falha de erradicação, mesmo se houve melhora clínica.</li><li>Entre opções de resgate, prefira a que use esquema quádruplo com bismuto e duração de 14 dias quando for necessário evitar macrolídeos e quinolonas.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-22-pSOG6Z
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Homem, 48 anos, procura atendimento por dor epigástrica recorrente há oito meses.
          Refere melhora parcial após alimentação e piora durante a madrugada. Nega perda ponderal, vômitos ou anemia. Não utiliza anti-inflamatórios não esteroidais. A endoscopia digestiva alta evidencia úlcera duodenal de 9 mm, sem sinais de sangramento ativo. O teste rápido da urease realizado durante o exame é negativo. Assinale a alternativa que apresenta a melhor conduta diante desse resultado.
        alternativas:
          - id: alt_A
            texto: Excluir definitivamente infecção por Helicobacter pylori devido ao teste da urease negativo.
            comentario: Está errada porque transforma um teste com possibilidade de falso-negativo em critério de exclusão definitiva. No contexto de úlcera duodenal sem uso de AINEs, a suspeita de H. pylori continua relevante, então a urease negativa isolada não encerra a investigação etiológica.
          - id: alt_B
            texto: Solicitar teste complementar para pesquisa de Helicobacter pylori, considerando a possibilidade de resultado falso-negativo.
            comentario: A alternativa B está correta porque a úlcera duodenal tem forte associação etiológica com H. pylori, e o teste rápido da urease, embora útil, não tem valor de exclusão definitiva quando negativo de forma isolada. Como esse exame pode falhar por erro de amostragem, baixa carga bacteriana ou distribuição irregular da colonização, a conduta tecnicamente adequada é prosseguir com teste complementar para confirmar ou afastar a infecção.
          - id: alt_C
            texto: Iniciar antibioticoterapia empírica independentemente de confirmação diagnóstica.
            comentario: Está errada porque propõe erradicação empírica sem confirmação diagnóstica, apesar de ainda haver possibilidade objetiva de esclarecer a etiologia com método complementar. Isso contraria o princípio de adequação diagnóstica antes de antibioticoterapia e favorece uso inadequado de antibióticos.
          - id: alt_D
            texto: Repetir endoscopia em sete dias.
            comentario: Está errada porque repetir endoscopia em sete dias não é a melhor estratégia para resolver a questão central, que é confirmar ou afastar H. pylori após urease negativa. Além disso, não há sangramento ativo, sinais de complicação, alarme ou outra indicação clínica apresentada que justifique nova endoscopia precoce.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Na úlcera duodenal, especialmente sem uso de AINEs, a probabilidade pré-teste de Helicobacter pylori é elevada; como o teste rápido da urease pode ser falso-negativo, o resultado negativo não exclui a infecção e obriga a complementar a investigação, o que torna a alternativa B a correta.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Urease negativa na úlcera duodenal</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre teste rápido da urease negativo e exclusão definitiva de H. pylori em um cenário em que a probabilidade clínica de infecção continua alta.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em úlcera duodenal sem uso de AINEs, mantenha alta suspeita de H. pylori mesmo diante de um teste inicial negativo.</li><li>Teste rápido da urease negativo isolado não fecha exclusão diagnóstica quando há possibilidade de falso-negativo.</li><li>Se a suspeita clínica persiste, a conduta é complementar a investigação, não encerrar o caso nem tratar empiricamente.</li><li>Repetição endoscópica precoce só entra quando houver indicação clínica própria; não é a resposta automática para urease negativa.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-23-vwgMf7
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: "Paciente do sexo masculino, 49 anos, foi submetido à endoscopia digestiva alta por dispepsia persistente. O exame evidenciou úlcera duodenal não complicada, sendo realizadas biópsias que confirmaram infecção por H. pylori.\_\nDurante a discussão terapêutica, o paciente perguntou por que não seria suficiente utilizar apenas um antibiótico, já que o microorganismo identificado é conhecido.\nConsiderando os princípios atuais relacionados à erradicação de H. pylori, assinale a opção que apresenta a afirmação mais adequada."
        alternativas:
          - id: alt_A
            texto: O objetivo principal do tratamento é reduzir temporariamente a carga bacteriana, não sendo necessária erradicação completa.
            comentario: Está errada porque, na doença ulcerosa péptica associada ao H. pylori, o objetivo terapêutico não é redução temporária da carga bacteriana, mas erradicação da infecção. Redução transitória pode até coexistir com melhora clínica inicial, porém não corresponde à cura etiológica nem ao princípio terapêutico cobrado.
          - id: alt_B
            texto: Esquemas terapêuticos utilizam associação de medicamentos visando aumentar eficácia e reduzir falhas relacionadas à resistência bacteriana.
            comentario: 'A alternativa B está correta porque expressa o racional microbiológico e farmacológico do tratamento erradicador do H. pylori: combinar medicamentos aumenta a chance de eliminar a bactéria, melhora a ação antimicrobiana em ambiente menos ácido e reduz insucessos ligados à resistência bacteriana. Na úlcera duodenal associada ao H. pylori, o objetivo é eliminar o agente etiológico, e não apenas aliviar sintomas ou cicatrizar a lesão.'
          - id: alt_C
            texto: O uso isolado de inibidor de bomba de prótons frequentemente é suficiente para erradicação definitiva.
            comentario: Está errada porque o IBP isolado promove supressão ácida e pode favorecer alívio sintomático e cicatrização da úlcera, mas isso não equivale à erradicação definitiva do H. pylori. O erro é confundir tratamento da acidez/úlcera com eliminação bacteriana.
          - id: alt_D
            texto: O sucesso terapêutico depende apenas da duração do tratamento, independentemente dos medicamentos escolhidos.
            comentario: Está errada porque a duração do tratamento influencia o resultado, mas não substitui a composição adequada do esquema. Um regime inadequado não se torna eficaz apenas por ser mais longo, já que o sucesso depende também da escolha de fármacos com atividade erradicadora diante da resistência bacteriana.
          - id: alt_E
            texto: "A utilização de múltiplos medicamentos ocorre exclusivamente para\_reduzir efeitos adversos\_gastrointestinais."
            comentario: Está errada porque a politerapia no H. pylori não é usada exclusivamente para reduzir efeitos adversos gastrointestinais. O motivo central da associação é aumentar a taxa de erradicação e diminuir falhas terapêuticas; atribuir essa estratégia apenas à tolerabilidade distorce o fundamento do tratamento.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Em úlcera duodenal com infecção confirmada por H. pylori, o tratamento tem finalidade erradicadora e requer terapia combinada com antibióticos associados à supressão ácida, porque a monoterapia tem baixa eficácia e maior risco de falha por resistência bacteriana; por isso, a alternativa correta é a que relaciona a associação de medicamentos ao aumento da eficácia e à redução das falhas terapêuticas.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Erradicação do H. pylori</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre tratar a úlcera e erradicar a infecção: conhecer o microrganismo não torna a monoterapia suficiente, e melhorar a acidez com IBP não significa eliminar o H. pylori.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em H. pylori associado a úlcera, primeiro defina o objetivo: erradicação bacteriana, não só cicatrização da lesão.</li><li>Se a alternativa defender monoterapia antibiótica ou IBP isolado como cura definitiva, ela contraria o princípio terapêutico básico.</li><li>Quando a questão perguntar por que usar múltiplos fármacos, o critério decisivo é eficácia erradicadora e enfrentamento da resistência, não apenas controle de sintomas ou redução de efeitos adversos.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-24-Bjoqnh
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: "Um paciente de 45 anos, executivo, refere quadro de dor epigástrica em queimação há 2 meses, que melhora com a alimentação e piora 2 a 3 horas após as refeições, despertando-o à noite. Ele nega perda de peso, mas admite uso frequente de anti-inflamatórios não esteroides (AINEs) por cefaleia tensional e relata alto nível de estresse no trabalho. Uma endoscopia digestiva alta é realizada e evidencia uma úlcera de 1,5 cm de diâmetro na parede anterior do bulbo duodenal. O teste de urease para Helicobacter pylori na biópsia gástrica resulta positivo. Sobre a fisiopatologia e o tratamento desta condição, analise as afirmativas a seguir:\n\nI.A fisiopatologia da úlcera duodenal envolve um desequilíbrio entre fatores agressores e protetores da mucosa. Neste caso, há dois fatores agressores principais: a infecção por H. pylori, que aumenta a secreção de gastrina e ácido clorídrico, e o uso de\_AINEs, que inibem a produção de prostaglandinas protetoras da mucosa.\n\nII.O tratamento visa a erradicação do H. pylori, a cicatrização da úlcera e a prevenção de recorrências. O esquema de primeira linha preconizado no Brasil envolve a combinação de um inibidor de bomba de prótons (IBP) em dose dupla com dois antibióticos, como amoxicilina e claritromicina, por 14 dias.\nIII.Após o término do tratamento de erradicação, é mandatório manter o uso contínuo de um IBP por tempo indeterminado para prevenir a recidiva da úlcera, mesmo com a confirmação da erradicação da bactéria.\n\nEstá correto o que se afirma em:"
        alternativas:
          - id: alt_A
            texto: I, II e III.
            comentario: 'Incorreta porque inclui a afirmativa III. O erro médico está em transformar o IBP em manutenção universal e indefinida após erradicação confirmada do H. pylori. Isso contraria o fundamento da questão: a erradicação bacteriana reduz a recorrência da úlcera duodenal, e o IBP crônico só se justifica em contextos selecionados, não como regra para todos.'
          - id: alt_B
            texto: I e III apenas.
            comentario: 'Incorreta por dois motivos objetivos: exclui a afirmativa II, que a base considera correta como esquema de primeira linha cobrado na prova, e mantém a III, que é falsa. O critério decisivo aqui é terapêutico: IBP + amoxicilina + claritromicina por 14 dias sustenta a II, enquanto a ausência de indicação universal de IBP indefinido derruba a III.'
          - id: alt_C
            texto: I e II apenas.
            comentario: 'A alternativa C está correta porque a afirmativa I descreve adequadamente a fisiopatologia do caso: úlcera péptica resulta de desequilíbrio entre fatores agressores e protetores, e aqui os dois agressores relevantes são H. pylori e AINEs. Na úlcera duodenal associada ao H. pylori, especialmente com predomínio antral, há redução relativa da somatostatina e aumento de gastrina, favorecendo hipersecreção ácida; os AINEs, por sua vez, inibem COX e reduzem prostaglandinas, com perda de muco, bicarbonato, fluxo sanguíneo mucoso e reparo epitelial. A afirmativa II também está correta porque a base adota como leitura válida para a prova o esquema tríplice de primeira linha usado em referências brasileiras: IBP associado a amoxicilina e claritromicina por 14 dias, com objetivo de erradicar a bactéria, cicatrizar a úlcera e reduzir recorrência. A afirmativa III é falsa porque a erradicação bem-sucedida do H. pylori reduz de forma marcante a recidiva da úlcera duodenal, e o uso indefinido de IBP não é obrigatório; manutenção crônica depende de indicações próprias, como persistência de AINEs, DRGE importante ou úlcera refratária/complicada.'
          - id: alt_D
            texto: I apenas.
            comentario: Incorreta porque a afirmativa II também está correta. A base é explícita ao aceitar, para esta questão, o esquema tríplice com IBP, amoxicilina e claritromicina por 14 dias como conduta compatível com referências brasileiras. Portanto, não é possível restringir o acerto à afirmativa I.
          - id: alt_E
            texto: II e III apenas.
            comentario: 'Incorreta porque a afirmativa I é verdadeira e a III é falsa. A I está sustentada pela fisiopatologia clássica da doença ulcerosa péptica: H. pylori aumenta a agressão ácida na úlcera duodenal e AINEs reduzem prostaglandinas protetoras. Já a III erra ao afirmar obrigatoriedade de IBP por tempo indeterminado após erradicação confirmada.'
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> A questão se resolve pelo reconhecimento de úlcera duodenal associada a H. pylori e AINEs, em que a conduta cobrada é erradicação com esquema tríplice por 14 dias e não manutenção indefinida de IBP após cura bacteriana; por isso, I e II são verdadeiras e III é falsa.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Úlcera duodenal</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre manter IBP por tempo limitado para cicatrização e impor uso por tempo indeterminado. A III fica errada pelo caráter mandatório e indefinido, não por negar que o IBP possa ser usado por algum período ou em situações específicas.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em úlcera duodenal, procure primeiro os fatores agressores concretos do caso: H. pylori e AINEs podem coexistir e somar risco.</li><li>Se a questão trouxer H. pylori positivo com úlcera documentada, o núcleo da conduta é erradicar a bactéria com esquema indicado na base da prova, não apenas suprimir ácido.</li><li>Uso prolongado de IBP só pode ser marcado como obrigatório quando houver indicação própria; após erradicação confirmada, manutenção indefinida não é regra.</li><li>Não deixe estresse ocupacional desviar o raciocínio quando o enunciado já fornece causa fisiopatológica objetiva.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-25-VAA6Qr
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Um paciente de 42 anos, previamente saudável, apresenta dor epigástrica crônica, diarreia aquosa e perda de 5 kg nos últimos 3 meses. Já foi tratado com IBP para úlcera duodenal, mas os sintomas persistem, mesmo com doses altas. Ao exame, encontra-se emagrecido, sem alterações focais. Uma endoscopia digestiva alta mostra múltiplas úlceras duodenais distais. A dosagem de gastrina sérica basal é 980 pg/mL (VN <150). O teste com secretina foi positivo.

          O diagnóstico mais provável e a melhor conduta para localização e tratamento do tumor são
        alternativas:
          - id: alt_A
            texto: adenocarcinoma gástrico; iniciar quimioterapia empírica.
          - id: alt_B
            texto: síndrome de Zollinger-Ellison (gastrinoma); localizar com octreoscan ou Ga-68 e realizar ressecção cirúrgica.
          - id: alt_C
            texto: doença ulcerosa péptica refratária; continuar IBP em dose dobrada.
          - id: alt_D
            texto: síndrome do intestino irritável; tratar com dieta e psicoterapia.
          - id: alt_E
            texto: GIST duodenal; iniciar imatinibe e observar evolução.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange; font-weight:bold;">Tema central:</span> Esta questão aborda a <b>Síndrome de Zollinger-Ellison (SZE)</b>, também chamada de <u>gastrinoma</u>, um tumor neuroendócrino responsável pela produção excessiva de gastrina, resultando em hipercloridria e quadro clínico de úlceras gástricas refratárias, diarreia e perda de peso.</p>

          <p><span style="color:darkorange; font-weight:bold;">Raciocínio para o diagnóstico:</span> O paciente apresenta <b>múltiplas úlceras duodenais distais</b> e baixa resposta ao IBP, associados a <span style="color:blue; font-weight:bold;">gastrina sérica de 980 pg/mL</span> (VN &lt;150) e <u>teste com secretina positivo</u>. Segundo o Projeto Diretrizes da AMB/CFM: <span style="color:blue;">“No gastrinoma, os níveis de gastrina sérica se encontram acima de 150 pg/ml, comumente em torno de 1.000 pg/ml. Valores acima de 1.000 pg/ml em pacientes com achados clínicos sugerindo doença por excesso de secreção de ácido são praticamente diagnósticos de Zollinger-Ellison.”</span></p>

          <p><b>Portanto, o diagnóstico é SZE (gastrinoma)</b>. A melhor conduta, segundo diretrizes (AMB, UpToDate, Harrison’s), consiste em <span style="color:darkorange;">confirmar a localização do tumor com exames sensíveis</span> (Octreoscan ou PET com Ga-68) e realizar <u>ressecção cirúrgica</u> se possível – aumentando as chances de cura nos casos não metastáticos.</p>

          <p><span style="color:darkorange; font-weight:bold;">Comentando as alternativas:</span></p>
          <p>
          <span style="color:blue; font-weight:bold;">A) Adenocarcinoma gástrico; iniciar quimioterapia empírica:</span> <span style="color:darkorange; font-weight:bold;">Incorreta.</span> O quadro não condiz com adenocarcinoma gástrico, que raramente cursa com hipercloridria dessa magnitude e não apresenta múltiplas úlceras duodenais distais.
          </p>
          <p>
          <span style="color:blue; font-weight:bold;">C) Doença ulcerosa péptica refratária; continuar IBP em dose dobrada:</span> <span style="color:darkorange; font-weight:bold;">Incorreta.</span> O foco não deve ser apenas controle sintomático, já que há forte indicativo de gastrinoma – é fundamental investigar e tratar a causa.
          </p>
          <p>
          <span style="color:blue; font-weight:bold;">D) Síndrome do intestino irritável; tratar com dieta e psicoterapia:</span> <span style="color:darkorange; font-weight:bold;">Errada.</span> Não justifica úlceras e gastrina elevada. A presença de lesões orgânicas exclui SII.
          </p>
          <p>
          <span style="color:blue; font-weight:bold;">E) GIST duodenal; iniciar imatinibe e observar evolução:</span> <span style="color:darkorange; font-weight:bold;">Incorreta.</span> GIST não cursa com hipercloridria nem com gastrina elevada.
          </p>

          <p><span style="color:darkorange; font-weight:bold;">Dicas de prova:</span> Atenção ao padrão de múltiplas úlceras distais refratárias, dosagem de gastrina e teste de secretina. Busque sempre o nexo entre <b>clínica, laboratório e conduta</b>.</p>

          <p><b>Resposta correta: alternativa B.</b></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-26-Lnt2Mn
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Homem de 68 anos, hipertenso, com antecedente de dispepsia crônica e uso contínuo de anti-inflamatórios não esteroidais (AINEs), é admitido na emergência com episódio de melena volumosa e queda do nível de consciência. Ao exame, encontrase pálido, sudorético, taquicárdico (FC 112 bpm) e hipotenso (PA 85/60 mmHg). Após estabilização com reposição volêmica e transfusão de 2 concentrados de hemácias, é submetido à endoscopia digestiva alta que revela úlcera duodenal com vaso visível sem sangramento ativo (classificação de Forrest IIa).
          Das condutas abaixo, a mais adequada nesse momento é
        alternativas:
          - id: alt_A
            texto: alta hospitalar com uso de IBP oral e nova endoscopia em 30 dias.
          - id: alt_B
            texto: apenas observação clínica com jejum e hidratação intravenosa por 24-48h.
          - id: alt_C
            texto: cirurgia de emergência com sutura da úlcera e vagotomia troncular
          - id: alt_D
            texto: tratamento endoscópico com injeção de adrenalina e termo coagulação local.
          - id: alt_E
            texto: embolização angiográfica profilática, mesmo sem sangramento ativo.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color: #003366; font-weight: bold;">Tema central:</span> Esta questão aborda o manejo do paciente com <span style="color: #FF8C00; font-weight:bold;">hemorragia digestiva alta por úlcera péptica, com estigma de alto risco (Forrest IIa)</span>, um tema essencial em Cirurgia Geral e frequentemente cobrado nas provas de Residência.</p>

          <p><span style="color: #003366; font-weight: bold;">Justificativa da alternativa correta:</span></p>

          <p>Conforme o <b>Projeto Diretrizes da SOBED</b>: “<i>Lesões classificadas como Forrest IIa (vaso visível não sangrante) apresentam alto risco de ressangramento, sendo indicado o tratamento endoscópico com injeção de adrenalina e métodos térmicos ou mecânicos.</i>”</p>

          <p>Portanto, o tratamento endoscópico combinado (injeção de adrenalina e termocoagulação local) deve ser realizado imediatamente, pois reduz drasticamente o risco de ressangramento, que pode chegar a 50% nesta classificação. (<span style="color: #FF8C00; font-weight:bold;">Alternativa D</span>).</p>

          <p><span style="color: #003366; font-weight: bold;">Análise crítica das alternativas:</span></p>
          <p>
          <b>A)</b> <span style="color: #FF8C00;">Alta hospitalar com IBP oral e nova endoscopia em 30 dias:</span> <u>Inadequado</u>. A úlcera Forrest IIa exige intervenção imediata devido ao risco elevado de novo sangramento. Protocolos atualizados <b>não</b> recomendam alta precoce nesse contexto.<br>
          <b>B)</b> <span style="color: #FF8C00;">Apenas observação clínica:</span> <u>Insuficiente</u>. O acompanhamento passivo diante de um estigma de alto risco não previne ressangramento e desconsidera as evidências atuais.<br>
          <b>C)</b> <span style="color: #FF8C00;">Cirurgia de emergência:</span> <u>Desnecessário neste momento</u>. A cirurgia fica reservada para falha do método endoscópico ou instabilidade refratária.<br>
          <b>E)</b> <span style="color: #FF8C00;">Embolização angiográfica profilática:</span> <u>Não indicada como primeira linha</u>. Só é considerada quando há falha de métodos endoscópicos.
          </p>

          <p><span style="color: #003366; font-weight: bold;">Estratégias para a prova:</span></p>
          <p>
          A banca buscou avaliar seu conhecimento sobre <span style="color: #FF8C00;">estratificação de risco pelo Forrest</span> e <span style="color: #FF8C00;">conduta baseada em evidências</span>. Atenção: “vaso visível” SEM sangramento ativo <u>não</u> significa conduta expectante! É fundamental identificar palavras-chave do enunciado – “vaso visível”, “Forrest IIa” e “paciente instável” – e lembrar sempre de agir para prevenir novo sangramento.</p>

          <p><span style="color: #003366; font-weight: bold;">Referências:</span></p>
          <p>
          <i>Projeto Diretrizes SOBED</i> – “O tratamento endoscópico é padrão ouro para úlcera péptica com vaso visível (Forrest IIa)”<br>
          <i>Harrison’s Principles of Internal Medicine</i>, 21ª edição – seção Hemorragia Digestiva.
          </p>

          <p><span style="color: #003366; font-weight: bold;">Resumo:</span> O paciente apresentou úlcera duodenal Forrest IIa, com necessidade obrigatória de tratamento endoscópico imediato para evitar ressangramento, conforme demonstram as principais diretrizes e estudos internacionais.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

      - tipo: ME
        id: 131026-0258-27-vcIidZ
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Paciente do sexo masculino, de 54 anos, com carga tabágica de 30 maços/ano, apresentou vários episódios de vômitos sanguinolentos, evoluindo com hipotensão arterial, taquicardia e melena.
          Após instalação das medidas clínicas de suporte, foi indicada a realização de endoscopia digestiva alta, a qual evidenciou uma úlcera de 1,5 cm no maior diâmetro, com sangramento em jato na parede inferior do bulbo duodenal. Foi realizada dupla terapia hemostática com clipe e injeção de solução de adrenalina, com boa resposta inicial. Assinale a alternativa correta em relação ao achado diagnóstico.
        alternativas:
          - id: alt_A
            texto: De acordo com a classificação de Sakita S1, há indicação de tratamento cirúrgico.
            comentario: Está errada por dois motivos médicos objetivos. Primeiro, Sakita não é a classificação usada para descrever sangramento ativo de úlcera duodenal; Sakita avalia fase evolutiva/cicatricial da úlcera, enquanto o enunciado exige Forrest. Segundo, a boa resposta inicial à hemostasia endoscópica afasta indicação cirúrgica obrigatória imediata. Cirurgia pode ser necessária em falha hemostática, ressangramento importante ou instabilidade refratária, mas não decorre automaticamente desse achado.
          - id: alt_B
            texto: Com risco de ressangramento em torno de 90%, o achado endoscópico é característico de Forrest IA.
            comentario: A alternativa B está correta porque há correspondência direta entre a descrição endoscópica e a classificação prognóstica adequada da hemorragia ulcerosa. Em úlcera péptica, sangramento ativo em jato é Forrest IA. Essa é uma lesão de alto risco, com probabilidade de ressangramento classicamente muito elevada se não houver hemostasia. O núcleo técnico cobrado é reconhecer que a classificação apropriada aqui é Forrest, e não outra, e que Forrest IA não é lesão de baixo risco.
          - id: alt_C
            texto: A piloroplastia à Finney seria a melhor opção de tratamento cirúrgico.
            comentario: Está errada porque propõe uma técnica cirúrgica específica como se fosse a melhor opção universal, sem que o caso tenha estabelecido indicação operatória. Após resposta inicial adequada à dupla terapia endoscópica, o achado diagnóstico por si só não define piloroplastia à Finney como tratamento padrão. Quando cirurgia é necessária na hemorragia ulcerosa duodenal, o princípio é controlar o vaso sangrante, e não concluir diretamente por essa técnica a partir do achado Forrest IA.
          - id: alt_D
            texto: O achado endoscópico é compatível com a classificação de Sarin, GOV 1.
            comentario: Está errada porque Sarin é classificação de varizes gástricas e gastroesofágicas, especialmente no contexto de hipertensão portal, e não de úlcera duodenal sangrante. O enunciado descreve lesão ulcerosa no bulbo duodenal com sangramento em jato, cuja classificação apropriada é Forrest.
          - id: alt_E
            texto: O tratamento cirúrgico está completamente descartado pelo baixo risco de ressangramento.
            comentario: Está errada por inverter a estratificação de risco e por excluir indevidamente conduta cirúrgica futura. Forrest IA é achado de alto, não de baixo, risco de ressangramento. Além disso, a boa resposta inicial à hemostasia endoscópica não descarta completamente cirurgia, que continua possível em falha terapêutica, ressangramento ou instabilidade persistente.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O achado endoscópico "sangramento em jato" em úlcera duodenal define Forrest IA, estigma de sangramento ativo arterial e de altíssimo risco de ressangramento; por isso, a alternativa B é a correta.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Classificação de Forrest</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca misturou classificações de entidades diferentes: Forrest para estigmas de sangramento em úlcera péptica, Sakita para fase evolutiva da úlcera e Sarin para varizes gastroesofágicas. O termo decisivo era "sangramento em jato", que identifica Forrest IA.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em hemorragia por úlcera péptica, procure primeiro o estigma endoscópico e traduza para Forrest antes de pensar em conduta.</li><li>Memorize o núcleo da Forrest: IA = jato, IB = babação, IIA = vaso visível, IIB = coágulo aderido, IIC = mancha plana, III = base limpa.</li><li>Não troque sistemas classificatórios: Sakita não estratifica sangramento ativo e Sarin não classifica úlcera duodenal.</li><li>Sucesso inicial da hemostasia endoscópica não transforma Forrest IA em lesão de baixo risco nem elimina totalmente a possibilidade de cirurgia.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-28-lNs5iK
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Um paciente de 72 anos de idade, com insuficiência renal crônica em hemodiálise e história de cardiopatia isquêmica, foi admitido com hemorragia digestiva alta maciça (hematêmese e melena). A endoscopia digestiva alta de urgência identificou uma úlcera duodenal sangrante com vaso visível (Forrest IIa). Após tentativa de hemostasia endoscópica com injeção de adrenalina e clipagem, houve ressangramento imediato. O paciente permanece instável, mesmo com reposição volêmica agressiva e múltiplas transfusões.
          Diante de hemorragia recorrente e instabilidade hemodinâmica nesse contexto de alto risco, qual conduta é a mais apropriada nesse momento?
        alternativas:
          - id: alt_A
            texto: Segunda tentativa de hemostasia endoscópica.
            comentario: Está errada porque o enunciado já documenta falha da hemostasia endoscópica com ressangramento imediato e manutenção de instabilidade hemodinâmica apesar de suporte intensivo. Embora nova endoscopia possa ser considerada em alguns ressangramentos selecionados, aqui o critério decisivo é a necessidade de terapia de resgate definitiva diante de sangramento grave persistente.
          - id: alt_B
            texto: Embolização arterial seletiva por angiografia.
            comentario: 'A alternativa B está correta porque o quadro já ultrapassou a fase de tratamento endoscópico inicial: trata-se de úlcera duodenal com vaso visível (Forrest IIa), lesão de alto risco, submetida a adrenalina e clipagem com ressangramento imediato, o que caracteriza falha terapêutica. Nesse cenário, as opções de resgate são embolização transcateter ou cirurgia. Como o enunciado enfatiza alto risco cirúrgico relevante por idade, cardiopatia isquêmica e insuficiência renal em hemodiálise, a via endovascular é a conduta mais apropriada no momento, desde que disponível, por oferecer controle hemostático com menor agressão fisiológica.'
          - id: alt_C
            texto: Laparotomia exploradora com sutura da úlcera e ligadura do vaso.
            comentario: Está errada como melhor resposta porque a laparotomia com sutura da úlcera e ligadura do vaso é, de fato, opção clássica após falha endoscópica, mas o caso foi construído para priorizar a alternativa endovascular. O dado que exclui a cirurgia como escolha mais apropriada neste momento é o altíssimo risco perioperatório de um idoso com cardiopatia isquêmica e insuficiência renal dialítica, havendo opção menos invasiva de resgate.
          - id: alt_D
            texto: Infusão de octreotida e espera para estabilização.
            comentario: Está errada porque octreotida não é tratamento de escolha para hemorragia ulcerosa não varicosa; seu uso se relaciona ao sangramento por hipertensão portal/varizes. Além disso, esperar estabilização sem controle hemostático definitivo contraria o quadro de ressangramento imediato com choque persistente.
          - id: alt_E
            texto: IBP em bolus e infusão contínua, com monitorização.
            comentario: Está errada porque IBP venoso é medida adjuvante útil na hemorragia ulcerosa, mas não substitui hemostasia definitiva quando há falha endoscópica com ressangramento e instabilidade hemodinâmica. O problema do caso não é falta de supressão ácida, e sim sangramento refratário exigindo terapia de resgate.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Após falha da hemostasia endoscópica em úlcera duodenal sangrante com Forrest IIa, a terapia de resgate definitiva é necessária; no paciente com alto risco cirúrgico, a embolização arterial seletiva por angiografia é a opção preferencial de resgate, sem excluir cirurgia como alternativa conforme disponibilidade e cenário.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Falha endoscópica na HDA</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a tendência de marcar cirurgia automaticamente após falha endoscópica. O diferencial real do caso é que a falha ocorreu em paciente com risco operatório muito alto, e a diretriz admite embolização transcateter como resgate preferencial nesse contexto.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Forrest IIa significa alto risco de ressangramento e exige hemostasia ativa; não é cenário para manejo conservador isolado.</li><li>Se houve falha da terapia endoscópica, pense em tratamento de resgate definitivo: embolização ou cirurgia.</li><li>Quando a questão destacar alto risco cirúrgico importante, a via endovascular tende a superar a laparotomia como melhor escolha, se disponível.</li><li>IBP e octreotida não resolvem sangramento ulceroso refratário com instabilidade: um é adjuvante e o outro nem é terapia de escolha para etiologia não varicosa.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-29-vAT6hE
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Paciente do sexo masculino dá entrada na sala de emergência por quadro de hematêmese franca e melena, associado à instabilidade hemodinâmica. Foi submetido a medidas de reanimação com expansão volêmica seguidas de intubação orotraqueal para proteção das vias aéreas. Assim que as condições clínicas permitiram, foi realizada uma endoscopia digestiva alta, que evidenciou uma úlcera duodenal bulbar com sangramento ativo em jato. Foi realizada hemostasia com aplicação de clipes hemostáticos havendo a interrupção do sangramento.
          Após 48 horas de internação, mantém quadro de melena importante, com níveis de hemoglobina ainda baixos.
          Uma segunda endoscopia foi realizada, e evidenciou-se sangue na região duodenal, não sendo conclusiva. Ao todo, foram necessárias múltiplas transfusões, totalizando 8 concentrados de hemácias no período. No momento:
          mau estado geral, descorado ++. PA: 90 x 70 mmHg, FC: 105 bpm.

          Diante do caso, assinale a alternativa que apresenta a conduta mais adequada.
        alternativas:
          - id: alt_A
            texto: Indicar cirurgia, pois o paciente agora apresenta sangramento lento, mas contínuo, com necessidade de transfusão diária (> 3U/dia).
            comentario: 'A alternativa A corresponde ao escalonamento adequado diante de falha terapêutica endoscópica prática, com persistência/recorrência de sangramento, elevada necessidade transfusional e instabilidade hemodinâmica. O fundamento decisivo não é um corte numérico isolado de transfusão, mas o conjunto clínico descrito: úlcera duodenal com sangramento de alto risco, controle inicial não sustentado, segunda endoscopia sem solução efetiva, necessidade de múltiplas transfusões e manutenção de hipotensão e taquicardia. Nesse cenário, a base sustenta indicação operatória como conduta mais adequada.'
          - id: alt_B
            texto: Manter observação clínica, pois trata-se de melena residual que pode persistir por vários dias devido à intensidade do sangramento ocorrido.
            comentario: 'Está errada porque observação clínica pressupõe estabilidade e compatibilidade com melena residual isolada. A base afasta essa hipótese: há hipotensão, taquicardia, anemia persistente e transfusão maciça, dados que indicam sangramento persistente/recorrente, e não mera eliminação residual de sangue digerido.'
          - id: alt_C
            texto: Realizar nova tentativa de controle endoscópico em 24 horas.
            comentario: Está errada porque, embora nova hemostasia endoscópica possa ser cogitada em alguns casos de ressangramento, a própria base ressalta que essa possibilidade cede diante de instabilidade hemodinâmica persistente e falha prévia de controle efetivo. Além disso, o paciente já foi submetido a segunda endoscopia inconclusiva; adiar 24 horas para nova tentativa não é a conduta mais adequada no quadro atual.
          - id: alt_D
            texto: Realizar exame de cápsula endoscópica de delgado para avaliação de hemorragia digestiva média.
            comentario: 'Está errada porque cápsula endoscópica é método de investigação de hemorragia digestiva média/obscura. Aqui não há sangramento obscuro: a fonte alta já foi identificada como úlcera duodenal bulbar sangrante. Em paciente instável com foco conhecido, exame investigativo desse tipo não substitui a necessidade de tratamento hemostático definitivo.'
          - id: alt_E
            texto: Realizar cintilografia com hemácias marcadas para avaliação do foco de sangramento.
            comentario: 'Está errada porque cintilografia com hemácias marcadas tem finalidade localizatória em contextos selecionados, mas a base é expressa em que, havendo fonte alta conhecida e paciente instável com provável ressangramento, a prioridade é intervenção definitiva, não exame de localização. O critério de exclusão é de prioridade terapêutica: investigar não substitui tratar.'
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: A</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O entendimento diretriz dominante para úlcera péptica hemorrágica é que, havendo falha do controle endoscópico e persistência/recorrência de sangramento, especialmente com hipotensão ou instabilidade hemodinâmica, deve-se escalar para tratamento definitivo cirúrgico (ou embolização angiográfica, se imediatamente disponível). Aqui, o paciente já teve hemostasia endoscópica inicial, apresentou persistência do quadro com segunda endoscopia inconclusiva, recebeu 8 concentrados de hemácias e segue com PA 90x70 mmHg e FC 105 bpm, o que conduz à indicação cirúrgica.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Ressangramento ulceroso instável</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explorou a confusão entre melena residual e sangramento persistente: a melena isoladamente pode persistir, mas não quando vem acompanhada de hipotensão, taquicardia, anemia mantida e grande necessidade transfusional. Também tentou induzir repetição automática de endoscopia, sem considerar que a instabilidade hemodinâmica muda a conduta.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se a fonte alta já foi identificada e o paciente segue instável após abordagem endoscópica, pense em falha terapêutica e escalonamento, não em observação.</li><li>Ressangramento ulceroso não impõe sempre cirurgia, mas hipotensão persistente e alta necessidade transfusional fortalecem a indicação operatória imediata.</li><li>Exames para hemorragia digestiva média ou para localização do foco não são prioritários quando já existe fonte alta conhecida e necessidade de hemostasia definitiva.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-30-02tlXf
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Homem, 67 anos, fibrilação atrial permanente, CHA₂DS₂-VASc 4 (HAS, idade > 65, IC prévia), HAS-BLED 2. Em uso irregular de apixabana. Internado por hemorragia digestiva alta com Hb 6,9 g/dL; Instabilidade hemodinâmica inicial; Necessidade de três concentrados de hemácias.
          Endoscopia digestiva alta: úlcera duodenal Forrest IIa (vaso visível); Hemostasia endoscópica com clipe e adrenalina; Sem sangramento ativo após tratamento.
          Após 72 horas, estável hemodinamicamente; Hb estável; sem novo episódio de melena; creatinina 1,4 mg/dL; sem cirrose ou varizes.

          A estratégia mais apropriada de anticoagulação nesse momento é
        alternativas:
          - id: alt_A
            texto: iniciar heparina não fracionada em dose terapêutica como ponte antes do anticoagulante oral.
            comentario: Errada porque ponte com heparina não fracionada em dose terapêutica não é a estratégia preferencial neste cenário de FA não valvar com retorno planejado a DOAC. A base informa que a apixabana tem início de ação rápido e atinge anticoagulação efetiva sem heparinização de transição. Além disso, a ponte acrescenta potencial de ressangramento sem benefício estabelecido de rotina nesse contexto.
          - id: alt_B
            texto: postergar anticoagulação por pelo menos 30 dias e substituir temporariamente por AAS.
            comentario: Errada porque postergar anticoagulação por pelo menos 30 dias contraria o equilíbrio risco-benefício após hemostasia eficaz e estabilidade por 72 horas em paciente com CHA2DS2-VASc 4. A base também é explícita em que AAS não substitui anticoagulação para prevenção cardioembólica na fibrilação atrial, além de não resolver adequadamente o risco tromboembólico.
          - id: alt_C
            texto: reiniciar apixabana em 24 h após hemostasia endoscópica, na mesma dose plena.
            comentario: Errada porque reinício em 24 horas é precoce para uma úlcera péptica Forrest IIa, que é estigma de alto risco de ressangramento, ainda mais após HDA grave com instabilidade inicial e transfusão. A base decisória apoia retomada relativamente precoce, mas dentro de uma janela entre 3 e 7 dias após controle do sangramento, não nas primeiras 24 horas neste perfil.
          - id: alt_D
            texto: reiniciar a anticoagulação entre o terceiro e o sétimo dia após o controle do sangramento, preferencialmente com anticoagulante oral direto, sem utilização de terapia de ponte com heparina.
            comentario: A alternativa D está correta porque o paciente continua com indicação relevante de anticoagulação pela fibrilação atrial, e o foco hemorrágico foi controlado endoscopicamente, sem nova melena e com estabilidade hemodinâmica e de hemoglobina após 72 horas. A úlcera Forrest IIa é lesão ulcerosa de alto risco de ressangramento, o que afasta reinício excessivamente precoce. Ao mesmo tempo, adiar demais expõe a risco tromboembólico injustificado. A base decisória cita a ESGE 2021 para HDA não varicosa, que favorece retomada assim que o sangramento estiver controlado, preferencialmente dentro de ou logo após 7 dias do evento. Como se trata de DOAC, há início de ação rápido e não há necessidade de ponte com heparina.
          - id: alt_E
            texto: suspender definitivamente anticoagulação devido ao risco de ressangramento.
            comentario: Errada porque suspensão definitiva da anticoagulação não se justifica quando a causa do sangramento foi tratada, a hemorragia é não varicosa, não há cirrose nem varizes, e a FA com CHA2DS2-VASc 4 mantém risco tromboembólico relevante. O evento hemorrágico tratado não vira, por si só, contraindicação permanente à anticoagulação.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: D</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Após HDA não varicosa controlada endoscopicamente em paciente com FA e CHA2DS2-VASc 4, a anticoagulação deve ser retomada de forma relativamente precoce, preferencialmente entre 3 e 7 dias após o controle do sangramento, com DOAC e sem ponte com heparina; a úlcera Forrest IIa impõe cautela contra reinício em 24 horas.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Reinício da anticoagulação</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre gravidade inicial do sangramento e necessidade de suspensão prolongada ou definitiva. O ponto real é que, apesar de a HDA ter sido grave, houve hemostasia endoscópica bem-sucedida e estabilidade por 72 horas; isso não autoriza reinício em 24 horas por se tratar de Forrest IIa, mas também não justifica adiar por 30 dias, trocar por AAS ou fazer ponte rotineira com heparina.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Primeiro defina se a indicação de anticoagulação permanece forte; em FA com CHA2DS2-VASc relevante, suspensão prolongada ou definitiva exige justificativa muito robusta.</li><li>Depois classifique o risco da lesão que sangrou; Forrest IIa é estigma de alto risco e afasta reinício muito precoce nas primeiras 24 horas.</li><li>Em HDA não varicosa controlada e paciente estável, a janela de retomada costuma ficar dentro de ou logo após 7 dias, frequentemente entre o 3º e o 7º dia no cenário da questão.</li><li>Se a retomada for com DOAC, lembre que o início de ação é rápido e, em FA não valvar, ponte rotineira com heparina não é a estratégia preferencial.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-31-WPBXF5
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Paciente idoso, 77 anos, com osteoartrose avançada e uso frequente de anti-inflamatórios não esteroidais, procura a emergência após dois episódios de melena e uma lipotimia. Na chegada ao serviço, ao exame físico: palidez cutâneo mucosa, sudorese fria, orientado, ritmo cardíaco regular com frequência cardíaca de 108 bpm e pressão arterial de 94 x 60 mmHg, abdome flácido, doloroso à palpação profunda mesogástrica e sem dor à descompressão dolorosa. Após reposição volêmica inicial, realiza endoscopia digestiva alta, que evidenciou úlcera duodenal com vaso visível não sangrante.

          Diante desse caso clínico, qual é a conduta correta?
        alternativas:
          - id: alt_A
            texto: Prescrever apenas protetor gástrico e transfundir hemácias profilaticamente.
            comentario: Está errada porque IBP isolado não substitui hemostasia endoscópica quando há vaso visível. Além disso, transfusão de hemácias não é profilática; deve ser guiada por critérios clínicos e laboratoriais.
          - id: alt_B
            texto: Cirurgia imediata, porque a presença de vaso visível implica falha provável do tratamento clínico.
            comentario: Está errada porque cirurgia imediata não é a primeira linha nessa situação. A conduta inicial é endoscópica; cirurgia fica reservada para falha da hemostasia, ressangramento refratário ou impossibilidade de controle por métodos menos invasivos.
          - id: alt_C
            texto: Tratamento endoscópico hemostático e inibidor de bomba de prótons por via intravenosa.
            comentario: A alternativa C está correta porque o achado endoscópico relevante é o vaso visível, e não a ausência de sangramento ativo no momento do exame. Esse estigma mantém alto risco de ressangramento, de modo que a conduta é tratamento endoscópico hemostático associado a inibidor de bomba de prótons por via intravenosa.
          - id: alt_D
            texto: Suspender AINE e repetir endoscopia em 30 dias, sem necessidade de intervenção na urgência.
            comentario: Está errada porque suspender o AINE é apenas medida adjuvante, e repetir endoscopia em 30 dias não resolve a hemorragia atual nem o estigma de alto risco já identificado. O caso exige intervenção na urgência.
          - id: alt_E
            texto: Alta com inibidor de bomba de prótons por via oral, já que não há sangramento ativo no momento da endoscopia.
            comentario: Está errada porque não haver sangramento ativo no exame não caracteriza baixo risco. O vaso visível continua sendo Forrest IIa, com alto risco de ressangramento, o que contraindica alta com IBP oral sem hemostasia endoscópica.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Vaso visível não sangrante em úlcera duodenal corresponde a estigma endoscópico de alto risco (Forrest IIa), com indicação de hemostasia endoscópica e IBP intravenoso após a estabilização inicial.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Hemorragia digestiva alta não varicosa</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre 'não estar sangrando agora' e 'ser lesão de baixo risco'. Em úlcera com vaso visível não sangrante, o risco continua alto.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em hemorragia digestiva alta não varicosa, valorize o estigma endoscópico mais do que a ausência momentânea de sangramento.</li><li>Vaso visível não sangrante em úlcera péptica indica alto risco de ressangramento e pede hemostasia endoscópica mais IBP intravenoso.</li><li>Não aceite transfusão de hemácias como medida profilática de rotina.</li><li>Cirurgia, nesse contexto, é conduta de resgate, não tratamento inicial padrão.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-32-oVtYR7
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: Homem de 68 anos, usuário crônico de anti-inflamatórios não esteroidais, é admitido por hematêmese e melena iniciadas há seis horas. Após reposição volêmica, apresenta pressão arterial de 108 × 68 mmHg, frequência cardíaca de 92 bpm e hemoglobina de 8,9 g/dL. A endoscopia digestiva alta identifica úlcera de 18 mm na parede posterior do bulbo duodenal, com coágulo firmemente aderido ao leito. Após irrigação vigorosa com jato de água, o coágulo permanece aderido, sem exteriorização de sangramento ativo. Considerando exclusivamente o aspecto endoscópico descrito e a classificação de Forrest, essa lesão deve ser classificada como
        alternativas:
          - id: alt_A
            texto: Forrest Ia, por apresentar estigma endoscópico de hemorragia recente caracterizado pela presença de coágulo persistente sobre o leito ulceroso.
          - id: alt_B
            texto: Forrest Ib, por apresentar estigma endoscópico de hemorragia recente caracterizado pela ausência de vaso identificável após irrigação do leito ulceroso.
          - id: alt_C
            texto: Forrest IIa, por apresentar estigma endoscópico de hemorragia recente caracterizado pela persistência de material hemático sem sangramento em atividade.
          - id: alt_D
            texto: Forrest IIb, por apresentar estigma endoscópico de hemorragia recente caracterizado pela presença de coágulo aderido sem sangramento em atividade.
          - id: alt_E
            texto: Forrest IIc, por apresentar estigma endoscópico de hemorragia recente caracterizado pela presença de conteúdo hemático organizado sobre o leito ulceroso.
        gabarito: D

      - tipo: ME
        id: 131026-0258-33-Bjd0mI
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Homem de 62 anos, tabagista e etilista crônico, apresenta quadro de hematêmese volumosa seguida de melena há 6 horas. Refere dor epigástrica intermitente há semanas, piora com jejum.

          Na chegada ao pronto-socorro, está pálido, sudorético, com PA:
          90 x 60 mmHg, FC: 112 bpm. Revela sensibilidade epigástrica sem sinais de peritonite. A gasometria arterial mostra acidose metabólica leve. No hemograma com hemoglobina inicial:
          8,1 g/dL. Foi realizada hidratação vigorosa com cristaloides e iniciado omeprazol EV. Realizou-se uma endoscopia digestiva alta que expõe úlcera duodenal sangrante com vaso visível (classificação de Forrest IIa).

          A melhor conduta inicial após a estabilização hemodinâmica será
        alternativas:
          - id: alt_A
            texto: ressecção gástrica subtotal com vagotomia troncular.
            comentario: Ressecção gástrica subtotal com vagotomia troncular é procedimento cirúrgico agressivo e não corresponde à conduta inicial de um sangramento ulceroso já identificado por endoscopia e passível de hemostasia endoscópica. O critério que exclui essa opção é a ausência de falha endoscópica, de perfuração e de peritonite.
          - id: alt_B
            texto: vagotomia superseletiva e piloroplastia.
            comentario: Vagotomia superseletiva com piloroplastia não resolve a necessidade imediata do caso, que é hemostasia do vaso visível. A urgência não é cirurgia antiulcerosa para reduzir secreção ácida, mas controle endoscópico do sangramento de alto risco.
          - id: alt_C
            texto: laparotomia imediata com rafia da úlcera.
            comentario: Laparotomia imediata com rafia da úlcera seria considerada diante de perfuração, peritonite ou hemorragia não controlável por métodos menos invasivos. O enunciado informa ausência de sinais de peritonite e descreve lesão endoscopicamente tratável após estabilização.
          - id: alt_D
            texto: embolização arterial por radiologia intervencionista.
            comentario: Embolização arterial por radiologia intervencionista é medida de resgate, indicada em geral quando a terapia endoscópica falha, não é possível ou há ressangramento persistente. Como há uma úlcera Forrest IIa acessível à terapia endoscópica, essa alternativa está hierarquicamente errada.
          - id: alt_E
            texto: controle endoscópico com injeção e termocoagulação do vaso.
            comentario: A alternativa E está correta porque a EDA mostrou úlcera duodenal com vaso visível (Forrest IIa), achado que indica alto risco de ressangramento e requer tratamento endoscópico hemostático quando a lesão é acessível. Após a reposição volêmica e o início de omeprazol EV, a terapêutica de escolha para esse estigma é a hemostasia endoscópica.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: E</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Forrest IIa (vaso visível) é estigma endoscópico de alto risco de ressangramento em hemorragia digestiva alta não varicosa por úlcera. Após estabilização hemodinâmica, a conduta indicada é hemostasia endoscópica; cirurgia e embolização ficam como resgate se houver falha, recorrência ou impossibilidade técnica.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Forrest IIa sangrante</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora duas confusões: tratar a instabilidade inicial como indicação automática de cirurgia e interpretar Forrest IIa como situação em que IBP isolado ou observação seriam suficientes. Mas a pergunta é após estabilização, e vaso visível é estigma de alto risco que exige hemostasia endoscópica.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em úlcera hemorrágica, use a classificação de Forrest para decidir: vaso visível é alto risco e pede hemostasia endoscópica.</li><li>Separe medidas de estabilização das medidas definitivas: após reposição volêmica e IBP, a próxima decisão depende do estigma endoscópico.</li><li>Cirurgia e embolização não são primeira escolha quando a lesão é tratável por endoscopia; pense nelas como resgate por falha, recorrência ou impossibilidade técnica.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-34-OBE4LP
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: Homem, 73 anos, é admitido na emergência por hematêmese volumosa iniciada há duas horas. Ao exame físico, apresenta-se confuso e pálido, com PA de 88/54 mmHg, frequência cardíaca de 122 bpm e extremidades frias. Exames laboratoriais evidenciaram hemoglobina de 7,6 g/dL, com plaquetas de 240.000/mm³, INR de 1,1, ureia de 78 mg/dL e creatinina de 1,2 mg/dL. Após estabilização hemodinâmica inicial, foi realizada endoscopia digestiva alta, que demonstrou úlcera duodenal com vaso visível não sangrante (Forrest IIa), sendo efetuada terapia endoscópica combinada com adrenalina e hemoclipes. De acordo com as diretrizes atuais, qual é a conduta subsequente mais adequada?
        alternativas:
          - id: alt_A
            texto: Alta hospitalar após observação por seis horas.
          - id: alt_B
            texto: Administração de inibidor da bomba de prótons intravenoso em altas doses.
          - id: alt_C
            texto: Nova endoscopia obrigatória em 12 horas, independentemente da evolução clínica.
          - id: alt_D
            texto: Indicação de cirurgia, devido ao alto risco de ressangramento.
        gabarito: B

      - tipo: ME
        id: 131026-0258-35-YhPTyL
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Na sua Unidade de Emergência dá entrada um homem de 62 anos, após episódio súbito de hematêmese volumosa, seguido de tontura e síncope transitória. Relata história de dor epigástrica em queimação há vários meses, parcialmente aliviada pela alimentação, mas nunca investigada. Refere uso diário de antiinflamatórios não esteroidais para osteoartrose dos joelhos nos últimos três anos. Nega doença hepática ou etilismo importante.

          Nas últimas 24 horas, apresentou dois episódios de melena e um episódio de hematêmese com eliminação de grande quantidade de sangue vermelho vivo.

          Ao exame físico, encontra-se consciente, porém pálido, sudorético e ansioso. Pressão arterial: 90/60 mmHg; frequência cardíaca: 120 bpm; frequência respiratória: 22 irpm.
          Extremidades frias e tempo de enchimento capilar prolongado. O abdome é plano, com discreta dor à palpação profunda do epigástrio, sem sinais de irritação peritoneal. O toque retal confirma presença de melena.
          Após reposição volêmica inicial, o paciente é submetido à endoscopia digestiva alta. O exame evidencia úlcera duodenal de aproximadamente 1,5 cm na parede posterior do bulbo duodenal, apresentando vaso visível não sangrante (Forrest IIa), sem sangramento ativo no momento do exame.

          Considerando as recomendações atuais, a conduta mais apropriada para o caso será
        alternativas:
          - id: alt_A
            texto: alta hospitalar após estabilização clínica, uma vez que não há sangramento ativo durante a endoscopia.
          - id: alt_B
            texto: realizar gastrectomia subtotal de urgência devido ao elevado risco de ressangramento.
          - id: alt_C
            texto: instituir apenas tratamento clínico com inibidor da bomba de prótons (IBP), sem intervenção endoscópica.
          - id: alt_D
            texto: realizar terapia endoscópica hemostática associada à administração de IBP intravenoso em alta dose e monitorização hospitalar.
          - id: alt_E
            texto: indicar vagotomia troncular com piloroplastia imediatamente após a endoscopia.
        gabarito: D

      - tipo: ME
        id: 131026-0258-36-EqUwCj
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Um homem de 55 anos é admitido na sala de urgência devido à hematêmese volumosa há 2 horas, presenciada por familiares. Associou-se a sintomas de melena e hipotensão. Na admissão, apresentava PA: 90 x 50 mmHg, FC: 118 bpm e hemoglobina de 7,8 mg/dL. O cirurgião iniciou medidas de reanimação com solução cristaloide, terapia medicamentosa com omeprazol intravenoso em dose plena e solicitação de transfusão de hemocomponentes. Após cerca de 24 horas da admissão, foi realizada endoscopia digestiva alta que revelou úlcera duodenal, na parede posterior, com presença de vasos visíveis. O endoscopista classificou a lesão como Forrest IIa. Foram realizadas terapia com adrenalina e aplicação de um clipe hemostático sobre o coto vascular.

          Com base nas diretrizes do manejo da hemorragia digestiva e na classificação de Forrest, avalie a conduta realizada.
        alternativas:
          - id: alt_A
            texto: A lesão Forrest IIa é considerada de baixo risco, não havendo indicação de terapia endoscópica.
            comentario: Está errada porque nega justamente a premissa decisiva da questão. Forrest IIa não é lesão de baixo risco; é vaso visível não sangrante, classificado como estigma de alto risco. Por isso, não só há indicação de terapia endoscópica, como ela é recomendada.
          - id: alt_B
            texto: A conduta do endoscopista foi adequada, pois trata-se de uma lesão de alto risco para ressangramento e requer tratamento endoscópico.
            comentario: 'A alternativa B está correta porque Forrest IIa corresponde a vaso visível não sangrante, classificado nas diretrizes como estigma de alto risco para sangramento persistente ou ressangramento. Por isso, há indicação de tratamento endoscópico hemostático. Além disso, a conduta descrita foi adequada também na técnica empregada, porque a adrenalina não foi usada isoladamente: houve associação com método mecânico por clipe, exatamente no sentido indicado pela base.'
          - id: alt_C
            texto: A conduta foi arriscada, pois, em casos de hemorragia exteriorizada por hematêmese, a conduta mais adequada é a realização de endoscopia digestiva alta em, no máximo, 4 horas da admissão.
            comentario: Está errada por criar uma exigência temporal que a base não admite como regra geral. A diretriz indicada na base recomenda endoscopia precoce em até 24 horas após reanimação/estabilização hemodinâmica, e não impõe, para toda hematêmese exteriorizada, realização obrigatória em no máximo 4 horas.
          - id: alt_D
            texto: A conduta foi excessiva. Como o sangramento já havia cessado, o tratamento endoscópico poderia ter sido realizado com injeção de adrenalina em monoterapia.
            comentario: Está errada porque admite adrenalina em monoterapia para lesão Forrest IIa. A base é expressa em afirmar que adrenalina isolada não é suficiente nem recomendada no sangramento ulceroso não varicoso com estigma de alto risco. A associação com outra modalidade hemostática, como o clipe usado no caso, é que está correta.
          - id: alt_E
            texto: A conduta foi adequada, mas deve-se proceder com um novo exame (second look) após 12 horas, para confirmar a eficácia da terapia endoscópica.
            comentario: Está errada porque transforma o second look em conduta rotineira obrigatória. A base afirma que nova endoscopia programada de rotina após hemostasia inicial bem-sucedida não é recomendada como prática padrão; portanto, não se exige exame em 12 horas apenas para confirmar eficácia.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> ESGE Guideline – Nonvariceal upper gastrointestinal hemorrhage (Endoscopy, 2021/atualização de diretriz aplicável): “ESGE recommends that peptic ulcers with spurting or oozing bleeding (Forrest classification Ia and Ib, respectively) or with a nonbleeding visible vessel (Forrest classification IIa) receive endoscopic hemostasis because these lesions are at high risk for persistent bleeding or rebleeding.” No caso, a úlcera duodenal foi classificada como Forrest IIa, ou seja, vaso visível não sangrante, o que impõe hemostasia endoscópica e confirma o acerto do gabarito B.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Forrest IIa e hemostasia endoscópica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explorou a confusão entre sangramento que aparentemente cessou e lesão de baixo risco. Em Forrest IIa, mesmo sem sangramento ativo no momento, há alto risco de ressangramento e a hemostasia endoscópica continua indicada.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Memorize que Forrest IIa = vaso visível não sangrante = alto risco = precisa de hemostasia endoscópica.</li><li>Quando a alternativa propuser adrenalina isolada para úlcera de alto risco, a tendência, pela base, é de incorreção.</li><li>Não converta recomendação de endoscopia precoce em até 24 horas após estabilização em regra universal de endoscopia em até 4 horas.</li><li>Second look rotineiro após hemostasia endoscópica bem-sucedida não é a conduta padrão.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-37-lb4WhN
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Mulher, 42 anos, técnica judiciária, procura atendimento ambulatorial com história de dor epigástrica em queimação há cerca de 2 meses, com piora no período pós-prandial tardio e melhora após ingestão de alimentos. Refere episódios ocasionais de náuseas, sem vômitos ou perda ponderal significativa. Nega uso crônico de anti-inflamatórios. Relata ter feito uso de azitromicina há 4 meses para tratamento de sinusite.

          Foi submetida à Endoscopia Digestiva Alta (EDA), que evidenciou úlcera em bulbo duodenal de 0,8 cm, com base limpa (Forrest III). Durante o exame, o teste rápido da urease foi positivo.

          A paciente não apresenta alergias medicamentosas conhecidas e não faz uso atual de antibióticos ou inibidores de bomba de prótons.

          De acordo com as recomendações mais recentes do V Consenso Brasileiro sobre Helicobacter pylori e as diretrizes internacionais, assinale a opção que indica a conduta mais adequada.
        alternativas:
          - id: alt_A
            texto: Iniciar terapia tripla clássica com ibp, amoxicilina e claritromicina por 7 dias, considerando a ausência de uso recente de macrolídeos.
            comentario: Está errada porque propõe terapia tripla por 7 dias, abaixo da duração recomendada na base decisória. O esquema com claritromicina, quando escolhido, deve ser feito por 14 dias.
          - id: alt_B
            texto: Iniciar terapia tripla otimizada com ibp, amoxicilina e claritromicina por 14 dias, uma vez que ainda é esquema eficaz em pacientes sem falha prévia documentada.
            comentario: A alternativa B é a melhor resposta porque reúne a necessidade de tratar a infecção por H. pylori identificada na EDA e escolhe a duração correta para a terapia tripla com IBP, amoxicilina e claritromicina. O enunciado traz úlcera duodenal, urease positiva e ausência de alergia medicamentosa, e a base decisória indica que, no arranjo proposto, a terapia tripla otimizada por 14 dias é a opção esperada. Assim, B se diferencia de A pela duração inadequada e de E porque não se deve postergar a erradicação até após a cicatrização.
          - id: alt_C
            texto: Iniciar terapia quádrupla concomitante (ibp, amoxicilina, claritromicina e metronidazol) por 14 dias, devido à elevada taxa de resistência à claritromicina.
            comentario: Embora a terapia concomitante por 14 dias seja compatível com diretrizes internacionais recentes e a justificativa da alternativa faça referência à resistência à claritromicina, a banca não a adotou como correta. Pela base decisória, a resposta esperada é B, e a leitura que a sustenta é a aceitação do esquema triplo otimizado por 14 dias neste enunciado, sem falha prévia documentada.
          - id: alt_D
            texto: Iniciar terapia quádrupla com bismuto (ibp, bismuto, tetraciclina e metronidazol), apenas após falha da terapia tripla inicial.
            comentario: Está errada porque o termo 'apenas após falha da terapia tripla inicial' restringe indevidamente o uso da terapia quádrupla com bismuto. A base informa que esse esquema pode ser usado já como primeira linha em diversos cenários.
          - id: alt_E
            texto: Tratar inicialmente apenas a úlcera com ibp por 6 a 8 semanas e realizar erradicação do helicobacter pylori após cicatrização completa da lesão.
            comentario: Está errada porque o tratamento apenas com IBP não erradica o H. pylori. Em úlcera duodenal com urease positiva, a erradicação deve ser instituída no contexto do diagnóstico, e não adiada até a cicatrização completa.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Úlcera duodenal com teste rápido da urease positivo é indicação de erradicação do H. pylori. Entre as alternativas com claritromicina, a BASE DE DECISÃO MÉDICA sustenta que o esquema triplo deve ser por 14 dias; por isso, 7 dias está abaixo do recomendado e a opção B é a resposta esperada pela banca.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Erradicação do H. pylori</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A principal armadilha é a duração do esquema: 7 dias versus 14 dias. A menção à azitromicina sugere possível exposição prévia a macrolídeo, e o Forrest III pode distrair, mas nenhum desses pontos muda a necessidade de erradicação.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em úlcera duodenal com H. pylori confirmado, pense em erradicação da bactéria, não apenas em IBP.</li><li>Se a alternativa trouxer terapia tripla com claritromicina, confira a duração: a base decisória aponta 14 dias.</li><li>Não deixe o Forrest III desviar o raciocínio: ele informa baixo risco hemorrágico, mas não elimina a indicação de tratar o H. pylori.</li><li>Quando houver exposição prévia a macrolídeo, reconheça a controvérsia com claritromicina, mas responda pelo critério explicitamente valorizado no enunciado e na base.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-38-Qhjo29
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: Homem, 72 anos de idade, com histórico de uso crônico de anti-inflamatórios não esteroides para osteoartrose, é admitido no PS com melena e hematêmese. O exame físico inicial revela um paciente pálido, com PA de 90×60 mmHg e FC de 125 bpm. A hemoglobina inicial é de 6,8 g/dL. Ele recebe ressuscitação volêmica e transfusão de 2 concentrados de hemácias. Uma endoscopia digestiva alta é realizada, identificando uma úlcera duodenal de 1,5 cm com sangramento ativo (Forrest Ia). O sangramento é controlado com injeção de adrenalina e 3 clipes hemostáticos. No entanto, 12 horas após o procedimento, o paciente apresenta novo episódio de hematêmese e instabilidade hemodinâmica com necessidade de droga vasoativa em dose alta e PA de 80×50 mmHg. Uma segunda endoscopia falha em controlar o sangramento. Qual é a conduta mais apropriada de imediato?
        alternativas:
          - id: alt_A
            texto: Laparotomia exploradora, duodenotomia com ligadura do vaso sangrante, sutura da úlcera sangrante e piloroplastia.
            comentario: 'A alternativa A descreve a operação de urgência apropriada para úlcera duodenal hemorrágica refratária: laparotomia para acesso rápido em paciente instável, duodenotomia para expor o foco, ligadura/hemostasia direta do vaso sangrante, sutura da úlcera e piloroplastia. Isso corresponde ao cenário de sangramento arterial ativo de alto risco (Forrest Ia), ressangramento precoce, nova falha endoscópica e instabilidade hemodinâmica grave. Em úlcera duodenal, o vaso envolvido costuma ser ramo da artéria gastroduodenal, o que justifica o controle local direto por via cirúrgica.'
          - id: alt_B
            texto: Embolização por radiologia intervencionista da artéria gástrica esquerda.
            comentario: Está errada por dois motivos concretos. Primeiro, a alternativa aponta embolização da artéria gástrica esquerda, que não é o vaso principal relacionado ao sangramento de úlcera duodenal; pela topografia, o sangramento costuma se relacionar à artéria gastroduodenal ou seus ramos. Segundo, o enunciado descreve choque grave com necessidade de vasopressor em alta dose após duas falhas endoscópicas, o que exige controle definitivo imediato; entre as opções oferecidas, a cirurgia aberta é a conduta mais apropriada.
          - id: alt_C
            texto: Exploração por laparoscopia, com ligadura da artéria gastroduodenal.
            comentario: Está errada porque a via laparoscópica não é a preferencial em hemorragia digestiva alta com instabilidade extrema, sangramento não controlado e necessidade de controle rápido e amplo acesso ao duodeno proximal. Além disso, a proposta de apenas ligar a artéria gastroduodenal por laparoscopia não corresponde ao procedimento clássico de hemostasia local da úlcera duodenal sangrante, que envolve duodenotomia e controle direto do leito ulceroso.
          - id: alt_D
            texto: Gastrectomia parcial com ligadura do vaso e gastroduodenostomia.
            comentario: Está errada porque propõe uma ressecção maior do que o necessário para o problema imediato. Na úlcera duodenal hemorrágica refratária, o objetivo é hemostasia rápida do vaso sangrante com tratamento local da úlcera, e não gastrectomia parcial com reconstrução. Esse procedimento aumenta a agressividade operatória sem vantagem imediata no cenário descrito.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: A</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O critério que decide a questão é a falha de hemostasia endoscópica associada a choque hemorrágico refratário: a úlcera duodenal Forrest Ia ressangrou 12 horas após o tratamento inicial, a segunda endoscopia não controlou o sangramento e o paciente evoluiu com PA 80x50 mmHg e necessidade de droga vasoativa em alta dose; nesse cenário, a conduta imediata é hemostasia cirúrgica definitiva, classicamente por laparotomia com duodenotomia e ligadura do vaso sangrante.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> HDA ulcerosa refratária</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre qualquer opção após falha endoscópica e a conduta correta no contexto real do caso: não basta saber que houve falha endoscópica; o decisivo é que houve nova falha associada a choque refratário, o que desloca a decisão para cirurgia aberta imediata. Outra armadilha é aceitar embolização de vaso anatomicamente inadequado para úlcera duodenal.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em HDA por úlcera, não decida só pelo diagnóstico; decida pela combinação entre classificação do sangramento, resposta ao tratamento endoscópico e estado hemodinâmico.</li><li>Forrest Ia significa sangramento arterial ativo e alto risco de persistência ou recorrência hemorrágica.</li><li>Se houver ressangramento, nova falha endoscópica e choque com vasopressor, pense em hemostasia cirúrgica imediata.</li><li>Na úlcera duodenal sangrante, confronte sempre a alternativa com a anatomia do vaso provável: gastroduodenal/ramos, não artéria gástrica esquerda.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-39-f9Bpfx
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Um homem de 43 anos, pedreiro, procurou assistência médica queixando-se de dor epigástrica em queimação, plenitude pósprandial, fadiga e episódios diarreicos. A dor muitas vezes o despertava de madrugada melhorando com a alimentação e a ingestão de alcalinos. Emagreceu cerca de 5 kg desde o início da dor, há 2 meses. Submetido a endoscopia digestiva alta que revelou duas úlceras A2 Sakita na parede anterior do bulbo duodenal de cerca de 10 mm e uma terceira úlcera no antro de cerca de 8 mm. O teste rápido da urease foi negativo e os seis fragmentos colhidos das bordas da lesão ulcerada gástrica foram negativos para malignidade. O paciente não fazia uso de antinflamatórios não esteroides (AINE’s), não bebia ou fumava.
          Tomografia abdominal revela massa de 2 cm na porção cefálica do pâncreas.
          Baseado nos dados fornecidos e na principal hipótese diagnóstica, a melhor abordagem diagnóstica é
        alternativas:
          - id: alt_A
            texto: solicitar CA 19-9 e elastase fecal.
            comentario: CA 19-9 e elastase fecal desviam a investigação para adenocarcinoma pancreático exócrino e insuficiência pancreática exócrina, hipóteses que não explicam o padrão de doença ulcerosa hipersecretora com diarreia, úlceras múltiplas, H. pylori negativo e ausência de AINEs. No contexto, a massa pancreática favorece tumor neuroendócrino funcional.
          - id: alt_B
            texto: solicitar Cálcio, Ecoendoscopia e IgG4.
            comentario: 'Cálcio pode ter utilidade indireta por associação com MEN1, e ecoendoscopia pode avaliar lesão pancreática, mas a alternativa falha no ponto decisivo: não inclui a gastrina sérica, que é o exame-chave para a síndrome funcional suspeita. Além disso, IgG4 direciona para pancreatite autoimune, hipótese que não explica adequadamente úlceras múltiplas com diarreia por hipersecreção ácida.'
          - id: alt_C
            texto: solicitar gastrina sérica e octreoscan.
            comentario: A alternativa correta investiga diretamente a hipótese principal do caso. A gastrina sérica é o exame laboratorial ligado à suspeita de hipergastrinemia por gastrinoma, que causa hipersecreção ácida, úlceras múltiplas e diarreia. O octreoscan é coerente para localização de tumor neuroendócrino secretor de gastrina, o que também faz sentido diante da massa pancreática descrita.
          - id: alt_D
            texto: solicitar RMN abdominal, CA 19-9 e CEA.
            comentario: RM abdominal, CA 19-9 e CEA priorizam a caracterização de neoplasias pancreáticas exócrinas e marcadores tumorais inespecíficos para o mecanismo suspeito. O problema diagnóstico central é confirmar uma síndrome hipergastrinêmica; CA 19-9 e CEA não confirmam gastrinoma e não substituem a dosagem de gastrina sérica.
          - id: alt_E
            texto: realizar teste respiratório do C14 para pesquisa do H.pylori.
            comentario: A pesquisa adicional de H. pylori não é a melhor abordagem porque o quadro já ultrapassa a explicação por infecção ulcerogênica isolada. Mesmo com urease negativa, isso não integra satisfatoriamente a combinação de úlceras múltiplas, diarreia, ausência de AINEs e massa pancreática. O caso exige investigação de etiologia hipersecretora tumoral.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O conjunto de úlceras duodenais múltiplas associado a úlcera gástrica, diarreia, ausência de AINEs, teste para H. pylori negativo e massa em cabeça de pâncreas aponta para gastrinoma/síndrome de Zollinger-Ellison; por isso, a melhor abordagem diagnóstica é dosar gastrina sérica e localizar o tumor com exame funcional como o octreoscan.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Gastrinoma</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a tendência de associar automaticamente massa pancreática a adenocarcinoma ou de insistir em H. pylori, ignorando que o conjunto úlceras múltiplas + diarreia + sem AINEs + urease negativa + massa pancreática é típico de gastrinoma.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Diante de úlceras múltiplas ou exuberantes com diarreia, pense em síndrome hipersecretora antes de tratar como úlcera péptica comum.</li><li>Se H. pylori e AINEs não explicam o quadro ulceroso, aumente a suspeita de gastrinoma.</li><li>Em suspeita de gastrinoma, procure um exame hormonal específico da síndrome e um método de localização de tumor neuroendócrino.</li><li>Não deixe a presença de massa pancreática desviar automaticamente para adenocarcinoma se o fenótipo clínico for de tumor funcional.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-40-cVW9Le
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: |-
          Homem de 65 anos, hipertenso e com osteoartrose de joelhos, procura o pronto atendimento por dois episódios de melena associados a tontura ao se levantar. Refere uso diário de naproxeno nas últimas três semanas devido à piora da dor articular. Nega hematêmese e hepatopatia prévia.

          Ao exame, apresenta se lúcido, hipocorado, com frequência cardíaca de 104 bpm, pressão arterial de 108 × 68 mmHg e abdome flácido, com discreta dor à palpação do epigástrio, sem sinais de irritação peritoneal.

          Os exames laboratoriais mostram: Hemoglobina: 8,1 g/dL;
          Hematócrito: 24%; VCM: 89 fL; Plaquetas: 238.000/mm³; Ureia:
          78 mg/dL; Creatinina: 1,1 mg/dL; Sódio: 139 mEq/L; Potássio: 4,2 mEq/L; INR: 1,0

          Após estabilização inicial, é submetido à endoscopia digestiva alta, que demonstra úlcera de 15 mm no bulbo duodenal com vaso visível não sangrante. É realizada hemostasia endoscópica com sucesso. Pesquisa de Helicobacter pylori é positiva.

          Considerando a estratégia farmacológica indicada imediatamente após o controle endoscópico do sangramento, assinale a opção que descreve corretamente o medicamento empregado e o mecanismo responsável pela duração de seu efeito antissecretor.
        alternativas:
          - id: alt_A
            texto: Famotidina, por antagonismo competitivo e irreversível dos receptores H2 das células parietais, impedindo a ativação da adenilato ciclase e mantendo supressão ácida até a síntese de novos receptores.
          - id: alt_B
            texto: Pantoprazol, por concentração no canalículo secretor ácido da célula parietal, ativação do pró fármaco e ligação covalente à H+/K+ ATPase, mantendo a inibição da secreção ácida até a recuperação funcional de bombas de prótons.
          - id: alt_C
            texto: Vonoprazana, por conversão em sulfenamida no canalículo secretor e formação de ligação covalente irreversível com resíduos de cisteína da H+/K+ ATPase.
          - id: alt_D
            texto: Sucralfato, por inibição direta e irreversível da H+/K+ ATPase associada à formação de uma barreira sobre a base da úlcera, proporcionando supressão ácida prolongada.
          - id: alt_E
            texto: Misoprostol, por antagonismo dos receptores EP3 da célula parietal, reduzindo AMP cíclico e promovendo inibição irreversível da etapa final da secreção de ácido clorídrico.
        gabarito: B
  - tipo: folder
    nome: Úlcera Péptica - 2024 a 2026
    conteudo:
      - tipo: ME
        id: 131026-0258-1-3Pm6Qm
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: 'Sobre úlcera péptica, é CORRETO afirmar que:'
        alternativas:
          - id: alt_A
            texto: O bacilo microaerófilo Gram-negativo que reside na camada mucosa gástrica e causa infecção gástrica e inflamação crônica é o Helicobacter pylori.
          - id: alt_B
            texto: Os sintomas normalmente aliviam logo depois que o estômago se esvazia, onde há diminuição na produção de ácido gástrico.
          - id: alt_C
            texto: O H. pylori está associado com 50 a 60% das úlceras duodenais e com 70 a 90% das úlceras gástricas.
          - id: alt_D
            texto: As células parenquimatosas do estômago produzem uréase, uma enzima que quebra a ureia, aumentando o pH local e inibindo o meio ácido.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>A alternativa correta é a <span style="color: darkorange; font-weight: bold;">A</span>. Vamos entender o porquê e discutir as demais alternativas.</p>

          <p><strong>Alternativa A</strong>:</p>
          <p><span style="color: darkorange;">"<span style="font-style: italic;">Helicobacter pylori</span> é um bacilo microaerófilo Gram-negativo que reside na camada mucosa gástrica e causa infecção gástrica e inflamação crônica."</span></p>
          <p>Essa afirmação está correta. O <span style="font-style: italic;">Helicobacter pylori</span> é um agente bem conhecido na patogênese da úlcera péptica. Ele coloniza a mucosa gástrica e está associado à gastrite crônica e ao desenvolvimento de úlceras gastroduodenais.</p>

          <p><strong>Alternativa B</strong>:</p>
          <p>"Os sintomas normalmente aliviam logo depois que o estômago se esvazia, onde há diminuição na produção de ácido gástrico."</p>
          <p>Essa afirmação está incorreta. Na verdade, os sintomas da úlcera péptica tendem a aliviar logo <span style="color: darkorange; font-weight: bold;">após a ingestão de alimentos</span>, pois o alimento pode tamponar temporariamente o ácido gástrico. Quando o estômago se esvazia, o ácido pode entrar em contato novamente com a mucosa danificada, intensificando a dor.</p>

          <p><strong>Alternativa C</strong>:</p>
          <p>"O <span style="font-style: italic;">H. pylori</span> está associado com 50 a 60% das úlceras duodenais e com 70 a 90% das úlceras gástricas."</p>
          <p>Essa alternativa também está incorreta. Na realidade, o <span style="font-style: italic;">H. pylori</span> está associado a cerca de <span style="color: darkorange; font-weight: bold;">70 a 90% das úlceras duodenais</span> e aproximadamente 50 a 60% das úlceras gástricas. Portanto, os percentuais mencionados estão invertidos.</p>

          <p><strong>Alternativa D</strong>:</p>
          <p>"As células parenquimatosas do estômago produzem urease, uma enzima que quebra a ureia, aumentando o pH local e inibindo o meio ácido."</p>
          <p>Isso também está incorreto. Não são as células parenquimatosas do estômago que produzem urease, mas sim o <span style="font-style: italic;">Helicobacter pylori</span>. Essa enzima é essencial para a sobrevivência da bactéria no ambiente ácido do estômago, pois a urease catalisa a hidrólise da ureia em amônia e dióxido de carbono, aumentando o pH local.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (1 like):</b>

            letra A
          </div>

      - tipo: ME
        id: 131026-0258-2-6YFkvA
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: Qual das seguintes alternativas representa uma característica da úlcera péptica?
        alternativas:
          - id: alt_A
            texto: Sintomas gastrointestinais recorrentes, predominantemente associados ao consumo de alimentos picantes e gordurosos.
          - id: alt_B
            texto: Resposta completa e duradoura à terapia com Inibidores da Bomba de Prótons (IBP) em todos os casos.
          - id: alt_C
            texto: História natural que inclui a possibilidade de complicação com hemorragia aguda ou perfuração.
          - id: alt_D
            texto: Maior incidência em pacientes jovens, especialmente aqueles com idade inferior a 30 anos.
          - id: alt_E
            texto: Elevação consistente nos níveis séricos de gastrina em pacientes com úlcera péptica, mesmo em ausência de tumores gastrinomatosos.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>A alternativa correta é a <strong style="color: darkorange;">C - História natural que inclui a possibilidade de complicação com hemorragia aguda ou perfuração.</strong></p>

          <p>A úlcera péptica é uma lesão aberta que se desenvolve na mucosa do estômago, duodeno ou esôfago. É causada principalmente por infecção com <em>Helicobacter pylori</em> e pelo uso prolongado de anti-inflamatórios não esteroides (AINEs). As úlceras pépticas podem complicar-se, levando a hemorragias agudas ou perfurações, que são condições potencialmente graves e exigem atenção médica urgente.</p>

          <p>Vamos analisar as alternativas para compreender melhor:</p>

          <p><strong style="color: darkorange;">A - Sintomas gastrointestinais recorrentes, predominantemente associados ao consumo de alimentos picantes e gordurosos.</strong></p>
          <p>Essa alternativa está incorreta. Embora alimentos picantes e gordurosos possam causar desconforto em algumas pessoas com problemas gastrointestinais, eles não são causas diretas de úlcera péptica. O desenvolvimento das úlceras está mais associado à infecção por <em>H. pylori</em> e ao uso de AINEs.</p>

          <p><strong style="color: darkorange;">B - Resposta completa e duradoura à terapia com Inibidores da Bomba de Prótons (IBP) em todos os casos.</strong></p>
          <p>Essa alternativa está incorreta. Embora os Inibidores da Bomba de Prótons (IBP) sejam eficazes no tratamento de úlceras pépticas, nem todos os casos respondem completamente e de forma duradoura. Além disso, a erradicação do <em>H. pylori</em> também é necessária para evitar recidivas.</p>

          <p><strong style="color: darkorange;">C - História natural que inclui a possibilidade de complicação com hemorragia aguda ou perfuração.</strong></p>
          <p>Essa é a alternativa correta. As úlceras pépticas têm um curso clínico que pode incluir complicações graves como hemorragias agudas, que podem causar anemia significativa, e perfurações, que são emergências médicas devido ao risco de peritonite.</p>

          <p><strong style="color: darkorange;">D - Maior incidência em pacientes jovens, especialmente aqueles com idade inferior a 30 anos.</strong></p>
          <p>Essa alternativa está incorreta. A incidência de úlcera péptica não é maior em pacientes jovens. Ela pode ocorrer em qualquer faixa etária, mas é mais comum em adultos mais velhos, especialmente aqueles que fazem uso prolongado de AINEs ou estão infectados com <em>H. pylori</em>.</p>

          <p><strong style="color: darkorange;">E - Elevação consistente nos níveis séricos de gastrina em pacientes com úlcera péptica, mesmo em ausência de tumores gastrinomatosos.</strong></p>
          <p>Essa alternativa está incorreta. A elevação nos níveis séricos de gastrina é mais caracteristicamente associada à síndrome de Zollinger-Ellison, uma condição rara causada por tumores gastrinomatosos. Na maioria dos pacientes com úlcera péptica sem essa condição, os níveis de gastrina não são consistentemente elevados.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-3-MhzwEf
        tags:
