        enunciado: |-
          Um paciente de 52 anos procura atendimento ambulatorial queixando-se de dor epigástrica intermitente há várias semanas, aliviada parcialmente após refeições.
          Ele relata uso frequente de anti-inflamatórios não esteroides (AINEs) para dor lombar crônica, sem histórico prévio de sangramento digestivo. Considerando o manejo diagnóstico e terapêutico da úlcera péptica, assinale a alternativa correta.
        alternativas:
          - id: alt_A
            texto: A confirmação diagnóstica da úlcera péptica depende exclusivamente de testes laboratoriais não invasivos, como hemograma e marcadores inflamatórios, sendo a endoscopia desnecessária na maioria dos casos.
            comentario: Está errada por critério diagnóstico. Hemograma e marcadores inflamatórios são inespecíficos e não confirmam úlcera péptica. A confirmação anatômica da úlcera depende de visualização da lesão, tendo a endoscopia digestiva alta como exame principal para confirmar a úlcera e avaliar complicações.
          - id: alt_B
            texto: O uso rotineiro de inibidores da bomba de prótons (IBPs) não é indicado em pacientes com suspeita de úlcera péptica associada a AINEs, pois não interfere na cicatrização da mucosa.
            comentario: Está errada por critério farmacológico e terapêutico. IBPs reduzem a secreção ácida gástrica e, com isso, favorecem cicatrização da mucosa ulcerada. Eles fazem parte do tratamento da úlcera péptica, inclusive quando associada a AINEs, e negar esse efeito contradiz o mecanismo terapêutico básico desses fármacos.
          - id: alt_C
            texto: A pesquisa da presença de Helicobacter pylori é recomendada em todos os casos de úlcera péptica, mesmo quando há uso contínuo de AINEs, para direcionar terapia erradicadora quando indicada.
            comentario: 'A alternativa C está correta porque mantém a investigação de H. pylori mesmo diante de um fator causal evidente, como o uso frequente de AINEs. Isso é relevante na prática porque um resultado positivo muda a conduta: além de tratar a úlcera, passa a haver indicação de terapia erradicadora da bactéria. Assim, a questão cobra o reconhecimento de que AINEs e H. pylori podem coexistir e que essa pesquisa tem impacto terapêutico objetivo.'
          - id: alt_D
            texto: A profilaxia da úlcera péptica em pacientes que utilizam AINEs não requer uso de IBPs ou antagonistas H2, bastando apenas monitorar a ingestão de anti-inflamatórios.
            comentario: Está errada por critério preventivo. Em usuários de AINEs com risco gastrointestinal, apenas monitorar a ingestão do anti-inflamatório não previne adequadamente lesão ulcerosa. Medidas de gastroproteção podem ser necessárias, e os IBPs têm papel reconhecido tanto no tratamento quanto na prevenção de lesão associada a AINEs quando indicada.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O critério que decide a questão é etiológico: em úlcera péptica, AINEs e H. pylori são causas principais e não excludentes. No caso, o uso de AINEs não dispensa a investigação de H. pylori, porque sua identificação altera a conduta ao indicar erradicação quando positiva.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Úlcera péptica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca tentou induzir o candidato a atribuir toda a úlcera ao uso de AINEs e, com isso, esquecer que H. pylori continua devendo ser investigado porque as duas causas podem coexistir e essa identificação muda a conduta.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Não trate AINE e H. pylori como causas excludentes de úlcera péptica; a presença de uma não elimina a outra.</li><li>Se a questão perguntar manejo de úlcera, procure a alternativa que muda conduta de forma objetiva, como pesquisa de H. pylori com possibilidade de erradicação.</li><li>Para confirmação de úlcera, diferencie exames inespecíficos de exame anatômico: hemograma pode avaliar repercussão, mas não confirma a lesão; a endoscopia é o método principal.</li><li>Lembre que IBP tem função terapêutica real na úlcera por supressão ácida e também pode ser usado como gastroproteção em usuários de AINEs quando indicado.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-24-DK7vRD
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2025'
        enunciado: Um paciente de 50 anos, com histórico de uso crônico de anti-inflamatórios não esteroidais (AINEs) para dor articular, apresenta queixa de dor epigástrica em queimação há 3 meses, que melhora com a alimentação e piora à noite. Ele também relata náuseas ocasionais. A endoscopia digestiva alta revela uma úlcera gástrica de 1,5 cm no antro, com bordas regulares e fundo limpo. A biópsia da lesão é negativa para Helicobacter pylori. Qual é a conduta mais adequada para o tratamento dessa úlcera péptica?
        alternativas:
          - id: alt_A
            texto: Suspensão dos AINEs e prescrição de omeprazol.
          - id: alt_B
            texto: Suspensão dos AINEs e prescrição de sucralfato.
          - id: alt_C
            texto: Manutenção dos AINEs e prescrição de ranitidina.
          - id: alt_D
            texto: Suspensão dos AINEs e prescrição de misoprostol.
          - id: alt_E
            texto: Manutenção dos AINEs e prescrição de omeprazol.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>O tema central desta questão é o manejo da <span style="color: darkorange;"><strong>úlcera péptica</strong></span> induzida por <strong>anti-inflamatórios não esteroidais (AINEs)</strong>. A úlcera péptica é uma lesão na mucosa gástrica ou duodenal que pode ser agravada pelo uso de AINEs, devido à inibição da síntese de prostaglandinas, que são protetoras da mucosa gastrointestinal. O paciente descrito apresenta uma úlcera gástrica sem infecção por <em>Helicobacter pylori</em>, o que indica a necessidade de revisar o uso de AINEs e iniciar tratamento específico.</p>

          <p><strong>Justificativa para a alternativa correta (A):</strong> A conduta mais adequada é a <span style="color: darkorange;"><strong>Suspensão dos AINEs e prescrição de omeprazol</strong></span>. A interrupção do uso dos AINEs é crucial para permitir a cicatrização da úlcera. O omeprazol, um inibidor da bomba de prótons (IBP), é eficaz na redução da secreção ácida gástrica, promovendo a cicatrização da úlcera. Este manejo está de acordo com diretrizes atuais, como a do <em>American College of Gastroenterology</em>.</p>

          <p><strong>Análise das alternativas incorretas:</strong></p>

          <p><strong>B - Suspensão dos AINEs e prescrição de sucralfato:</strong> Embora o sucralfato possa proteger a mucosa gástrica, ele não é tão eficaz quanto os IBPs na cicatrização de úlceras induzidas por AINEs. Portanto, o sucralfato não é a terapia de primeira linha.</p>

          <p><strong>C - Manutenção dos AINEs e prescrição de ranitidina:</strong> Manter o uso de AINEs não é recomendado, pois eles são a causa subjacente da úlcera. A ranitidina é um antagonista dos receptores H2, menos eficaz que os IBPs na cicatrização de úlceras.</p>

          <p><strong>D - Suspensão dos AINEs e prescrição de misoprostol:</strong> O misoprostol pode ser usado para prevenir úlceras em pacientes que necessitam continuar com AINEs, mas nesta situação, a prioridade é a cicatrização da úlcera já existente, para a qual os IBPs são mais indicados.</p>

          <p><strong>E - Manutenção dos AINEs e prescrição de omeprazol:</strong> Ainda que o omeprazol ajude na cicatrização, a manutenção dos AINEs continua a prejudicar a mucosa gástrica, impedindo a cura eficaz da úlcera.</p>

          <p>Ao identificar o uso de AINEs como fator etiológico, a estratégia de tratamento deve focar na suspensão dos AINEs e no uso de um IBP para promover a cicatrização da úlcera.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-25-Efaoz9
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: |-
          A úlcera péptica é uma úlcera de forma redonda ou oval na qual o revestimento do estômago ou duodeno foi corroído pelo ácido gástrico e sucos digestivos. Sobre este assunto analise os itens e assinale a correta:

          I - As úlceras pépticas podem ser causadas por uma infecção pela bactéria Helicobacter pylori ou pelo uso de medicamentos tais como aspirina ou outros medicamentos anti-inflamatórios não esteroides (AINEs), que não enfraquecem o revestimento do estômago ou do duodeno.

          II - O desconforto causado por úlceras vai e vem e tende a não estar relacionado com as refeições (às vezes melhora após comer e às vezes piora após comer).
          III -O diagnóstico da úlcera péptica é baseado nos sintomas de dores gástricas e nos resultados de um exame do estômago realizado pela inserção de um tubo flexível para visualização (endoscopia digestiva alta) e exames de Helicobacter pylori.

          IV - Medicamentos são administrados para reduzir a acidez do estômago e antibióticos são administrados para eliminar a bactéria Helicobacter pylori.
        alternativas:
          - id: alt_A
            texto: Os itens I, II e III estão corretos.
          - id: alt_B
            texto: Os itens III e IV estão corretos.
          - id: alt_C
            texto: Os itens II, III e IV estão corretos.
          - id: alt_D
            texto: Os itens II e IV estão corretos.
          - id: alt_E
            texto: Os itens I e III estão corretos.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b><span style="color:darkblue;">Tema central:</span></b> Úlcera péptica resulta do desequilíbrio entre fatores agressivos (ácido, pepsina, <i>H. pylori</i>, AINEs) e defensivos da mucosa (muco, bicarbonato, prostaglandinas e fluxo sanguíneo). O entendimento desse balanço é chave para diagnóstico e tratamento.</p>

          <p><b><span style="color:darkblue;">Alternativa correta: B (Itens III e IV)</span></b></p>

          <p><b>Item III – Correto:</b> O diagnóstico é sustentado por <u>endoscopia digestiva alta</u> (método de escolha para visualizar a úlcera e complicações) e <u>testes para <i>H. pylori</i></u> (teste respiratório da ureia, antígeno fecal, urease rápida, histologia). Sintomas isolados são inespecíficos, mas orientam a investigação. Referências: Harrison’s Principles of Internal Medicine; UpToDate; Diretriz ACG para <i>H. pylori</i> (2022).</p>

          <p><b>Item IV – Correto:</b> O tratamento baseia-se em <u>supressão ácida</u> com IBP (geralmente 4–8 semanas) e, quando <i>H. pylori</i> positivo, <u>erradicação antibiótica</u> (p. ex., terapia quádrupla com bismuto por 10–14 dias). Confirmar erradicação 4+ semanas após antibióticos e 2 semanas sem IBP. Em úlcera por AINE, suspender o AINE, usar IBP e considerar COX-2 + IBP se imprescindível. Referências: ACG 2022; UpToDate.</p>

          <p><b><span style="color:darkorange;">Por que as demais estão incorretas?</span></b></p>

          <p><b>Item I – Incorreto:</b> A afirmação diz que AINEs “não enfraquecem” a mucosa, o que contradiz a fisiopatologia. AINEs inibem COX-1/COX-2, reduzindo prostaglandinas → menor muco, bicarbonato e fluxo sanguíneo, aumentando suscetibilidade à lesão ácida. É causa principal de úlcera não infecciosa. Referências: Harrison’s; UpToDate.</p>

          <p><b>Item II – Incorreto:</b> Dor de úlcera <u>costuma se relacionar às refeições</u>. Em geral, <span style="color:darkblue;"><b>úlcera duodenal</b></span>: melhora com alimento e piora 2–5 h depois e à noite; <span style="color:darkblue;"><b>úlcera gástrica</b></span>: piora com alimento. Dizer que “tende a não estar relacionada” é armadilha clássica.</p>

          <p><b><span style="color:darkorange;">Análise das alternativas</span></b></p>
          <p><b>A</b> (I, II, III): erra por incluir I e II (ambos falsos).<br>
          <b>B</b> (III, IV): <span style="color:darkblue;"><b>correta</b></span>.<br>
          <b>C</b> (II, III, IV): inclui II (falso).<br>
          <b>D</b> (II, IV): inclui II (falso).<br>
          <b>E</b> (I, III): inclui I (falso).</p>

          <p><b><span style="color:darkblue;">Dicas para a prova</span></b></p>
          <ul>
          <li>Desconfie de negações absolutas (“não enfraquecem”) quando você sabe o mecanismo contrário.</li>
          <li>Lembre a associação da dor com a refeição para diferenciar úlcera gástrica x duodenal.</li>
          <li>Diagnóstico definitivo: endoscopia; <i>H. pylori</i> sempre deve ser pesquisado e tratado quando presente.</li>
          </ul>

          <p><b><span style="color:darkorange;">Referências rápidas</span></b>: Harrison’s Principles of Internal Medicine; UpToDate (Peptic ulcer disease); American College of Gastroenterology Guideline on Treatment of <i>Helicobacter pylori</i> Infection (2022).</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-26-RjhyTO
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2025'
        enunciado: |-
          Após uma hemorragia digestiva superior controlada, um homem de 72 anos com histórico de úlcera péptica H. pylori positiva inicia erradicação com terapia tripla. Ele é orientado a reiniciar o uso de ácido acetilsalicílico (AAS) em baixa dose para prevenção secundária de eventos cardiovasculares.
          Durante a consulta, ele questiona sobre a melhor estratégia para prevenir uma nova recorrência de sangramento.
        alternativas:
          - id: alt_A
            texto: Substituir o AAS por clopidogrel sem necessidade de inibidor de bomba de próton (IBP).
          - id: alt_B
            texto: Confirmar erradicação do H. pylori e associar IBP contínuo ao AAS.
          - id: alt_C
            texto: Prescrever ranitidina junto com o AAS.
          - id: alt_D
            texto: Continuar o AAS sem necessidade de IBP após erradicação do H. pylori.
          - id: alt_E
            texto: Introduzir celecoxibe em vez de AAS.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange; font-weight:bold;">Tema central:</span> A questão trata da <u>prevenção de recorrência de hemorragia digestiva alta</u> em paciente idoso, com histórico de úlcera péptica positiva para <i>H. pylori</i>, que faz uso obrigatório de <b>ácido acetilsalicílico (AAS)</b> para prevenção cardiovascular secundária.</p>

          <p><span style="color:navy; font-weight:bold;">Justificativa para a alternativa correta (B):</span> <br>
          A estratégia mais indicada é <b>confirmar a erradicação do <i>H. pylori</i></b> e <b>associar o uso contínuo de inibidor de bomba de prótons (IBP)</b> ao AAS. Segundo o Ministério da Saúde ("Uso Racional de Medicamentos: Temas Selecionados"): <span style="color:darkorange;">"A administração concomitante de inibidores de bomba [...] reduz o risco de sangramento digestivo alto nesses pacientes."</span> Ao se erradicar o <i>H. pylori</i> e usar IBP, você aborda tanto a etiologia infecciosa das úlceras quanto protege a mucosa contra o efeito erosivo do AAS, sendo esta a abordagem recomendada pelas principais diretrizes nacionais e internacionais (UpToDate, diretrizes da SBAD e ACC/AHA).</p>

          <p><b>Estratégia de leitura:</b> Fique atento a <span style="color:navy;">"recorrência de sangramento"</span> e à necessidade de manter o AAS, pois estes pontos norteiam a resposta baseada em protocolos de risco gastrointestinais em casos de prevenção cardiovascular.</p>

          <p><span style="color:darkorange; font-weight:bold;">Análise das alternativas incorretas:</span></p>
          <ul>
          <li><b>A)</b> <span style="color:navy;">Substituir AAS por clopidogrel</span> não é seguro, pois clopidogrel também pode causar sangramento GI e não supera o benefício da associação AAS + IBP (<i>NEJM, 2005</i>).</li>
          <li><b>C)</b> A <span style="color:navy;">ranitidina</span> é significativamente menos eficaz que IBP para prevenção de úlceras em usuários de AAS segundo estudos randomizados e diretrizes atuais.</li>
          <li><b>D)</b> <span style="color:navy;">Manter AAS após erradicação do <i>H. pylori</i> sem IBP</span> mantém alto o risco, pois o AAS sozinho pode lesar a mucosa.</li>
          <li><b>E)</b> <span style="color:navy;">Celecoxibe</span> não substitui o efeito antiplaquetário do AAS, sendo inadequado para prevenção secundária de eventos cardiovasculares.</li>
          </ul>

          <p><span style="color:darkorange; font-weight:bold;">Resumo prático:</span> O aluno deve sempre buscar <b>associar proteção da mucosa (IBP)</b> quando não há alternativa ao uso de AAS com risco prévio de sangramento! Essa conduta é respaldada por evidência robusta e integra protocolos essenciais para a prática médica segura.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-27-ZfbIYf
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: |-
          Uma paciente do sexo feminino, 34 anos, com relato de dor epigástrica crônica, teve piora significativa nos últimos 3 meses.
          Foi aventada a hipótese de síndrome de Zollinger-Ellison. Assim, a endoscopia digestiva alta detectou úlcera péptica grave.

          Esse acha somatostatina;do é secundário a hipersecreção de ácido gástrico devido a um tumor neuroendócrino não-β, geralmente bem diferenciado que libera o seguinte hormônio:
        alternativas:
          - id: alt_A
            texto: colecistocinina;
          - id: alt_B
            texto: somatostatina;
          - id: alt_C
            texto: gastrina;
          - id: alt_D
            texto: secretina;
          - id: alt_E
            texto: peptídeo YY.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange;"><b>Tema central:</b></span> A questão aborda a <b>Síndrome de Zollinger-Ellison (SZE)</b>, um tema relevante em concursos de acesso à Residência Médica. Essa síndrome é causada por um tumor neuroendócrino, geralmente do pâncreas ou duodeno (o <b>gastrinoma</b>), que produz <u>excessivamente um hormônio específico</u>. Isso resulta em hipersecreção de ácido gástrico e em úlceras pépticas graves, frequentemente múltiplas e de difícil controle.</p>

          <p><span style="color:navy;"><b>Justificativa da alternativa correta:</b></span> <br>
          A alternativa <b><span style="color:darkorange;">C) Gastrina</span></b> está correta. O gastrinoma produz <b>gastrina</b>, que é o hormônio responsável por estimular as células parietais gástricas a secretarem ácido clorídrico. O excesso de ácido lesa a mucosa do trato digestivo, levando a úlceras recorrentes e quadros de dor epigástrica intensa ou refratária ao tratamento convencional.</p>

          <p>Segundo o <b>Harrison’s Principles of Internal Medicine</b> (21ª ed.): 
          <span style="color:darkorange;">“A principal característica laboratorial é o aumento inapropriado de gastrina sérica, que provoca hipersecreção ácida e úlceras gastroduodenais.”</span></p>

          <p>A análise clínica, associada à elevação da gastrina sérica e ao achado endoscópico de úlcera grave, fortalece a suspeita de SZE.</p>

          <p><span style="color:navy;"><b>Análise das alternativas incorretas:</b></span></p>
          <ul>
          <li><b>A) Colecistocinina:</b> Hormônio envolvido na digestão de gorduras e proteínas, estimulando o pâncreas e contração da vesícula biliar, <span style="color:darkorange;">não tem relação direta com a acidez gástrica nem com a etiologia da SZE</span>.</li>
          <li><b>B) Somatostatina:</b> Tem função inibitória sobre vários hormônios gastrointestinais, <span style="color:darkorange;">inclusive a gastrina; mas sua hipersecreção não causa SZE</span>.</li>
          <li><b>D) Secretina:</b> Estimula a secreção de bicarbonato pelo pâncreas, <span style="color:darkorange;">mas não está implicada na formação de úlcera péptica por excesso de ácido.</span></li>
          <li><b>E) Peptídeo YY:</b> Atua na inibição da motilidade gastrointestinal e secreção gástrica após refeições, <span style="color:darkorange;">sem papel na SZE</span>.</li>
          </ul>

          <p><span style="color:darkorange;"><b>Dicas para provas:</b></span> 
          Observe as palavras-chave "hipersecreção de ácido" e "tumor neuroendócrino", que direcionam à opção relacionada à <b>gastrina</b>. Evite distrações com hormônios que, apesar de serem gastrointestinais, não têm ligação causal com úlceras por hiperacidez.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-28-VlLdTr
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2026'
        enunciado: |-
          Um paciente de 56 anos, obeso, em uso crônico de AINEs por gonartrose muito sintomática, apresenta dor abdominal súbita e intensa, associada com rigidez abdominal difusa e sinais de peritonite generalizada.
          Estudo radiográfico de abdome evidencia pneumoperitônio subdiafragmático. O paciente encontra-se hipotenso, taquicárdico e desidratado. Considerando o diagnóstico de abdome agudo perfurativo por úlcera péptica, a estratégia cirúrgica de emergência mais adequada é:
        alternativas:
          - id: alt_A
            texto: adiar a cirurgia, tentando tratamento inicial conservador (com antibióticos e inibidores de bomba de prótons) até estabilização completa do paciente.
            comentario: Está errada porque peritonite difusa, pneumoperitônio e hipotensão/taquicardia definem perfuração visceral complicada com necessidade de controle cirúrgico urgente da fonte. Antibiótico e inibidor de bomba de prótons não corrigem a perfuração nem a contaminação peritoneal. O erro específico é postergar a intervenção definitiva esperando estabilização completa, o que é inadequado nesse cenário.
          - id: alt_B
            texto: proceder imediatamente com laparoscopia diagnóstica, sem intervenção cirúrgica inicial, mantendo o paciente em observação para uma possível intervenção subsequente.
            comentario: Está errada porque o problema não é diagnóstico duvidoso, e sim necessidade de tratamento definitivo imediato. Laparoscopia apenas diagnóstica seguida de observação não fecha a perfuração nem trata a peritonite. A via laparoscópica pode existir como acesso em casos selecionados, mas com reparo da perfuração; o erro da alternativa é propor ausência de intervenção terapêutica inicial.
          - id: alt_C
            texto: após estabilização hemodinâmica inicial, levar à laparotomia de emergência, com fechamento da perfuração (sutura simples ou com patch de omento) e drenagem da cavidade.
            comentario: 'A alternativa C descreve a conduta padrão no abdome agudo perfurativo por úlcera péptica complicada: primeiro reanimação inicial, sem esperar estabilização completa, e depois operação de urgência para controlar a fonte séptica. O objetivo cirúrgico é fechar a perfuração, geralmente com sutura simples com ou sem patch de omento, e realizar lavagem/drenagem da cavidade, porque a peritonite e a instabilidade decorrem do extravasamento gastroduodenal e não se resolvem com tratamento não operatório isolado.'
          - id: alt_D
            texto: após estabilização hemodinâmica inicial, realizar ressecção gástrica ampla (gastrectomia subtotal) de forma rotineira, em todos os casos de perfuração, independentemente do tamanho da úlcera e sua natureza (benigna/maligna).
            comentario: Está errada porque gastrectomia subtotal rotineira em toda perfuração é procedimento excessivo e não corresponde ao manejo padrão da maioria das perfurações pépticas benignas. A extensão da cirurgia deve ser individualizada conforme achados e contexto; sem elementos que imponham ressecção, o procedimento usual é fechamento da perfuração com tratamento da cavidade. Além disso, a base não permite afirmar malignidade nem justificar ressecção ampla universal.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Peritonite generalizada com pneumoperitônio e instabilidade hemodinâmica caracteriza perfuração livre de víscera oca, compatível com úlcera péptica perfurada, exigindo ressuscitação hemodinâmica inicial seguida de cirurgia urgente para controle da fonte e fechamento da perfuração.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Úlcera péptica perfurada</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre 'estabilização hemodinâmica inicial' e atraso indevido da cirurgia: neste quadro, estabilizar significa reanimar rapidamente para operar, não tentar tratamento conservador prolongado nem observar sem reparo.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se houver dor súbita intensa, rigidez difusa e pneumoperitônio, pense em perfuração de víscera oca com indicação de controle urgente da fonte.</li><li>Em perfuração péptica com peritonite generalizada, antibiótico e reposição volêmica entram como medidas iniciais, não como substitutos da operação.</li><li>Diferencie via de acesso de estratégia terapêutica: laparoscopia pode ser acesso, mas a conduta correta precisa incluir reparo da perfuração.</li><li>Ressecções gástricas extensas não são rotina universal no cenário agudo; o padrão mais frequente é fechamento da perfuração com ou sem patch de omento.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-29-gLq24f
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: "Analise as afirmativas a seguir:\_\n\nI. A úlcera péptica (UP) é uma lesão do trato digestivo desencadeada por um desequilíbrio entre os fatores agressores e protetores da mucosa, resultando em dano causado pela hipersecreção ácida.\_\nII. O inibidor de bomba de prótons (IBP) é o medicamento menos indicado para promover uma cicatrização mais rápida da úlcera.\_\nIII. Os sintomas associados a esse tipo de lesão são muito variados mas não incluem dor epigástrica, aliviada ou agravada com refeições, dispepsia, vômitos e nem tampouco pode ocorrer perda de apetite e intolerância a alimentos gordurosos.\n\nMarque a alternativa CORRETA:"
        alternativas:
          - id: alt_A
            texto: Todas as afirmativas estão corretas.
          - id: alt_B
            texto: Nenhuma afirmativa está correta.
          - id: alt_C
            texto: Apenas uma afirmativa está correta.
          - id: alt_D
            texto: Apenas duas afirmativas estão corretas.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:#0B3D91"><b>Tema central</b></span>: a úlcera péptica resulta do <b>desequilíbrio entre fatores agressores</b> (ácido, pepsina, H. pylori, AINEs) e <b>mecanismos de defesa da mucosa</b> (muco, bicarbonato, fluxo sanguíneo, prostaglandinas). O ácido é <u>necessário</u> para a lesão, mas nem sempre há “hipersecreção” (ex.: úlcera por AINE).</p>

          <p><span style="color:#0B3D91"><b>Gabarito: C — Apenas uma afirmativa está correta.</b></span></p>

          <p><b>Qual afirmativa está correta?</b> <span style="color:#0B3D91"><b>I</b></span>. Ela descreve adequadamente a fisiopatologia como desequilíbrio agressor/defesa. Embora nem toda UP decorra de <i>hipersecreção</i>, o ácido tem papel central no dano ácido-péptico, o que mantém a assertiva globalmente verdadeira. Referências: Harrison’s; UpToDate; diretrizes ACG.</p>

          <p><b>Por que as demais estão incorretas?</b></p>
          <p><span style="color:#0B3D91"><b>II</b></span> — Falsa. <b>IBP</b> é o <span style="color:#FF8C00"><b>mais indicado</b></span> para cicatrização rápida de úlcera, superior a bloqueadores H2, antiácidos e sucralfato (taxas de cicatrização maiores e alívio mais rápido). Diretrizes ACG e consensos internacionais recomendam IBP por 4–8 semanas.</p>
          <p><span style="color:#0B3D91"><b>III</b></span> — Falsa. Os sintomas típicos <u>incluem</u> <b>dor epigástrica</b> relacionada às refeições (duodenal: alívio com alimento; gástrica: piora pós-prandial), <b>dispepsia</b>, <b>náuseas/vômitos</b>, possível <b>anorexia</b> e <b>intolerância a gorduras</b>. Afirmativa usa negação absoluta (“não incluem”), característica de pegadinha. Fontes: Harrison’s; UpToDate.</p>

          <p><span style="color:#0B3D91"><b>Condutas essenciais (provas)</b></span>:</p>
          <ul>
            <li><b>Diagnóstico</b>: endoscopia se sinais de alarme (sangramento, perda ponderal, anemia, vômitos persistentes, &gt;55 anos) ou refratariedade; pesquisa de <i>H. pylori</i> (teste respiratório de ureia, antígeno fecal, biópsia).</li>
            <li><b>Tratamento</b>: <b>IBP</b> por 4–8 semanas; erradicar <i>H. pylori</i> (terapia quádrupla com bismuto por 10–14 dias como primeira linha em muitos cenários); suspender <b>AINEs</b> e usar proteção gástrica se imprescindíveis.</li>
          </ul>

          <p><span style="color:#FF8C00"><b>Estratégia de prova</b></span>: desconfie de termos absolutos como ��não incluem” (III) e de afirmações que contrariem o padrão-ouro terapêutico (II). Em fisiopatologia, busque a ideia-mãe “desequilíbrio agressor/defesa” (I).</p>

          <p><i>Referências-chave</i>: Harrison’s Principles of Internal Medicine; UpToDate (Peptic ulcer disease); Diretrizes ACG para manejo de úlcera e infecção por H. pylori.</p>

          <p><b>Conclusão</b>: Apenas a <b>I</b> está correta; <b>IBP</b> é o tratamento de escolha e os sintomas descritos na III são, de fato, característicos de UP.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A questão apresenta três afirmativas sobre úlcera péptica e seu tratamento, pedindo para julgar a veracidade de cada uma.

            A afirmativa I está correta. A úlcera péptica é realmente uma lesão no trato digestivo que ocorre quando há um desequilíbrio entre fatores agressores, como o ácido gástrico, e fatores protetores da mucosa gástrica, como a produção de muco. Então, a lesão é frequentemente associada com hipersecreção ácida ou com a presença da bactéria Helicobacter pylori.

            A afirmativa II está incorreta. O inibidor de bomba de prótons (IBP) é, na verdade, o tratamento de escolha para a úlcera péptica, pois diminui a secreção ácida gástrica, promovendo um ambiente favorável para a cicatrização da lesão.

            A afirmativa III também está incorreta. Os sintomas descritos são tipicamente associados à úlcera péptica. Dor epigástrica que melhora ou piora com as refeições, dispepsia (indigestão), vômitos, perda de apetite e intolerância a alimentos gordurosos são todos sintomas comuns desta condição.

            Dado que apenas a afirmativa I está correta, a resposta correta é a alternativa C - Apenas uma afirmativa está correta. As outras duas afirmativas contêm informações incorretas sobre o tratamento e os sintomas da úlcera péptica, respectivamente.
          </div>

      - tipo: ME
        id: 131026-0258-30-yCAuen
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: |-
          A doença ulcerosa péptica (DUP) é a causa mais frequente de hemorragia digestiva alta (HDA) não varicosa, respondendo por aproximadamente 60 a 70% dos casos, o que excede a incidência combinada de todas as outras etiologias. Sobre o assunto, julgue as seguintes afirmações como verdadeiras (V) ou falsas (F):

          (__)A principal causa de DUP é a infecção crônica, provocada pela bactéria Helicobacter pylori.
          (__)AINEs são a segunda causa de úlcera péptica e englobam substâncias como o ácido acetilsalicílico (AAS), diclofenaco, ibuprofeno, cetoprofeno, nimesulida e meloxicam.
          (__)As úlceras gástricas podem provocar sangramentos bem mais vultosos do que as duodenais.

          Assinale a alternativa cuja respectiva ordem de julgamento esteja correta:
        alternativas:
          - id: alt_A
            texto: V − V − V.
          - id: alt_B
            texto: V − V − F.
          - id: alt_C
            texto: V − F − F.
          - id: alt_D
            texto: F − F − F.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:#0b3d91;">Tema central:</b> Hemorragia digestiva alta (HDA) não varicosa por doença ulcerosa péptica (DUP), suas principais causas e características do sangramento.</p>

          <p><b style="color:#cc5500;">Gabarito:</b> B — <u>V</u> – <u>V</u> – <u>F</u>.</p>

          <p><b style="color:#0b3d91;">Justificativa das afirmações</b></p>

          <p><b>1) Verdadeira.</b> A <b>Helicobacter pylori</b> é a principal causa de DUP mundialmente. A bactéria induz inflamação crônica, aumenta a secreção ácida e compromete as defesas da mucosa, favorecendo úlceras gástricas e duodenais. A erradicação reduz recidiva e sangramento. Referências: Harrison’s Principles of Internal Medicine; UpToDate; diretrizes ACG/ESGE para HDA não varicosa.</p>

          <p><b>2) Verdadeira.</b> <b>AINEs</b> são a segunda causa de DUP. Incluem <b>AAS</b> (aspirina) e não seletivos como <b>diclofenaco, ibuprofeno, cetoprofeno</b>, além de preferenciais/COX-2 como <b>nimesulida, meloxicam</b>—estes têm <u>menor</u> risco que não seletivos, mas não o eliminam. Mecanismo: inibição de COX → ↓prostaglandinas → ↓muco/fluxo sanguíneo mucoso → maior suscetibilidade a ácido. Diretrizes ACG/ESGE e UpToDate corroboram.</p>

          <p><b>3) Falsa.</b> <b>Úlceras duodenais</b>, especialmente na parede <b>posterior</b>, sangram de forma <u>mais vultosa</u> por erosão da <b>artéria gastroduodenal</b>. Úlceras gástricas também sangram, mas classicamente o sangramento maciço é mais associado às duodenais. Fontes: Harrison’s; UpToDate; ESGE 2021.</p>

          <p><b style="color:#0b3d91;">Estratégia de prova</b>: identifique palavras-chave — “principal causa” remete a H. pylori; “AINEs” incluem AAS; desconfie de generalizações como “gástricas sangram mais” (pegadinha) lembrando da relação anatômica das duodenais com vasos calibrosos.</p>

          <p><b style="color:#0b3d91;">Análise das alternativas</b></p>
          <p><b>A (V–V–V)</b>: Errada porque a 3ª é falsa.</p>
          <p><b>B (V–V–F)</b>: <b style="color:#cc5500;">Correta</b>. Coerente com evidências epidemiológicas e anatômicas.</p>
          <p><b>C (V–F–F)</b>: Errada, pois AINEs são sim a 2ª causa de DUP e os fármacos citados pertencem ao grupo.</p>
          <p><b>D (F–F–F)</b>: Errada, pois as duas primeiras são verdadeiras.</p>

          <p><b style="color:#0b3d91;">Aplicação prática rápida</b></p>
          <p>Na HDA por DUP: estabilização hemodinâmica, IBP em dose alta, endoscopia em até 24 h com terapia hemostática quando indicado; pesquisar e erradicar H. pylori; avaliar necessidade de suspender AINE/AAS ou associar proteção gástrica. Referências: ACG 2021/2022, ESGE 2021, UpToDate.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-31-MEmR6C
        tags:
          - Comentário Oficial
