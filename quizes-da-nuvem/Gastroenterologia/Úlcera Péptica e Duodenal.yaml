            ```html
          <p><strong>Tema central:</strong> A questão aborda a <span style="color:darkorange;"><strong>complicação aguda de úlcera péptica</strong></span>, que é um tópico importante em cirurgia geral. O conhecimento sobre a apresentação clínica e complicações das úlceras pépticas é essencial para o diagnóstico correto em casos de abdome agudo.</p>

          <p><strong>Justificativa para a alternativa correta (B - Perfuração de úlcera):</strong></p>

          <p>Um homem de 50 anos com histórico de <span style="color:darkorange;"><strong>úlcera péptica</strong></span> apresenta dor súbita e intensa em epigástrio. Este quadro clínico é altamente sugestivo de <strong>perfuração de úlcera</strong>. A perfuração leva à liberação de conteúdo gástrico na cavidade peritoneal, resultando em uma dor abdominal aguda e intensa, muitas vezes descrita como "em facada". Clinicamente, esses pacientes podem apresentar-se com sinais de irritação peritoneal e defesa abdominal.</p>

          <p>Na emergência, a confirmação pode ser feita com uma radiografia de abdome em pé, que pode mostrar <span style="color:darkorange;"><strong>ar livre sob o diafragma</strong></span>, um sinal clássico de perfuração. Este é um exemplo de um <strong>abdome agudo cirúrgico</strong>, e o manejo envolve tratamento cirúrgico urgente.</p>

          <p><strong>Análise das alternativas incorretas:</strong></p>

          <p><span style="color:darkblue;"><strong>A - Peritonite bacteriana:</strong></span> Embora a peritonite bacteriana cause dor abdominal, ela geralmente não se apresenta com a dor súbita e intensa descrita, a menos que seja secundária à perfuração, como no caso de uma úlcera perfurada. A peritonite bacteriana primária é mais comum em pacientes com ascite, como os que têm cirrose hepática.</p>

          <p><span style="color:darkblue;"><strong>C - Pancreatite aguda:</strong></span> A pancreatite aguda pode causar dor epigástrica severa, mas essa dor geralmente se irradia para as costas e não é tão súbita quanto a dor de uma perfuração de úlcera. Além disso, fatores de risco e achados laboratoriais específicos, como elevação de amilase e lipase, são necessários para confirmar este diagnóstico.</p>

          <p><span style="color:darkblue;"><strong>D - Infarto mesentérico:</strong></span> O infarto mesentérico também pode causar dor abdominal intensa, mas é mais comumente associado a pacientes com fatores de risco para tromboembolismo, como fibrilação atrial. A dor é geralmente desproporcional aos achados físicos, e frequentemente acompanhada de sinais de sepse em estágios avançados.</p>

          <p>Em suma, a história de úlcera péptica combinada com a apresentação clínica de dor súbita e intensa em epigástrio torna o diagnóstico de <strong>perfuração de úlcera</strong> o mais provável.</p>

          <p><em>Gostou do comentário? Deixe sua avaliação aqui embaixo!</em></p>
