        enunciado: Um paciente de 65 anos apresenta úlcera péptica gástrica com sangramento ativo, estável hemodinamicamente. Qual o procedimento de primeira escolha para o controle do sangramento?
        alternativas:
          - id: alt_A
            texto: Lavagem gástrica
          - id: alt_B
            texto: Gastrectomia parcial
          - id: alt_C
            texto: Compressão com gaze
