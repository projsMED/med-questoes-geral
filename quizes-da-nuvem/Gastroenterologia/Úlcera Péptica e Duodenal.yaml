          - Úlcera Peptica
          - '2025'
        enunciado: Considerando o manejo endoscópico da úlcera péptica hemorrágica com vaso visível, assinale alternativa correta.
        alternativas:
          - id: alt_A
            texto: Apenas o uso de inibidor de bomba pós-procedimento já é suficiente.
            comentario: Errada. Vaso visível é lesão de alto risco e tem indicação de hemostasia endoscópica. O IBP pós-endoscopia é adjuvante, mas não substitui a intervenção hemostática necessária nesse estigma.
          - id: alt_B
            texto: A injeção de adrenalina isolada é a melhor estratégia terapêutica.
            comentario: Errada. A adrenalina isolada não é a melhor estratégia porque seu efeito é temporário e há maior taxa de ressangramento do que com terapia combinada. O erro é tomá-la como tratamento definitivo preferencial.
          - id: alt_C
            texto: A hemorragia resfriada (água gelada) é o primeiro passo da hemostasia.
            comentario: Errada. Irrigação com água pode auxiliar a visualização, mas água gelada não é o primeiro passo terapêutico padrão para hemostasia de vaso visível nem constitui método hemostático definitivo recomendado.
          - id: alt_D
            texto: O clipe endoscópico é contraindicado em lesões do bulbo duodenal.
            comentario: Errada. O clipe endoscópico não é contraindicado por princípio em lesões do bulbo duodenal. Sua utilização depende de anatomia, acesso e características da lesão, sem contraindicação anatômica universal.
          - id: alt_E
            texto: A aplicação combinada de métodos mecânicos e injeção é preferencial.
            comentario: A alternativa E está correta porque, diante de úlcera péptica hemorrágica com vaso visível, o tratamento endoscópico deve ser ativo. A base informa que a associação de injeção com método mecânico, como clipe, ou com método térmico reduz falha hemostática e ressangramento em relação à adrenalina isolada. Assim, a preferência por aplicação combinada corresponde ao manejo mais sustentado para esse estigma de alto risco.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: E</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Vaso visível em úlcera péptica hemorrágica é estigma de alto risco que exige hemostasia endoscópica; nesse cenário, a adrenalina isolada é inferior e a alternativa correta é a que indica terapia combinada com métodos mecânicos e injeção.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Hemostasia endoscópica da úlcera péptica hemorrágica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre controle temporário com adrenalina e tratamento preferencial definitivo, além de induzir o erro de achar que IBP ou medidas de irrigação substituem hemostasia endoscópica em lesão de alto risco.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li style="margin-bottom:0.5rem">Se o enunciado trouxer vaso visível, pense em estigma de alto risco com indicação de hemostasia endoscópica ativa.</li><li style="margin-bottom:0.5rem">Não aceite adrenalina isolada como melhor estratégia para úlcera sangrante com alto risco de ressangramento.</li><li style="margin-bottom:0.5rem">IBP após o procedimento é adjuvante; não substitui a hemostasia endoscópica quando há vaso visível.</li><li style="margin-bottom:0.5rem">Dificuldade técnica de clipe em determinada topografia não equivale a contraindicação absoluta.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-8-OdPrl7
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2025'
        enunciado: 'Os sintomas referidos por pacientes com úlcera péptica não permitem diferenciar a forma duodenal da gástrica. Contudo, caso se suspeite de úlcera gástrica, uma das informações que pode ajudar é o relato de:'
        alternativas:
          - id: alt_A
            texto: dor abdominal pouco intensa
            comentario: Dor abdominal pouco intensa não diferencia úlcera gástrica de duodenal. A intensidade da dor tem baixa especificidade para definir a topografia da úlcera.
          - id: alt_B
            texto: manutenção da dor de forma rítmica
            comentario: Manutenção da dor de forma rítmica remete a padrão mais associado à úlcera duodenal. Não é pista típica de úlcera gástrica.
          - id: alt_C
            texto: piora da dor com ingestão de alimentos
            comentario: 'A alternativa C está correta porque descreve o achado clássico que favorece úlcera gástrica: piora da dor após a ingestão de alimentos. Esse é o dado semiológico mais útil entre as opções para a suspeita pedida no enunciado.'
          - id: alt_D
            texto: despertar noturno em função da dor abdominal
            comentario: Despertar noturno por dor abdominal favorece mais úlcera duodenal, em que a dor pode surgir horas após a refeição e durante a noite.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> A pista semiológica decisiva é a relação da dor com a alimentação: na úlcera gástrica, a ingestão alimentar pode precipitar ou agravar a dor, enquanto na úlcera duodenal a dor tende a melhorar temporariamente com a alimentação e pode ocorrer horas depois ou à noite; por isso, a alternativa correta é a que aponta piora da dor com alimentos.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Relação da dor com a alimentação</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a inversão do padrão clássico entre úlcera gástrica e duodenal: dor noturna e dor rítmica lembram úlcera péptica, mas apontam mais para a forma duodenal; para úlcera gástrica, a pista útil é a piora pós-prandial.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se a pergunta pedir pista para úlcera gástrica, procure a alternativa que relacione dor com piora após alimentação.</li><li>Dor aliviada por comida, dor tardia após refeição e dor noturna favorecem mais úlcera duodenal.</li><li>Não use intensidade da dor como critério para localizar a úlcera.</li><li>Em questões de semiologia ulcerosa, a relação temporal da dor com a refeição costuma ser o critério decisivo.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-9-zB2ylf
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: Qual das seguintes alternativas representa uma abordagem terapêutica apropriada para o tratamento de úlcera péptica associada à infecção por Helicobacter pylori?
        alternativas:
          - id: alt_A
            texto: Somente inibidores de bomba de prótons (IBPs).
          - id: alt_B
            texto: Apenas antiácidos.
          - id: alt_C
            texto: Terapia antibiótica em conjunto com inibidores de bomba de prótons.
          - id: alt_D
            texto: Terapia com corticosteroides.
          - id: alt_E
            texto: Terapia de suplementação com ferro.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkblue;"><strong>Tema central:</strong></span> manejo da <strong>úlcera péptica associada ao <em>Helicobacter pylori</em></strong>. A bactéria lesa a mucosa gástrica, altera a produção de ácido e compromete mecanismos de defesa; sem <u>erradicação bacteriana</u>, a úlcera <strong>recidiva</strong> frequentemente.</p>

          <p><span style="color:darkblue;"><strong>Gabarito:</strong> C – Terapia antibiótica em conjunto com IBP.</span> A conduta correta é <strong>erradicar o H. pylori</strong> com <u>antibióticos</u> e promover <u>supressão ácida</u> com IBP para cicatrização e aumento da eficácia antibiótica. Diretrizes internacionais (ACG 2024; Maastricht VI/Florence 2022) e consensos brasileiros recomendam <strong>regimes combinados por 10–14 dias</strong>.</p>

          <p><span style="color:darkorange;"><strong>Protocolos recomendados (exemplos):</strong></span><br>
          - <strong>Esquema quádruplo com bismuto:</strong> IBP + bismuto + tetraciclina + metronidazol por 10–14 dias (primeira linha em muitos cenários, sobretudo onde a resistência à claritromicina é alta).<br>
          - <strong>Esquema concomitante (não bismuto):</strong> IBP + amoxicilina + claritromicina + metronidazol por 10–14 dias.<br>
          - <em>Observação:</em> <strong>Tríplice com claritromicina</strong> (IBP + amoxicilina + claritromicina) só quando a resistência local à claritromicina é <u>baixa</u> e não houve uso prévio de macrolídeos.</p>

          <p><span style="color:darkorange;"><strong>Diagnóstico e follow-up (essenciais em provas):</strong></span> confirmar infecção por <em>H. pylori</em> por <u>teste respiratório da ureia</u>, <u>antígeno fecal</u> ou <u>biópsia com teste da urease</u>. <strong>Comprovar erradicação</strong> ≥4 semanas após antibióticos e ≥2 semanas sem IBP (evita falso-negativo).</p>

          <p><span style="color:darkblue;"><strong>Análise das alternativas incorretas:</strong></span><br>
          <strong>A – Somente IBPs:</strong> reduzem ácido e cicatrizam a úlcera, mas <u>não erradicam</u> o H. pylori; há alta <strong>recidiva</strong> após suspender o IBP.<br>
          <strong>B – Apenas antiácidos:</strong> alívio sintomático curto; não cicatrizam adequadamente nem tratam a infecção.<br>
          <strong>D – Corticosteroides:</strong> não tratam H. pylori e podem <u>aumentar risco de sangramento</u> e retardar cicatrização de úlceras, especialmente associados a AINEs.<br>
          <strong>E – Suplementação com ferro:</strong> pode corrigir anemia por perda crônica, mas <u>não trata</u> a úlcera por H. pylori; a prioridade é a <strong>erradicação</strong>.</p>

          <p><span style="color:darkorange;"><strong>Estratégia de prova:</strong></span> viu “<em>úlcera + H. pylori</em>”? Pense em <strong>“antibióticos + IBP por 10–14 dias + confirmação de erradicação”</strong>. Atenção à pegadinha da <u>claritromicina</u>: só use regimes com ela quando a resistência local for baixa.</p>

          <p><span style="color:darkblue;"><strong>Referências rápidas:</strong></span> ACG Clinical Guideline: Treatment of Helicobacter pylori Infection (2024); Maastricht VI/Florence Consensus Report (2022); UpToDate (H. pylori: treatment regimens); Harrison’s Principles of Internal Medicine; Consenso Brasileiro sobre H. pylori (SBG/SBCD).</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-10-g37uAY
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2025'
        enunciado: A úlcera péptica associada ao Helicobacter pylori é caracterizada por inflamação crônica da mucosa gástrica, frequentemente levando à recorrência se não tratada adequadamente. A erradicação da bactéria com terapia combinada de antibióticos é fundamental para a cura da lesão e a prevenção de novas ulcerações. Dadas as alternativas relacionadas ao manejo da úlcera péptica associada ao Helicobacter pylori, assinale a correta.
        alternativas:
          - id: alt_A
            texto: O uso isolado de inibidores da bomba de prótons é suficiente para erradicar o Helicobacter pylori em pacientes com úlcera péptica.
          - id: alt_B
            texto: A úlcera péptica causada pelo Helicobacter pylori é geralmente autolimitada e não requer intervenção medicamentosa.
          - id: alt_C
            texto: A terapia combinada com antibióticos e inibidores da bomba de prótons é eficaz na erradicação do Helicobacter pylori e na prevenção de recorrências.
          - id: alt_D
            texto: A erradicação do Helicobacter pylori com antibióticos é indicada apenas em casos de úlcera gástrica refratária ao tratamento sintomático.
          - id: alt_E
            texto: O Helicobacter pylori não está relacionado à recorrência de úlceras pépticas, sendo o tratamento direcionado apenas ao alívio dos sintomas.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>O tema central da questão é o <span style="color:darkorange;"><strong>manejo da úlcera péptica associada ao Helicobacter pylori</strong></span>. O <em>Helicobacter pylori</em> é uma bactéria que coloniza a mucosa gástrica e está implicada na patogênese de várias doenças gastrointestinais, incluindo úlceras pépticas. A erradicação da bactéria é crucial para a cura e prevenção de recorrências.</p>

          <p><span style="color:darkblue;"><strong>Alternativa correta: C</strong></span> - A terapia combinada com antibióticos e inibidores da bomba de prótons (IBPs) é eficaz na erradicação do <em>Helicobacter pylori</em> e na prevenção de recorrências. Esta abordagem é padronizada e recomendada por diretrizes internacionais, como as de Maastricht e da American College of Gastroenterology.</p>

          <p><strong>Justificativa:</strong> A combinação geralmente envolve um inibidor da bomba de prótons, como omeprazol, associado a dois antibióticos, frequentemente claritromicina e amoxicilina ou metronidazol. Os IBPs reduzem a acidez gástrica, melhorando a eficácia dos antibióticos e promovendo a cicatrização da mucosa.</p>

          <p><span style="color:darkorange;"><strong>Análise das alternativas incorretas:</strong></span></p>

          <p><strong>Alternativa A:</strong> O uso isolado de inibidores da bomba de prótons não é suficiente para erradicar o <em>Helicobacter pylori</em>. Embora os IBPs sejam eficazes na redução da acidez e no alívio dos sintomas, a erradicação do <em>H. pylori</em> requer o uso de antibióticos.</p>

          <p><strong>Alternativa B:</strong> A úlcera péptica causada pelo <em>Helicobacter pylori</em> não é autolimitada. Sem tratamento adequado, a infecção persiste, levando à recorrência e possível complicação da doença.</p>

          <p><strong>Alternativa D:</strong> A erradicação do <em>H. pylori</em> é indicada em todos os casos de úlcera péptica associada à bactéria, não apenas em casos refratários. O tratamento visa prevenir complicações e recorrências.</p>

          <p><strong>Alternativa E:</strong> O <em>Helicobacter pylori</em> está diretamente relacionado à recorrência de úlceras pépticas. A erradicação da bactéria é fundamental para o manejo da condição, e não se limita apenas ao alívio dos sintomas.</p>

          <p>É importante destacar que a compreensão do manejo adequado da úlcera péptica associada ao <em>Helicobacter pylori</em> é essencial para a prática clínica, prevenindo complicações a longo prazo.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-11-703JAU
        tags:
          - Comentário Oficial
          - Úlcera Peptica
          - '2024'
        enunciado: Um paciente consulta por sintomas de uma úlcera péptica sem complicações. Das manifestações clínicas abaixo, qual NÃO é compatível com o diagnóstico?
        alternativas:
          - id: alt_A
            texto: Dor epigástrica irradiada para o tórax.
          - id: alt_B
            texto: Azia.
          - id: alt_C
            texto: Dor aliviada pela alimentação.
          - id: alt_D
            texto: Hematêmese.
          - id: alt_E
            texto: Náusea.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:#0B2545;">Tema central:</b> A questão aborda as <span style="color:#CB5700;"><b>manifestações clínicas da úlcera péptica sem complicações</b></span>, exigindo do candidato conhecimento sobre sintomas típicos e sinais de gravidade.</p>

          <p><b style="color:#0B2545;">Justificativa da alternativa correta (D – Hematêmese):</b></p>
          <p>A <span style="color:#CB5700;"><b>hematêmese</b></span> refere-se ao vômito com sangue e indica <u>hemorragia digestiva alta</u>. Isso ocorre quando há erosão de vaso sanguíneo na parede gástrica ou duodenal. <b>Segundo o protocolo da Federação Brasileira de Gastroenterologia:</b> "Úlcera péptica sem complicações apresenta sintomas <u>discretos e localizados</u>; a presença de vômitos com sangue aponta necessariamente para úlcera complicada por sangramento." <br>
          Assim, hematêmese <b>NÃO</b> é manifestação de úlcera simples, mas de <span style="color:#CB5700;">complicação</span>.</p>

          <p><b style="color:#0B2545;">Análise das alternativas incorretas:</b></p>

          <p><b style="color:#CB5700;">A) Dor epigástrica irradiada para o tórax:</b> Sintoma clássico da úlcera péptica, frequentemente localizado no epigástrio, podendo, em alguns casos, irradiar-se discreta e vagamente para o tórax. Não indica complicação.</p>

          <p><b style="color:#CB5700;">B) Azia:</b> Queimação retroesternal é comum nos distúrbios gástricos, inclusive úlceras, devido ao contato do ácido com a mucosa.</p>

          <p><b style="color:#CB5700;">C) Dor aliviada pela alimentação:</b> <b>Característico da úlcera duodenal</b>, pois a alimentação neutraliza temporariamente o ácido, oferecendo alívio.</p>

          <p><b style="color:#CB5700;">E) Náusea:</b> Pode ocorrer em úlceras por disfunção gástrica e irritação da mucosa, sem, obrigatoriamente, indicar complicação.</p>

          <p><b style="color:#0B2545;">Dicas importantes para questões de concursos:</b></p>
          <p>- <b>Atente-se a termos-chaves</b> como “sem complicações”, pois a presença de <u>hematêmese</u> muda o cenário clínico totalmente.<br>
          - Sintomas graves (como vômitos com sangue, melena, perda de peso rápida) apontam para complicações e excluem quadros simples.</p>

          <p><b style="color:#0B2545;">Diretrizes e referências:</b><br>
          Segundo o livro <b>Harrison – Medicina Interna</b> (20ª edição, cap. 317): “Úlceras não complicadas apresentam-se com dor epigástrica, náuseas, azia e alívio pós-alimentar; sangramento manifesta-se por hematêmese, sugerindo complicação.”<br>
          “Protocolo de Diagnóstico e Tratamento de Úlcera Péptica do Ministério da Saúde (2019, p. 16): ‘Hematêmese ocorre nas úlceras complicadas por sangramento, não sendo manifestação típica do quadro simples.’”</p>

          <p><b style="color:#CB5700;">Resumo estratégico:</b> Em provas, oriente-se pela gravidade: <span style="color:#0B2545;"><b>sintomas leves = úlcera não complicada; sinais de alarme = úlcera complicada</b></span>.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            Para responder a essa questão, é fundamental entender as manifestações clínicas típicas da úlcera péptica. A úlcera péptica é uma lesão na mucosa do estômago ou no duodeno que frequentemente causa dor epigástrica. Essa dor pode irradiar para o tórax (A), ser acompanhada de azia (B) e geralmente é aliviada pela alimentação (C), pois o alimento pode neutralizar temporariamente o ácido gástrico. Náusea (E) também é um sintoma comum em úlcera péptica. No entanto, a hematêmese, que é o vômito de sangue, sugere uma complicação mais grave, como uma úlcera sangrante. Portanto, a alternativa D não é compatível com o diagnóstico de uma úlcera péptica sem complicações, confirmando que a resposta correta é a alternativa D.
          </div>

