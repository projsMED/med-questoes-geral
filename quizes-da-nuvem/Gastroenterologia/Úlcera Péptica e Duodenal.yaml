        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Para resolver essa questão, é importante compreender o manejo de uma úlcera péptica gástrica com sangramento ativo, especialmente em um paciente que está estável hemodinamicamente.</p>

          <p>A alternativa <span style="color: darkorange;"><strong>D - Injeção de epinefrina</strong></span> é a correta.</p>

          <p><strong>Justificativa:</strong> A injeção de epinefrina é uma técnica comum e de primeira linha para o controle do sangramento em úlceras pépticas. A epinefrina age como um agente vasoconstritor, reduzindo o sangramento ao diminuir o fluxo sanguíneo no local da úlcera. Este procedimento é realizado endoscopicamente, sendo eficaz e geralmente disponível em unidades de saúde.</p>

          <p><strong>Análise das alternativas incorretas:</strong></p>

          <p><span style="color: darkblue;"><strong>A - Lavagem gástrica:</strong></span> Este procedimento é utilizado para remover sangue e coágulos do estômago, mas não controla diretamente o sangramento ativo.</p>

          <p><span style="color: darkblue;"><strong>B - Gastrectomia parcial:</strong></span> Trata-se de uma cirurgia invasiva e não é considerada como primeira escolha para controle de sangramento ativo em um paciente estável.</p>

          <p><span style="color: darkblue;"><strong>C - Compressão com gaze:</strong></span> Compressão com gaze não é viável para úlceras gástricas, pois não há como alcançar o local do sangramento desta forma.</p>

          <p><span style="color: darkblue;"><strong>E - Colocação de prótese gástrica:</strong></span> Este procedimento é utilizado para outras condições, como obstruções, e não para controle imediato de sangramento.</p>

          <p>Ao entender o papel da epinefrina no manejo de úlceras sangrantes, fica claro por que a alternativa D é a escolha correta. Em concursos, procurar sempre associar a alternativa correta com o procedimento mais efetivo e de primeira linha pode ajudar a eliminar respostas erradas.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (1 like):</b>

            <strong>⚕️QUESTÃO SOBRE ÚLCERA PÉPTICA GÁSTRICA COM SANGRAMENTO</strong>

            <strong>✅ALTERNATIVA CORRETA: [D] Injeção de epinefrina</strong>

            ✏️JUSTIFICATIVA.

            O <strong>controle do sangramento ativo</strong> em pacientes com úlcera péptica gástrica deve ser feito inicialmente de forma endoscópica. A <strong>injeção de epinefrina</strong> é um procedimento eficaz para <strong>controlar o sangramento</strong> ao causar vasoconstrição local. A epinefrina também é utilizada para promover o tamponamento do vaso sanguíneo e ajudar na hemostasia. Isso é recomendado em casos de sangramento ativo, especialmente quando o paciente está estável hemodinamicamente, como no caso descrito.

            ⚠️ANÁLISE DAS DEMAIS ALTERNATIVAS

            ❌ [A]: A lavagem gástrica pode ser útil para remover sangue visível no estômago, mas não é um método eficaz para <strong>controlar o sangramento ativo</strong>.

            ❌ [B]: A gastrectomia parcial é um procedimento cirúrgico de última linha, indicado para casos complicados de úlceras pépticas, geralmente em pacientes com sangramentos refratários a tratamentos endoscópicos. Não é a primeira escolha.

            ❌ [C]: A compressão com gaze pode ser utilizada em alguns casos, mas não é uma abordagem efetiva no controle de <strong>sangramento ativo</strong> de úlceras gástricas.

            ❌ [E]: A colocação de prótese gástrica é indicada para outras condições, como obstrução, e não é um procedimento de escolha para controle de <strong>sangramento ativo</strong>.

            ⏳RESUMO: A <strong>injeção de epinefrina</strong> é o tratamento endoscópico de primeira escolha para <strong>controle de sangramentos ativos</strong> em úlceras pépticas gástricas estáveis hemodinamicamente.

            ‼️PONTOS CHAVE

            ◊ A injeção de epinefrina é eficaz na <strong>hemostasia de úlceras pépticas sangrantes</strong>.

            ◊ Procedimentos endoscópicos são de <strong>primeira escolha</strong> para o controle do sangramento em úlceras pépticas.

            ◊ A lavagem gástrica não resolve o problema do sangramento ativo.

            ◊ A gastrectomia parcial e a colocação de prótese gástrica são opções de tratamento para complicações graves, não sendo adequadas para casos iniciais de sangramento.
          </div>

