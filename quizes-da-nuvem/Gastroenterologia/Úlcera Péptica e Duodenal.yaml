    conteudo:
      - tipo: ME
        id: 131026-0258-1-ercN5a
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: Qual opção cirúrgica tem menor recidiva da úlcera duodenal e é mais eficaz na redução da secreção ácida?
        alternativas:
          - id: alt_A
            texto: Gastrectomia subtotal.
            comentario: Gastrectomia subtotal não é a opção que melhor atende ao critério cobrado de menor recidiva e maior supressão ácida entre as técnicas clássicas listadas. A base destaca que o melhor resultado comparativo depende da combinação de forte redução do estímulo vagal com retirada do antro gastrinosecretor, o que é mais bem representado pela vagotomia troncular com antrectomia.
          - id: alt_B
            texto: Vagotomia troncular com cirurgia de Heineke-Mikulicz.
            comentario: Vagotomia troncular com Heineke-Mikulicz é vagotomia associada a drenagem. A piloroplastia de Heineke-Mikulicz tem papel de esvaziamento gástrico, não de supressão ácida relevante. Assim, essa combinação reduz menos a secreção ácida do que a vagotomia troncular com antrectomia e, por manter o antro produtor de gastrina, apresenta maior recidiva ulcerosa.
          - id: alt_C
            texto: Vagotomia superseletiva com cirurgia de Heineke-Mikulicz.
            comentario: A vagotomia superseletiva é menos radical do ponto de vista anti-secretor do que a vagotomia troncular com antrectomia, porque preserva estruturas antrais/pilóricas e não remove o antro gastrinosecretor. Associar Heineke-Mikulicz não corrige essa limitação, já que drenagem não substitui o efeito da antrectomia sobre a gastrina. Por isso, a recidiva é maior.
          - id: alt_D
            texto: Vagotomia troncular com antrectomia.
            comentario: A vagotomia troncular com antrectomia é a alternativa com maior potência anti-secretora entre as listadas. A vagotomia troncular reduz o estímulo neural colinérgico para secreção ácida, e a antrectomia remove a principal fonte de gastrina. Como a recidiva da úlcera duodenal se relaciona à persistência de secreção ácida, a soma desses dois mecanismos produz a menor recorrência ulcerosa nessa comparação clássica.
          - id: alt_E
            texto: Vagotomia superseletiva.
            comentario: A vagotomia superseletiva isolada preserva o antro, mantendo fonte hormonal relevante para estímulo ácido. Embora reduza a acidez, sua potência anti-secretora é menor que a da associação com antrectomia, e classicamente a taxa de recorrência ulcerosa é superior. Portanto, não atende ao pedido de menor recidiva com maior redução da secreção ácida.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: D</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O critério decisivo é a comparação entre as técnicas clássicas quanto à supressão da secreção ácida e à recidiva da úlcera duodenal; entre as opções listadas, a vagotomia troncular com antrectomia é a que oferece maior efeito anti-secretor e menor recorrência.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Cirurgia antiulcerosa clássica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre procedimento de drenagem e procedimento anti-secretor: Heineke-Mikulicz melhora o esvaziamento, mas não reduz a secreção ácida como a retirada do antro. Também induz erro ao fazer parecer que a vagotomia superseletiva, por ser mais seletiva, teria menor recidiva.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Quando a pergunta cobrar menor recidiva da úlcera duodenal, procure a técnica com maior supressão ácida global.</li><li>Separe mentalmente drenagem de efeito anti-secretor: piloroplastia resolve esvaziamento, não substitui antrectomia.</li><li>Valorize o papel do antro na secreção ácida: retirar o antro reduz gastrina e muda o resultado da comparação.</li><li>Entre vagotomias clássicas, a associação com antrectomia é mais potente do que vagotomia isolada ou vagotomia com drenagem.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-2-e7xh6X
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: Quais são as alterações da mucosa gastroduodenal que favorecem o surgimento de úlcera duodenal em pacientes com infecção por Helicobacter pylori?
        alternativas:
          - id: alt_A
            texto: Metaplasia gástrica no bulbo duodenal e pangastrite atrófica.
            comentario: Erra no componente gástrico. Metaplasia gástrica no bulbo duodenal é compatível com o mecanismo da úlcera duodenal, mas pangastrite atrófica não é o padrão gástrico típico desse fenótipo. Pangastrite atrófica se relaciona mais a atrofia glandular e hipocloridria, enquanto a úlcera duodenal por H. pylori se associa a gastrite crônica antral predominante e maior carga ácida.
          - id: alt_B
            texto: Metaplasia intestinal no antro gástrico e gastrite crônica antral.
            comentario: Erra na alteração metaplásica relevante. Gastrite crônica antral é compatível com úlcera duodenal, mas metaplasia intestinal no antro gástrico não é a lesão-chave desse mecanismo. O achado decisivo no duodeno é metaplasia gástrica no bulbo, porque é ela que permite colonização local pelo H. pylori e favorece duodenite e ulceração.
          - id: alt_C
            texto: Metaplasia gástrica no bulbo duodenal e gastrite crônica antral.
            comentario: A alternativa C reúne os dois elementos mucosos centrais desse mecanismo. No estômago, o padrão associado à úlcera duodenal é a gastrite crônica antral predominante, que favorece hipercloridria relativa. No duodeno, essa maior exposição ao ácido induz metaplasia gástrica no bulbo duodenal; como o H. pylori coloniza epitélio de tipo gástrico, essa metaplasia permite inflamação local e favorece a ulceração. Essa é a combinação fisiopatológica clássica cobrada.
          - id: alt_D
            texto: Metaplasia intestinal no antro gástrico e duodenite atrófica.
            comentario: Erra nos dois componentes. Metaplasia intestinal no antro gástrico não corresponde à alteração mucosa típica que explica úlcera duodenal por H. pylori, e duodenite atrófica também não é a lesão duodenal clássica cobrada. O mecanismo esperado exige gastrite crônica antral associada a metaplasia gástrica no bulbo duodenal.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> A fisiopatologia clássica da úlcera duodenal por H. pylori é gastrite crônica predominantemente antral associada à metaplasia gástrica no bulbo duodenal; essa combinação favorece colonização do epitélio metaplásico e ulceração, o que torna correta a alternativa C.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Úlcera duodenal por H. pylori</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca troca a metaplasia gástrica duodenal, que participa diretamente da fisiopatologia da úlcera duodenal, por metaplasia intestinal gástrica e por pangastrite atrófica, que pertencem a outro padrão de lesão crônica por H. pylori.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Na úlcera duodenal por H. pylori, procure a dupla: gastrite crônica antral predominante + metaplasia gástrica no bulbo duodenal.</li><li>Diferencie metaplasia gástrica duodenal de metaplasia intestinal gástrica: a primeira entra no mecanismo da úlcera duodenal; a segunda se liga a lesão crônica atrófica/carcinogênese.</li><li>Se a alternativa trouxer pangastrite atrófica, pense em padrão de atrofia e hipocloridria, não no fenótipo clássico da úlcera duodenal por H. pylori.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-3-pmiepq
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: 'Paciente de 12 anos apresenta dor epigástrica noturna e anemia ferropriva. Endoscopia mostra úlcera duodenal. Nesse caso, o fator etiológico CORRETAMENTE associado em pediatria é:'
        alternativas:
          - id: alt_A
            texto: Uso crônico de corticoides.
            comentario: Uso crônico de corticoides, de forma isolada, não é causa etiológica clássica de úlcera duodenal em pediatria. A confusão comum é misturar corticoide com fármacos sabidamente ulcerogênicos, como AINEs. Corticoides podem participar de risco gastrointestinal em contextos específicos, mas não sustentam a melhor associação etiológica neste cenário.
          - id: alt_B
            texto: Infecção por Helicobacter pylori.
            comentario: 'Helicobacter pylori é fator etiológico estabelecido para úlcera duodenal em crianças e adolescentes. O fundamento médico é fisiopatológico: a infecção, especialmente com predomínio antral, favorece aumento da secreção ácida e dano duodenal, criando o nexo causal reconhecido com doença ulcerosa péptica nessa topografia. A dor epigástrica noturna é compatível com esse padrão, e o achado decisivo do caso é a úlcera duodenal documentada à endoscopia.'
          - id: alt_C
            texto: Dieta rica em ultraprocessados.
            comentario: Dieta rica em ultraprocessados não tem nexo causal clássico e reconhecido com formação de úlcera duodenal. Pode haver relação com sintomas dispépticos ou hábitos alimentares inadequados, mas isso não equivale a etiologia de doença ulcerosa péptica documentada por endoscopia.
          - id: alt_D
            texto: Deficiência de vitamina D.
            comentario: Deficiência de vitamina D não é causa etiológica reconhecida de úlcera duodenal em pediatria. Falta mecanismo fisiopatológico estabelecido, dentro da base fornecida, que conecte essa deficiência à formação de úlcera péptica duodenal.
          - id: alt_E
            texto: Estresse escolar prolongado.
            comentario: Estresse escolar prolongado não é etiologia clássica de úlcera duodenal. A exclusão aqui depende de diferenciar estresse emocional crônico do conceito de úlcera de estresse em contexto de doença crítica, que é outra entidade e não corresponde ao caso descrito.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Em pediatria, úlcera duodenal com dor epigástrica noturna é compatível com doença ulcerosa péptica, cuja associação etiológica clássica e mais correta é infecção por Helicobacter pylori; esse nexo define a alternativa B.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Etiologia da úlcera duodenal pediátrica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a troca indevida entre causas orgânicas comprovadas de úlcera duodenal e associações populares ou inespecíficas, sobretudo confundir H. pylori com corticoide ou com estresse emocional.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se o enunciado trouxer úlcera duodenal documentada em criança ou adolescente, pense primeiro em H. pylori quando não houver outra causa secundária específica mencionada.</li><li>Dor epigástrica noturna reforça padrão ulceroso duodenal, mas o dado que define a etiologia na prova é a topografia da lesão.</li><li>Não use anemia ferropriva como critério principal de etiologia; ela pode coexistir, mas não substitui o valor diagnóstico da endoscopia.</li><li>Separe fatores que pioram sintomas digestivos de causas etiológicas clássicas de úlcera péptica.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-4-y3h1Be
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2026'
        enunciado: 'Um paciente de 58 anos, tabagista, apresenta hematêmese volumosa. Endoscopia mostra úlcera duodenal sangrante com vaso visível. Assinale CORRETAMENTE a conduta endoscópica considerada padrão nesse caso:'
        alternativas:
          - id: alt_A
            texto: Injeção de solução salina simples no leito da úlcera.
            comentario: Injeção de solução salina simples isolada não é hemostasia definitiva para úlcera com vaso visível. O efeito é apenas compressivo e transitório, inferior ao tratamento mecânico direto do vaso responsável pelo sangramento.
          - id: alt_B
            texto: Lavagem abundante com soro fisiológico e observação.
            comentario: Lavagem com soro e observação não tratam um estigma endoscópico de alto risco. Vaso visível não é achado de baixo risco para conduta expectante; exige intervenção hemostática.
          - id: alt_C
            texto: Administração endovenosa de IBP antes da endoscopia.
            comentario: IBP endovenoso pode ser medida adjuvante na hemorragia digestiva alta por úlcera, mas a questão pede a conduta endoscópica padrão. Além disso, IBP isoladamente não substitui o tratamento local de uma úlcera com vaso visível.
          - id: alt_D
            texto: Suspender o exame e encaminhar diretamente para cirurgia.
            comentario: Cirurgia não é a primeira conduta quando a lesão está identificada à endoscopia e é passível de hemostasia endoscópica. Ela fica reservada para falha do controle endoscópico, ressangramento refratário ou impossibilidade de tratamento endoscópico.
          - id: alt_E
            texto: Aplicação de clipes hemostáticos sobre o vaso identificado.
            comentario: A alternativa E está correta porque o clipe hemostático atua diretamente sobre o vaso visível, produzindo hemostasia mecânica local e definitiva no foco hemorrágico. Em úlcera péptica com vaso visível, esse é um método endoscópico padrão e efetivo, ao contrário de medidas apenas temporárias ou adjuvantes.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: E</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O achado decisivo é o vaso visível na úlcera duodenal, estigma endoscópico de alto risco de ressangramento que exige hemostasia endoscópica ativa; como a terapia deve tratar diretamente o vaso culpado, a clipagem hemostática é a conduta padrão entre as alternativas.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Hemostasia endoscópica na úlcera</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca mistura medidas acessórias ou insuficientes com a conduta endoscópica definitiva: vaso visível não se maneja com observação, salina simples isolada nem apenas IBP, e a gravidade do sangramento não torna cirurgia a primeira escolha se a hemostasia endoscópica é factível.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se a endoscopia mostra vaso visível em úlcera péptica, classifique como lesão de alto risco e procure uma terapia hemostática ativa.</li><li>Diferencie medida adjuvante de tratamento definitivo: IBP ajuda, mas não substitui hemostasia endoscópica quando há vaso visível.</li><li>Elimine opções que apenas limpam ou observam a lesão quando o achado endoscópico já indica necessidade de tratar o vaso.</li><li>Quando houver método mecânico tratando diretamente o vaso identificado, ele supera alternativas temporárias como salina simples isolada.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-5-o0yHRO
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: Para um paciente de 54 anos que apresenta perfuração de úlcera duodenal e peritonite difusa há 6 horas, qual deve ser a opção cirúrgica de controle do quadro agudo?
        alternativas:
          - id: alt_A
            texto: Gastrectomia subtotal com reconstrução Billroth II.
            comentario: Gastrectomia subtotal com reconstrução Billroth II é procedimento ressectivo de maior porte, voltado a tratamento definitivo da doença ulcerosa, e não a opção padrão de controle imediato da perfuração duodenal aguda descrita. O erro está em substituir a cirurgia de controle do evento agudo por cirurgia definitiva mais extensa.
          - id: alt_B
            texto: Vagotomia troncular e antrectomia de urgência.
            comentario: 'Vagotomia troncular e antrectomia de urgência também representam cirurgia definitiva para doença ulcerosa, mais extensa, e não a escolha de rotina para úlcera duodenal perfurada com poucas horas de evolução e necessidade de controle imediato da perfuração e da peritonite. O critério excludente é o mesmo: confusão entre tratamento definitivo e conduta inicial padrão de urgência.'
          - id: alt_C
            texto: Sutura simples com omentopexia (técnica de Graham/“patch”).
            comentario: A alternativa C é a adequada porque corresponde ao fechamento da perfuração com reforço omental, medida cirúrgica indicada para controlar imediatamente a perfuração e a contaminação peritoneal no quadro agudo descrito. O enunciado não pede cirurgia definitiva da doença ulcerosa, mas sim a conduta de urgência para conter a complicação.
          - id: alt_D
            texto: Vagotomia superseletiva isolada.
            comentario: 'Vagotomia superseletiva isolada é insuficiente porque não fecha a perfuração já existente nem controla adequadamente a peritonite difusa. A alternativa é eliminada por não atender ao requisito mínimo do caso: controle efetivo da perfuração e da contaminação abdominal.'
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Na perfuração aguda de úlcera duodenal com peritonite difusa de curta evolução, a conduta operatória clássica de controle do quadro agudo é o fechamento da perfuração com sutura simples associada a omentopexia (patch de Graham).</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Perfuração duodenal aguda</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explorou a confusão entre o tratamento cirúrgico do evento agudo e as cirurgias definitivas da doença ulcerosa péptica; quem focou na úlcera como doença, e não na perfuração com peritonite como urgência, tende a errar.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Identifique se a pergunta quer controle imediato da urgência ou tratamento definitivo da doença de base.</li><li>Em perfuração duodenal aguda com peritonite de curta evolução, procure a opção que feche a perfuração e controle a contaminação.</li><li>Desconfie de procedimentos ressectivos ou vagotomias extensas quando o enunciado descreve quadro agudo típico de urgência.</li><li>Elimine alternativas que não resolvem o defeito anatômico principal do caso, isto é, a perfuração.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 131026-0258-6-k63SIU
        tags:
          - Comentário Oficial
          - Úlcera duodenal
          - '2025'
        enunciado: |-
          Paciente, 35 anos, chega à emergência após episódio de hematêmese e melena. Endoscopia digestiva alta revela úlcera duodenal com sangramento ativo em gotejamento.
          A classificação de Forrest para esse paciente é
        alternativas:
          - id: alt_A
            texto: Forrest IA.
            comentario: Forrest IA exige sangramento ativo em jato. O enunciado descreve gotejamento, que corresponde a Forrest IB.
          - id: alt_B
            texto: Forrest IB.
            comentario: A alternativa B está correta porque Forrest IB é definido por sangramento ativo em gotejamento/oozing à endoscopia. O caso descreve exatamente esse achado, que classifica a lesão como Forrest IB.
          - id: alt_C
            texto: Forrest 2A.
            comentario: Forrest IIA corresponde a vaso visível não sangrante. Isso não condiz com o achado de sangramento ativo descrito na endoscopia.
          - id: alt_D
            texto: Forrest 2B.
            comentario: Forrest IIB corresponde a coágulo aderido, e não a sangramento ativo em gotejamento.
          - id: alt_E
            texto: Forrest 2C.
            comentario: Forrest IIC corresponde a mancha plana hematínica, um estigma de sangramento recente sem atividade atual.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Na classificação de Forrest para hemorragia de úlcera péptica, sangramento ativo em gotejamento/oozing corresponde a Forrest IB; sangramento ativo em jato corresponde a Forrest IA. Como o enunciado descreve sangramento ativo em gotejamento, o gabarito é B.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Classificação de Forrest em úlcera péptica hemorrágica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a diferença entre os subtipos de sangramento ativo na classificação de Forrest: jato define IA e gotejamento/oozing define IB. Outra armadilha é usar a hematêmese e a melena para classificar Forrest, quando o que decide é o achado endoscópico.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Na classificação de Forrest, primeiro identifique se há sangramento ativo ou estigma de sangramento recente.</li><li>Dentro de Forrest I, sangramento em jato é IA e sangramento em gotejamento/oozing é IB.</li><li>A classificação depende do aspecto endoscópico descrito, não apenas da apresentação clínica.</li></ul></div></div>
          </div>

