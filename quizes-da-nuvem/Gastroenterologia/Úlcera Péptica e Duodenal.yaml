        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:#003366;">Tema central:</b> Úlcera péptica é uma lesão que ultrapassa a mucosa do estômago ou duodeno, alcançando a submucosa. As duas principais causas são <u>infecção por</u> <b style="color:#FF8C00;">Helicobacter pylori</b> e <u>uso de AINEs</u>. Reconhecer a associação com agente infeccioso é chave em provas.</p>

          <p><b style="color:#003366;">Alternativa correta: C — <span style="color:#FF8C00;">Helicobacter pylori</span></b></p>
          <p><b>Justificativa:</b> <i>H. pylori</i> é uma bactéria gram-negativa, espiralada, <u>urease-positiva</u>, que coloniza o antro gástrico. A urease alcaliniza o microambiente, permitindo a sobrevivência bacteriana e desencadeando inflamação crônica, aumento de secreção ácida (duodenal) e/ou redução das defesas da mucosa (gástrica), levando à úlcera. Está presente em grande parcela das úlceras duodenais e de muitas gástricas. Também se associa a gastrite crônica, linfoma MALT e adenocarcinoma gástrico. Referências: ACG Guideline for H. pylori (2022), UpToDate, Harrison’s.</p>

          <p><b style="color:#003366;">Como reconhecer em provas:</b> Diante de “úlcera péptica” + “infecção”, pense automaticamente em <b style="color:#FF8C00;">H. pylori</b>. Lembre que AINEs são a outra grande causa, porém não infecciosa.</p>

          <p><b style="color:#003366;">Diagnóstico (quando cobrado):</b> Testes não invasivos: <u>teste respiratório da ureia</u> e <u>antígeno fecal</u> (evitar IBP 2 semanas antes; ATB 4 semanas antes). Endoscopia com biópsia/urease/HP histológico é indicada em sinais de alarme ou idade avançada. Confirmar erradicação após tratamento. (ACG/UpToDate)</p>

          <p><b style="color:#003366;">Tratamento (essencial para memorização):</b> Esquema preferido: <u>quadruplo com bismuto por 14 dias</u> (IBP + bismuto + tetraciclina + metronidazol). Alternativas: concomitante (IBP + claritromicina + amoxicilina + metronidazol) por 14 dias. Evitar tripla com claritromicina onde houver alta resistência. Sempre reavaliar erradicação.</p>

          <p><b style="color:#003366;">Análise das incorretas:</b></p>
          <ul>
          <li><b><i>Streptococcus pneumoniae</i></b>: causa pneumonia, otite, meningite. Não está implicado em úlcera péptica.</li>
          <li><b><i>Escherichia coli</i></b>: associada a ITU e diarreia do viajante; não causa úlcera péptica.</li>
          <li><b><i>Candida albicans</i></b>: pode causar esofagite em imunossuprimidos, mas não é causa típica de úlcera péptica gástrica/duodenal.</li>
          <li><b><i>Vibrio cholerae</i></b>: provoca diarreia secretória aquosa (cólera), sem ulcerar mucosa.</li>
          </ul>

          <p><b style="color:#003366;">Pegadinhas:</b> Microrganismos entéricos comuns (E. coli, V. cholerae) geram diarreia, não úlcera; patógenos respiratórios (S. pneumoniae) e fungos (Candida) desviam a atenção. Associe “úlcera + infecção” a <b style="color:#FF8C00;">H. pylori</b>.</p>

          <p><b style="color:#003366;">Gabarito:</b> <b style="color:#FF8C00;">C) Helicobacter pylori</b></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 131026-0258-7-BQOu04
        tags:
