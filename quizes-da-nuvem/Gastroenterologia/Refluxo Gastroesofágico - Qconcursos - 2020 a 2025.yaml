            <p><span style="color:darkorange;"><b>Tema central:</b></span> A questão aborda os <b>distúrbios motores do esôfago</b> e a <b>doença do refluxo gastroesofágico (DRGE)</b>, conceitos fundamentais em Gastroenterologia para o entendimento de sintomas como disfagia e dor torácica, além do risco de complicações como a esofagite erosiva.</p>

          <p><span style="color:navy;"><b>Justificativa da alternativa correta (D):</b></span></p>

          <p>Na análise das afirmativas, observamos que <b>apenas duas</b> delas estão corretas. O êxito na resolução da questão exige cuidado com <u>termos técnicos</u> e reconhecimento das formas típicas de apresentação das doenças esofágicas.</p>

          <p><span style="color:darkorange;"><b>Afirmativa I – INCORRETA:</b></span> Os distúrbios motores primários do esôfago, como acalasia e espasmo esofágico difuso, geram <b>disfagia funcional e dor torácica</b>. Contudo, trata-se classicamente de <u>dor torácica não cardíaca</u> (ou esofágica), ou seja, de origem esofágica e não relacionada ao coração. A afirmação erra ao dizer "dor torácica <b>cardíaca</b>", pegadinha frequentemente usada para testar atenção do candidato. Segundo o <b>Harrison’s Principles of Internal Medicine</b> (20ª ed., Cap. 355), “a dor torácica de origem esofágica é clinicamente indistinguível da cardíaca, mas não possui relação com isquemia miocárdica.”</p>

          <p><span style="color:navy;"><b>Afirmativa II – CORRETA:</b></span> A <b>esofagite erosiva</b> pode ocasionar <u>úlceras e até sangramento esofágico</u>, ainda que tal relação não seja completamente conclusiva. Esse risco é maior quando há comprometimento da mucosa, como citado no <b>PCDT de DRGE</b> do Ministério da Saúde (2022): “Casos graves podem evoluir para hemorragia digestiva.” A expressão “embora não de forma conclusiva” demonstra atualização e precisão científica.</p>

          <p><span style="color:darkorange;"><b>Afirmativa III – CORRETA:</b></span> A <b>DRGE</b> é multifatorial, e envolve <u>distúrbios motores associados</u>, como alterações na pressão do esfíncter esofágico inferior e motilidade do corpo esofágico, segundo o <b>Consenso Brasileiro de DRGE</b> e <b>World Gastroenterology Organisation</b>: “os distúrbios motores esofágicos estão frequentemente presentes em pacientes com DRGE”.</p>

          <p><b>Análise das alternativas:</b></p>
          <ul>
          <li><b>A</b>: Incorreta – <i>Nem todas</i> as afirmativas estão corretas.</li>
          <li><b>B</b>: Incorreta – <i>Pelo menos duas</i> estão corretas.</li>
          <li><b>C</b>: Incorreta – <i>DUAS</i> estão corretas, não apenas uma.</li>
          <li><span style="color:navy;"><b>D</b></span>: Correta – <b>Apenas II e III estão corretas</b>.</li>
          </ul>

          <p><b>Estrategicamente</b>, fique atento a erros sutis na terminologia (como “cardíaca” versus “não cardíaca”), elementos frequentes em provas.</p>
