          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A alternativa correta é a B - III e IV, apenas. A doença do Refluxo Gastroesofágico (RGE) é mais comum em adultos e pode causar sintomas como azia, regurgitação e dor no peito. No entanto, a ausência desses sintomas não significa que o paciente não tenha RGE. Por isso, a afirmativa III está correta. Já a afirmativa IV também está correta, pois ao tratar a RGE com medicamentos antiácidos, pode haver a redução na absorção de nutrientes, o que pode levar à anemia e à osteoporose em idosos. Portanto, é importante investigar essas condições antes de prescrever o tratamento antiácido. As afirmativas I e II estão incorretas, pois a endoscopia digestiva alta não é o teste padrão-ouro para diagnóstico de RGE e a presença de regurgitação não necessariamente indica uma hérnia hiatal.
          </div>

      - tipo: ME
        id: 121026-1655-28-52aOGX
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Analise as afirmativas abaixo e dê valores Verdadeiro (V) ou Falso (F).

          ( ) São considerados alguns fatores de risco para a Doença do Refluxo Gastroesofágico (DRGE): gênero feminino, gravidez, tabagismo e obesidade.
          ( ) A estenose péptica é uma complicação da DRGE.
          ( ) São condições que aumentam a ocorrência da DRGE: hipermotilidade esofágica, hipertensão do esfíncter esofagiano inferior (EEI), hérnia de hiato e aumento do clearence esofágico.
          ( ) O Stretta é um procedimento endoscópico adequado para pacientes com DRGE com 18 anos ou mais, que tem hérnia de hiato maior que 3 cm e pressão do EEI menor que 5 mmHg.

          Assinale a alternativa que apresenta a sequência correta de cima para baixo.
        alternativas:
          - id: alt_A
            texto: F - V - V - F
          - id: alt_B
            texto: F - F - V - F
          - id: alt_C
            texto: V - V - F - F
          - id: alt_D
            texto: F - V - F - F
          - id: alt_E
            texto: F - V - F - V
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange;"><b>Tema central:</b></span> O foco da questão é a compreensão dos <b>fatores de risco, complicações e indicações terapêuticas da Doença do Refluxo Gastroesofágico (DRGE)</b>, tema clássico em provas de Endoscopia e Gastroenterologia.</p>

          <p><span style="color:darkblue;"><b>Análise detalhada das afirmativas:</b></span></p>

          <p><b>1ª afirmativa – <span style="color:darkorange;">Falsa</span></b>: Embora <b>obesidade, tabagismo e gravidez</b> sejam fatores de risco bem estabelecidos para DRGE (“A obesidade e o tabagismo são reconhecidos como fatores de risco... a gravidez também pode predispor ao refluxo” – Projeto Diretrizes AMB/CFM), o <b>gênero feminino isoladamente não é considerado fator de risco</b> clássico. Esta é uma pegadinha frequente nas provas! Fique atento para, ao ler listas de fatores de risco, conferir rigor científico a cada elemento citado.</p>

          <p><b>2ª afirmativa – <span style="color:darkblue;">Verdadeira</span></b>: A <b>estenose péptica</b> é complicação clássica da DRGE, decorrente de inflamação crônica e cicatrização esofágica. Segundo o Projeto Diretrizes da AMB/CFM: “A esofagite péptica pode evoluir para estenose”. Portanto, está correta.</p>

          <p><b>3ª afirmativa – <span style="color:darkorange;">Falsa</span></b>: <b>Hipermotilidade esofágica</b> e <b>hipertensão do EEI</b> NÃO aumentam a DRGE, pois são mecanismos de proteção. <b>Hérnia de hiato</b> é fator de risco verdadeiro, mas <b>aumento do clearance esofágico</b> protege, ao diminuir o tempo de contato do ácido (pegadinha recorrente, pois muitos alunos associam “aumento” com “pior prognóstico”).</p>

          <p><b>4ª afirmativa – <span style="color:darkorange;">Falsa</span></b>: O procedimento endoscópico <b>Stretta</b> está <u>contraindicado</u> em casos de hérnia de hiato maior que 3 cm e EEI menor que 5 mmHg. <span style="color:darkblue;">Diretriz AMB/CFM:</span> “Stretta é preconizado em hérnia menor que 2 cm e EEI &gt;8mmHg”.</p>

          <p><b><span style="color:darkorange;">Alternativa correta: F – V – F – F (letra D)</span></b></p>

          <p><span style="color:darkblue;"><b>Dica para provas:</b></span> Sempre desconfie quando uma questão lista muitos fatores ou mecanismos de risco e inclua elementos dúbios, especialmente conceitos opostos ao que é científico (ex: hiper vs. hipo; aumento vs. diminuição). Revise sempre as diretrizes recentes!</p>

          <p><b>Referências essenciais:</b> Projeto Diretrizes “Refluxo Gastroesofágico: Diagnóstico e Tratamento” – AMB/CFM e Harrison’s Principles of Internal Medicine.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

      - tipo: ME
        id: 121026-1655-29-zCA4NY
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Sobre a doença do refluxo gastroesofágico (DRGE) em crianças, analise as proposições a seguir:

          I.Nos casos em que não há sinais agravantes, o diagnóstico é essencialmente clínico e nenhum exame deve ser solicitado para diagnóstico.

          II.A patogênese da DRGE é multifatorial e complexa, envolvendo frequência diminuída dos relaxamentos transitórios do esfíncter esofágico inferior, esvaziamento gástrico acelerado, clearance esofágico deficiente, alterações na barreira antirrefluxo, aumento do tônus do esfíncter esofágico inferior, hipersensibilidade visceral e hipo-reatividade brônquica.

          III.A cintilografia tem baixa sensibilidade e especificidade e não é recomendada como método de rotina para diagnóstico e seguimento de lactentes com DRGE.

          É correto o que se afirma em:
        alternativas:
          - id: alt_A
            texto: II e III, apenas.
            comentario: Incorreta porque exclui a proposição I, que é verdadeira no contexto explicitado pelo enunciado. Na ausência de sinais agravantes, o diagnóstico inicial da DRGE em crianças é clínico, sem indicação de exames de rotina apenas para estabelecer o diagnóstico.
          - id: alt_B
            texto: I e II, apenas.
            comentario: Incorreta porque inclui a proposição II, mas esse item está falsamente construído. A DRGE se relaciona a aumento dos relaxamentos transitórios do EEI e falha da barreira antirrefluxo; o enunciado afirma o oposto nesses pontos, invertendo a fisiopatologia.
          - id: alt_C
            texto: II, apenas.
            comentario: Incorreta porque se apoia exclusivamente na proposição II, que é falsa por contradição direta com os mecanismos clássicos da DRGE. A presença de termos técnicos não corrige os erros centrais do item.
          - id: alt_D
            texto: I e III, apenas.
            comentario: 'A alternativa D está correta porque reúne as duas proposições compatíveis com o conhecimento técnico consolidado da DRGE em pediatria. A proposição I é verdadeira no contexto delimitado pelo enunciado: na ausência de sinais agravantes, o diagnóstico é essencialmente clínico e exames complementares não são solicitados de rotina para confirmação inicial. A proposição III também é verdadeira, pois a cintilografia tem baixa acurácia e não é recomendada como método de rotina para diagnóstico ou seguimento de lactentes com DRGE. A proposição II é falsa porque descreve a fisiopatologia em sentido oposto ao correto.'
          - id: alt_E
            texto: III, apenas
            comentario: Incorreta porque reconhece a veracidade da proposição III, mas desconsidera a proposição I, que também é verdadeira no cenário delimitado. Sem sinais de alarme, a abordagem diagnóstica inicial é clínica e não depende de exames complementares de rotina.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: D</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Sem sinais de alarme, a avaliação inicial da DRGE em crianças é clínica e não exige exames de rotina; a fisiopatologia típica envolve aumento dos relaxamentos transitórios do esfíncter esofágico inferior e falha da barreira antirrefluxo; e a cintilografia tem baixa sensibilidade e especificidade, sem papel rotineiro no diagnóstico ou seguimento. Assim, a proposição II é falsa por inverter mecanismos clássicos, enquanto I e III são verdadeiras.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> DRGE pediátrica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca misturou, na proposição II, elementos técnicos com afirmações em sentido invertido, tornando o item plausível à primeira leitura; além disso, a proposição I só é verdadeira porque o enunciado restringe o cenário à ausência de sinais agravantes.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em DRGE pediátrica, verifique primeiro se o enunciado menciona sinais de alarme: sem eles, o diagnóstico inicial costuma ser clínico.</li><li>Em itens de fisiopatologia, procure inversões de mecanismo: na DRGE, o esperado é aumento dos relaxamentos transitórios do EEI e falha da barreira antirrefluxo.</li><li>Quando aparecer cintilografia para DRGE em lactentes, lembre que ela tem baixa acurácia e não é exame de rotina para diagnóstico ou seguimento.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-30-n2V2Ji
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Homem de 45 anos de idade com diagnóstico de Doença de refluxo gastroesofágico, com adequada aderência às medidas comportamentais e dietéticas para controle dos sintomas e, uso de inibidor de bomba de prótons de longa duração com necessidade de doses cada vez maiores da medicação, porém sem adequada resposta clínica. Comparece à consulta de controle com resultado de exames:

          • EDA classificação endoscópica de Los Angeles Grau D e Hérnia hiatal >5cm.
          • Manometria esofágica: esfíncter esofágico inferior com pressão de repouso menor do que 6 mmHg e comprimento total inferior a 2 cm. O corpo esofágico apresenta propagações peristálticas eficazes em menos 30% dos episódios de deglutição avaliados.

          Qual a melhor conduta terapêutica a ser oferecida nesse caso?
        alternativas:
          - id: alt_A
            texto: Miotomia de Heller com fundoplicatura.
          - id: alt_B
            texto: Adição de antiácidos e bloqueadores de receptores H2 para otimizar o tratamento farmacológico.
          - id: alt_C
            texto: Tratamento cirúrgico com fundoplicatura parcial ou cirurgia de Toupet.
          - id: alt_D
            texto: Esofagocardiomiotomia.
          - id: alt_E
            texto: Supressão ácida e derivação duodenal.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:#003366;"><b>Tema central:</b></span> Este caso aborda o manejo cirúrgico da <b>Doença do Refluxo Gastroesofágico (DRGE)</b> grave e refratária ao tratamento clínico, associada a hérnia hiatal volumosa e importante <b>distúrbio de motilidade esofágica</b> demonstrado em manometria.</p>

          <p><span style="color:#003366;"><b>Justificativa da alternativa correta (C):</b></span><br>
          Segundo as <b>diretrizes da Associação Médica Brasileira</b> e os protocolos da <b>Federação Brasileira de Gastroenterologia</b>, pacientes com DRGE erosiva grave, hérnia hiatal &gt;5cm e motilidade esofágica ineficaz (<span style="color:#D2691E;"><b>menos de 30% de peristalse eficaz</b></span>), têm indicação de <u>cirurgia antirrefluxo</u> <span style="color:#D2691E;">preferencialmente por fundoplicatura parcial</span>, como a <b>Toupet</b>.</p>

          <p>Essa técnica <u>envolve o fundo gástrico parcialmente ao esôfago distal</u> (270°), reduzindo o refluxo sem sobrecarregar um esôfago já hipomotil, o que previne disfagia pós-operatória significativa. A fundoplicatura total poderia causar importante obstrução funcional nestes quadros.</p>

          <p><span style="color:#003366;"><b>Análise das alternativas incorretas:</b></span></p>

          <p><b>A) Miotomia de Heller com fundoplicatura</b>: <span style="color:#D2691E;"><b>Indicação clássica para acalasia</b></span>, não para DRGE com motilidade ineficaz. Não trata o refluxo neste contexto.</p>

          <p><b>B) Adição de antiácidos e bloqueadores H2</b>: Ao paciente <u>refratário ao tratamento clínico</u>, escalonar medicamentos é ineficaz e não recomendado, conforme diretrizes.</p>

          <p><b>D) Esofagocardiomiotomia</b>: <span style="color:#D2691E;">Procedimento utilizado em acalasia</span>, não apropriado para DRGE avançada.</p>

          <p><b>E) Supressão ácida e derivação duodenal</b>: <span style="color:#D2691E;">Não faz parte da conduta padrão</span> para DRGE refratária, sendo reservada para situações muito específicas, como após insucesso de múltiplas fundoplicaturas.</p>

          <p><span style="color:#003366;"><b>Pontos de atenção na leitura:</b></span> O enunciado enfatiza <span style="color:#D2691E;"><b>motilidade esofágica gravemente comprometida</b></span>. Em questões de concurso, atente para dados de manometria e tamanho da hérnia para indicar cirurgias diferenciadas.</p>

          <p><span style="color:#003366;">Referências:</span> Projeto Diretrizes AMB/CFM – “Doença do Refluxo Gastroesofágico” (manometria e indicação cirúrgica, p. 4-5); Federação Brasileira de Gastroenterologia – recomendações para cirurgia de Toupet em motilidade esofágica ineficaz.</p>

          <p><b>Resumo:</b> <span style="color:#003366;">A fundoplicatura parcial (Toupet) é a opção recomendada para DRGE grave com distúrbio de motilidade, prevenindo disfagia e controlando os sintomas.</span></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A melhor conduta terapêutica a ser oferecida para o paciente descrito no caso apresentado é o tratamento cirúrgico com fundoplicatura parcial ou cirurgia de Toupet, opção C. Isso porque o paciente apresenta uma doença de refluxo gastroesofágico (DRGE) de difícil controle com medicações, mesmo com medidas comportamentais e dietéticas adequadas. Além disso, os exames indicam um forte comprometimento do esfíncter esofágico inferior e uma hérnia hiatal com um grande risco de complicações a longo prazo, como a esofagite de refluxo, úlceras e estenose do esôfago. A cirurgia de fundoplicatura ou Toupet pode ajudar a reforçar a barreira anti-refluxo e reduzir a incidência de sintomas, além de prevenir complicações a longo prazo.
          </div>

      - tipo: ME
        id: 121026-1655-31-UZ6VO9
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Um paciente de 30 anos de idade procura atendimento médico por queixa de pirose, queimação retroesternal e epigastralgia há cerca de 3 meses. Possui antecedentes de doença do refluxo gastresofágico e suspendeu uso de inibidor de bomba de prótons pelo medo de ter demência. Novo exame de endoscopia digestiva alta revela a presença de esofagite erosiva moderada (Grau C - Los Angeles) com áreas de mucosa ectópica avermelhada acima da linha Z, ascendentes a partir da junção esofagogástrica. A transição esofagogástrica encontra-se a 4 cm acima do pinçamento diafragmático. Biópsias são obtidas das áreas ectópicas da mucosa esofagiana, que revelam a presença de metaplasia intestinal no epitélio colunar no esôfago distal, não havendo sinais de displasia ou neoplasia local.

          A respeito do caso relatado, assinale a alternativa correta.
        alternativas:
          - id: alt_A
            texto: Trata-se de um caso de hérnia de hiato associado a esofagite eosinofilica
          - id: alt_B
            texto: A descrição da biopsia esofágica sugere esôfago de Barrett associado a adenocarcinoma
          - id: alt_C
            texto: O tratamento clínico com inibidor de bomba de prótons não regride esôfago de Barrett, mas evita progressão para adenocarcinoma
          - id: alt_D
            texto: A vigilância endoscópica se faz necessário a cada 2 anos com biopsias seriadas de mucosa gástrica.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:darkorange;">Comentário do gabarito:</b></p>

          <p><span style="color:navy;"><b>Tema central:</b></span> O caso aborda <b>esôfago de Barrett</b>, condição caracterizada por <u>metaplasia intestinal</u> no esôfago distal decorrente de refluxo crônico, principal fator de risco para <b>adenocarcinoma esofágico</b>.</p>

          <p><b style="color:darkorange;">Análise e justificativa da alternativa correta (C):</b></p>
          <p>
          O <b>esôfago de Barrett</b> é uma complicação da DRGE, confirmado pela biópsia que revela metaplasia intestinal no epitélio colunar esofágico. O tratamento com <u>inibidor de bomba de prótons (IBP)</u> <b>não reverte</b> a metaplasia, mas promove redução da inflamação ao neutralizar o pH ácido do refluxo e <b>diminui o risco de progressão para adenocarcinoma</b>. 
          </p>
          <p>
          Segundo o <b>Manual MSD – Doença do refluxo gastroesofágico</b>: 
          <span style="color:navy;">“Os inibidores da bomba de prótons [...] normalmente constituem o tratamento mais eficaz para o refluxo gastroesofágico e para a esofagite e a esofagite erosiva causadas por refluxo gastroesofágico.”</span>
          </p>
          <p>
          Diretrizes internacionais e nacionais, como a da Sociedade Brasileira de Gastroenterologia, reforçam esse manejo conservador em pacientes sem displasia.
          </p>

          <p><b style="color:darkorange;">Crítica às alternativas incorretas:</b></p>
          <p>
          <b>A)</b> <span style="color:navy;">Erro conceitual.</span> Não há achados típicos de <b>esofagite eosinofílica</b> (ausência de eosinófilos em biópsia, disfagia, anéis esofágicos). Além disso, a hérnia de hiato, apesar de provável pelo deslocamento da transição esofagogástrica, não justifica o quadro sem outras evidências clínicas.
          </p>
          <p>
          <b>B)</b> <span style="color:navy;">Incorreta.</span> A biópsia confirma <u>esôfago de Barrett</u>, mas explicitamente não há sinais de <b>adenocarcinoma</b> (“não havendo sinais de displasia ou neoplasia local”). Atenção ao comando do enunciado!
          </p>
          <p>
          <b>D)</b> <span style="color:navy;">Inadequada.</span> A vigilância endoscópica no esôfago de Barrett deve focar o <u>esôfago</u> (não mucosa gástrica), realizando biópsias <b>a cada 3-5 anos</b> em pacientes sem displasia (diretriz SBAD – Sociedade Brasileira de Endoscopia Digestiva). A frequência proposta e o alvo da biópsia estão errados.
          </p>

          <p><b style="color:darkorange;">Dicas e estratégias:</b></p>
          <p>
          Atenção a termos como “displasia”, “adenocarcinoma” e <u>localização das biópsias</u>! Questões como esta avaliam conhecimento de protocolos e a leitura cuidadosa do laudo histopatológico.
          </p>

          <p><b style="color:navy;">Resumo final:</b> O IBP, embora <b>não reverta</b> o esôfago de Barrett, é essencial <b>para controle do refluxo e redução do risco de progressão neoplásica</b>. A vigilância endoscópica deve ser feita focando o esôfago, de acordo com achado de displasia.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>
