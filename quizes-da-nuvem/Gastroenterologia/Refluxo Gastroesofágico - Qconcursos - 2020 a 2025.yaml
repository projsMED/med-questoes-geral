          - id: alt_B
            texto: Investigação de dor torácica de origem cardíaca.
          - id: alt_C
            texto: Pacientes refratários ao tratamento empírico com IBP.
          - id: alt_D
            texto: Recorrência de sintomas após oito semanas de tratamento com IBP.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Na questão apresentada, o tema principal é a <strong>Doença do Refluxo Gastroesofágico (DGRE)</strong> e a indicação de exames complementares, como a Endoscopia Digestiva Alta (EDA). Para responder a essa questão corretamente, é necessário entender quais situações exigem a realização de exames adicionais em pacientes que apresentam sintomas de refluxo gastroesofágico.</p>

          <p>A alternativa correta é: <span style="color: darkorange;"><strong>B - Investigação de dor torácica de origem cardíaca.</strong></span></p>

          <p><strong>Justificativa da Alternativa Correta:</strong></p>

          <p>A alternativa B é a correta porque a investigação de dor torácica de origem cardíaca não é um indicativo para a realização de Endoscopia Digestiva Alta (EDA) em pacientes com DGRE. Quando a dor torácica é suspeita de ser de origem cardíaca, o enfoque diagnóstico deve ser em investigações cardiorrespiratórias, como eletrocardiograma ou ecocardiograma, e não na busca de problemas gastrointestinais.</p>

          <p><strong>Exploração das Alternativas Incorretas:</strong></p>

          <p><span style="color: blue;"><strong>A - Fatores de risco para esôfago de Barret:</strong></span> Pacientes com DGRE que possuem fatores de risco para o desenvolvimento de esôfago de Barret, uma condição pré-cancerosa, devem ser submetidos à EDA para avaliação e monitoramento.</p>

          <p><span style="color: blue;"><strong>C - Pacientes refratários ao tratamento empírico com IBP:</strong></span> Quando os pacientes não respondem ao tratamento com inibidores da bomba de prótons (IBP), a EDA é indicada para investigar possíveis complicações ou causas alternativas para os sintomas.</p>

          <p><span style="color: blue;"><strong>D - Recorrência de sintomas após oito semanas de tratamento com IBP:</strong></span> Se os sintomas de refluxo retornam após um tratamento adequado com IBP, a EDA é recomendada para identificar a causa subjacente da recorrência, como a presença de hérnia de hiato ou esofagite erosiva.</p>

          <p>Em resumo, ao abordar questões sobre DGRE e EDA, é crucial entender quais são as condições em que a EDA realmente se faz necessária. Domine o conceito de que a investigação de dores torácicas de origem cardíaca não se relaciona diretamente com a necessidade de exames gastrointestinais.</p>

          <p><strong>Gostou do comentário? Deixe sua avaliação aqui embaixo!</strong></p>
          </div>

      - tipo: ME
        id: 121026-1640-19-d5LwjS
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Assinale a alternativa que se refere ao tratamento medicamentoso caracterizado no texto abaixo:

          Não existem ensaios clínicos controlados que apoiem a sua utilização ou comprovem seus benefícios na doença do refluxo gastroesofágico (DRGE). Como apresenta efeitos colaterais neurológicos, como os extrapiramidais, não se deve indicá-la de rotina no tratamento da DRGE.
        alternativas:
          - id: alt_A
            texto: Metoclopramida.
          - id: alt_B
            texto: Domperidona.
          - id: alt_C
            texto: Bromoprida.
          - id: alt_D
            texto: Ranitidina.
          - id: alt_E
            texto: Procinéticos.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange;"><b>Tema central:</b></span> O foco da questão é o <b>tratamento medicamentoso da Doença do Refluxo Gastroesofágico (DRGE)</b>, especialmente a identificação de uma medicação cuja <u>eficácia na DRGE não é suportada por evidências científicas</u> e que <b>apresenta efeitos adversos neurológicos</b>, como os extrapiramidais, devendo ser evitada de rotina nesse contexto.</p>

          <p><span style="color:darkblue;"><b>Justificativa da alternativa correta – C) Bromoprida:</b></span></p>
          <p>A <b>bromoprida</b> é um <span style="color:darkorange;"><b>antagonista dos receptores dopaminérgicos D2</b></span>, indicada primariamente para náuseas e vômitos. Não há ensaios clínicos controlados robustos que comprovem benefícios da bromoprida na DRGE, sendo seu uso controverso e não recomendado rotineiramente para esse fim. Conforme destacado pelo <b>saude.df.gov.br</b>: “O uso da bromoprida está associado a <span style="color:darkblue"><u>reações extrapiramidais</u></span>, devendo seu uso na DRGE ser evitado pela ausência de evidências de eficácia.”. Esses efeitos, como distonia e acatisia, exigem cautela, sobretudo em crianças e idosos.</p>

          <p><span style="color:darkorange;"><b>Análise das alternativas incorretas:</b></span></p>

          <p><b>A) Metoclopramida:</b> Embora também cause efeitos extrapiramidais, existem <u>ensaios clínicos</u> que suportam sua indicação específica em situações gastrointestinais, como gastroparesia, o que a diferencia da bromoprida.</p>
          <p><b>B) Domperidona:</b> Apresenta ação similar à metoclopramida, porém com menor penetração no SNC, resultando em <b>menor risco de sintomas extrapiramidais</b>. Além disso, existem contextos clínicos respaldando seu uso.</p>
          <p><b>D) Ranitidina:</b> É um <b>antagonista H2 da histamina</b>, eficaz na inibição da secreção ácida gástrica. Não causa efeitos extrapiramidais e não pertence ao grupo dos procinéticos.</p>
          <p><b>E) Procinéticos:</b> Classe de fármacos (da qual bromoprida faz parte), porém a questão exige a identificação de um fármaco específico, tornando essa resposta genérica demais.</p>

          <p><span style="color:darkblue;"><b>Estratégia para futuras questões:</b></span></p>
          <p>Em provas, <u>atente-se a palavras como “não comprovado por ensaios clínicos” e “efeitos extrapiramidais”</u> — são indicações de procinéticos dopaminérgicos menos recomendados em diretrizes atuais.<br>
          Segundo o <b>Protocolo Clínico de DRGE</b> do Ministério da Saúde, o tratamento medicamentoso de escolha são <b>IBPs</b>, com procinéticos sendo reservados para situações muito específicas.</p>

          <p><span style="color:darkorange;"><b>Resumo final:</b></span> Entre os fármacos apresentados, <b>bromoprida</b> é o que melhor se encaixa na descrição da questão, sendo desaconelhada de rotina na DRGE por <u>ausência de evidências e potencial de efeitos neurológicos</u>.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A questão requer que o candidato identifique qual medicamento está sendo descrito no texto fornecido. O texto destaca que o tratamento em questão não tem ensaios clínicos controlados que comprovem sua eficácia no tratamento da doença do refluxo gastroesofágico (DRGE) e menciona efeitos colaterais neurológicos, especificamente efeitos extrapiramidais.

            A resposta correta é a alternativa C - Bromoprida. A Bromoprida é um medicamento procinético que age aumentando a motilidade gastrointestinal, e é utilizada em condições como a DRGE. No entanto, assim como outros procinéticos, pode estar associada a efeitos colaterais neurológicos, incluindo efeitos extrapiramidais, o que desaconselha seu uso de rotina para DRGE. Apesar de a Metoclopramida (alternativa A) e a Domperidona (alternativa B) também serem procinéticos e poderem causar efeitos colaterais neurológicos, o texto menciona especificamente que não há ensaios clínicos que comprovem os benefícios para DRGE, o que se aplica à Bromoprida. A Ranitidina (alternativa D) é um antagonista H2 utilizado para diminuir a produção de ácido no estômago, sem os efeitos colaterais neurológicos mencionados. Por fim, a alternativa E - Procinéticos é uma categoria de medicamentos que inclui a Metoclopramida, a Domperidona e a Bromoprida, mas a questão pede a identificação de um tratamento específico, não de uma classe de medicamentos.
          </div>

