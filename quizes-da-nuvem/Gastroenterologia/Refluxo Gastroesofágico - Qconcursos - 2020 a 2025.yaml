          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:#003366;">Tema central:</b> Tosse seca associada à doença do refluxo gastroesofágico (DRGE) – fisiopatologia e manifestações clínicas.</p>

          <p><span style="color:#FF6600;"><b>Comentário didático:</b></span><br>
          A <b>DRGE</b> é caracterizada pelo retorno do conteúdo gástrico ao esôfago, levando a manifestações digestivas e também atípicas, como sintomas respiratórios. A tosse seca é uma das manifestações extraesofágicas mais comuns, resultado da irritação da mucosa da orofaringe e laringe pelo ácido gástrico refluído.</p>

          <p><b style="color:#003366;">Justificativa da alternativa correta (D):</b><br>
          A tosse no refluxo gastroesofágico frequentemente ocorre <u>em acessos após o paciente deitar-se</u>. Isso porque a posição supina diminui a ação da gravidade, facilitando o refluxo do conteúdo ácido. Este ácido pode atingir a laringe e a faringe, desencadeando tosse reflexa. Conforme descrito no <b>Projeto Diretrizes da Associação Médica Brasileira</b>:<br>
          <q>"A exposição ácida repetida nas vias aéreas superiores pode causar irritação persistente, principalmente quando o paciente se deita."</q><br>
          Portanto, a <b>alternativa D</b> retrata corretamente o mecanismo pelo qual a tosse se manifesta.</p>

          <p><span style="color:#FF6600;"><b>Análise das alternativas incorretas:</b></span></p>

          <p><b>A) Sensação de coceira, na garganta.</b><br>
          Embora possa ocorrer algum desconforto faríngeo, <span style="color:#003366;font-weight:bold;">"coceira"</span> não é característica clássica da tosse no refluxo, mas sim mais típica de quadros alérgicos ou irritativos de vias aéreas superiores.</p>

          <p><b>B) Piorando com decúbito lateral.</b><br>
          Não há relação consistente entre decúbito lateral e intensificação da tosse no refluxo; a piora está relacionada ao <u>decúbito dorsal</u> (deitado), especialmente após refeições.</p>

          <p><b>C) Predominantemente, noturna.</b><br>
          Apesar da tosse relacionada à DRGE poder ocorrer à noite, não é <span style="color:#003366;font-weight:bold;">exclusivamente</span> noturna, podendo se manifestar em outros períodos, principalmente após refeições ou ao deitar-se.</p>

          <p><b>E) Com otalgia associada.</b><br>
          A associação com <span style="color:#003366;font-weight:bold;">otalgia</span> (dor de ouvido) não é típica da DRGE, e sim de quadros infecciosos ou inflamatórios do ouvido ou nasofaríngeos.</p>

          <p><b style="color:#003366;">Dicas de prova:</b> Atenção com termos específicos e situações clínicas descritas. O aspecto de “acesso ao deitar-se” é muito descrito em livros-texto e protocolos, diferentemente de outros sintomas citados.</p>

          <p><b style="color:#FF6600;">Referências:</b> Diretrizes da Associação Médica Brasileira (seção manifestações extraesofágicas), UpToDate, e bases como o Harrison’s Principles of Internal Medicine.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (1 like):</b>

            A tosse seca é uma condição comum no refluxo gastroesofágico, que se caracteriza por um refluxo do conteúdo gástrico para o esôfago e faringe, irritando as mucosas e provocando a tosse. A alternativa D é a correta, pois a tosse em acessos geralmente ocorre quando o paciente deita-se, devido ao aumento da pressão abdominal e consequente refluxo do conteúdo gástrico. As outras alternativas não se aplicam especificamente ao refluxo gastroesofágico, sendo assim, estão incorretas. É importante destacar que, além da tosse seca, o refluxo gastroesofágico pode causar outros sintomas, como azia, regurgitação e sensação de queimação no peito.
          </div>

      - tipo: ME
        id: 121026-1653-7-1Ve7fD
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'Em relação ao tratamento do refluxo gástrico esofágico, é correto afirmar:'
        alternativas:
          - id: alt_A
            texto: O tratamento com losartana piora o refluxo.
          - id: alt_B
            texto: Os antagonistas do receptor H2 não são indicados.
          - id: alt_C
            texto: Os inibidores de bomba protônica são bem indicados.
          - id: alt_D
            texto: O uso de carisoprosol relaxa o esfíncter pilórico, acelerando o esvaziamento gástrico e reduzindo o refluxo.
          - id: alt_E
            texto: A amitriptilina não está indicada pois aumenta a atividade adrenérgica.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>A alternativa <span style="color:darkorange;"><strong>C</strong></span> é a correta: <strong>Os inibidores de bomba protônica são bem indicados.</strong></p>

          <p>O tratamento do refluxo gastroesofágico, também conhecido como DRGE (Doença do Refluxo Gastroesofágico), é uma área importante dentro da <strong>Gastroenterologia</strong>. Essa condição ocorre quando o conteúdo ácido do estômago volta para o esôfago, causando sintomas como azia e regurgitação, além de possíveis complicações a longo prazo.</p>

          <p>Os <strong>inibidores de bomba protônica (IBPs)</strong> são frequentemente utilizados no tratamento do refluxo gastroesofágico. Eles são eficazes na redução da produção de ácido no estômago, proporcionando alívio dos sintomas e cura das lesões esofágicas. Essa classe de medicamentos é amplamente recomendada e utilizada na prática clínica para o manejo de DRGE, justificando a escolha da opção <span style="color:darkorange;"><strong>C</strong></span>.</p>

          <p>Vamos agora analisar as alternativas incorretas:</p>

          <p><span style="color:blue;"><strong>A - O tratamento com losartana piora o refluxo.</strong></span> Losartana é um medicamento utilizado principalmente para tratar hipertensão arterial e não tem relação direta com o agravamento do refluxo gastroesofágico. Não é reconhecido que interfira diretamente no tratamento do refluxo.</p>

          <p><span style="color:blue;"><strong>B - Os antagonistas do receptor H2 não são indicados.</strong></span> Apesar dos inibidores de bomba protônica serem a primeira escolha, os antagonistas do receptor H2, como a ranitidina, podem ser utilizados como uma alternativa, embora menos eficazes que os IBPs. Portanto, essa afirmação está incorreta, pois eles ainda podem ser indicados em certas situações.</p>

          <p><span style="color:blue;"><strong>D - O uso de carisoprodol relaxa o esfíncter pilórico, acelerando o esvaziamento gástrico e reduzindo o refluxo.</strong></span> Carisoprodol é um relaxante muscular e não tem impacto direto na fisiologia do esfíncter pilórico ou no esvaziamento gástrico. Essa alternativa está incorreta.</p>

          <p><span style="color:blue;"><strong>E - A amitriptilina não está indicada pois aumenta a atividade adrenérgica.</strong></span> Amitriptilina é um antidepressivo tricíclico e não é tipicamente contraindicado por aumentar a atividade adrenérgica. Embora tenha efeitos anticolinérgicos, que poderiam potencialmente relaxar o esfíncter esofágico inferior, a justificativa apresentada na alternativa não está correta.</p>

          <p>"Gostou do comentário? Deixe sua avaliação aqui embaixo!"</p>
          </div>

      - tipo: ME
        id: 121026-1653-8-v24vex
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: A respeito da doença do refluxo esofágico (DRE) no adulto, assinale a alternativa correta.
        alternativas:
          - id: alt_A
            texto: A endoscopia digestiva alta (EDA) é o teste padrão-ouro para o diagnóstico do RGE.
          - id: alt_B
            texto: A presença de regurgitação no contexto do RGE geralmente indica uma hérnia hiatal.
          - id: alt_C
            texto: A ausência de pirose e regurgitação afasta o diagnóstico de RGE.
          - id: alt_D
            texto: Antes de prescrever tratamento antiácido para a pessoa idosa, é necessário investigar anemia crônica e presença de osteopenia / osteoporose.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:#003366;">Tema central:</b> A questão aborda a <b>doença do refluxo gastroesofágico (DRGE)</b> no adulto, com foco em diagnóstico, manifestações clínicas e cuidados na prescrição de antiácidos em idosos, pontos fundamentais para atuação do médico generalista.</p>

          <p><span style="color:#D2691E;"><b>Alternativa correta: D</b></span><br>
          <strong>Justificativa:</strong> Em idosos, a prescrição de antiácidos (especialmente <b>inibidores da bomba de prótons</b> – IBPs) exige cuidados prévios quanto à <span style="color:#003366;"><b>osteopenia/osteoporose e anemia</b></span>. Segundo diretrizes brasileiras (“Fratura do colo do fêmur em idosos”, Ministério da Saúde), deve-se <u>avaliar fatores de risco osteometabólico</u> antes de iniciar fármacos que aumentam o risco de fraturas. Os IBPs interferem na absorção de cálcio e vitamina B12, elevando o risco de <span style="color:#003366;"><b>osteoporose e anemia crônica</b></span> (<i>UpToDate; Rubin’s Pathology</i>). Logo, <span style="color:#003366;font-weight:bold;">é prudente investigar essas condições</span> nesse grupo, estabelecendo medidas preventivas, como ajuste de cálcio/vitamina D e acompanhamento laboratorial.</p>

          <p><b>Análise das alternativas incorretas:</b></p>

          <p><span style="color:#003366;"><b>A)</b></span> <b>ERRADA.</b> A <b>endoscopia digestiva alta (EDA) NÃO é o padrão-ouro para o diagnóstico de DRGE</b>. O padrão-ouro é a <span style="color:#D2691E;"><u>pHmetria esofágica de 24h</u></span> (Harrison, 21ª ed.; SBAD). EDA serve para excluir complicações (esofagite, Barrett), e não para diagnóstico de rotina.</p>

          <p><span style="color:#003366;"><b>B)</b></span> <b>ERRADA.</b> <b>Regurgitação não indica necessariamente hérnia hiatal.</b> É típico de DRGE, e hérnia hiatal pode estar ou não presente. O diagnóstico de hérnia depende de exame de imagem ou EDA, não do sintoma isolado.</p>

          <p><span style="color:#003366;"><b>C)</b></span> <b>ERRADA.</b> A <b>ausência de pirose e regurgitação NÃO exclui DRGE</b>. Casos chamados “DRGE não erosiva” (NERD) ou "atípica" podem apresentar sintomas extra-esofágicos (tosse, rouquidão) mesmo sem pirose ou regurgitação (<i>SBAD; UpToDate</i>).</p>

          <p><b style="color:#D2691E;">Dica de prova:</b> <u>Fique atento a termos absolutos</u> (como “afasta”, “sempre”, “nunca”) e à diferenciação entre critérios diagnósticos e exames de confirmação de complicações.</p>

          <p><b style="color:#003366;">Resumo prático:</b> DRGE é diagnóstico clínico; exames confirmam complicações. IBPs pedem atenção redobrada em idosos. Sempre leia atentamente o que se pergunta, buscando respaldo nas principais diretrizes e literatura médica.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1653-9-VrpVDC
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'É considerado exame padrão-ouro para o diagnóstico e avaliação quantitativa da Doença do refluxo gastro esofágico:'
        alternativas:
          - id: alt_A
            texto: eletromanometria esofágica.
          - id: alt_B
            texto: raio X constrastado do esôfago.
          - id: alt_C
            texto: teste de perfusão ácida.
          - id: alt_D
            texto: pHmetria esofágica de 24h.
          - id: alt_E
            texto: endoscopia digestiva alta com biópsia.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>O tema central desta questão é o diagnóstico da <span style="color: darkorange;"><strong>Doença do Refluxo Gastroesofágico (DRGE)</strong></span>. Para resolver esta questão, é importante compreender quais exames são utilizados para diagnosticar e avaliar quantitativamente esta condição.</p>

          <p>A alternativa correta é a <strong>Alternativa D - pHmetria esofágica de 24h</strong>. Este exame é considerado o padrão-ouro para o diagnóstico de DRGE porque mede o pH dentro do esôfago durante 24 horas, permitindo identificar episódios de refluxo ácido e quantificar a acidez. Isso fornece uma avaliação detalhada da presença e gravidade do refluxo ácido.</p>

          <p>Vamos analisar por que as outras alternativas estão incorretas:</p>

          <p><strong>A - Eletromanometria esofágica:</strong> Embora este exame seja útil para avaliar a motilidade esofágica, ele não mede diretamente o refluxo ácido e, portanto, não é o padrão-ouro para DRGE.</p>

          <p><strong>B - Raio X contrastado do esôfago:</strong> Este exame pode mostrar anormalidades estruturais no esôfago, mas não mede a presença de ácido ou episódios de refluxo, tornando-o inadequado para avaliar quantitativamente a DRGE.</p>

          <p><strong>C - Teste de perfusão ácida:</strong> Também conhecido como teste de Bernstein, era utilizado anteriormente para reproduzir sintomas de refluxo, mas não é mais a primeira escolha para diagnóstico, especialmente para quantificação.</p>

          <p><strong>E - Endoscopia digestiva alta com biópsia:</strong> A endoscopia é útil para visualizar possíveis complicações do refluxo, como esofagite e Barrett, mas não quantifica o refluxo ácido.</p>

          <p>É essencial entender que, para diagnósticos precisos e quantitativos da DRGE, a <strong>pHmetria esofágica de 24h</strong> é a técnica mais adequada, pois oferece dados objetivos e mensuráveis sobre o refluxo ácido. Isso pode influenciar o tratamento e manejo da doença, tornando-se uma ferramenta valiosa para os profissionais de saúde.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

