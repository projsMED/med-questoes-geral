        enunciado: "Com relação aos sintomas da doença do refluxo\_gastroesofágico (DRGE) e o teste terapêutico, assinale com\_V as afirmativas verdadeiras e com F as falsas.\n\n( ) Os sintomas considerados típicos da DRGE são a\_pirose e a regurgitação, que, em razão de sua alta\_especificidade, apresentam valor preditivo para o\_diagnóstico da DRGE.\n( ) Dor torácica não cardíaca, tosse crônica, laringite e asma estão entre os sintomas atípicos da DRGE, cuja manifestação está associada aos sintomas típicos da doença.\_\_\n( ) Os sintomas de alerta da DRGE, como hemorragia digestiva, disfagia e odinofagia, são frequentemente associados a complicações, razão pela qual os pacientes devem receber abordagem diagnóstica mais agressiva.\_\n( ) O teste terapêutico com inibidor da bomba protônica\_em dose padrão habitual por um período variável,\_em geral, de quatro semanas permite, em alguns\_casos, inferir o diagnóstico de DRGE.\n\nAssinale a sequência correta."
        alternativas:
          - id: alt_A
            texto: V F V F
          - id: alt_B
            texto: F V F F
          - id: alt_C
            texto: V V F V
          - id: alt_D
            texto: F F V V
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b><span style="color:#0B3D91;">Tema central:</span></b> Doença do refluxo gastroesofágico (DRGE) — reconhecimento de sintomas típicos e atípicos, sinais de alarme e uso do “teste terapêutico” com inibidor de bomba de prótons (IBP) para apoio diagnóstico.</p>

          <p><b><span style="color:#D35400;">Gabarito:</span> D — F F V V</b></p>

          <p><b><u>Justificativa afirmativa por afirmativa</u></b></p>

          <p><b>1) Falso.</b> Pirose e regurgitação são <span style="color:#0B3D91;"><b>sintomas típicos</b></span> de DRGE, porém <b>não são altamente específicos</b>. Têm boa sensibilidade, mas podem ocorrer em dispepsia funcional, esofagite eosinofílica, uso de AINEs, entre outros. Logo, <b>o valor preditivo isolado é limitado</b>; o diagnóstico é clínico-probabilístico e pode requerer endoscopia ou pH-impedanciometria conforme o contexto. (ACG GERD Guideline 2022; UpToDate 2024)</p>

          <p><b>2) Falso.</b> Dor torácica não cardíaca, tosse crônica, laringite e asma são <span style="color:#0B3D91;"><b>sintomas atípicos/extraesofágicos</b></span>, mas <b>não precisam estar associados</b> aos sintomas típicos; podem ocorrer isoladamente e têm <b>baixa especificidade</b> para DRGE. Nesses quadros, recomenda-se investigar causas alternativas e <b>não assumir</b> DRGE apenas por coexistência. (ACG 2022; Federação Brasileira de Gastroenterologia – FBG, Consenso DRGE)

          </p><p><b>3) Verdadeiro.</b> <span style="color:#D35400;"><b>Sinais de alarme</b></span> (hemorragia digestiva, disfagia, odinofagia, anemia, perda de peso) sugerem complicações como <b>esofagite erosiva grave, estenose, Barrett ou neoplasia</b>, exigindo <b>endoscopia precoce</b> e abordagem diagnóstica mais agressiva, em vez de apenas teste terapêutico. (Harrison’s; ACG 2022)</p>

          <p><b>4) Verdadeiro.</b> O <span style="color:#0B3D91;"><b>teste terapêutico com IBP</b></span> em <b>dose padrão por ~2–4 semanas</b> nos pacientes com sintomas típicos e sem alarme pode <b>aumentar a probabilidade</b> de DRGE quando há resposta clínica. Não é confirmatório (há falsos negativos/positivos), mas é uma <b>estratégia aceitável</b> na prática. Em manejo de manutenção/erosiva, costuma-se estender para <b>8 semanas</b>. (ACG 2022; UpToDate)</p>

          <p><b><u>Estratégia de prova</u></b></p>
          <ul>
            <li>Desconfie de frases que superestimem <b><span style="color:#D35400;">“alta especificidade”</span></b> para sintomas típicos.</li>
            <li>Em sintomas extraesofágicos, lembre: <b><span style="color:#0B3D91;">baixa especificidade</span></b> e podem ocorrer sem pirose/regurgitação.</li>
            <li><b>Alarmes</b> pedem <b>endoscopia</b>, não apenas IBP.</li>
            <li>Resposta ao IBP <b>apoia</b>, mas <b>não confirma</b> DRGE.</li>
          </ul>

          <p><b><u>Por que as alternativas A, B e C estão incorretas?</u></b></p>
          <ul>
            <li><b>A (V F V F):</b> erra a 1 (não é V) e a 4 (é V).</li>
            <li><b>B (F V F F):</b> erra a 2 (não é V) e a 3–4 (ambas são V).</li>
            <li><b>C (V V F V):</b> erra a 1–2 (não são V) e a 3 (não é F).</li>
          </ul>

          <p><b><u>Referências essenciais</u></b>: ACG Clinical Guideline: GERD (2022); UpToDate: Clinical manifestations and diagnosis of GERD (acesso 2024); Harrison’s Principles of Internal Medicine; Consensos FBG/SOBED sobre DRGE.</p>

          <p><i>Gostou do comentário? Deixe sua avaliação aqui embaixo!</i></p>
          </div>

