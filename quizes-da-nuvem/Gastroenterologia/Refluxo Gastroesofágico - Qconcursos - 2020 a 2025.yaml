      - tipo: ME
        id: 121026-1640-16-QaWnO9
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Mulher de 46 anos, com doença do refluxo gastroesofágico em terapia crônica com inibidor de bomba de prótons, realizou uma endoscopia digestiva alta (EDA) para avaliar o recente agravamento dos sintomas.

          Dentre as opções a seguir, o mais provável achado no EDA é:
        alternativas:
          - id: alt_A
            texto: pólipo de glândula fúndica.
          - id: alt_B
            texto: pólipo hiperplásico.
          - id: alt_C
            texto: pólipo gástrico inflamatório.
          - id: alt_D
            texto: esôfago de Barret.
          - id: alt_E
            texto: tumor carcinoide.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange;"><b>Tema central da questão:</b></span> O tema principal aborda os <b>achados endoscópicos</b> que podem surgir em pacientes com <b>doença do refluxo gastroesofágico</b> (DRGE) submetidos a tratamento crônico com <b>inibidor da bomba de prótons</b> (IBP). É fundamental reconhecer as alterações gástricas associadas ao uso prolongado dessa medicação, especialmente em provas voltadas a médicos endoscopistas.</p>

          <p><span style="color:darkblue;"><b>Análise e justificativa da alternativa correta (A):</b></span> <u>Pólipo de glândula fúndica</u> é a resposta mais provável. O uso crônico de IBPs, como evidenciado em revisões sistemáticas e em publicações da <b>Sociedade Brasileira de Patologia Digestiva</b>, está claramente associado ao desenvolvimento destes pólipos, que são benignos, localizados no fundo ou corpo gástrico, sésseis e geralmente menores que 1 cm.<br>
          Segundo o texto “Polipose Gástrica” (docs.bvsalud.org, p. 3), “os pólipos das glândulas fúndicas ocorrem frequentemente em usuários crônicos de IBPs, sendo incidentalmente encontrados em Endoscopia Digestiva Alta”. O mecanismo se dá pelo aumento compensatório da gastrina, promovendo proliferação das células fúndicas.</p>

          <p><span style="color:darkorange;"><b>Análise das alternativas incorretas:</b></span></p>
          <p>
          <b>B) Pólipo hiperplásico:</b> Estes pólipos estão mais associados a processos inflamatórios crônicos, como <u>gastrite atrófica</u> ou <u>infecção por H. pylori</u>, e não têm vínculo direto com IBPs.<br>
          <b>C) Pólipo gástrico inflamatório:</b> Embora também benigno, relaciona-se mais a irritações e processos inflamatórios locais, menos comuns em usuários de IBPs.<br>
          <b>D) Esôfago de Barret:</b> Esta é uma complicação da DRGE, encontrada no <b>esôfago distal</b>, não no estômago, e o enunciado sugere achado gástrico relacionado ao IBP.<br>
          <b>E) Tumor carcinoide:</b> Raro e geralmente consequente a hipergastrinemia prolongada de magnitude elevada; não é o achado mais esperado em pacientes apenas com refluxo e IBP.
          </p>

          <p><span style="color:darkblue;"><b>Orientação prática para concursos:</b></span> Ao interpretar questões, busque <span style="text-decoration:underline;">palavras-chave</span> como “uso crônico de IBPs” e relacione com efeitos adversos clássicos dessa classe. Descarte opções anatomopatológicas incompatíveis com o mecanismo de ação do medicamento ou com o histórico clínico apresentado.</p>

          <p><b>Dica de prova:</b> Quando o enunciado destaca o uso prolongado de uma droga e questiona achados endoscópicos, pondere <span style="color:darkorange;"><b>reações adversas associadas ao fármaco</b></span>!</p>

          <p><i>Gostou do comentário? Deixe sua avaliação aqui embaixo!</i></p>
          </div>

