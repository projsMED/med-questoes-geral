    conteudo:
      - tipo: ME
        id: 121026-1640-1-dc4eBy
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'Sobre Doença do Refluxo Gastroesofágico (DRGE), marque a alternativa CORRETA:'
        alternativas:
          - id: alt_A
            texto: A endoscopia digestiva alta é útil para determinar a gravidade da DRGE.
          - id: alt_B
            texto: A endoscopia digestiva alta normal descarta a o diagnóstico de DRGE.
          - id: alt_C
            texto: A doença aumenta o risco de carcionoma espinocelular (CEC) de esôfago.
          - id: alt_D
            texto: A principal medicação usada no tratamento é a domperidona, sendo a primeira escolha.
          - id: alt_E
            texto: A presença de hérnia de hiato na endoscopia digestiva alta confirma o diagnóstico de DRGE.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><strong style="color: darkorange;">Tema Central:</strong> A questão aborda a <strong>Doença do Refluxo Gastroesofágico (DRGE)</strong>, uma condição em que o conteúdo do estômago volta para o esôfago, causando sintomas como azia e regurgitação. Entender a DRGE envolve conhecimentos sobre diagnóstico, complicações e tratamento.</p>

          <p><strong style="color: darkorange;">Alternativa Correta:</strong> A - A endoscopia digestiva alta é útil para determinar a gravidade da DRGE.</p>

          <p>A endoscopia digestiva alta é um exame importante no contexto da DRGE, pois permite <strong>avaliar a presença de esofagite</strong> (inflamação no esôfago) e outras complicações, como úlceras. Embora não seja sempre necessária para diagnosticar a DRGE, ela é utilizada para <u>determinar a gravidade</u> da condição, especialmente em pacientes com sintomas alarmantes ou refratários ao tratamento.</p>

          <p><strong style="color: darkblue;">Por que as alternativas estão incorretas:</strong></p>

          <p><strong>B</strong> - A endoscopia digestiva alta normal descarta o diagnóstico de DRGE. <br>
          Esse é um equívoco comum. A endoscopia pode ser normal em muitos pacientes com DRGE, pois nem todos apresentam esofagite visível. O diagnóstico de DRGE é frequentemente clínico, baseado nos sintomas do paciente, e pode ser confirmado por pHmetria quando necessário.</p>

          <p><strong>C</strong> - A doença aumenta o risco de carcinoma espinocelular (CEC) de esôfago. <br>
          A DRGE está, na verdade, associada a um aumento do risco de <strong>adenocarcinoma</strong> de esôfago, não ao carcinoma espinocelular. O adenocarcinoma está ligado a alterações pré-cancerosas como o esôfago de Barrett, que pode se desenvolver com DRGE crônica.</p>

          <p><strong>D</strong> - A principal medicação usada no tratamento é a <u>domperidona</u>, sendo a primeira escolha. <br>
          A domperidona é um agente procinético, mas os <strong>inibidores da bomba de prótons (IBPs)</strong>, como omeprazol e esomeprazol, são as principais medicações utilizadas no tratamento de DRGE, por reduzirem a produção de ácido gástrico.</p>

          <p><strong>E</strong> - A presença de hérnia de hiato na endoscopia digestiva alta confirma o diagnóstico de DRGE. <br>
          Embora a hérnia de hiato seja um fator de risco para DRGE, sua presença <strong>não confirma</strong> o diagnóstico por si só. Muitos indivíduos com hérnia de hiato não apresentam DRGE, e o diagnóstico é clinicamente baseado em sintomas e, se necessário, em exames adicionais como pHmetria.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1640-2-HO8P0c
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: No consenso brasileiro sobre o tratamento da doença do refluxo gastresofágico (DRGE),
        alternativas:
          - id: alt_A
            texto: não há diferença no tratamento das formas erosiva e não erosiva.
          - id: alt_B
            texto: mudanças no estilo de vida têm alto nível de evidência e recomendação.
          - id: alt_C
            texto: procinéticos podem substituir os IBPs no tratamento da DRGE.
          - id: alt_D
            texto: os bloqueadores de receptores H2 são recomendados para fase de manutenção.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:darkblue;">Tema central:</b> manejo da DRGE segundo consensos (Brasil e internacionais). A questão explora se há diferença terapêutica entre formas <u>erosiva</u> (esofagite erosiva) e <u>não erosiva</u> (NERD), além do papel de medidas de estilo de vida, procinéticos e bloqueadores H2.</p>

          <p><b style="color:darkorange;">Alternativa correta: A</b> – “não há diferença no tratamento das formas erosiva e não erosiva”.</p>

          <p><b>Justificativa:</b> Nos consensos brasileiros e em diretrizes internacionais, a <u>terapia de primeira linha</u> para DRGE típica é semelhante nas formas erosiva e não erosiva: <b>inibidor de bomba de prótons (IBP)</b> em dose plena por 8 semanas, antes do desjejum, com ajustes por resposta clínica. A “pegadinha” é confundir <i>primeira linha</i> com <i>manutenção</i>: embora o <u>início</u> seja semelhante, a <u>estratégia de manutenção</u> costuma diferir (p.ex., manutenção contínua é mais indicada na esofagite erosiva grave – Los Angeles C/D –, enquanto NERD muitas vezes permite uso <i>on-demand</i>/degrau para baixo). Referências: Consenso Brasileiro de DRGE (FBG/SOBED) e ACG 2022.</p>

          <p><b style="color:darkblue;">Por que as demais estão incorretas?</b></p>

          <p><b>B)</b> “mudanças no estilo de vida têm alto nível de evidência e recomendação.” – <b>Incorreta.</b> As medidas são recomendadas, mas o <u>nível de evidência é variável</u>: <b>perda de peso</b> (forte/moderada), <b>elevação da cabeceira</b> e evitar refeições noturnas (condicional/baixa a moderada). Evitar álcool, chocolate, café e cítricos tem evidência <u>limitada</u> e individualizada. Logo, não é “alto” de forma ampla. (ACG 2022; UpToDate).</p>

          <p><b>C)</b> “procinéticos podem substituir os IBPs…” – <b>Incorreta.</b> Procinéticos (metoclopramida, domperidona) <u>não substituem IBP</u> na DRGE não complicada e têm <b>menor eficácia</b> para cicatrização/controle de pirose, além de efeitos adversos (extrapiramidais, prolongamento do QT). Podem ser <i>adjuvantes</i> em casos selecionados (p.ex., com gastroparesia documentada). (Harrison’s; ACG 2022; Consenso Brasileiro).</p>

          <p><b>D)</b> “bloqueadores H2 são recomendados para manutenção.” – <b>Incorreta.</b> Para manutenção, <b>IBP</b> é superior para <u>cicatrização e prevenção de recidiva</u>, especialmente na esofagite erosiva. Bloqueadores H2 podem ter papel em <i>step-down</i> ou uso noturno adjuvante (nocturnal acid breakthrough), mas não são recomendação de primeira escolha para manutenção pela <b>taquifilaxia</b> e menor potência. (ACG 2022; UpToDate).</p>

          <p><b style="color:darkorange;">Estratégia para a prova:</b> quando a banca falar “não há diferença”, pense em <u>primeira linha</u> (IBP para todos). Se a alternativa versar sobre manutenção, lembre que a esofagite erosiva grave tende a exigir manutenção contínua; NERD, muitas vezes, manejo sob demanda.</p>

          <p><b>Referências essenciais:</b> Consenso Brasileiro de DRGE (FBG/SOBED); ACG Clinical Guideline for GERD 2022; Harrison’s Principles of Internal Medicine; UpToDate – Management of GERD.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1640-3-TgCNEo
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Assinale a alternativa correta sobre a diferenciação dos sintomas de refluxo gastroesofágico (GERD).
        alternativas:
          - id: alt_A
            texto: A ausência de resposta ao tratamento agressivo com IBPs pode sugerir a presença de doenças esofágicas ou extraesofágicas semelhantes ao GERD, como acalasia ou divertículo de Zenker.
          - id: alt_B
            texto: A esofagite causada por Helicobacter pylori é a principal causa de sintomas que imitam o GERD e deve ser considerada antes do diagnóstico de GERD.
          - id: alt_C
            texto: A dispepsia funcional é um dos principais fatores associados a uma resposta positiva ao tratamento com IBPs, ajudando a distinguir claramente entre GERD e outras condições.
          - id: alt_D
            texto: A maioria das condições esofágicas e extraesofágicas que imitam GERD não são diagnosticáveis com testes diagnósticos padrão e, portanto, a resposta ao tratamento com IBPs é geralmente suficiente para o diagnóstico.
          - id: alt_E
            texto: A presença de sintomas esofágicos não específicos e a falha em responder ao tratamento com IBPs excluem a possibilidade de GERD como diagnóstico.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b><span style="color:darkblue">Tema central:</span></b> Diferenciar <b>doenças que mimetizam os sintomas de refluxo gastroesofágico (GERD)</b> e compreender os <b>limites do “teste terapêutico” com inibidores de bomba de prótons (IBPs)</b>. A resposta ou a falha ao IBP, isoladamente, <u>não confirmam nem excluem</u> GERD (ACG 2022; UpToDate; Harrison’s).</p>

          <p><b><span style="color:darkblue">Alternativa correta — A</span>:</b> A <b>falha ao tratamento otimizado com IBP</b> (dose adequada, 30–60 min antes das refeições, por 8 semanas) deve levar à investigação de <b>condições esofágicas/extraesofágicas que simulam GERD</b>, como <span style="color:darkblue"><b>acalasia</b></span> (disfagia progressiva, regurgitação, perda ponderal; diagnóstico: <b>manometria esofágica</b>), <span style="color:darkblue"><b>divertículo de Zenker</b></span> (regurgitação de alimentos não digeridos, halitose; diagnóstico: <b>esofagograma baritado</b>), <b>esofagite eosinofílica</b> (disfagia, impactação; <b>endoscopia com biópsias</b>), <b>ruminação</b>, <b>dispepsia funcional</b>, <b>hipersensibilidade ao refluxo</b> e <b>dor cardíaca não cardíaca</b>. A avaliação inclui <b>endoscopia</b>, <b>pH-impedância</b> e <b>manometria</b> conforme a suspeita (ACG 2022; Lyon Consensus 2.0).</p>

          <p><b><span style="color:darkblue">Por que as demais estão incorretas?</span></b></p>
          <p><b>B.</b> “Esofagite por <i>H. pylori</i>” não é causa principal de sintomas tipo GERD. Pelo contrário, há <b>associação inversa</b> entre <i>H. pylori</i> e GERD em vários estudos; erradica-se <i>H. pylori</i> por outras indicações (úlcera, linfoma MALT), não para “imitar GERD” (ACG/AGA).</p>
          <p><b>C.</b> <b>Dispepsia funcional</b> não “ajuda a distinguir” GERD por responder ao IBP. O <b>teste com IBP tem acurácia limitada</b>; na dispepsia, a resposta é variável (benefício discreto no subtipo dor epigástrica). Logo, <b>não separa claramente</b> GERD de outras condições (ACG/UpToDate).</p>
          <p><b>D.</b> É falso que as “condições miméticas” não sejam diagnosticáveis. Dispomos de <b>endoscopia</b> (esofagite, EoE, estenoses), <b>pH ou pH-impedância</b> (exposição ácida/refluxo fraco), <b>manometria</b> (acalasia, distúrbios motores) e <b>esofagograma</b> (Zenker). Portanto, <b>resposta ao IBP não é suficiente</b> como diagnóstico definitivo (ACG 2022; Lyon 2.0).</p>
          <p><b>E.</b> Falha ao IBP <b>não exclui GERD</b>. Pode haver <b>uso inadequado</b>, <b>baixa adesão</b>, <b>refluxo não ácido</b> ou <b>hipersensibilidade</b>. A conduta é <b>otimizar IBP</b>, revisar estilo de vida e <b>investigar com exames</b> antes de descartar GERD (diretrizes ACG).</p>

          <p><b><span style="color:darkblue">Estratégia diagnóstica prática</span>:</b> Sem sinais de alarme, iniciar <b>IBP por 8 semanas</b>. Se persistir: verificar <b>adesão/tempo de tomada</b>, considerar <b>IBP em dose dupla</b> e realizar <b>endoscopia</b>. Endoscopia normal? Prosseguir com <b>pH-impedância</b> e <b>manometria</b> se suspeita de distúrbio motor. Procurar “pistas” clínicas de <b>acalasia</b> e <b>Zenker</b> para direcionar exames (ACG 2022; Harrison’s).</p>

          <p><b><span style="color:darkorange">Pegadinhas de prova</span>:</b> 1) <b>Resposta ao IBP ≠ diagnóstico de GERD</b>. 2) <b><i>H. pylori</i> não causa esofagite típica</b>. 3) <b>PPI-falha ≠ excluir GERD</b>; exige investigação objetiva.</p>

          <p><b>Gabarito: A.</b></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1640-4-OpGuB2
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'Sobre o manejo do refluxo gastroesofágico (RGE) em adultos, é INCORRETO afirmar que:'
        alternativas:
          - id: alt_A
            texto: A pHmetria de 24 horas é indicada em pacientes com sintomas persistentes de RGE que não apresentam esofagite visível na endoscopia e não respondem ao tratamento.
            comentario: Está aceitável no contexto da prova. Em paciente com sintomas persistentes, endoscopia sem esofagite visível e ausência de resposta ao tratamento, a monitorização objetiva do refluxo tem papel diagnóstico para comprovar ou afastar RGE. A diretriz diferencia melhor o cenário em que o diagnóstico ainda não está estabelecido, em que a monitorização é feita fora do IBP, e o cenário em que já há diagnóstico estabelecido, em que se considera impedâncio-pH sob IBP.
          - id: alt_B
            texto: O uso de IBP é considerado o tratamento de primeira linha para pacientes com sintomas de RGE frequentes e melhora rapidamente os sintomas na maioria dos casos.
            comentario: Está correta porque o IBP é a terapia farmacológica de primeira linha no RGE sintomático frequente. O fundamento médico é seu efeito de supressão ácida, que é o mais eficaz para aliviar sintomas e favorecer cicatrização da esofagite por refluxo. A observação de que a melhora não é universal não invalida a assertiva.
          - id: alt_C
            texto: Em pacientes com RGE e esofagite erosiva confirmada, é recomendado o uso contínuo de IBP para manutenção da remissão a longo prazo.
            comentario: Está correta porque, na esofagite erosiva confirmada, a manutenção com IBP é estratégia aceita para sustentar remissão e reduzir recorrência, sobretudo nas formas mais intensas. A base reconhece que a necessidade de uso contínuo varia com gravidade e recorrência, mas a afirmação permanece compatível com a diretriz e com a prática de prova.
          - id: alt_D
            texto: A cirurgia antirrefluxo é indicada apenas para pacientes com esofagite de refluxo que respondem ao tratamento com IBP e preferem uma solução definitiva.
            comentario: A alternativa D é a incorreta porque descreve a cirurgia antirrefluxo de forma excessivamente restrita. O ponto decisivo não é o paciente ter esofagite e ter respondido ao IBP com desejo de “solução definitiva”, e sim haver evidência objetiva de RGE e contexto clínico adequado para tratamento de longo prazo. Pela base, a cirurgia pode ser considerada em outros cenários selecionados, como esofagite erosiva grave, hérnia hiatal importante e sintomas persistentes ou regurgitação refratária documentada. Portanto, o erro médico está no “apenas”.
          - id: alt_E
            texto: Modificações no estilo de vida, como evitar refeições copiosas à noite e elevar a cabeceira da cama, são parte fundamental do manejo de RGE.
            comentario: Está correta porque medidas comportamentais fazem parte do manejo do RGE, especialmente para sintomas noturnos. Evitar refeições próximas ao decúbito e elevar a cabeceira atuam reduzindo a exposição ao refluxo nesse contexto. O ponto técnico é que são medidas adjuvantes, não substitutas do IBP quando há indicação farmacológica.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: D</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> A diretriz ACG 2022 considera a cirurgia antirrefluxo uma opção de tratamento de longo prazo para pacientes com evidência objetiva de RGE, especialmente em esofagite erosiva grave, hérnia hiatal grande e/ou sintomas persistentes como regurgitação. Assim, a alternativa D erra ao impor uma restrição absoluta com “apenas”, como se a indicação cirúrgica dependesse exclusivamente do perfil descrito.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Manejo do RGE</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explorou o termo “apenas” na alternativa D. Ele cria uma restrição absoluta falsa e induz o candidato a esquecer que a indicação cirúrgica depende de evidência objetiva de RGE e de cenários clínicos apropriados, não só de resposta ao IBP com desejo de solução definitiva.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em alternativa sobre cirurgia antirrefluxo, procure termos absolutos como “apenas”; no RGE, a indicação cirúrgica não se restringe a um único perfil clínico.</li><li>Se o caso trouxer sintomas persistentes com endoscopia normal, pense em monitorização objetiva do refluxo para confirmar ou excluir RGE.</li><li>Associe esofagite erosiva confirmada a maior chance de necessidade de manutenção com IBP para prevenir recidiva.</li><li>Medidas de estilo de vida entram como parte do manejo, sobretudo em sintomas noturnos, mas não substituem tratamento farmacológico quando ele está indicado.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1640-5-WCC5hH
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'A Doença do Refluxo Gastroesofágico (DRGE) é uma das mais importantes patologias do aparelho digestivo, considerando a elevada e crescente incidência, a intensidade dos sintomas e a gravidade das complicações. Segundo a Diretriz Brasileira de Conduta Terapêutica na Doença do Refluxo Gastroesofágico, é INCORRETO afirmar que:'
        alternativas:
          - id: alt_A
            texto: O uso de procinéticos está recomendado no tratamento da DRGE.
          - id: alt_B
            texto: O alginato é benéfico no controle dos sintomas de azia e regurgitação.
          - id: alt_C
            texto: Inibidores da Bomba de Prótons (IBPs) são os medicamentos de escolha no tratamento do refluxo ácido.
          - id: alt_D
            texto: Pacientes idosos em uso prolongado de IBPs devem ter seus níveis de vitamina B12 e magnésio verificados periodicamente.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            ```html
          <p>A Doença do Refluxo Gastroesofágico (DRGE) é uma condição comum que afeta o trato digestivo, caracterizada pelo retorno do conteúdo gástrico para o esôfago, causando sintomas como azia e regurgitação. O tratamento adequado é crucial para aliviar sintomas e prevenir complicações.</p>

          <p>Vamos analisar as alternativas:</p>

          <p><strong style="color:blue;">Alternativa A:</strong> <strong>O uso de procinéticos está recomendado no tratamento da DRGE.</strong></p>
          <p>Essa é a alternativa <span style="color:darkorange;"><strong>incorreta</strong></span>, pois os procinéticos não são recomendados como tratamento de primeira linha para DRGE. Embora possam ser úteis em casos específicos, como a presença de dismotilidade esofágica, eles não são eficazes isoladamente para o controle dos sintomas de refluxo. Segundo a Diretriz Brasileira de Conduta Terapêutica na DRGE, o foco principal são outros medicamentos.</p>

          <p><strong style="color:blue;">Alternativa B:</strong> <strong>O alginato é benéfico no controle dos sintomas de azia e regurgitação.</strong></p>
          <p>Essa afirmação está <span style="color:green;"><strong>correta</strong></span>. O alginato forma uma barreira física que impede o refluxo do conteúdo gástrico, aliviando sintomas de azia e regurgitação. É comumente usado em combinação com outros tratamentos para proporcionar alívio sintomático.</p>

          <p><strong style="color:blue;">Alternativa C:</strong> <strong>Inibidores da Bomba de Prótons (IBPs) são os medicamentos de escolha no tratamento do refluxo ácido.</strong></p>
          <p>Correta. Os IBPs são considerados a primeira linha de tratamento para DRGE. Eles reduzem significativamente a produção de ácido gástrico, aliviando os sintomas e prevenindo complicações. Diretrizes como as do <em>Harrison’s Principles of Internal Medicine</em> confirmam seu uso predominante.</p>

          <p><strong style="color:blue;">Alternativa D:</strong> <strong>Pacientes idosos em uso prolongado de IBPs devem ter seus níveis de vitamina B12 e magnésio verificados periodicamente.</strong></p>
          <p>Correta. O uso prolongado de IBPs pode levar a deficiências de vitamina B12 e magnésio, entre outros efeitos adversos, especialmente em pacientes idosos. Portanto, monitorar esses níveis é uma prática recomendada para prevenir complicações nutricionais.</p>

          <p><strong style="color:darkorange;">Conclusão:</strong> A alternativa <span style="color:darkorange;"><strong>A</strong></span> é a <span style="color:darkorange;"><strong>incorreta</strong></span>, pois os procinéticos não são recomendados como tratamento de primeira linha na DRGE.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          ```
          </div>

      - tipo: ME
        id: 121026-1640-6-YnOFKL
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'Sobre a esofagite de refluxo e a hérnia de hiato, assinale a alternativa correta:'
        alternativas:
          - id: alt_A
            texto: A hérnia de hiato de deslizamento é um fator de risco para o desenvolvimento da esofagite de refluxo.
            comentario: A hérnia de hiato de deslizamento predispõe ao refluxo gastroesofágico porque altera a anatomia e a competência da junção esofagogástrica, enfraquecendo a barreira antirrefluxo. Esse aumento da exposição ácida esofágica eleva o risco de esofagite de refluxo. Portanto, a afirmação de que ela é fator de risco está medicamente correta, sem exigir que seja causa necessária em todos os casos.
          - id: alt_B
            texto: A presença de úlceras esofágicas à endoscopia é um achado típico da esofagite por refluxo grave.
            comentario: Úlcera esofágica pode ocorrer em esofagite por refluxo grave, mas não é achado típico definidor. O padrão endoscópico clássico da esofagite de refluxo grave é a presença de erosões/rupturas mucosas extensas ou confluentes, especialmente em esôfago distal. A alternativa erra ao transformar uma complicação possível em marcador típico universal de gravidade.
          - id: alt_C
            texto: A manometria esofágica é o exame padrão- ouro para o diagnóstico da hérnia de hiato deslizante.
            comentario: A manometria esofágica é exame funcional, voltado à avaliação da motilidade e da localização funcional do esfíncter esofagiano inferior. Ela pode sugerir hérnia hiatal, mas não é o padrão-ouro para demonstrar hérnia hiatal deslizante. A demonstração anatômica é feita por métodos como endoscopia digestiva alta e estudo contrastado.
          - id: alt_D
            texto: O tratamento da esofagite de refluxo consiste apenas na prescrição de inibidores da bomba de prótons.
            comentario: 'A alternativa está errada pelo termo "apenas". O tratamento da esofagite de refluxo não se limita à prescrição de inibidor da bomba de prótons: também inclui medidas comportamentais, perda ponderal quando indicada e, em casos selecionados, tratamento cirúrgico. Reduzir o manejo a monoterapia farmacológica exclusiva contraria o princípio terapêutico básico da DRGE.'
          - id: alt_E
            texto: A cirurgia antirrefluxo é contraindicada no tratamento da hérnia de hiato de grande tamanho.
            comentario: É falsa a ideia de contraindicação geral da cirurgia antirrefluxo em hérnia hiatal grande. Pelo contrário, hérnias hiatais volumosas podem justamente integrar o contexto de indicação cirúrgica, conforme o quadro clínico. O erro médico da alternativa é inverter uma possível indicação em contraindicação.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: A</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Na hérnia hiatal deslizante, a junção esofagogástrica migra proximalmente e compromete a barreira antirrefluxo, favorecendo refluxo gastroesofágico; por isso, a alternativa A descreve corretamente um fator predisponente para esofagite de refluxo.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Hérnia hiatal e refluxo</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explorou absolutizações indevidas: chamar úlcera de achado "típico", dizer que a manometria é "padrão-ouro", reduzir o tratamento a "apenas" IBP e afirmar "contraindicação" cirúrgica onde pode haver indicação.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em hérnia hiatal deslizante, pense primeiro na perda da barreira antirrefluxo da junção esofagogástrica; isso favorece refluxo e esofagite.</li><li>Separe exame funcional de exame anatômico: manometria avalia motilidade; hérnia hiatal é demonstrada por métodos anatômicos como endoscopia e estudo contrastado.</li><li>Desconfie de alternativas com "apenas", "típico" ou "contraindicado" quando o tema envolve doenças com apresentação e manejo variáveis.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1640-7-GPNYjH
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'É o principal mecanismo de ação da metoclopramida que contribui para sua eficácia no tratamento da gastroparesia e do refluxo gastroesofágico:'
        alternativas:
          - id: alt_A
            texto: inibição da bomba de prótons no estômago, reduzindo a produção de ácido gástrico.
          - id: alt_B
            texto: bloqueio dos canais de cálcio, diminuindo a contratilidade do músculo liso gastrointestinal
          - id: alt_C
            texto: aumento da motilidade gástrica por antagonismo dos receptores de dopamina D2, facilitando o esvaziamento gástrico.
          - id: alt_D
            texto: agonismo dos receptores opiáceos, reduzindo a sensibilidade à dor e o desconforto gastrointestinal.
          - id: alt_E
            texto: inibição seletiva da recaptura de serotonina, melhorando o humor e indiretamente os sintomas gastrointestinais.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Para resolver a questão proposta, é importante entender o <strong>mecanismo de ação da metoclopramida</strong> no tratamento de condições como <span style="color: darkorange;"><strong>gastroparesia</strong></span> e <span style="color: darkorange;"><strong>refluxo gastroesofágico</strong></span>. Esses conhecimentos são fundamentais para identificar a alternativa correta.</p>

          <p>A alternativa correta é a <strong>Alternativa C</strong>: <span style="color: darkblue;">aumento da motilidade gástrica por antagonismo dos receptores de dopamina D2, facilitando o esvaziamento gástrico</span>.</p>

          <p><strong>Justificativa:</strong> A metoclopramida atua principalmente como um <span style="color: darkorange;"><strong>antagonista dos receptores de dopamina D2</strong></span>. Este bloqueio aumenta a motilidade gástrica, ajudando o estômago a esvaziar mais rapidamente, o que é crucial para tratar distúrbios como a gastroparesia e o refluxo gastroesofágico.</p>

          <p><strong>Análise das alternativas incorretas:</strong></p>

          <p><strong>A - Inibição da bomba de prótons:</strong> Esta ação está relacionada aos inibidores da bomba de prótons, como o omeprazol, e não à metoclopramida. Eles reduzem a produção de ácido gástrico, mas não afetam a motilidade gástrica.</p>

          <p><strong>B - Bloqueio dos canais de cálcio:</strong> Essa ação está associada a medicamentos que afetam a contratilidade do músculo liso, mas não é o mecanismo principal da metoclopramida.</p>

          <p><strong>D - Agonismo dos receptores opiáceos:</strong> Esta alternativa está incorreta, pois a metoclopramida não atua nos receptores opiáceos. Esses receptores estão mais relacionados ao controle da dor e não à motilidade gástrica.</p>

          <p><strong>E - Inibição seletiva da recaptura de serotonina:</strong> Esta ação é típica de antidepressivos, que podem melhorar o humor, mas não têm relação direta com o efeito da metoclopramida no trato gastrointestinal.</p>

          <p>Ao analisar as alternativas, a chave é <strong>associar o mecanismo de ação específico da metoclopramida</strong> com o aumento da motilidade gástrica, o que auxilia no tratamento dos distúrbios mencionados.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A resposta correta é a alternativa C. A metoclopramida é um agente pró-cinético que atua principalmente pelo antagonismo dos receptores de dopamina D2. A dopamina tem um efeito inibitório sobre a motilidade gastrointestinal, e ao bloquear esses receptores, a metoclopramida promove o aumento da motilidade gástrica, facilitando o esvaziamento do conteúdo do estômago para o intestino. Esse mecanismo de ação é particularmente eficaz no tratamento da gastroparesia, uma condição onde a motilidade gástrica está prejudicada, e no refluxo gastroesofágico, onde um esvaziamento gástrico mais rápido pode reduzir os episódios de refluxo. As outras alternativas não se aplicam ao mecanismo de ação primário da metoclopramida neste contexto: a inibição da bomba de prótons (A) é o mecanismo dos inibidores de bomba de prótons, o bloqueio dos canais de cálcio (B) está relacionado a certos medicamentos usados para outros fins, o agonismo dos receptores opiáceos (D) está relacionado ao controle da dor, e a inibição da recaptura de serotonina (E) é característica dos antidepressivos. Portanto, a alternativa C descreve corretamente o mecanismo de ação da metoclopramida no tratamento dessas condições.
          </div>

      - tipo: ME
        id: 121026-1640-8-IVP7zG
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Na avaliação cirúrgica de um paciente com doença do refluxo, qual dos sintomas abaixo NÃO se configura um sinal de alerta?
        alternativas:
          - id: alt_A
            texto: Vômito
          - id: alt_B
            texto: Perda de peso
          - id: alt_C
            texto: Melena
          - id: alt_D
            texto: Rouquidão
          - id: alt_E
            texto: Disfagia
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color: #0D47A1; font-weight: bold;">Comentário da banca:</span></p>

          <p><span style="text-decoration: underline; color: #FF6F00; font-weight: bold;">Tema central:</span> A questão aborda <strong>a identificação dos sinais de alerta</strong> (“alarmes” ou “red flags”) em pacientes com <span style="color: #0D47A1;"><strong>doença do refluxo gastroesofágico (DRGE)</strong></span>. Esse conceito é fundamental, pois sinais de alerta indicam possível gravidade, risco de malignidade ou complicações estruturais, exigindo avaliação rápida e, muitas vezes, endoscopia.</p>

          <p><span style="color: #0D47A1;"><strong>Alternativa correta: D) Rouquidão</strong></span></p>

          <p><span style="color: #FF6F00; font-weight: bold;">Justificativa:</span> 
          <strong>Rouquidão</strong> é considerada manifestação atípica, relacionada à irritação laríngea por refluxo, mas <span style="text-decoration: underline;">não configura um sinal de alerta</span> de gravidade ou necessidade imediata de investigação invasiva.</p>
          <p>Segundo as recomendações padronizadas (ex: <strong>UpToDate</strong>, <strong>ACG Clinical Guideline: Diagnosis and Management of GERD, 2022</strong>), <span style="color: #0D47A1;">rouquidão</span>, quando isolada, não implica diretamente risco aumentado de câncer, estenose ou sangramento.</p>

          <p><span style="color: #FF6F00;">Análise das alternativas incorretas:</span></p>
          <ul>
            <li><strong>Vômito (A):</strong> Pode indicar complicações como estenose ou até malignidade; é considerado <span style="color: #FF6F00; font-weight: bold;">sinal de alerta</span> para avaliação precoce.</li>
            <li><strong>Perda de peso (B):</strong> Sinal clássico de alarme, relacionado a doenças graves como câncer ou estenose. Fundamenta investigação imediata (<span style="color: #0D47A1;">recomendações internacionais e nacionais</span>).</li>
            <li><strong>Melena (C):</strong> Indica <span style="color: #FF6F00; font-weight: bold;">sangramento digestivo alto</span>; requer atenção urgente.</li>
            <li><strong>Disfagia (E):</strong> Indica dificuldade de progressão alimentar; pode sugerir estenose, neoplasia ou inflamação severa – outro <span style="color: #FF6F00;">sinal de alarme clássico</span>.</li>
          </ul>

          <p><span style="color: #0D47A1; font-weight: bold;">Estratégia de prova:</span> Os sinais de alarme exigem sempre <u>investigação adicional</u>. Palavras como “vômito persistente”, “disfagia”, “melena” ou “perda de peso inexplicada” apontam para complicação. Rouquidão é sintoma atípico, recorrente, mas pouco específico.</p>

          <p><span style="color: #0D47A1;"><strong>Diretriz e evidência:</strong></span> “A presença de sintomas de alarme como anemia, perda de peso, hemorragia digestiva, vômitos persistentes e disfagia justifica avaliação endoscópica imediata.” (<em>UpToDate, seção "Approach to the adult with dyspepsia and GERD", 2024</em>).</p>

          <p><span style="color: #FF6F00;"><strong>Resumo:</strong></span> <span style="color: #0D47A1; font-weight: bold;">Rouquidão</span> (<strong>D</strong>) não é sinal de alerta. Atenção à leitura cuidadosa nas provas, buscando <span style="color: #FF6F00;">termos de gravidade</span> para identificar as red flags.</p>

          <p><em>Gostou do comentário? Deixe sua avaliação aqui embaixo!</em></p>
          </div>

      - tipo: ME
        id: 121026-1640-9-hyU5KY
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Em relação à Doença do Refluxo Gastroesofágico (DRGE), analise as afirmativas a seguir.

          I. É definida pela presença de lesão mucosa característica observada na endoscopia digestiva alta e/ou pela exposição anormal ao ácido demonstrada pela manometria esofágica de 24h.

          II. É a condição na qual o refluxo do conteúdo gástrico para o esôfago resulta em sintomas e/ou complicações.

          III. O diagnóstico da doença do refluxo gastresofágico se baseia essencialmente no quadro clínico e na avaliação manométrica do órgão.

          IV. A endoscopia digestiva alta é o exame de escolha para o diagnóstico da DRGE.

          Está correto o que se afirma em
        alternativas:
          - id: alt_A
            texto: I, II e III, apenas.
          - id: alt_B
            texto: I, apenas.
          - id: alt_C
            texto: I, II, III e IV.
          - id: alt_D
            texto: I e II, apenas.
          - id: alt_E
            texto: II, apenas.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><strong>Alternativa Correta: E - II, apenas.</strong></p>

          <p>A questão trata sobre a <span style="color: darkorange;"><strong>Doença do Refluxo Gastroesofágico (DRGE)</strong></span>, uma condição médica em que o conteúdo do estômago retorna para o esôfago, causando sintomas incômodos e, em alguns casos, complicações. Para resolver a questão, é necessário entender como a DRGE é diagnosticada e quais exames são mais adequados para sua confirmação.</p>

          <p>Afirmativa II está correta: <span style="color: darkblue;"><strong>DRGE é a condição na qual o refluxo do conteúdo gástrico para o esôfago resulta em sintomas e/ou complicações.</strong></span> Essa definição é amplamente aceita na prática clínica, reconhecendo que o refluxo pode levar a diferentes manifestações, desde azia até complicações mais severas como esofagite.</p>

          <p><strong>Análise das Afirmativas Incorretas:</strong></p>

          <p><span style="color: darkorange;"><strong>Afirmativa I:</strong></span> Esta afirmativa sugere que a DRGE é definida pela presença de lesões mucosas características observadas na endoscopia ou pela manometria esofágica de 24 horas. No entanto, enquanto a endoscopia pode mostrar lesões, a manometria esofágica não é usada para medir a exposição ao ácido, mas sim para avaliar a motilidade esofágica. O exame de pHmetria de 24 horas seria mais apropriado para essa avaliação.</p>

          <p><span style="color: darkorange;"><strong>Afirmativa III:</strong></span> Indica que o diagnóstico da DRGE se baseia essencialmente no quadro clínico e na avaliação manométrica. Isso é incorreto, pois a manometria não é um exame de escolha para diagnosticar DRGE. O diagnóstico muitas vezes é clínico, baseado nos sintomas, e pode ser confirmado com a pHmetria esofágica.</p>

          <p><span style="color: darkorange;"><strong>Afirmativa IV:</strong></span> Alega que a endoscopia digestiva alta é o exame de escolha para o diagnóstico da DRGE. Apesar de a endoscopia ser usada para avaliar lesões esofágicas, não é o exame primário para diagnóstico da DRGE. O diagnóstico pode ser feito clinicamente e confirmado com outros exames, como a pHmetria.</p>

          <p>Em resumo, apenas a afirmativa II reflete corretamente o entendimento da DRGE em termos de definição e diagnóstico, enquanto as outras afirmativas apresentam imprecisões sobre os métodos diagnósticos.</p><p>

          </p><p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1640-10-uMnGcx
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Sabe-se que a endoscopia digestiva alta é um exame de baixa sensibilidade para o diagnóstico de doença do refluxo gastroesofágico. Contudo, alguns achados ao exame endoscópico conferem alta especificidade para tal patologia. Os pacientes que possuem esofagite de refluxo podem ser classificados de acordo com a classificação de Los Angeles.

          A opção que relaciona corretamente a classificação e sua respectiva descrição endoscópica adequada é:
        alternativas:
          - id: alt_A
            texto: 'A de Los Angeles: presença de uma ou mais erosões de até 5 mm'
          - id: alt_B
            texto: 'B de Los Angeles: presença de apenas uma erosão maior que 5 mm'
          - id: alt_C
            texto: 'C de Los Angeles: presença de erosões convergentes, envolvendo menos que 50% do órgão'
          - id: alt_D
            texto: 'D de Los Angeles: presença de erosões convergentes, que ocupem mais de 50% do órgão'
          - id: alt_E
            texto: 'E de Los Angeles: ausência de erosões'
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>O tema central da questão está relacionado à <span style="font-weight: bold; color: darkorange;">classificação de Los Angeles</span>, que é utilizada para categorizar a esofagite de refluxo com base em achados endoscópicos. Este é um tópico importante na <span style="font-weight: bold; color: darkorange;">gastroenterologia</span>, pois ajuda a determinar a gravidade da doença do refluxo gastroesofágico (DRGE) e a orientar o tratamento adequado.</p>

          <p><span style="text-decoration: underline; font-weight: bold;">Alternativa Correta:</span> <span style="color: darkblue;">A - A de Los Angeles: presença de uma ou mais erosões de até 5 mm</span></p>

          <p>A <span style="font-weight: bold; color: darkorange;">classificação de Los Angeles</span> é composta por quatro graus (A, B, C e D), que descrevem a extensão e a localização das erosões ou lesões no esôfago:</p>

          <ul>
            <li><span style="font-weight: bold; color: darkblue;">Grau A:</span> Uma ou mais erosões de até 5 mm de comprimento, que não se estendem entre as dobras esofágicas. Esta é a descrição correta para a alternativa A.</li>
            <li><span style="font-weight: bold; color: darkblue;">Grau B:</span> Uma ou mais erosões maiores que 5 mm, mas sem continuidade entre as dobras. A alternativa B está incorreta porque descreve erroneamente a extensão das erosões.</li>
            <li><span style="font-weight: bold; color: darkblue;">Grau C:</span> Erosões que se estendem entre as dobras, mas ocupam menos de 75% da circunferência do esôfago. A alternativa C está incorreta, pois menciona menos de 50%.</li>
            <li><span style="font-weight: bold; color: darkblue;">Grau D:</span> Erosões que ocupam mais de 75% da circunferência do esôfago. A alternativa D está incorreta por mencionar apenas 50%.</li>
          </ul>

          <p>A classificação mencionada como <span style="font-weight: bold; color: darkblue;">E de Los Angeles</span> na alternativa E não existe, sendo essa uma opção inválida.</p>

          <p>Esses conhecimentos são essenciais para a prática clínica, pois a correta identificação do grau de esofagite pode influenciar o manejo clínico e terapêutico dos pacientes com DRGE.</p>

          <p><span style="font-weight: bold;">Gostou do comentário? Deixe sua avaliação aqui embaixo!</span></p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A classificação de Los Angeles é utilizada para categorizar a gravidade da esofagite de refluxo com base nos achados endoscópicos. A resposta correta, alternativa A, indica que a categoria A de Los Angeles é caracterizada pela presença de uma ou mais erosões de até 5 mm, confinadas às pregas mucosas, que não se estendem entre as cristas das pregas adjacentes. Esta definição é específica e corresponde aos critérios estabelecidos para a classe A de esofagite. As outras opções são incorretas, pois não descrevem adequadamente a classificação correspondente de acordo com os critérios estabelecidos: a categoria B envolve uma ou mais erosões maiores que 5 mm que podem ser contínuas entre duas ou mais pregas mucosas; a categoria C tem erosões que se estendem por pelo menos 50% das pregas circunferenciais, mas não circundam completamente o esôfago; e a categoria D, a mais grave, apresenta erosões que circundam completamente o esôfago. A opção E está incorreta porque a ausência de erosões não se enquadra em nenhuma categoria da classificação de Los Angeles para esofagite de refluxo.
          </div>

      - tipo: VF
        id: 121026-1640-11-RUiAAu
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Uma paciente de 42 anos de idade, tabagista, foi atendida com desconforto retroesternal de forte intensidade, que a despertara do sono havia quatro horas. O incômodo era em queimação e estava acompanhado de náuseas. Ela referiu ter feito uma refeição copiosa antes de deitar e relatou apresentar halitose e salivação excessiva havia dois meses, porém negou antecedentes patológicos pessoais ou familiares significativos.
          O exame físico não revelou anormalidades significativas.
          O eletrocardiograma demonstrou alterações inespecíficas da repolarização ventricular.

          Com base nesse quadro clínico, julgue o próximo item.

          Uma endoscopia digestiva alta normal é suficiente para afastar o diagnóstico de doença do refluxo gastroesofágico nessa paciente.
        gabarito: F
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Para resolver esta questão, é importante entender o tema central: <strong>Doença do Refluxo Gastroesofágico (DRGE)</strong>. Esta condição ocorre quando o ácido do estômago frequentemente volta para o esôfago, irritando seu revestimento. Os sintomas comuns incluem <span style="color: darkorange;"><strong>azia</strong></span>, regurgitação ácida, além de halitose e salivação excessiva, como relatado pela paciente. O diagnóstico pode ser desafiador e não depende apenas de um exame endoscópico.</p>

          <p>A <strong>alternativa correta</strong> é <span style="color: darkblue;"><strong>E - errado</strong></span>. A justificativa para essa resposta está no fato de que uma endoscopia digestiva alta normal não é suficiente para afastar o diagnóstico de DRGE. Muitas vezes, a endoscopia pode não mostrar anormalidades, mesmo quando a DRGE está presente. É comum que o diagnóstico seja feito com base em uma combinação de sintomas clínicos, testes de pH esofágico e resposta ao tratamento com inibidores da bomba de prótons.</p>

          <p>Portanto, a afirmação de que a endoscopia normal afastaria o diagnóstico de DRGE está incorreta, pois o exame pode não detectar todos os casos da doença. Outros métodos diagnósticos são frequentemente necessários para confirmar a presença de DRGE.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1640-12-N0HJs7
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Durante a avaliação pré-operatória para cirurgia bariátrica, um paciente relata ter histórico de refluxo gastroesofágico grave.

          Assinale a abordagem mais apropriada em relação à seleção da técnica cirúrgica.
        alternativas:
          - id: alt_A
            texto: Selecionar uma técnica cirúrgica que minimize o risco de refluxo gastroesofágico.
          - id: alt_B
            texto: Realizar uma endoscopia digestiva alta para avaliar a gravidade do refluxo gastroesofágico.
          - id: alt_C
            texto: Proceder com a cirurgia bariátrica conforme planejado, uma vez que o refluxo gastroesofágico não é uma contraindicação absoluta para a cirurgia.
          - id: alt_D
            texto: Adiar a cirurgia bariátrica até que o refluxo gastroesofágico esteja completamente controlado com tratamento clínico.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b>Alternativa correta:</b> A - Selecionar uma técnica cirúrgica que minimize o risco de refluxo gastroesofágico.</p>

          <p>Para resolver essa questão, é essencial entender a relação entre cirurgia bariátrica e refluxo gastroesofágico (RGE). A cirurgia bariátrica é uma intervenção que visa a perda de peso em pacientes obesos, podendo envolver diferentes técnicas como a gastrectomia vertical (sleeve), o bypass gástrico e a banda gástrica ajustável. Cada uma dessas técnicas tem impactos distintos sobre o sistema gastrointestinal e, especificamente, sobre o refluxo gastroesofágico.</p>

          <p><b>Justificativa da alternativa correta:</b></p>
          <p><b>A:</b> A melhor abordagem para um paciente com histórico de RGE grave é escolher uma técnica cirúrgica que minimize o risco de piora da condição. Por exemplo, o <b>bypass gástrico</b> é frequentemente preferido, pois tende a reduzir os sintomas de refluxo devido à criação de uma pequena bolsa gástrica e ao desvio do fluxo alimentar do esôfago.</p>

          <p><b>Análise das alternativas incorretas:</b></p>

          <p><b>B:</b> Realizar uma endoscopia digestiva alta pode ser uma etapa importante da avaliação pré-operatória, mas não é a abordagem principal que a questão pede. A endoscopia auxilia na avaliação da gravidade do RGE e na identificação de possíveis complicações, mas não aborda diretamente a escolha da técnica cirúrgica.</p>

          <p><b>C:</b> Proceder com a cirurgia bariátrica conforme planejado sem considerar o impacto do RGE pode levar a complicações pós-operatórias. Ignorar a gravidade do RGE na escolha da técnica cirúrgica é uma abordagem inadequada e potencialmente perigosa para o paciente.</p>

          <p><b>D:</b> Adiar a cirurgia até que o RGE esteja completamente controlado não é a abordagem mais prática. O controle absoluto do RGE pode ser difícil de alcançar, e postergar a cirurgia pode retardar os benefícios da perda de peso. A escolha da técnica cirúrgica adequada é uma solução mais eficaz.</p>

          <p>Portanto, a alternativa <b>A</b> é a mais apropriada, pois prioriza a seleção de uma técnica cirúrgica que minimize o risco de agravamento do refluxo gastroesofágico.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A resposta correta é a alternativa A – Selecionar uma técnica cirúrgica que minimize o risco de refluxo gastroesofágico. O motivo dessa escolha está relacionado à necessidade de personalizar a abordagem cirúrgica para as condições clínicas específicas do paciente. Pacientes com histórico de refluxo gastroesofágico grave podem ter um risco aumentado de complicações ou exacerbação dos sintomas de refluxo após procedimentos bariátricos, especialmente com técnicas que potencialmente aumentam a pressão intra-abdominal ou alteram a anatomia do estômago e esfíncter esofágico inferior de maneiras que poderiam agravar o refluxo. Portanto, é prudente escolher uma técnica que seja menos provável de contribuir para o refluxo, como a gastrectomia vertical (sleeve) ou uma abordagem combinada que inclua medidas para controlar o refluxo, como a fundoplicatura de Nissen associada ao bypass gástrico, se for clinicamente indicado. Enquanto as outras opções podem ser consideradas durante a avaliação pré-operatória, elas não abordam diretamente a necessidade de ajustar a técnica cirúrgica com base no histórico de refluxo do paciente, que é a prioridade para reduzir o risco de complicações pós-operatórias, e assim melhorar os resultados da cirurgia bariátrica.
          </div>

