      - tipo: ME
        id: 121026-1655-1-NgW5rJ
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Quais sintomas são considerados atípicos da Doença do Refluxo Gastroesofágico (DRGE)?
        alternativas:
          - id: alt_A
            texto: Regurgitação ácida e disfagia.
            comentario: Está incorreta porque regurgitação ácida é sintoma típico da DRGE. Além disso, disfagia não compõe o conjunto clássico de sintomas atípicos cobrados aqui; seu significado clínico é distinto, funcionando mais como sintoma de alarme, possível complicação ou diagnóstico diferencial.
          - id: alt_B
            texto: Pirose e regurgitação ácida.
            comentario: Está incorreta porque pirose e regurgitação ácida são exatamente os sintomas típicos da DRGE. Portanto, a alternativa contradiz diretamente o critério pedido no enunciado, que é identificar manifestações atípicas.
          - id: alt_C
            texto: Disfagia e pirose.
            comentario: Está incorreta porque pirose é um marcador clínico típico da DRGE, o que já exclui a alternativa como resposta para sintomas atípicos. A presença de disfagia não corrige isso, porque disfagia não forma, com pirose, um par clássico de manifestações atípicas/extraesofágicas.
          - id: alt_D
            texto: Dor torácica e globus faríngeo.
            comentario: 'A alternativa D está correta porque reúne duas manifestações reconhecidas como atípicas/extraesofágicas da DRGE: dor torácica não cardíaca e globus faríngeo. Em contraste com pirose e regurgitação ácida, que são os sintomas típicos, esses achados pertencem ao grupo não típico associado ao refluxo.'
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: D</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O critério decisivo é a distinção semiológica entre sintomas típicos e atípicos da DRGE: pirose e regurgitação ácida são típicos, enquanto dor torácica não cardíaca e globus faríngeo são manifestações atípicas/extraesofágicas. Como o enunciado pede especificamente os sintomas atípicos, a alternativa correta é a D.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Sintomas da DRGE</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora duas confusões: misturar um sintoma típico forte, como pirose ou regurgitação, com outro sintoma para induzir erro, e confundir globus faríngeo com disfagia, embora tenham significados clínicos diferentes.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em DRGE, primeiro separe o par típico clássico: pirose e regurgitação ácida.</li><li>Quando a questão pedir manifestações atípicas ou extraesofágicas, pense em dor torácica não cardíaca e globus antes de aceitar alternativas com pirose ou regurgitação.</li><li>Não trate disfagia como sinônimo de globus: globus é sensação de bolo na garganta; disfagia é dificuldade de deglutição e tem implicação clínica diferente.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-2-nYY4hP
        tags:
