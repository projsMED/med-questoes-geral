          <p><span style="color:#164194;"><u>Ponto-chave para provas:</u></span> Fique atento a detalhes de procedimentos. Termos genéricos como “instalação cirúrgica de anel” podem ser uma <span style="color:#D2691E;">pegadinha</span>. Busque sempre associar descrições com a técnica clássica de referência.</p>

          <p><span style="color:#D2691E;">Dica de prova:</span> Em tratamento cirúrgico de hérnia de hiato, marque <strong>fundoplicatura de Nissen</strong> como padrão ouro. Alterações desse conceito, mesmo que discretas, costumam caracterizar a alternativa errada.</p>

          <p><span style="color:#164194;"><u>Referências:</u></span> “A cirurgia mais utilizada é a fundoplicatura de Nissen.” – <em>Harrison, Medicina Interna, 21ª ed., p. 2103</em><br>
