        enunciado: 'A doença do refluxo gastroesofágico (DRGE) é definida como uma afecção crônica decorrente do fluxo retrógrado do conteúdo gastroduodenal para o esôfago e/ou órgãos adjacentes a ele, acarretando um espectro variável de sintomas e/ou sinais esofagianos e/ou extraesofagianos, associados ou não a lesões teciduais. São manifestações típicas da DRGE:'
        alternativas:
          - id: alt_A
            texto: pirose e regurgitação
          - id: alt_B
            texto: dor torácica e tosse
          - id: alt_C
            texto: laringite e hemoptise
          - id: alt_D
            texto: rouquidão e pigarro
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>A alternativa correta é <strong style="color: darkorange;">A - pirose e regurgitação</strong>. Vamos entender o porquê.</p>

          <p>A <strong>Doença do Refluxo Gastroesofágico (DRGE)</strong> é uma condição crônica que ocorre quando o conteúdo do estômago volta para o esôfago, causando sintomas e potenciais danos aos tecidos. Esse refluxo pode afetar o esôfago e órgãos adjacentes, apresentando uma variedade de sintomas.</p>

          <p><strong style="color: darkblue;">Pirose</strong>, conhecida popularmente como azia, é uma sensação de queimação que sobe do estômago para o esôfago, frequentemente sentida no peito ou garganta. Já a <strong style="color: darkblue;">regurgitação</strong> é a percepção de retorno do conteúdo gástrico para a boca ou garganta, sem o esforço de vômito. Ambas são manifestações típicas da DRGE e estão frequentemente associadas a esse diagnóstico, justificando a escolha da alternativa A.</p>

          <p>Vamos analisar as alternativas incorretas:</p>

          <p><strong style="color: darkorange;">B - dor torácica e tosse</strong>: Embora a dor torácica possa ocorrer na DRGE, ela não é uma manifestação típica, já que pode ser confundida com problemas cardíacos. A tosse, por sua vez, é um sintoma extraesofágico menos comum e não caracteriza a apresentação típica da doença.</p>

          <p><strong style="color: darkorange;">C - laringite e hemoptise</strong>: Laringite pode ser uma complicação extraesofágica da DRGE, mas não é uma apresentação típica. Hemoptise, que é a expectoração de sangue, não é usualmente associada ao refluxo gastroesofágico, sendo mais indicativa de outras condições pulmonares ou cardiovasculares.</p>

          <p><strong style="color: darkorange;">D - rouquidão e pigarro</strong>: Esses são sintomas extraesofágicos e podem ocorrer na DRGE, mas não configuram a apresentação clássica da doença, sendo mais associados a irritações crônicas da laringe ou faringe devido ao refluxo contínuo.</p>

          <p>Entender as manifestações típicas e atípicas da DRGE é crucial em concursos públicos, pois ajuda a diferenciar essa condição de outras doenças com sintomas semelhantes.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

