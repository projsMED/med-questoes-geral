        enunciado: "Quanto à doença do refluxo gastroesofágico (DRGE) e suas complicações, julgue o item que se segue.\_\n\nNos casos de biópsias esofágicas em DRGE com Barrett, caso não haja displasia, está indicado o seguimento endoscópico com biópsias seriadas a cada 24 meses."
        gabarito: V
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange; font-weight:bold;">Comentário da Questão:</span></p>

          <p><b>Tema central:</b> <span style="color:navy;">Esôfago de Barrett em Doença do Refluxo Gastroesofágico (DRGE)</span></p>

          <p>A questão avalia o conhecimento sobre o <b>seguimento endoscópico nos casos de esôfago de Barrett sem displasia</b>, condição em que o epitélio do esôfago é substituído por metaplasia intestinal, elevando o risco de <u>adenocarcinoma esofágico</u>.</p>

          <p><span style="color:darkorange;"><b>Justificativa da alternativa correta:</b></span></p>
          <p>De acordo com as <b>diretrizes internacionais e nacionais</b>, como as “Guidelines for the Diagnosis and Management of Gastroesophageal Reflux Disease” e recomendações de sociedades como a American Gastroenterological Association (AGA) e a Sociedade Brasileira de Endoscopia Digestiva (SOBED), a conduta para o esôfago de Barrett <b>sem displasia</b> não é o seguimento bienal (a cada 24 meses). O intervalo orientado é de <span style="color:navy;"><b>3 a 5 anos</b></span>, visto o baixo risco de progressão para câncer (cerca de 0,3% ao ano).</p>

          <p>O trecho oficial destaca: <span style="color:navy;">“O intervalo de vigilância recomendado é de 5 anos.”</span> (Guidelines GERD, Seção “Vigilância do Esôfago de Barrett”)</p>

          <p><span style="color:darkorange;"><b>Análise das alternativas:</b></span></p>
          <p><b>C) Certo:</b> <span style="color: darkred;">Incorreta</span>. Indicar seguimento a cada 24 meses é <u>mais frequente do que o recomendado</u>, podendo levar a procedimentos desnecessários, sobrecarga nos serviços e custos extras, sem benefício comprovado para esse perfil de paciente.</p>
          <p><b>E) Errado:</b> <span style="color:darkgreen;"><b>Correta</b></span>. Segundo as diretrizes, o período de 3 a 5 anos é suficiente para detecção precoce de displasia ou neoplasia, sendo a alternativa alinhada à melhor prática assistencial. Portanto, a resposta é “Errado”.</p>

          <p><span style="color: darkorange;">Estratégia para provas:</span> Sempre identifique a <u>classificação do Barrett</u> (com ou sem displasia) e se o intervalo proposto condiz com os <b>protocolos atuais</b>. Intervalos menores geralmente se aplicam apenas para Barrett com displasia de baixo grau (6-12 meses) ou alto grau (ainda mais frequente).</p>

          <p>Conforme Harrison’s (“Principles of Internal Medicine”, 21ª ed.): <span style="color:navy;">“Em Barrett sem displasia, recomenda-se vigilância em intervalos de três a cinco anos.”</span></p>

          <p><b>Resumo para fixação:</b> <span style="color:navy;">Barrett SEM displasia: endoscopia a cada 3-5 anos.</span></p>

