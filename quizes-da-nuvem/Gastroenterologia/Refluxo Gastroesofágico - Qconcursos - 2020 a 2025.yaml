          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>A alternativa correta é: <b>C - A afirmativa II é verdadeira, e a I é falsa.</b></p>

          <p>A Doença do Refluxo Gastroesofágico (DRGE) é uma condição comum que afeta muitas pessoas. Vamos analisar cada uma das afirmativas para entender melhor essa patologia.</p>

          <p><b><span style="color: darkorange;">Afirmativa I:</span></b> "Consideramos sintomas típicos da Doença do refluxo gastroesofágico (DRGE) a pirose e a regurgitação. A prevalência da pirose é diferente entre as idades, pois é um sintoma que só aparece em idosos, jamais ocorrendo em indivíduos jovens."</p>

          <p>Esta afirmativa está <b>falsa</b>. Embora seja verdadeiro que a pirose (sensação de queimação) e a regurgitação são sintomas típicos da DRGE, a ideia de que a pirose só ocorre em idosos está incorreta. A pirose pode afetar indivíduos de todas as idades, incluindo jovens. Portanto, afirmar que a pirose "jamais" ocorre em indivíduos jovens é um equívoco.</p>

          <p><b><span style="color: darkorange;">Afirmativa II:</span></b> "Os fatores desencadeantes mais comuns são os alimentos gordurosos ou picantes, cítricos, carminativos, café, refrigerantes, álcool, refeições volumosas, tabaco, medicamentos e o hábito de se deitar imediatamente após as refeições."</p>

          <p>Esta afirmativa está <b>verdadeira</b>. Os fatores listados são, de fato, conhecidos por desencadear ou agravar os sintomas da DRGE. Alimentos gordurosos e picantes, bem como bebidas como café e álcool, são conhecidos por relaxar o esfíncter esofágico inferior, permitindo que o ácido do estômago retorne ao esôfago. Além disso, o hábito de se deitar logo após as refeições pode aumentar a chance de refluxo.</p>

          <p>Vamos agora justificar porque as outras alternativas estão incorretas:</p>

          <p><b>A - As duas afirmativas são verdadeiras:</b> Como vimos, a afirmativa I é falsa, então essa alternativa está incorreta.</p>

          <p><b>B - A afirmativa I é verdadeira, e a II é falsa:</b> Sabemos que a afirmativa I é falsa e a II é verdadeira, então essa alternativa também está incorreta.</p>

          <p><b>D - As duas afirmativas são falsas:</b> A afirmativa II é verdadeira, então essa alternativa está incorreta.</p>

          <p>Portanto, a alternativa correta é a <b>C</b>. É importante estar atento ao conhecimento atualizado sobre sintomas e fatores desencadeantes da DRGE para responder corretamente questões como essa.</p>

          <p><i>Gostou do comentário? Deixe sua avaliação aqui embaixo!</i></p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A alternativa correta é a C, pois a afirmativa II está correta e a afirmativa I está incorreta. A afirmativa II corretamente identifica uma variedade de fatores que podem desencadear sintomas da Doença do Refluxo Gastroesofágico (DRGE), como alimentos gordurosos, picantes, cítricos, carminativos (que favorecem a eliminação de gases), cafeína contida no café, refrigerantes, álcool, refeições volumosas e tabaco, além do consumo de certos medicamentos e o hábito de se deitar logo após comer. Estes fatores são reconhecidos por aumentar a probabilidade de ocorrência do refluxo ácido, quando o conteúdo estomacal retorna ao esôfago, causando desconforto e potenciais danos ao esôfago.

            Por outro lado, a afirmativa I é falsa porque afirma erroneamente que os sintomas de DRGE, como a pirose (uma sensação de queimação no peito) e a regurgitação, apenas aparecem em idosos. De fato, esses sintomas podem ocorrer em pessoas de qualquer idade, não sendo exclusivos da população idosa. Pessoas jovens também podem sofrer de DRGE e apresentar esses sintomas típicos. Portanto, a limitação dos sintomas à população idosa é incorreta, o que torna a afirmativa I falsa, e a única opção que reflete essa análise é a alternativa C.
          </div>

      - tipo: ME
        id: 121026-1640-28-dDRUrY
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          A Doença do Refluxo Gastroesofágico (DRGE) é uma das mais importantes afecções digestivas, tendo em vista as elevadas e crescentes incidências, a intensidade dos sintomas e a gravidade das complicações. Neste contexto foram estabelecidos, em 2021, os Guidelines Clínicos para o Diagnóstico e Tratamento da DRGE (Clinical Guideline for the Diagnosis and Management of Gastroesophageal Reflux Disease – American College of Gastroenterology.). Considerando tais recomendações, analise as afirmativa a seguir.

          I. Recomenda-se a realização de endoscopia diagnóstica, idealmente após a interrupção dos Inibidores de Bomba de Prótons (IBPs) por 2 a 4 semanas, em pacientes cujos sintomas clássicos de DRGE não respondem adequadamente ao tratamento empírico de 8 semanas com IBPs ou cujos sintomas retornam quando os IBPs são descontinuados.

          II. Recomenda-se terapia de manutenção com IBP por tempo indeterminado ou cirurgia antirrefluxo para pacientes com esofagite grau C ou D de Los Angeles.

          III. Em pacientes para os quais o diagnóstico de DRGE é suspeito, mas não está claro, e a endoscopia não mostra nenhuma evidência objetiva de DRGE, recomenda-se que o monitoramento do refluxo com pHmetria seja realizado fora da terapia para estabelecer o diagnóstico.

          Está correto o que se afirma em
        alternativas:
          - id: alt_A
            texto: I, II e III.
          - id: alt_B
            texto: I e II, apenas.
          - id: alt_C
            texto: I e III, apenas.
          - id: alt_D
            texto: II e III, apenas.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:#1f3b73"><b>Tema central:</b></span> diagnóstico e manejo da Doença do Refluxo Gastroesofágico (DRGE) segundo o guideline do American College of Gastroenterology (ACG, 2021).</p>

          <p><span style="color:#cc5500"><b>Gabarito: A – I, II e III.</b></span></p>

          <p><span style="color:#1f3b73"><b>Por que a alternativa A é correta?</b></span></p>

          <p><b>I.</b> Em sintomas típicos que <u>não respondem</u> a 8 semanas de IBP ou recaem ao suspender, o ACG recomenda <b>endoscopia diagnóstica</b> após <u>interromper IBP por 2–4 semanas</u>. Isso aumenta a chance de detectar <b>esofagite erosiva</b>, classificar pela <b>Los Angeles</b>, avaliar <b>Barrett</b> e considerar diagnósticos diferenciais como <b>esofagite eosinofílica</b>. Alarme (disfagia, perda ponderal, sangramento) indica endoscopia imediata. Referência: ACG 2021; UpToDate 2024.</p>

          <p><b>II.</b> Em <b>esofagite grave (LA C/D)</b>, a recidiva e complicações (estenose, sangramento) são frequentes se suspender IBP. Por isso, o ACG recomenda <b>manutenção com IBP por tempo indeterminado</b> na menor dose eficaz ou considerar <b>cirurgia antirrefluxo</b> (fundoplicatura) quando preferencial, em jovens, hérnia hiatal volumosa ou sintomas refratários bem documentados. Referência: ACG 2021; Harrison’s 21ª ed.</p>

          <p><b>III.</b> Se a endoscopia é <b>normal</b> e o diagnóstico ainda é suspeito, recomenda-se <b>pHmetria/impedâncio-pH</b> <u>fora de IBP</u> para <b>confirmar DRGE</b> (tempo de exposição ácida elevado e associação sintoma-refluxo). A monitorização <u>em uso de IBP</u> é reservada a <b>DRGE comprovada</b> com sintomas persistentes. Referência: ACG 2021.</p>

          <p><span style="color:#1f3b73"><b>Análise das alternativas incorretas</b></span></p>
          <p><b>B (I e II):</b> Incompleta, pois a afirmação III também está de acordo com o guideline (pHmetria off-therapy quando não há evidência endoscópica).</p>
          <p><b>C (I e III):</b> Incompleta; a manutenção com IBP ou cirurgia em LA C/D (II) é recomendação forte do ACG.</p>
          <p><b>D (II e III):</b> Incompleta; a endoscopia após suspensão de IBP por 2–4 semanas (I) é recomendada em refratariedade/recorrência.</p>

          <p><span style="color:#cc5500"><b>Estratégia de prova:</b></span> Grife três chaves do ACG: <u>“endoscopia off-IBP 2–4 semanas”</u> em refratariedade; <u>“IBP manutenção ou cirurgia”</u> para LA C/D; <u>“pHmetria off-therapy”</u> quando endoscopia normal e diagnóstico incerto. Lembre-se: pHmetria <u>on-therapy</u> só para DRGE já documentada com sintomas persistentes.</p>

          <p><span style="color:#1f3b73"><b>Resumo clínico útil</b></span>: sintomas típicos (pirose, regurgitação); sinais de alarme pedem endoscopia precoce; IBP é primeira linha; confirme DRGE com teste fisiológico quando a endoscopia é normal e a suspeita persiste.</p>

          <p><span style="color:#1f3b73"><b>Referências</b></span>: ACG Clinical Guideline for the Diagnosis and Management of GERD (2021); UpToDate (Gastroesophageal reflux in adults, 2024); Harrison’s Principles of Internal Medicine, 21ª ed.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A alternativa correta é a "A - I, II e III", pois todas as três afirmativas estão alinhadas com as recomendações estabelecidas nos Guidelines Clínicos para o Diagnóstico e Tratamento da Doença do Refluxo Gastroesofágico (DRGE) de 2021 da American College of Gastroenterology.

            Na primeira afirmativa (I), é recomendado que a endoscopia diagnóstica seja realizada após uma interrupção dos Inibidores de Bomba de Prótons (IBPs) por 2 a 4 semanas em pacientes que não tiveram resposta ao tratamento empírico de 8 semanas com IBPs ou em casos em que os sintomas reaparecem após a interrupção do uso de IBPs. Isso se deve ao fato de que os IBPs podem mascarar os sintomas e as evidências endoscópicas da doença, impedindo um diagnóstico adequado.

            Na segunda afirmativa (II), é recomendada a terapia de manutenção com IBP por tempo indeterminado ou cirurgia antirrefluxo para pacientes com esofagite erosiva grave, especificamente grau C ou D de Los Angeles. Essas são opções para prevenir as recidivas dos sintomas e as complicações da esofagite erosiva.

            Por último, a terceira afirmativa (III) destaca a recomendação de realizar monitoramento do refluxo com pHmetria fora da terapia (sem uso de IBPs) em pacientes nos quais o diagnóstico de DRGE é suspeito, mas não confirmado pela endoscopia, e não há evidência objetiva da doença. O monitoramento com pHmetria pode confirmar ou excluir o diagnóstico de DRGE baseando-se na quantidade e na qualidade do refluxo ácido para o esôfago.

            Todas essas recomendações têm como objetivo otimizar o diagnóstico e o tratamento da DRGE, proporcionando um manejo mais eficaz e evitando complicações da doença.
          </div>

      - tipo: ME
        id: 121026-1640-29-tKWrOv
        tags:
