          <p>A alternativa <span style="color: darkorange; font-weight: bold;">B - III e IV, apenas</span> é a correta.</p>

          <p>Vamos analisar cada afirmativa para entender melhor essa questão:</p>

          <p><b>I. A endoscopia digestiva alta (EDA) é o teste padrão-ouro para o diagnóstico do RGE.</b></p>
          <p>A afirmativa <span style="color: red;">está incorreta</span>. A endoscopia digestiva alta (EDA) é uma ferramenta importante no diagnóstico de complicações do RGE, como esofagite, mas não é o padrão-ouro para diagnosticar o RGE em si. O teste padrão-ouro é a pHmetria esofágica de 24 horas, que mede a exposição ácida esofágica.</p>

          <p><b>II. A presença de regurgitação no contexto do RGE geralmente indica uma hérnia hiatal.</b></p>
          <p>Essa afirmativa também <span style="color: red;">está incorreta</span>. Embora a regurgitação seja um sintoma comum do RGE, ela não é específica de hérnia hiatal. Muitas pessoas com RGE não têm hérnia hiatal, e a herniação do estômago através do hiato esofágico não é sempre correlacionada com a presença de regurgitação.</p>

          <p><b>III. A ausência de pirose e regurgitação não afasta o diagnóstico de RGE.</b></p>
          <p>Esta afirmativa <span style="color: green; font-weight: bold;">está correta</span>. O RGE pode se manifestar através de sintomas atípicos, como tosse crônica, rouquidão ou asma, entre outros. A ausência de pirose e regurgitação, portanto, não exclui o diagnóstico.</p>

          <p><b>IV. Na pessoa idosa, antes de prescrever tratamento antiácido, é necessário investigar anemia crônica e presença de osteopenia / osteoporose.</b></p>
          <p>Esta afirmativa <span style="color: green; font-weight: bold;">está correta</span>. Em idosos, o uso prolongado de inibidores da bomba de prótons, que são antiácidos potentes, pode estar associado a um risco aumentado de anemia por deficiência de vitamina B12, bem como a osteopenia e osteoporose, devido à má absorção de cálcio.</p>

          <p>Portanto, a alternativa correta é <span style="color: darkorange; font-weight: bold;">B - III e IV, apenas</span>, pois as afirmativas III e IV são verdadeiras.</p>

