        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Vamos explorar o tema central desta questão: <strong><span style="color:darkorange;">doença do refluxo gastroesofágico (DRGE)</span></strong>. Essa condição é caracterizada pelo retorno do conteúdo gástrico para o esôfago, causando sintomas como dispepsia, refluxo ácido e dor retroesternal, como descrito no caso da paciente.</p>

          <p>Para confirmar a hipótese de DRGE e quantificá-la, precisamos identificar o exame complementar mais adequado. A alternativa correta é a <strong><span style="color:darkorange;">B - PHmetria esofageana.</span></strong></p>

          <p><strong>Justificativa:</strong></p>

          <p><span style="color:darkorange;"><strong>PHmetria esofageana</strong></span> é o exame padrão para diagnosticar e quantificar o refluxo gastroesofágico. Ele mede o tempo e a frequência em que o ácido do estômago está presente no esôfago, fornecendo dados precisos sobre a acidez esofágica e confirmando a presença de refluxo.</p>

          <p><strong>Análise das alternativas incorretas:</strong></p>

          <p><strong>A - Manometria esofageana:</strong> Este exame avalia a motilidade e a pressão esofágica, sendo indicado principalmente para investigar distúrbios motores do esôfago, e não para quantificar o refluxo.</p>

          <p><strong>C - Seriografia esôfago-estômago-duodeno:</strong> Este é um exame radiológico que fornece imagens do trato gastrointestinal, mas não é específico para detectar ou quantificar refluxo ácido.</p>

          <p><strong>D - Endoscopia digestiva alta:</strong> Embora útil para visualizar o esôfago e identificar inflamações ou lesões, ela não quantifica o refluxo. A endoscopia pode sugerir DRGE, mas não quantifica os episódios de refluxo.</p>

          <p><strong>E - Tomografia computadorizada de abdome:</strong> Este exame não é utilizado para avaliar refluxo gastroesofágico, sendo mais adequado para investigar outras condições abdominais.</p>

          <p>Compreender <strong>qual exame é mais apropriado</strong> para cada situação clínica é crucial na prática médica. Ao enfrentar questões como esta, lembre-se de relacionar os sintomas do paciente com os exames capazes de fornecer informações detalhadas e específicas para o diagnóstico.</p>

          <p><strong>Gostou do comentário? Deixe sua avaliação aqui embaixo!</strong></p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
