      - tipo: ME
        id: 121026-1653-12-IJQeMV
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          O refluxo gastroesofágico (RGE) é uma das queixas mais frequentes no consultório de gastroenterologia pediátrica.
          A respeito do RGE, assinale a afirmativa correta.
        alternativas:
          - id: alt_A
            texto: A doença do refluxo gastroesofágico (DRGE) associa-se a esofagite, manifestações respiratórias e déficit nutricionais.
          - id: alt_B
            texto: O diagnóstico diferencial entre RGE e DRGE requer estudo contrastado do esôfago.
          - id: alt_C
            texto: O RGE do lactente apresenta evolução linear com resolução após a introdução alimentar.
          - id: alt_D
            texto: A síndrome de Sandifer é caracterizada por apneia, cianose e perda do tônus muscular.
          - id: alt_E
            texto: No RGE está indicado o uso de inibidores de bomba de prótons a fim de diminuir os episódios de regurgitação.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><strong>Tema Central:</strong></p>

          <p>O tema central da questão é o <span style="color:darkorange;"><strong>refluxo gastroesofágico (RGE)</strong></span>, uma condição comum na prática clínica, especialmente em pediatria. O foco está em diferenciar a condição normal de refluxo em lactentes do quadro patológico chamado de <span style="color:darkorange;"><strong>doença do refluxo gastroesofágico (DRGE)</strong></span>, além de compreender o manejo adequado e as complicações associadas.</p>

          <p><strong>Alternativa Correta: A</strong></p>

          <p>A afirmativa <strong>A</strong> está correta: "<span style="color:darkblue;">A doença do refluxo gastroesofágico (DRGE) associa-se a esofagite, manifestações respiratórias e déficit nutricionais.</span>"</p>

          <p>A <strong>DRGE</strong> é uma condição em que o refluxo causa sintomas ou complicações que afetam a qualidade de vida. Isso pode incluir <span style="text-decoration:underline;">esofagite</span> (inflamação do esôfago), <span style="text-decoration:underline;">manifestações respiratórias</span> como tosse crônica ou asma, e <span style="text-decoration:underline;">déficit nutricional</span> devido à má absorção ou recusa alimentar. Essa alternativa aborda corretamente as complicações associadas ao quadro patológico do refluxo.</p>

          <p><strong>Análise das Alternativas Incorretas:</strong></p>

          <p><strong>B</strong>: "<span style="color:darkblue;">O diagnóstico diferencial entre RGE e DRGE requer estudo contrastado do esôfago.</span>" - Esta alternativa está incorreta. O <strong>diagnóstico diferencial</strong> entre RGE fisiológico e DRGE é principalmente clínico, baseado na história do paciente e nos sintomas apresentados. Estudos contrastados, como a radiografia com contraste, não são essenciais para esse diagnóstico.</p>

          <p><strong>C</strong>: "<span style="color:darkblue;">O RGE do lactente apresenta evolução linear com resolução após a introdução alimentar.</span>" - O RGE em lactentes geralmente melhora com o tempo, mas a <strong>resolução</strong> não está necessariamente ligada diretamente à introdução alimentar. Muitos lactentes superam o refluxo à medida que o sistema digestivo amadurece, independente da introdução de novos alimentos.</p>

          <p><strong>D</strong>: "<span style="color:darkblue;">A síndrome de Sandifer é caracterizada por apneia, cianose e perda do tônus muscular.</span>" - A <strong>síndrome de Sandifer</strong> é caracterizada por movimentos anormais da cabeça e pescoço associados ao refluxo gastroesofágico, mas não por apneia e cianose. A descrição dada na alternativa está incorreta.</p>

          <p><strong>E</strong>: "<span style="color:darkblue;">No RGE está indicado o uso de inibidores de bomba de prótons a fim de diminuir os episódios de regurgitação.</span>" - Para casos de <strong>RGE fisiológico</strong> em lactentes saudáveis, o uso de inibidores de bomba de prótons não é indicado. Esses medicamentos são reservados para casos de DRGE, onde há complicações ou sintomas severos.</p>

          <p><strong>Conclusão:</strong></p>

          <p>É importante entender as diferenças entre RGE fisiológico e DRGE, assim como reconhecer as indicações corretas para tratamento e as complicações possíveis, para responder questões como essa corretamente.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: VF
        id: 121026-1653-13-VEiiRo
        tags:
