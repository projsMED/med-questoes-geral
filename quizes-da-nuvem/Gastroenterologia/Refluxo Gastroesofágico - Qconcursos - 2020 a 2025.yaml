        enunciado: A doença do refluxo gastroesofágico (DRGE) ocorre quando o refluxo do conteúdo proveniente do estômago torna-se sintomático e/ou gera complicações para o paciente. Trata-se de uma patologia de alta prevalência tanto na atenção primária como nos consultórios de gastroenterologia, ocasionando um impacto considerável na qualidade de vida dos doentes, assim como custos elevados para os serviços de saúde. Para indicação de tratamento endoscópico na DRGE, são necessários exames específicos. Assinale a alternativa correta que os apresenta.
        alternativas:
          - id: alt_A
            texto: Manometria de alta resolução e impedâncio-pHmetria de 24 horas.
          - id: alt_B
            texto: Impedâncio-pHmetria de 24 horas e esofagograma.
          - id: alt_C
            texto: Radiografia simples de tórax e endoscopia digestiva alta (EDA).
          - id: alt_D
            texto: Endoscopia digestiva alta (EDA) e esofagograma baritado.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p style="text-align: justify;">A questão aborda a <span style="color: darkorange; font-weight: bold;">doença do refluxo gastroesofágico (DRGE)</span>, uma condição comum que ocorre quando há refluxo do conteúdo estomacal para o esôfago, causando sintomas e potenciais complicações. A DRGE é de alta prevalência, afetando a qualidade de vida dos pacientes e gerando custos significativos para a saúde pública.</p>

          <p style="text-align: justify;">A questão pede para identificar os exames necessários para a indicação de tratamento endoscópico na DRGE. Vamos analisar as alternativas:</p>

          <p style="text-align: justify;"><span style="color: darkblue; font-weight: bold;">Alternativa A:</span> Manometria de alta resolução e impedâncio-pHmetria de 24 horas. <span style="color: darkorange;">Esta é a alternativa correta.</span> A <span style="text-decoration: underline;">manometria de alta resolução</span> é importante para avaliar a motilidade esofágica e excluir distúrbios motores que podem simular DRGE. A <span style="text-decoration: underline;">impedâncio-pHmetria de 24 horas</span> é o padrão-ouro para confirmar o diagnóstico de DRGE, pois mede tanto a quantidade de refluxo ácido quanto não ácido.</p>

          <p style="text-align: justify;"><span style="color: darkblue; font-weight: bold;">Alternativa B:</span> Impedâncio-pHmetria de 24 horas e esofagograma. A impedâncio-pHmetria é correta, mas o <span style="color: darkorange;">esofagograma</span> não é utilizado para indicação de tratamento endoscópico da DRGE; ele é mais apropriado para avaliar a anatomia esofágica e detectar hérnias de hiato.</p>

          <p style="text-align: justify;"><span style="color: darkblue; font-weight: bold;">Alternativa C:</span> Radiografia simples de tórax e endoscopia digestiva alta (EDA). Enquanto a <span style="color: darkorange;">endoscopia digestiva alta</span> é útil para avaliar complicações da DRGE, como esofagite erosiva ou estenoses, a <span style="color: darkorange;">radiografia simples de tórax</span> não tem papel no diagnóstico ou tratamento endoscópico de DRGE.</p>

          <p style="text-align: justify;"><span style="color: darkblue; font-weight: bold;">Alternativa D:</span> Endoscopia digestiva alta (EDA) e esofagograma baritado. Novamente, a <span style="color: darkorange;">EDA</span> é importante para avaliar complicações, mas o <span style="color: darkorange;">esofagograma baritado</span> não é indicado para a decisão de tratamento endoscópico na DRGE.</p>

          <p style="text-align: justify;">De acordo com diretrizes médicas como as do <em>UpToDate</em> e <em>Harrison’s Principles of Internal Medicine</em>, o uso de manometria e impedâncio-pHmetria é crucial para o diagnóstico preciso e a decisão de tratamento na DRGE. Esses exames identificam pacientes que realmente se beneficiariam de intervenções endoscópicas.</p>

          <p style="text-align: justify;">Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A alternativa A é a resposta correta porque apresenta os exames específicos que são indicados para avaliar a função do esôfago e a presença e severidade do refluxo gastroesofágico antes de considerar um tratamento endoscópico na doença do refluxo gastroesofágico (DRGE). A manometria de alta resolução é um exame que avalia a motilidade do esôfago, medindo as contrações musculares ao longo do órgão quando o paciente engole, permitindo identificar alterações motoras que podem estar contribuindo para o refluxo. Já a impedâncio-pHmetria de 24 horas é um exame que mede a quantidade de refluxo de ácido e não ácido do estômago para o esôfago e é feito durante um período prolongado, geralmente 24 horas, para capturar variações ao longo do dia e durante o sono. Este exame ajuda a correlacionar os sintomas do paciente com episódios de refluxo e avalia a eficácia de medicamentos anti-refluxo. As outras alternativas listam exames que são úteis no diagnóstico da DRGE, como a endoscopia digestiva alta (EDA) que visualiza a mucosa esofágica e identifica esofagite ou outros danos ao esôfago, mas não são os exames específicos para indicar tratamento endoscópico como a manometria e a impedâncio-pHmetria.
          </div>

      - tipo: ME
        id: 121026-1640-14-T98WeB
        tags:
