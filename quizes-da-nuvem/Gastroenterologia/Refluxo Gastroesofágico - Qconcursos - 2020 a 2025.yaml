            <p><span style="color: #1a237e; font-weight: bold;">Tema central:</span> O monitoramento do pH esofágico ambulatorial é um exame diagnóstico fundamental na avaliação da <span style="color: #ff6f00;"><b>Doença do Refluxo Gastroesofágico (DRGE)</b></span> em situações específicas, principalmente quando o quadro clínico não é típico ou o tratamento não surte efeito esperado.</p>

          <p><u><b>Análise das afirmativas:</b></u></p>

          <p><span style="color: #ff6f00;">1. Sintomas típicos que respondem aos inibidores da bomba de prótons (IBP).</span> <span style="color: #d32f2f;"><b>Falso</b></span>. <b>Justificativa:</b> Segundo a Sociedade Brasileira de Motilidade Digestiva e Neurogastroenterologia (SBMDN): “O monitoramento do pH esofágico é usado quando há sintomas típicos que <u>não respondem</u> ao tratamento medicamentoso”. Ou seja, se o paciente responde bem ao IBP, a realização do exame não é indicada, pois já fica confirmada a relação dos sintomas com DRGE.</p>

          <p><span style="color: #ff6f00;">2. Sintomas atípicos, como dor torácica não-cardíaca.</span> <span style="color: #388e3c;"><b>Verdadeiro</b></span>. <b>Justificativa:</b> Sintomas atípicos, especialmente <span style="color: #1a237e;">dor torácica não-cardíaca</span>, requerem investigação adicional para afastar refluxo ácido, razão pela qual a pHmetria é útil nestes casos.</p>

          <p><span style="color: #ff6f00;">3. Sintomas atípicos, como manifestações pulmonares.</span> <span style="color: #388e3c;"><b>Verdadeiro</b></span>. <b>Justificativa:</b> Tosse crônica, rouquidão e manifestações pulmonares também podem ser secundárias ao refluxo gastroesofágico. Segundo o “Projeto Diretrizes” da AMB/CFM, “a avaliação por pHmetria é justificada em sintomas atípicos, para estabelecer relação causal com DRGE”.</p>

          <p><span style="color: #ff6f00;">4. Sintomas recorrentes após a cirurgia antirrefluxo.</span> <span style="color: #388e3c;"><b>Verdadeiro</b></span>. <b>Justificativa:</b> Sintomas que persistem ou retornam após a cirurgia antirrefluxo são indicação clássica para monitorização do pH, conforme diretrizes nacionais e internacionais, pois podem indicar recorrência, falha cirúrgica ou outra etiologia.</p>

          <p><b><span style="color: #1a237e;">Gabarito:</span> B) F, V, V, V.</b></p>

          <p><u><b>Análise crítica das alternativas incorretas:</b></u></p>
          <p><b>Alternativa A</b> considera a afirmativa 1 como verdadeira, o que contraria as diretrizes, pois não há indicação de pHmetria em sintomas típicos que melhoram com IBP. <br>
          <b>Alternativa C</b> ignora o papel da pHmetria em sintomas pós-cirúrgicos.<br>
          <b>Alternativa D</b> despreza a relevância da avaliação de sintomas atípicos torácicos, erro frequente em provas.</p>

          <p><span style="color: #1a237e;"><b>Estratégias de prova:</b></span> Atenção a termos como “responde” ou “não responde” ao IBP e diferencie sintomas típicos de atípicos. Sintomas típicos controlados NÃO são indicação! Fique atento quando a banca usar termos opostos, pois essa é uma pegadinha comum.</p>

          <p><span style="color: #ff6f00;"><b>Base científica</b>:</span> Consulte sempre as recomendações da SBMDN, AMB/CFM e fontes como UpToDate ou Harrison’s para reforçar seu raciocínio clínico.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A questão aborda as indicações para a monitoração do pH esofágico ambulatorial, que é um teste utilizado para avaliar o refluxo ácido do estômago para o esôfago e é particularmente útil em pacientes com sintomas que não são típicos da doença do refluxo gastroesofágico (DRGE) ou quando o diagnóstico é incerto. A resposta correta é a alternativa B - F, V, V, V. A justificativa para essa resposta é que:

            - Sintomas típicos que respondem aos inibidores da bomba de prótons (IBP) geralmente não requerem monitoração do pH esofágico, pois a resposta positiva ao tratamento já sugere que os sintomas têm relação com o refluxo ácido. Por isso, o primeiro item é falso.

            - Sintomas atípicos, como dor no tórax não-cardíaca e manifestações pulmonares, podem ser causados pelo refluxo ácido, mas não são tão claramente relacionados à DRGE quanto os sintomas típicos. Nestes casos, a monitoração do pH esofágico pode ser utilizada para determinar se o refluxo ácido está realmente contribuindo para esses sintomas, tornando os segundo e terceiro itens verdadeiros.

            - Sintomas recorrentes após a cirurgia anti-refluxo indicam que o procedimento pode não ter sido completamente eficaz, ou que o problema pode ter retornado. A monitoração do pH esofágico ajuda a confirmar se o refluxo ácido persiste como causa dos sintomas pós-operatórios. Portanto, o quarto item é verdadeiro.

            Assim, a sequência correta de verdadeiro (V) ou falso (F) para as indicações é F, V, V, V, e a resposta correta é a alternativa B.
          </div>

