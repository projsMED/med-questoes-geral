        gabarito: F
        comentario_geral: "<div class=\"qc-gabarito-professor\" style=\"border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;\">\n  <p><span style=\"color:#1a237e; font-weight:bold;\">Tema central:</span> O enunciado aborda o <u>esôfago de Barrett</u>, complicação relevante da Doença do Refluxo Gastroesofágico (DRGE). É crucial conhecer seus <b>aspectos histológicos</b> e <b>aspecto endoscópico (macroscópico)</b> para uma abordagem clínica e diagnóstica adequada.</p>\n\n<p><span style=\"color:#e65100; font-weight:bold;\">Justificativa da alternativa correta (“Errado”):</span><br>\nO <b>esôfago de Barrett</b> é definido <span style=\"color:#1a237e;\">histologicamente</span> pela substituição do epitélio escamoso do esôfago por <b>epitélio colunar com metaplasia intestinal</b> (presença de células caliciformes). <br>\nNo exame <span style=\"color:#1a237e;\">macroscópico (endoscópico)</span>, a lesão característica se apresenta como <span style=\"color:#e65100;\"><b>área de mucosa vermelho-rósea ou cor salmão</b></span>, diferente da mucosa esofágica normal, que é mais pálida e esbranquiçada.<br>\nPortanto, <u>não</u> são áreas “espessadas e esbranquiçadas”, como traz a alternativa. Esta descrição não condiz com o padrão endoscópico clássico do Barrett.<br>\nSegundo o Projeto Diretrizes da Associação Médica Brasileira (AMB): \n<span style=\"color:#1a237e;\">“O esôfago de Barrett se apresenta como mucosa de cor salmão, diferenciando-se da mucosa esofágica normal, que é esbranquiçada.” </span> \n(AMB, Projeto Diretrizes – Refluxo Gastroesofágico, p. 5)</p>\n\n<p><span style=\"color:#e65100;\"><b>Pontos importantes na leitura do enunciado:</b></span>\n</p><ul>\n  <li>Fique atento a expressões absolutas (“sempre”, “nunca”, “define”, “apresenta-se como”) e à coerência com o que é encontrado em diretrizes e livros-texto.</li>\n  <li>Zonas esbranquiçadas, espessadas ou ulceradas, quando aparecem no esôfago, estão mais relacionadas a outros diagnósticos (ex.: leucoplasia, candidíase, carcinoma), <span style=\"color:#1a237e;\">não ao Barrett</span>.</li>\n</ul>\n<p></p>\n\n<p><span style=\"font-weight:bold;\">Análise das alternativas:</span><br>\n</p><ul>\n  <li><b>“Certo”:</b> Está <span style=\"color:#e65100;\">errada</span> porque descreve incorretamente o aspecto macroscópico.</li>\n  <li><b>“Errado”:</b> Está <span style=\"color:#1a237e;\">correta</span> pois rejeita a descrição inadequada do padrão endoscópico do Barrett.</li>\n</ul>\n<p></p>\n\n<p><span style=\"color:#e65100;\"><b>Dica de prova:</b></span> Questões de imagem ou descrição macroscópica geralmente exigem memorização de padrões clássicos. Use sempre livros como “Harrison’s Principles of Internal Medicine” ou “Sleisenger &amp; Fordtran Gastrointestinal and Liver Disease” como referência para esses achados.</p>\n\n<p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>\n</div>\n\n<div style=\"border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;\">\n  <b>Comentário 01 (1 like):</b>\n\n  Substituição do epitélio estratificado e escamoso do esôfago por epitélio colunar com células de padrão intestinal\n</div>\n\n<div style=\"border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;\">\n  <b>Comentário 02 (0 likes):</b>\n\n  Ao realizar a Endoscopia Digestiva Alta, o aspecto macroscópico do esôfago de Barret são projeções de cor VERMELHO SALMÃO. Portanto, não são é mucosa esbranquiçada. Afirmativa ERRADA. Quem quiser estudar mais estou disponibilizando minhas anotações e flashcards nesse link: https://www.brainscape.com/p/4EQ9O-LH-CNI2M<span>\uFEFF</span>\n</div>"

      - tipo: VF
        id: 121026-1653-23-a87ZOK
