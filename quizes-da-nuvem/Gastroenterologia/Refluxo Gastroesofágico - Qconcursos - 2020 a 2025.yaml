          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color: #003366; font-weight: bold;">Tema central:</span> Esta questão aborda a <b>Doença do Refluxo Gastroesofágico (DRGE)</b> e, especificamente, o uso da <u>Classificação de Los Angeles</u> para diagnóstico de esofagite erosiva, conceito essencial que frequentemente aparece em concursos. Entender critérios diagnósticos e condutas terapêuticas reforça o preparo clínico do candidato.</p>

          <p><span style="color: #d35400; font-weight: bold;">Justificativa da alternativa correta (B):</span><br>
          A <b>presença de esofagite erosiva Los Angeles A</b>, por conter lesões menores que 5 mm que não se estendem entre as pregas mucosas, <span style="color: #003366;"><b>não é suficiente para confirmar o diagnóstico de DRGE</b></span>. Segundo o "Projeto Diretrizes: Refluxo Gastroesofágico – Diagnóstico e Tratamento", esta lesão pode estar presente em indivíduos <i>sem sintomas</i> ou associada a outras condições, não sendo exclusiva da DRGE. Por isso, a alternativa B está <span style="color: #d35400;"><b>correta</b></span>.</p>

          <p><span style="color: #003366; font-weight: bold;">Análise das alternativas incorretas:</span></p>

          <p><b>A)</b> O uso de <u>procinéticos</u> não é recomendado como <span style="color: #d35400;">primeira linha</span> nos sintomas típicos de DRGE. Os inibidores da bomba de prótons (IBPs) são a terapia padrão, conforme múltiplas diretrizes.</p>

          <p><b>C)</b> O <u>sucralfato</u> é seguro na gestação e pode ser utilizado para alívio de sintomas, conforme recomendações de segurança farmacológica em gestantes.</p>

          <p><b>D)</b> A <u>pHmetria esofágica</u> <b>não deve ser realizada rotineiramente</b> em pacientes com esôfago de Barrett. Seu uso é reservado para situações de dúvida diagnóstica, sintomas refratários ou avaliação pré-cirúrgica, conforme consenso da SBAD e literatura internacional.</p>

          <p><b>E)</b> O <u>baclofeno</u> raramente é utilizado para DRGE, sendo reservado para casos refratários. Não é tratamento padrão, tampouco é prescrito em dose única diária por 8 semanas.</p>

          <p><span style="color: #003366;"><b>Pontuação da questão:</b></span> O candidato atento reconheceria o detalhe técnico sobre a <u>Classificação de Los Angeles</u> e eliminaria respostas que propõem condutas não alinhadas às diretrizes ou exageram indicações de exames.</p>

          <p><span style="color: #d35400; font-weight: bold;">Dica para concursos:</span> Atente-se a termos como <i>“rotineiramente”</i>, “primeira linha” ou diagnósticos relacionados a achados endoscópicos leves, pois costumam ser pegadinhas.</p>

