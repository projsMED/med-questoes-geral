      - tipo: ME
        id: 121026-1655-21-H1s3SY
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Não existe um algoritmo estabelecido para o tratamento da doença do refluxo gastroesofágico em crianças que não provoque discussões ou controvérsias. Os Inibidores da Bomba de Potássio (IBP) estão indicados nos casos de esofagite erosiva, estenose péptica ou esôfago de Barrett, bem como nas crianças que necessitam de um bloqueio mais efetivo da secreção ácida, como nas portadoras de doença respiratória crônica grave ou com problemas neurológicos. Assinale a alternativa que apresenta um IBP.
        alternativas:
          - id: alt_A
            texto: Famotidina.
          - id: alt_B
            texto: Alginato.
          - id: alt_C
            texto: Omeprazol.
          - id: alt_D
            texto: Sucralfato.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange;"><b>Tema central:</b></span> A questão aborda o reconhecimento e a indicação dos <b>Inibidores da Bomba de Prótons (IBPs)</b> no tratamento da Doença do Refluxo Gastroesofágico (DRGE) pediátrica, conhecimento fundamental na prática do Pediatra.</p>

          <p>Segundo o <b>Guia Prático de Orientação: Doença do Refluxo Gastroesofágico</b> da Sociedade Brasileira de Pediatria, os IBPs são a opção farmacológica de escolha especialmente em casos de <span style="color:darkblue;"><b>esofagite erosiva</b></span>, <span style="color:darkblue;"><b>estenose péptica</b></span> ou indicação de bloqueio ácido potente.</p>

          <p><b><span style="color:darkorange;">Justificativa da alternativa correta:</span></b></p>
          <p>
          <span style="color:darkblue;"><b>Alternativa C) Omeprazol</b></span> é o <u>único IBP listado entre as opções</u>, atuando inibindo irreversivelmente a bomba de prótons H⁺/K⁺ ATPase das células parietais gástricas, o que leva à supressão potente e prolongada da secreção ácida. Isso resulta em <b>alívio dos sintomas, cicatrização esofágica</b> e redução do risco de complicações. Em pediatria, o omeprazol é seguro, eficaz e amplamente empregado em protocolos nacionais e internacionais. 
          </p>

          <p>
          De acordo com o documento da SBP: <i>“O tratamento farmacológico com IBPs é o mais frequentemente indicado em crianças maiores e adolescentes, nos quais os sintomas são mais claros e específicos e a esofagite de refluxo é mais frequente.”</i>
          </p>

          <p><b><span style="color:darkorange;">Análise das alternativas incorretas:</span></b></p>
          <ul>
            <li>
              <span style="color:darkblue;"><b>Alternativa A) Famotidina:</b></span> É um <u>bloqueador H2</u> (antagonista do receptor de histamina), que reduz a secreção ácida, porém <b>não é IBP</b>. Geralmente, é menos eficaz que IBPs em casos de esofagite grave.
            </li>
            <li>
              <span style="color:darkblue;"><b>Alternativa B) Alginato:</b></span> Atua como <u>barreira física</u> impedindo o refluxo, sem interferir com a produção de ácido gástrico. <b>Não pertence ao grupo dos IBPs</b>.
            </li>
            <li>
              <span style="color:darkblue;"><b>Alternativa D) Sucralfato:</b></span> É um <u>agente citoprotetor</u>, formando uma película sobre a mucosa lesionada, mas <b>não reduz de forma significativa a secreção ácida</b> nem é IBP.
            </li>
          </ul>

          <p><b><span style="color:darkorange;">Dicas para a prova:</span></b> Fique atento à nomenclatura nas alternativas – <span style="color:darkblue;"><b>todos os IBPs apresentam o sufixo “-prazol”</b></span> (como omeprazol, lansoprazol, pantoprazol). Evite confundir classes: bloqueadores H2, agentes barreira e citoprotetores não são IBPs!</p>

          <p><b>Portanto, a alternativa correta é <span style="color:darkblue;">C) Omeprazol</span>.</b></p>

          <p><i>Gostou do comentário? Deixe sua avaliação aqui embaixo!</i></p>
          </div>

      - tipo: ME
        id: 121026-1655-22-KJbFP2
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          A doença do refluxo gastroesofágico (DRGE) é uma condição frequente na prática clínica, impactando significativamente a qualidade de vida dos pacientes. Sobre a DRGE, analise as afirmativas:

          I. A DRGE está associada ao relaxamento transitório do esfíncter esofágico inferior.
          II. O principal sintoma da DRGE é a odinofagia.

          III. A esofagite erosiva é uma complicação comum nos casos graves de DRGE.
          IV. O tratamento inicial inclui a combinação de mudanças no estilo de vida e inibidores da bomba de prótons.

          Estão corretas as afirmativas:
        alternativas:
          - id: alt_A
            texto: II e III, apenas.
          - id: alt_B
            texto: I, II, III e IV.
          - id: alt_C
            texto: I, III e IV, apenas.
          - id: alt_D
            texto: I e II, apenas.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Vamos analisar a questão sobre a <span style="color: darkorange;"><strong>Doença do Refluxo Gastroesofágico (DRGE)</strong></span>, uma condição clínica comum que afeta a qualidade de vida dos pacientes. A questão exige que identifiquemos as afirmativas corretas sobre essa condição.</p>

          <p><strong>I. A DRGE está associada ao relaxamento transitório do esfíncter esofágico inferior.</strong></p>
          <p>Esta afirmação é <span style="color: darkorange;"><strong>correta</strong></span>. O principal mecanismo fisiopatológico da DRGE é o relaxamento inadequado do esfíncter esofágico inferior (EEI), o que permite que o conteúdo gástrico ácido reflua para o esôfago. Este relaxamento transitório é uma das causas mais comuns de refluxo ácido.</p>

          <p><strong>II. O principal sintoma da DRGE é a odinofagia.</strong></p>
          <p>Esta afirmação é <span style="color: darkblue;"><strong>incorreta</strong></span>. O principal sintoma da DRGE é a <span style="color: darkorange;"><strong>azia</strong></span> (ou pirose), que é a sensação de queimação no peito. A <span style="color: darkorange;"><strong>odinofagia</strong></span>, que é dor ao engolir, não é típica da DRGE e geralmente indica outras condições, como infecção esofágica ou esofagite grave.</p>

          <p><strong>III. A esofagite erosiva é uma complicação comum nos casos graves de DRGE.</strong></p>
          <p>Esta afirmação é <span style="color: darkorange;"><strong>correta</strong></span>. A esofagite erosiva é uma complicação da DRGE resultante da exposição prolongada do esôfago ao ácido gástrico, levando a lesões na mucosa esofágica. É mais comum em casos mais graves ou não tratados adequadamente.</p>

          <p><strong>IV. O tratamento inicial inclui a combinação de mudanças no estilo de vida e inibidores da bomba de prótons.</strong></p>
          <p>Esta afirmação é <span style="color: darkorange;"><strong>correta</strong></span>. O manejo inicial da DRGE geralmente envolve modificações no estilo de vida, como perda de peso, elevação da cabeceira da cama e evitar refeições antes de deitar. Além disso, os <span style="color: darkorange;"><strong>inibidores da bomba de prótons (IBPs)</strong></span>, como omeprazol, são a terapia medicamentosa de escolha devido à sua eficácia em reduzir a produção de ácido gástrico.</p>

          <p>Com base nas análises acima, a resposta correta é a alternativa <strong>C - I, III e IV, apenas.</strong></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1655-23-RDE3FB
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Um homem feodérmico de 53 anos está em controle gastroenterológico, por 16 anos, de esofagite de refluxo associada à hérnia hiatal de deslizamento de grande dimensão. Previamente, o tratamento com inibidores de prótons e procinéticos controlava adequadamente as manifestações clínicas e a inflamação esofágica, porém, no último ano, as queixas acentuaram-se e o paciente tornou-se refratário a todos os tratamentos clínicos. Ele foi encaminhado para tratamento cirúrgico. Qual exame pré-operatório é fundamental para orientar o tipo de fundoplicatura a ser realizada?
        alternativas:
          - id: alt_A
            texto: Tomografia com contraste venoso, para avaliar a vascularização do fundo gástrico.
            comentario: Está errada porque estudo tomográfico com contraste venoso para vascularização do fundo gástrico não é o exame fundamental do preparo habitual da cirurgia antirrefluxo e não define a escolha entre fundoplicatura total ou parcial. O critério decisivo aqui é funcional, isto é, a motilidade esofágica, e não a vascularização do fundo gástrico.
          - id: alt_B
            texto: Tomografia abdominal com contraste oral para avaliar o trânsito e a hérnia.
            comentario: Está errada porque a tomografia com contraste oral pode acrescentar descrição anatômica da hérnia, mas anatomia da hérnia não é o dado que orienta o tipo de fundoplicatura. A decisão técnica depende da função motora do esôfago, que esse exame não avalia.
          - id: alt_C
            texto: Cintilografia do trânsito esofagogastroduodenal, para ver o esvaziamento do esôfago.
            comentario: Está errada porque cintilografia de trânsito/esvaziamento pode ter utilidade selecionada, mas não é o exame padrão essencial para decidir a técnica antirrefluxo. Ela não substitui a manometria na avaliação da motilidade esofágica necessária para planejar a fundoplicatura.
          - id: alt_D
            texto: Manometria esofágica para avaliar o tono da musculatura do esôfago.
            comentario: A alternativa D está correta porque a manometria esofágica é o exame funcional decisivo no preparo da cirurgia antirrefluxo. O dado que muda a técnica operatória não é apenas a presença da hérnia ou da esofagite, mas a capacidade de propulsão do esôfago. Quando a motilidade está preservada, uma fundoplicatura total pode ser mais aceitável; quando há distúrbio motor importante, uma técnica parcial pode ser preferida para diminuir obstrução funcional e disfagia pós-operatória. Por isso, é esse exame que orienta o tipo de válvula antirrefluxo.
          - id: alt_E
            texto: Endoscopia digestiva alta, para confirmar a presença da hérnia hiatal.
            comentario: Está errada porque a endoscopia é importante para documentar esofagite, complicações e até a hérnia hiatal, mas confirmar o diagnóstico anatômico não responde à pergunta sobre qual fundoplicatura realizar. Ela não mede a motilidade esofágica, que é o fator que realmente orienta a técnica cirúrgica.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: D</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O critério que define o tipo de fundoplicatura é a motilidade esofágica no pré-operatório; no contexto de DRGE refratária com hérnia hiatal encaminhada para cirurgia, a manometria esofágica é o exame que avalia o esfíncter esofagiano inferior e a peristalse do corpo esofágico, dado funcional que orienta a escolha entre fundoplicatura total ou parcial.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Manometria esofágica pré-operatória</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca desloca a atenção para a hérnia hiatal grande e para exames anatômicos, mas a pergunta não é qual exame confirma a doença; é qual exame orienta o tipo de fundoplicatura, e esse critério é funcional, não anatômico.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se a pergunta for sobre escolher entre fundoplicatura total ou parcial, procure o exame que avalia motilidade esofágica.</li><li>Endoscopia e tomografia podem documentar anatomia e inflamação, mas não definem sozinhas a técnica da válvula antirrefluxo.</li><li>Na cirurgia antirrefluxo, a função motora do esôfago é o que muda a operação e o risco de disfagia pós-operatória.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-24-emg8Va
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Um paciente de 50 anos de idade, portador de esclerodermia sistêmica, apresenta disfagia progressiva a sólidos e líquidos, pirose atípica, dor torácica e perda ponderal de 6 kg em 3 meses. A manometria esofágica de alta resolução evidencia ausência completa de peristalse no corpo esofágico e hipotensão do esfíncter esofágico inferior (EEI), com episódios frequentes de relaxamento transitório do EEI. A pH-metria de 24h documenta refluxo gastroesofágico ácido severo (Índice de DeMeester > 30).
          Tendo em vista a principal preocupação no planejamento de cirurgia antirrefluxo para esse paciente, considerando especificamente sua fisiopatologia esofágica, assinale a alternativa correta.
        alternativas:
          - id: alt_A
            texto: A fundoplicatura à Nissen (360°) é o procedimento de escolha, pois restaura completamente a barreira antirrefluxo.
            comentario: 'Está errada porque a maior potência antirrefluxo da Nissen não resolve o problema decisivo do caso: o esôfago não tem peristalse para vencer uma barreira distal mais rígida. Em aperistalse completa, fundoplicatura total aumenta o risco de retenção alimentar e disfagia pós-operatória.'
          - id: alt_B
            texto: O tratamento endoscópico com radiofrequência (Stretta) no EEI é preferível para minimizar o risco de disfagia pós-operatória.
            comentario: 'Está errada porque não enfrenta adequadamente a fisiopatologia descrita: há refluxo ácido severo documentado e falência motora esofágica avançada por esclerodermia. Pela base, a radiofrequência endoscópica não corrige o distúrbio motor.'
          - id: alt_C
            texto: A ausência de peristalse e a hipotensão do EEI aumentam o risco de disfagia após fundoplicatura, de modo que uma fundoplicatura parcial (270° Toupet) deve ser considerada para equilibrar antirrefluxo e esvaziamento esofágico.
            comentario: 'A alternativa C está correta porque integra os dois problemas fisiopatológicos do caso: refluxo importante por incompetência do EEI e depuração esofágica ruim por aperistalse completa. Nesse cenário, uma válvula total tende a impor resistência distal maior do que esse esôfago consegue vencer. A lógica da fundoplicatura parcial posterior é justamente oferecer controle antirrefluxo com menor obstrução funcional, reduzindo o risco de agravar a disfagia em um esôfago aperistáltico.'
          - id: alt_D
            texto: A miotomia do EEI (Heller) é essencial para aliviar a disfagia e, concomitantemente, reduzir o refluxo ácido.
            comentario: 'Está errada porque a miotomia de Heller se aplica a quadro obstrutivo por EEI hipertenso ou relaxamento inadequado, como na acalásia. Aqui a manometria mostra o oposto: EEI hipotenso, com refluxo intenso. Seccionar ainda mais essa região tenderia a piorar a DRGE, não a tratá-la.'
          - id: alt_E
            texto: O paciente é candidato ideal para esofagectomia, devido à falência motora completa do esôfago.
            comentario: Está errada porque falência motora esofágica isolada, mesmo grave, não torna o paciente candidato ideal a esofagectomia. Pela base, trata-se de procedimento radical e de alta morbidade, sem indicação automática no cenário apresentado para controle de refluxo e disfagia.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O ponto decisivo é que a esclerodermia cursa com aperistalse esofágica e EEI hipotenso; assim, aumentar demais a resistência na junção esofagogástrica tende a piorar a disfagia. Por isso, se houver cirurgia antirrefluxo, a opção parcial é a que melhor preserva o trânsito esofágico.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Antirrefluxo na esclerodermia</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre disfagia por esclerodermia e disfagia por acalásia: neste caso o EEI é hipotenso e o esôfago é aperistáltico, então o problema é incompetência da barreira antirrefluxo com risco de piorar a disfagia se a cirurgia aumentar demais a resistência distal.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Leia a manometria antes de escolher a técnica: aperistalse com EEI hipotenso aponta para esclerodermia esofágica, não para acalásia.</li><li>Em cirurgia antirrefluxo, não escolha a válvula pela potência isolada; escolha pelo equilíbrio entre controle do refluxo e risco de disfagia conforme a motilidade.</li><li>Se o esôfago não tem propulsão efetiva, aumentar muito a resistência na junção esofagogástrica tende a piorar o trânsito esofágico.</li><li>Disfagia não indica automaticamente miotomia; a indicação depende de padrão obstrutivo distal, que não está presente quando o EEI é hipotenso.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-25-I0gHUB
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Uma paciente de 38 anos, obesa, IMC de 32, comparece à clínica com queixas típicas de doença do refluxo gastroesofágico (DRGE), incluindo azia e regurgitação há 6 meses. A paciente nunca realizou endoscopia e não apresenta sintomas de alarme (como disfagia, perda de peso ou sangramento gastrointestinal). A médica realiza uma avaliação inicial e conclui que os sintomas são consistentes com DRGE não complicada. Considerando as diretrizes da American Society for Gastrointestinal Endoscopy (ASGE) para o manejo e o diagnóstico inicial da DRGE, e excluindo qualquer intervenção cirúrgica ou endoscópica, qual é a melhor conduta inicial recomendada para essa paciente?
        alternativas:
          - id: alt_A
            texto: Recomenda-se realizar imediatamente a endoscopia digestiva alta (EDA) para descartar esôfago de Barrett (EB), uma vez que a paciente apresenta múltiplos fatores de risco (idade < 50 anos, sexo feminino, obesidade).
            comentario: Está errada porque indica EDA imediata para rastrear Barrett sem respaldo no perfil descrito. A base afirma que, na DRGE típica não complicada, a EDA não é rotina inicial e que o rastreamento de Barrett é seletivo. Além disso, a própria justificativa da alternativa usa como reforço idade menor que 50 anos e sexo feminino, que não fortalecem a indicação; a obesidade isoladamente não transforma esse caso em indicação automática de EDA.
          - id: alt_B
            texto: Recomenda-se iniciar um tratamento empírico com bloqueadores H2 por um período de 8 semanas, pois a EDA deve ser reservada apenas para pacientes com DRGE refratária.
            comentario: Está errada porque, embora acerte ao não exigir EDA inicial, erra no tratamento farmacológico principal. A base é explícita ao afirmar que IBP é mais eficaz que bloqueadores H2 e constitui a terapia de primeira linha na DRGE típica persistente. Portanto, o erro médico da alternativa não é a reserva da EDA, e sim escolher bloqueador H2 como melhor conduta inicial.
          - id: alt_C
            texto: Recomenda-se iniciar modificações de estilo de vida (como perda de peso e evitar refeições até 3 horas antes de dormir) e, em seguida, iniciar o tratamento médico com inibidores de bomba de prótons (IBPs) na menor dose e pelo menor tempo possível.
            comentario: 'A alternativa C é a única compatível com o cenário descrito: paciente com azia e regurgitação típicas, sem disfagia, perda de peso, sangramento ou outro sinal de alarme. Nesse contexto, a base da questão orienta manejo inicial empírico, reservando a EDA para alarme, refratariedade, complicações ou situações seletivas. Entre as opções, C é a que melhor se ajusta por combinar medidas comportamentais apropriadas para sobrepeso/obesidade e tratamento medicamentoso com IBP, que é mais eficaz que bloqueadores H2 no controle da DRGE típica.'
          - id: alt_D
            texto: Sugere-se a avaliação para terapia de energia de radiofrequência (Stretta), como alternativa ao uso crônico de medicamentos, já que a paciente apresenta obesidade.
            comentario: Está errada porque propõe terapia endoscópica com radiofrequência como conduta inicial em DRGE não complicada, o que contraria o escalonamento terapêutico descrito na base. Procedimentos antirrefluxo não são a primeira etapa nesse cenário e o próprio enunciado exclui intervenções cirúrgicas ou endoscópicas.
          - id: alt_E
            texto: A EDA é obrigatória, pois o diagnóstico clínico de DRGE é insuficiente, sendo necessário confirmar objetivamente a esofagite erosiva pelo sistema de classificação de Los Angeles.
            comentario: Está errada porque afirma que a EDA é obrigatória para confirmar objetivamente a DRGE, o que contradiz diretamente a diretriz usada pela questão. A base informa que sintomas típicos sem alarme permitem abordagem clínica inicial sem confirmação endoscópica imediata. A classificação de Los Angeles só tem papel quando a endoscopia é realizada e mostra esofagite erosiva; ela não é requisito universal para diagnóstico inicial.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Em DRGE típica não complicada, sem sinais de alarme, a ASGE não exige EDA imediata e favorece abordagem inicial clínica; no caso, isso afasta as alternativas com endoscopia e mantém como correta a opção de medidas comportamentais associadas a IBP.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> DRGE inicial</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca misturou um fator de risco real, obesidade, com a falsa ideia de que isso por si só obriga EDA ou rastreamento imediato de Barrett, e ainda ofereceu uma alternativa parcialmente verdadeira com H2 para induzir erro contra o critério central: DRGE típica sem alarme começa com manejo clínico e IBP.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se houver azia e regurgitação típicas sem sinais de alarme, pense primeiro em manejo empírico clínico, não em EDA obrigatória.</li><li>Quando a questão pedir melhor tratamento inicial da DRGE típica, IBP supera bloqueadores H2 como escolha farmacológica.</li><li>Rastreamento de Barrett é seletivo; não transforme obesidade isolada ou ausência de endoscopia prévia em indicação automática de EDA.</li><li>Classificação endoscópica de esofagite não é pré-requisito para diagnosticar toda DRGE na apresentação típica sem alarme.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-26-Ah4eWb
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Um homem de 39 anos procura avaliação para cirurgia bariátrica.
          Refere ser obeso desde a adolescência, com múltiplas tentativas frustradas de perda de peso com dieta e atividade física. Relata histórico de refluxo gastroesofágico intenso, diagnosticado por endoscopia há 2 anos como esofagite grau C (Los Angeles).
          Também tem diabetes mellitus tipo 2 há 6 anos, atualmente mal controlado com metformina e insulina. Apresenta IMC de 42 kg/m², sem uso de álcool ou tabagismo. Nega sintomas depressivos ou compulsão alimentar grave.

          Os exames complementares:

          • Endoscopia: Esofagite grau C, sem hérnia hiatal;

          • HbA1c: 9,2%;

          • Eletrocardiograma e avaliação cardiológica pré-operatória:
          sem contraindicações;

          • Avaliação psicológica: apto à cirurgia;
          • Ultrassonografia abdominal: fígado esteatótico, sem litíase biliar.

          A melhor técnica de cirurgia bariátrica indicada, nesse caso, é
        alternativas:
          - id: alt_A
            texto: derivação gástrica em Y de Roux, por ser eficaz tanto para perda ponderal quanto para controle do diabetes e do refluxo gastroesofágico.
          - id: alt_B
            texto: gastrectomia vertical (sleeve), por ser técnica com menor incidência de complicações e não interferir na anatomia intestinal.
          - id: alt_C
            texto: banda gástrica ajustável, por ser técnica menos invasiva e reversível.
          - id: alt_D
            texto: duodenal switch, por ser superior na resolução do diabetes e da dislipidemia em longo prazo.
          - id: alt_E
            texto: Balão intragástrico, como estratégia intermediária antes da cirurgia definitiva devido à presença de esteatose hepática.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color: #25396c;"><b>Tema central:</b></span> 
          O tema da questão é a <u>indicação da técnica cirúrgica bariátrica mais adequada</u> para paciente com obesidade mórbida, refluxo gastroesofágico grave (esofagite grau C) e diabetes tipo 2 mal controlado.</p>

          <p><span style="color: #25396c;"><b>Análise clínica e justificativa da alternativa correta (A):</b></span> 
          O paciente tem <b><span style="color: #d2691e;">IMC de 42 kg/m²</span></b>, <b>diabetes tipo 2</b> sem bom controle com tratamento medicamentoso e <b>esofagite grave</b> sem hérnia hiatal. De acordo com a <b>Resolução CFM nº 2.429/2025</b>, a indicação de cirurgia bariátrica é clara nesses casos — pacientes com IMC ≥ 40, ou ≥ 35 com comorbidades como DM2 e DRGE importante.</p>

          <p>Entre as opções cirúrgicas, a <b>Derivação Gástrica em Y de Roux (Bypass)</b> se destaca por:</p>
          <ul>
            <li>Promover <span style="color: #d2691e;"><b>eficaz perda ponderal</b></span> e alta taxa de <span style="color: #d2691e;"><b>remissão do diabetes</b></span> (<i>HbA1c basal de 9,2%</i> leva à indicação preferencial de técnica com efeito metabólico comprovado)</li>
            <li><b>Melhorar significativamente o refluxo gastroesofágico</b> e a esofagite, sendo a técnica de escolha para casos graves</li>
            <li>Ser amplamente recomendada pela SBCBM e validada em revisões sistemáticas (<span style="color: #d2691e;">Research, Society and Development; Manual de Diretrizes de Cirurgia Bariátrica e Metabólica</span>)</li>
          </ul>

          <p><span style="color: #25396c;"><b>Análise das alternativas incorretas:</b></span></p>
          <p><b>B) Gastrectomia vertical (Sleeve):</b> apesar do bom perfil de perda ponderal, <span style="color: #d2691e;"><b>piora ou induz sintomas de refluxo</b></span> em muitos pacientes — é contraindicada para quem já tem DRGE grave ou esofagite C.</p>
          <p><b>C) Banda gástrica ajustável:</b> oferece resultados inferiores de remissão do diabetes e do refluxo, com <b>alto risco de insucesso ou recidiva</b>.</p>
          <p><b>D) Duodenal switch:</b> técnica mais agressiva, <span style="color: #d2691e;">associada a maior risco nutricional</span> e reservada para obesidade mais grave, não sendo a primeira escolha para refluxo sem outras complicações.</p>
          <p><b>E) Balão intragástrico:</b> é temporário e <b>não é indicado para obesidade grau III</b> com comorbidades graves como DM2 e DRGE.</p>

          <p><span style="color: #25396c;"><b>Dica para prova:</b></span> 
          Sempre atente ao <u>perfil clínico</u> e às <u>comorbidades</u> ao escolher a técnica — presença de <b>refluxo grave</b> é critério chave!</p>

          <p><span style="color: #25396c;"><b>Resumo segundo protocolos:</b></span><br>
          <b>“O Bypass gástrico está indicado em pacientes obesos com DRGE grave e diabetes mal controlado, devido à sua ação combinada sobre peso, glicemia e refluxo.”</b>
          <br><i>(Manual SBCBM, Resolução CFM 2.429/2025)</i></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>
