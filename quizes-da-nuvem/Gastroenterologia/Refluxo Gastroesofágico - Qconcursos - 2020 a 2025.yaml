            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Em esôfago de Barrett, qualquer grau de displasia deve ser confirmado por patologista com expertise em trato gastrointestinal; como o caso traz displasia de baixo grau em biópsias aleatórias e não descreve lesão visível focal, a alternativa correta é a que orienta essa revisão anatomopatológica.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Barrett com displasia de baixo grau</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca mistura dois desvios comuns: fazer o candidato esquecer que LGD em Barrett precisa de confirmação por patologista especialista e induzi-lo a partir direto para conduta invasiva ou vigilância arbitrária; além disso, usa a descrição 'ocupando toda a circunferência' para derrubar quem errar a classificação de Praga.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em Barrett com qualquer grau de displasia, primeiro verifique se o laudo foi confirmado por patologista especialista em trato gastrointestinal.</li><li>Se a displasia aparece apenas em biópsias aleatórias e não há lesão visível descrita, não assuma indicação automática de mucosectomia ou ESD.</li><li>Na classificação de Praga, ocupação circunferencial exclui C0; C mede o segmento circunferencial e M a extensão máxima.</li><li>Não confunda Barrett com 