        enunciado: Paciente do sexo masculino, 40 anos, com histórico de doença do refluxo gastroesofágico de longa data, apresenta endoscopia com mucosa rosa salmão em terço distal ocupando toda circunferência do órgão e com extensão de cerca de 3 cm. À histologia, obteve-se o diagnóstico de esôfago de Barrett, com displasia de baixo grau em biópsias aleatórias. Sobre esse quadro, é correto afirmar que
        alternativas:
          - id: alt_A
            texto: deve ser utilizada a classificação endoscópica de Praga que, nesse caso, seria C0M3.
            comentario: Está errada porque a classificação de Praga foi aplicada de forma incorreta. Se a mucosa metaplásica ocupa toda a circunferência por cerca de 3 cm, o componente circunferencial é C3 e a extensão máxima é M3. Portanto, não pode ser C0M3.
          - id: alt_B
            texto: há indicação de revisão do laudo de patologia por um patologista especialista em trato gastrointestinal.
            comentario: 'A alternativa B está correta porque a displasia de baixo grau no esôfago de Barrett tem importante variabilidade interobservador. Assim, o diagnóstico não deve ser aceito automaticamente a partir de um único laudo geral: ele precisa de confirmação por patologista especialista em trato gastrointestinal antes de definir vigilância ou terapia endoscópica.'
          - id: alt_C
            texto: o paciente tem indicação de ressecção do local da lesão com mucosectomia ou ESD.
            comentario: Está errada porque mucosectomia ou ESD são indicadas principalmente quando há lesão visível no Barrett, permitindo ressecção-alvo e estadiamento histológico. No enunciado, a displasia foi encontrada em biópsias aleatórias e não há descrição de nódulo, ulceração ou outra lesão focal visível; nesse cenário, a base sustenta primeiro a confirmação histológica, não ressecção imediata do suposto local da lesão.
          - id: alt_D
            texto: o paciente tem indicação de endoscopia de controle trimestral.
            comentario: Está errada porque não há indicação padrão de endoscopia trimestral de rotina para esse quadro com base nas informações fornecidas. Segundo a base, o passo decisivo inicial é confirmar a LGD com patologista especialista; só depois se define reavaliação estruturada, vigilância em intervalos de diretriz ou terapia de erradicação endoscópica. Controle trimestral empírico não é sustentado aqui.
          - id: alt_E
            texto: todo esôfago de Barrett é considerado displasia de baixo grau, desse modo não há necessidade de seguimento específico.
            comentario: Está errada porque esôfago de Barrett não é sinônimo de displasia de baixo grau. Barrett é metaplasia intestinal do esôfago distal e pode estar sem displasia, ser indefinido para displasia, ter displasia de baixo grau, alto grau ou neoplasia inicial. Portanto, é falso afirmar que todo Barrett seja LGD e também é falso concluir que não necessite seguimento específico.
