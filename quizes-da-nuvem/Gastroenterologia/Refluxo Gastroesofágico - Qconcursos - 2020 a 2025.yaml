            texto: Deve realizar exames complementares no caso de refluxo gastroesofágico fisiológico.
          - id: alt_B
            texto: O tratamento para refluxo gastroesofágico fisiológico deve ser feito com inibidor de bomba de prótons.
          - id: alt_C
            texto: O Relaxamento Transitório do Esfíncter Esofágico Inferior (RTEEI) é a principal causa da DRGE.
          - id: alt_D
            texto: Refluxo gastroesofágico é uma manifestação muito comum em crianças com pico de incidência entre 2 e 4 anos.
          - id: alt_E
            texto: A frequência do refluxo aumenta com a idade do lactente, sendo comum em crianças acima dos 18 meses.
        gabarito: C

      - tipo: ME
        id: 121026-1655-10-5R7Ztf
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Acerca da doença do refluxo gastroesofágico, assinale a alternativa que apresenta o melhor tratamento cirúrgico com crurorrafia e fundoplicatura.
        alternativas:
          - id: alt_A
            texto: paciente jovem com sintomas típicos de refluxo gastroesofágicos com esofagite erosiva e boa resposta ao tratamento clínico com inibidor de bomba de prótons
          - id: alt_B
            texto: paciente com laringite posterior sem resposta ao tratamento com inibidores de bomba de prótons
          - id: alt_C
            texto: presença de hérnia de hiato por deslizamento de 2 cm, oligossintomático
          - id: alt_D
            texto: paciente com esôfago de Barret com displasia de alto grau
          - id: alt_E
            texto: pacientes com sintomas atípicos de refluxo com manomentria e pHmetria esofágicas normais
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange;"><b>Tema central:</b></span> A questão aborda o <b>tratamento cirúrgico da Doença do Refluxo Gastroesofágico (DRGE)</b>, especificamente a <b>indicação de crurorrafia e fundoplicatura</b>. Essas técnicas consistem, respectivamente, no reforço do hiato esofágico e na realização de um envolvimento parcial ou total do fundo gástrico ao redor do esôfago, com objetivo de restaurar o mecanismo antirrefluxo.</p>

          <p><span style="color:navy;"><b>Comentário da alternativa correta – Letra A:</b></span> <br>
          <b>Paciente jovem com sintomas típicos de refluxo, esofagite erosiva e boa resposta ao tratamento clínico com IBP.</b><br>
          Essa é a alternativa correta, pois, conforme as <b>Diretrizes da Sociedade Brasileira de Cirurgia Digestiva (SBCD)</b> e protocolos internacionais, a cirurgia está indicada para pacientes com <u>sintomas típicos, esofagite comprovada e boa resposta ao tratamento clínico</u>, mas que apresentam <b>desejo de evitar o uso contínuo de medicamentos</b>, sofrem efeitos colaterais inaceitáveis ou têm aderência insatisfatória ao tratamento farmacológico.<br>
          Segundo o <b>Consenso Brasileiro da DRGE</b>: “A boa resposta à terapia clínica prediz sucesso cirúrgico.” (Consenso da DRGE, 2021, p. 21).</p>

          <p><span style="color:darkorange;"><b>Análise das alternativas incorretas:</b></span></p>

          <p><b>B)</b> <b>Laringite posterior isolada</b> é manifestação extraesofágica com indicação controversa de cirurgia, principalmente quando não há resposta ao IBP, já que muitos desses casos não têm relação direta comprovada com DRGE.</p>

          <p><b>C)</b> A <b>hérnia hiatal pequena e oligossintomática</b> não constitui indicação cirúrgica, pois sintomas leves são manejados clinicamente, de acordo com o guia da <b>SBAD (p. 19)</b>.</p>

          <p><b>D)</b> Em <b>esôfago de Barrett com displasia de alto grau</b>, a conduta prioritária é <u>tratamento endoscópico</u> e vigilância oncológica, não sendo a fundoplicatura o procedimento de escolha nesse contexto.</p>

          <p><b>E)</b> <b>Sintomas atípicos de refluxo sem alterações em exames funcionais</b> (pHmetria e manometria normais) contraindicam intervenção cirúrgica, pois sugerem <b>ausência de DRGE documentada</b>, como orienta o <b>ACG Guideline: Diagnosis and Management of GERD (2022, p. 11)</b>.</p>

          <p><span style="color:navy;"><b>Dica para provas:</b></span> Atenção para <b>perfis clássicos de indicação cirúrgica</b>: sintomas típicos documentados, evidência endoscópica e boa resposta clínica — sinais de que a cirurgia oferece maior benefício. Cuidado com sintomas atípicos ou ausência de confirmação diagnóstica, que <u>não</u> autorizam intervenção cirúrgica.</p>

          <p><span style="color:darkorange;"><b>Resumo final:</b></span> O tratamento cirúrgico com <b>crurorrafia e fundoplicatura</b> deve ser reservado para pacientes com DRGE documentada, esofagite erosiva e que desejam evitar uso crônico de IBP. Fundamente sua resposta <u>sempre</u> nas diretrizes e correlacione achados clínicos e exames.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A alternativa A é a resposta correta pois representa um cenário clássico e ideal para a indicação de tratamento cirúrgico da doença do refluxo gastroesofágico (DRGE). Neste caso, temos um paciente jovem que apresenta sintomas típicos, como azia e regurgitação, acompanhados de esofagite erosiva, que é uma inflamação com erosão da mucosa esofágica, diagnosticada por endoscopia. O paciente também responde bem ao tratamento com inibidores de bomba de prótons (IBP), que são a primeira linha de tratamento clínico para a DRGE. A resposta ao IBP sugere que os sintomas são de fato devidos ao refluxo ácido, o que aumenta a chance de uma resposta positiva à cirurgia. A fundoplicatura com crurorrafia é uma técnica cirúrgica que restaura a anatomia normal da junção gastroesofágica e reforça o esfíncter esofágico inferior, reduzindo o refluxo de ácido para o esôfago.

            As demais opções não são ideais para o melhor tratamento cirúrgico com crurorrafia e fundoplicatura: B) Um paciente com laringite posterior sem resposta ao IBP pode não ter a DRGE como causa principal dos seus sintomas; C) Uma pequena hérnia de hiato oligossintomática não justifica uma intervenção cirúrgica, já que os sintomas são mínimos; D) Um paciente com esôfago de Barret com displasia de alto grau pode necessitar de tratamento cirúrgico, mas o principal objetivo é prevenir o câncer e não necessariamente controlar o refluxo e E) Pacientes com sintomas atípicos e exames normais não têm indicação clara para a cirurgia, já que não há evidência objetiva de refluxo anormal ou alterações esofágicas secundárias ao refluxo.
          </div>

      - tipo: ME
        id: 121026-1655-11-ZEuVx2
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'Considerando as implicações clínicas e patofisiológicas da doença do refluxo gastroesofágico (DRGE) e suas manifestações associadas, assinale a alternativa correta:'
        alternativas:
          - id: alt_A
            texto: A identificação da DRGE é, em muitos casos, baseada em sintomas clássicos, como dor torácica não cardíaca, tosse, pigarro e disfonia.
          - id: alt_B
            texto: A presença de hérnia hiatal não é considerada um fator de risco associado à DRGE.
          - id: alt_C
            texto: O Esôfago de Barret é uma condição puramente benigna e não representa risco para o desenvolvimento de adenocarcinoma esofágico.
          - id: alt_D
            texto: A DRGE provoca um aumento da resistência do epitélio mucoso esofágico, levando a uma diminuição do espaço intercelular e presença de erosões.
          - id: alt_E
            texto: O Esôfago de Barret surge devido ao refluxo gastroesofágico crônico. Embora o exame endoscópico possa indicar sua presença, a confirmação é feita por meio da análise histológica de biópsias.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color: darkorange; font-weight: bold;">Tema central:</span> <u>Doença do Refluxo Gastroesofágico (DRGE) e Esôfago de Barrett</u></p>

          <p>
          A questão aborda <b>as principais manifestações clínicas e complicações associadas à DRGE</b>, especialmente sua relação com o <span style="color: darkblue; font-weight: bold;">Esôfago de Barrett</span>. Entender as bases de diagnóstico e risco das complicações é fundamental para atuação clínica e para provas de concursos!
          </p>

          <p>
          <b><u>Justificativa para a alternativa correta (E):</u></b>
          <br>
          A alternativa <span style="color: darkblue;"><b>E</b></span> está correta porque <b>o Esôfago de Barrett é resultado do refluxo gastroesofágico crônico</b>. O diagnóstico inicial é feito pela <b>endoscopia digestiva alta</b>, que pode sugerir a presença da lesão. <u>Porém, a confirmação só ocorre com a análise histológica</u> das biópsias, que deve demonstrar <b>metaplasia intestinal especializada</b> substituindo o epitélio escamoso normal do esôfago. Segundo as "Guidelines for the Diagnosis, Surveillance and Therapy of Barrett's Esophagus" (American College of Gastroenterology): <span style="color: darkorange;">“O diagnóstico de Esôfago de Barrett requer a identificação endoscópica de mucosa esofágica anormal e confirmação histológica de metaplasia intestinal especializada.”</span>
          </p>

          <p>
          Além disso, trata-se de uma <span style="color: darkorange; font-weight: bold;">condição pré-maligna</span>, que exige acompanhamento devido ao risco aumentado de <b>adenocarcinoma esofágico</b>.
          </p>

          <p><b>Análise das alternativas incorretas:</b></p>

          <p>
          <span style="color: darkblue;"><b>A)</b></span> Errada! <b>Sintomas típicos</b> da DRGE são pirose (azia) e regurgitação. Tosse, pigarro, disfonia e dor torácica não cardíaca são <span style="color: darkorange;">manifestações atípicas</span> e menos frequentes.<br>
          <span style="color: darkblue;"><b>B)</b></span> Errada! A <b>hérnia hiatal</b> é um conhecido <span style="color: darkorange;">fator de risco</span> para o desenvolvimento de DRGE.<br>
          <span style="color: darkblue;"><b>C)</b></span> Incorreta! O Esôfago de Barrett não é benigno — aumenta o risco de <b>adenocarcinoma esofágico</b> (incidência anual cerca de 0,12%).<br>
          <span style="color: darkblue;"><b>D)</b></span> Incorreta! Na DRGE ocorre aumento da <b>permeabilidade do epitélio</b> (e não resistência), aumento do espaço intercelular e surgimento de erosões.
          </p>

          <p><b>Estratégia de prova:</b> Atenção ao uso de termos como “fator de risco”, “confirmação diagnóstica” e “benigno ou maligno”, frequentemente usados em pegadinhas. Leia cada alternativa atentamente, buscando diferenças sutis nos conceitos.</p>

          <p>
          <b>Resumo:</b> A alternativa <span style="color: darkblue; font-weight: bold;">E</span> traduz corretamente o raciocínio clínico, alinhado às evidências científicas, sobre o diagnóstico e o risco do Esôfago de Barrett em relação à DRGE.
          </p>

          <p><i>Gostou do comentário? Deixe sua avaliação aqui embaixo!</i></p>
          </div>

      - tipo: ME
        id: 121026-1655-12-dKSPr8
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          O caso hipotético a seguir contextualiza a questão. Leia-o atentamente.

          Mulher, 55 anos, com pirose e regurgitação há quatro meses, associados a episódios de náuseas e vômitos, perda ponderal e odinofagia. É tabagista e possui histórico familiar de câncer de esôfago.

          Diante da hipótese diagnóstica de Doença do Refluxo Gastroesofágico (DRGE), são consideradas indicações para a realização de Endoscopia Digestiva Alta (EDA), EXCETO:
        alternativas:
          - id: alt_A
            texto: Odinofagia.
          - id: alt_B
            texto: Perda ponderal.
          - id: alt_C
            texto: Náuseas e vômitos.
          - id: alt_D
            texto: História familiar de câncer.
          - id: alt_E
            texto: Idade maior ou igual a 50 anos.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color: #003366; font-weight: bold;">Tema central:</span> <span style="font-weight: bold;">Indicações para Endoscopia Digestiva Alta (EDA) em Doença do Refluxo Gastroesofágico (DRGE)</span></p>

          <p>A questão explora os <span style="color: #ff6600; font-weight: bold;">critérios de encaminhamento para EDA</span> diante de sintomas de DRGE, fundamental para a prática clínica e para a atuação do médico gastroenterologista na saúde pública. É essencial saber diferenciar sintomas que exigem investigação imediata dos que apenas demandam acompanhamento e tratamento clínico inicial.</p>

          <p><span style="background-color: #e6f0fa;"><b>Justificativa para a alternativa correta (E)</b></span></p>
          <p>
          <span style="color: #003366; font-weight: bold;">Idade maior ou igual a 50 anos</span> <b>não é, isoladamente, indicação para EDA</b> em pacientes com DRGE. Segundo protocolos estaduais e municipais, bem como literatura internacional (UpToDate, consensos SBG), <u>a indicação baseia-se principalmente em sintomas de alarme</u> (como odinofagia, emagrecimento, vômitos persistentes, disfagia, anemia sem causa definida e histórico familiar relevante).
          Citar idade como critério isolado seria um erro comum em provas, funcionando como uma "pegadinha". </p>

          <p><span style="background-color: #e6f0fa;"><b>Análise das alternativas incorretas</b></span></p>
          <ul>
          <li><b style="color: #ff6600;">A) Odinofagia:</b> <span style="color: #003366;">Sinal de alarme</span> importante, pois pode indicar complicações como úlceras, esofagite erosiva grave ou neoplasias. Sempre requer EDA.</li>
          <li><b style="color: #ff6600;">B) Perda ponderal:</b> Sinal clássico de gravidade. <span style="color: #003366;">Emagrecimento sem causa aparente</span> é forte indicativo de investigação para excluir câncer ou estenoses.</li>
          <li><b style="color: #ff6600;">C) Náuseas e vômitos:</b> Persistência desses sintomas pode evidenciar estenose, úlcera ou tumores – situações que exigem EDA para definição diagnóstica e de conduta.</li>
          <li><b style="color: #ff6600;">D) História familiar de câncer:</b> Em paciente sintomático, <span style="color: #003366;">história familiar de neoplasia esofágica/gástrica em parente de 1º grau</span> eleva o risco, devendo ser critério para EDA conforme protocolos.</li>
          </ul>

          <p><span style="background-color: #e6f0fa;"><b>Estratégia para provas:</b></span> Atente-se para alternativas que isolam idade como único critério – <span style="color: #ff6600;">vale apenas em associação a outros sintomas de alarme!</span> Pegadinhas são comuns, tentando confundir idade avançada com prioridade absoluta para EDA, o que não condiz com protocolos nacionais.</p>

          <p><span style="color: #003366;"><b>Evidência oficial:</b></span> Segundo o Protocolo de Gastroenterologia do Estado do Espírito Santo (p. 3): <em>“a idade avançada isolada não constitui indicação para endoscopia; considera-se sempre presença de sinais de alarme.”</em></p>

          <p><b>Resumo prático:</b> EDA está indicada na presença de sinais de alarme <u>independentemente da idade</u>. Idade ≥ 50 anos apenas associada a sintomas leves <span style="color: #ff6600; font-weight: bold;">NÃO</span> é critério isolado.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A questão envolve o conhecimento sobre as indicações para a realização de uma Endoscopia Digestiva Alta (EDA) no caso de uma suspeita de Doença do Refluxo Gastroesofágico (DRGE). A alternativa correta é a E - "Idade maior ou igual a 50 anos", porque essa condição em si não é uma indicação direta para a realização de endoscopia. As outras opções, como odinofagia (dor ao engolir), perda ponderal (perda de peso), náuseas e vômitos, e história familiar de câncer são sintomas, sinais ou fatores de risco que, quando presentes em pacientes com suspeita de DRGE, indicam a necessidade de uma EDA para investigação mais profunda. A idade maior ou igual a 50 anos, por outro lado, não é um critério isoladamente suficiente para indicar esse procedimento, pois a EDA é indicada com base na presença de sintomas ou sinais clínicos, não apenas na idade do paciente.
          </div>

      - tipo: ME
        id: 121026-1655-13-zMbI7P
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Pela classificação CEP para Doença do Refluxo Gastroesofágico (DRGE), paciente com manifestações esofágicas, exame endoscópico normal e pHmetria com resultados patológicos será classificado como
        alternativas:
          - id: alt_A
            texto: C1E1P1.
          - id: alt_B
            texto: C1E0P2.
          - id: alt_C
            texto: CXE3P2.
          - id: alt_D
            texto: C2E1P3.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b style="color:#1f3a93;">Alternativa correta: B – C1E0P2</b></p>

          <p><b style="color:#d35400;">Tema central</b>: Classificação CEP da Doença do Refluxo Gastroesofágico (DRGE), que integra três eixos: <u>C</u>línica, <u>E</u>ndoscopia e <u>P</u>Hmetria. É uma forma didática de <b>rotular o fenótipo da DRGE</b>, muito usada em provas e na prática no Brasil (Consenso Brasileiro de DRGE/FBG; Projeto Diretrizes AMB/CFM). </p>

          <p><b style="color:#1f3a93;">Por que a alternativa B é a correta?</b></p>
          <ul>
            <li><b>C1</b>: “manifestações esofágicas” indica <u>sintomas típicos</u> de DRGE (pirose, regurgitação). Logo, C1.</li>
            <li><b>E0</b>: “endoscopia normal” significa <u>ausência de esofagite erosiva/complicações</u>. Logo, E0.</li>
            <li><b>P2</b>: “pHmetria patológica” implica <u>exposição ácida aumentada</u> (p.ex., Acid Exposure Time &gt; 6% ou escore de DeMeester elevado), o que classifica como <b>patológico</b>. Logo, P2.</li>
          </ul>
          <p><i>Estratégia de prova</i>: traduza cada pista do enunciado em uma letra do CEP (sintomas → C; endoscopia → E; pHmetria → P), verificando se é típico/normal/patológico.</p>

          <p><b style="color:#d35400;">Conceitos-chave</b>:</p>
          <ul>
            <li><b>C (Clínica)</b>: C1 = sintomas típicos (pirose/regurgitação); C2 = manifestações extraesofágicas (tosse, rouquidão, asma); “Cx” quando não especificado.</li>
            <li><b>E (Endoscopia)</b>: E0 = normal; E1/E2 = esofagite erosiva em graus crescentes; E3 = complicações (estenose, Barrett, úlcera).</li>
            <li><b>P (pHmetria)</b>: P0 = normal; P1 = limítrofe/indeterminado; <b>P2 = patológico</b>; P3 = patológico grave/complicado (varia por protocolo).</li>
          </ul>

          <p><b style="color:#1f3a93;">Análise das alternativas incorretas</b>:</p>
          <ul>
            <li><b>A – C1E1P1</b>: embora C1 esteja correto, <b>E1</b> pressupõe esofagite, o que <u>contradiz a endoscopia normal</u>. Além disso, <b>P1</b> sugere achado <u>limítrofe</u>, e o enunciado afirma patológico.</li>
            <li><b>C – CXE3P2</b>: <b>E3</b> indica <u>complicações endoscópicas</u> (p.ex., Barrett/estenose), incompatível com “endoscopia normal”. O “CX” ignora que o enunciado define manifestações esofágicas (deveria ser C1).</li>
            <li><b>D – C2E1P3</b>: <b>C2</b> refere-se a <u>extraesofágico</u>, mas o caso é esofágico típico. <b>E1</b> não é endoscopia normal. <b>P3</b> extrapola “patológico” sugerindo gravidade maior, não citada.</li>
          </ul>

          <p><b style="color:#d35400;">Raciocínio clínico e evidências</b>:</p>
          <p>Pacientes com sintomas típicos e <u>endoscopia normal</u> podem ter DRGE confirmada pela <b>pHmetria</b>, que permanece referência para documentar refluxo patológico quando a endoscopia é negativa. Critérios como <u>tempo de exposição ácida &gt; 6%</u> e <u>DeMeester elevado</u> definem patologia (UpToDate; Consenso Brasileiro de DRGE/FBG; Diretrizes AMB/CFM). Assim, C1E0P2 resume precisamente o quadro.</p>

          <p><i>Evite a pegadinha</i>: endoscopia normal <u>não exclui</u> DRGE; o eixo “P” decide. Diferencie <b>esofágico (C1)</b> de <b>extraesofágico (C2)</b>.</p>

          <p><b style="color:#1f3a93;">Resposta final: B – C1E0P2.</b></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A classificação CEP para a Doença do Refluxo Gastroesofágico (DRGE) é baseada em três parâmetros: C (complacência esofágica), E (esofagite) e P (pHmetria de 24 horas). A alternativa correta para o paciente com manifestações esofágicas, exame endoscópico normal e pHmetria com resultados patológicos é a B - C1E0P2. Isso ocorre porque o paciente apresenta uma complacência esofágica normal (C1), não há esofagite (E0) e a pHmetria de 24 horas apresenta resultados patológicos (P2). É importante destacar que a classificação CEP é utilizada para avaliar a gravidade da DRGE e direcionar o tratamento adequado.
          </div>

