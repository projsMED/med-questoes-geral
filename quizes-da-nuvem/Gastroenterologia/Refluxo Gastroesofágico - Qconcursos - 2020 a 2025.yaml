        enunciado: |-
          Com relação à doença do refluxo gastroesofágico (DRGE), julgue o item seguinte.

          O refluxo ocorre quando há um funcionamento inadequado do músculo anelar, que normalmente impede que o conteúdo gástrico retorne ao esôfago.
        gabarito: V
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Vamos analisar a questão sobre a <strong><span style="color: darkorange;">doença do refluxo gastroesofágico (DRGE)</span></strong>. O tema central é o mecanismo pelo qual ocorre o refluxo, especificamente, o papel do músculo anelar (esfíncter esofágico inferior).</p>

          <p>O enunciado da questão nos leva a entender que o refluxo ocorre quando há um funcionamento inadequado do músculo que normalmente impediria o retorno do conteúdo gástrico para o esôfago. Este músculo é conhecido como <strong><span style="color: darkorange;">esfíncter esofágico inferior</span></strong>. Em condições normais, ele atua como uma barreira, se contraindo para fechar a passagem do esôfago ao estômago.</p>

          <p>Agora, vejamos as alternativas:</p>

          <p><strong>Alternativa C - certo:</strong> Esta é a <span style="color: darkorange;">alternativa correta</span>. O enunciado descreve corretamente o mecanismo de refluxo. Quando o esfíncter esofágico inferior não funciona adequadamente, ele não se fecha corretamente, permitindo que o conteúdo do estômago retorne ao esôfago, resultando na DRGE.</p>

          <p><strong>Alternativa E - errado:</strong> Esta <span style="color: darkorange;">alternativa está incorreta</span> porque contradiz o fato bem estabelecido sobre o papel do esfíncter esofágico inferior na prevenção do refluxo. O enunciado está correto ao afirmar que o refluxo é resultado de um mau funcionamento deste músculo.</p>

          <p>Para resolver questões como esta, é importante ter uma boa compreensão da <strong><span style="color: darkorange;">fisiologia do sistema digestório</span></strong>, especialmente no que se refere à função dos esfíncteres e ao mecanismo do refluxo gastroesofágico. Ao encontrar termos técnicos, como "músculo anelar", associe-os aos conhecimentos que você já possui sobre as estruturas do trato gastrointestinal.</p>

          <p><em>Gostou do comentário? Deixe sua avaliação aqui embaixo!</em></p>
          </div>

