        enunciado: |-
          A prevalência do esôfago de Barrett na população geral é de 1 a 2%, podendo chegar a 13% nos pacientes com refluxo gastroesofágico.

          Sobre o esôfago de Barrett, assinale a alternativa correta
        alternativas:
          - id: alt_A
            texto: A taxa de progressão para displasia de baixo grau ou adenocarcinoma é de 0,3-0,8% por ano.
          - id: alt_B
            texto: O diagnóstico é feito pela presença de epitélio colunar de tamanho mínimo de 2 cm no esôfago distal.
          - id: alt_C
            texto: A inspeção do Barrett durante a endoscopia deve durar um minuto para cada 5 cm de extensão.
          - id: alt_D
            texto: Na presença de lesão visível com displasia de baixo grau, deve-se fazer acompanhamento a cada seis meses.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><strong style="color:darkblue;">Tema central:</strong> Esôfago de Barrett (EB) é uma metaplasia intestinal do esôfago distal secundária ao refluxo gastroesofágico, aumentando o risco de adenocarcinoma esofágico. O diagnóstico é endoscópico com confirmação histológica. O manejo baseia-se em <u>estratificação por displasia</u> e vigilância/terapia endoscópica.</p>

          <p><strong style="color:darkorange;">Alternativa correta: A</strong> – A taxa de progressão anual em <u>EB sem displasia</u> para displasia (sobretudo alto grau) ou adenocarcinoma gira em torno de <strong>0,2–0,5% ao ano</strong>, podendo chegar a ~<strong>0,6–0,8%/ano</strong> em séries e metanálises, alinhando-se ao intervalo proposto. Diretrizes ACG 2022 e revisões no UpToDate indicam risco anual para HGD/EAC ~0,22–0,5% e, para EAC isolado, ~0,12–0,63%/ano. Portanto, a alternativa traduz adequadamente o risco de progressão do EB.</p>

          <p><strong style="color:darkblue;">Por que as demais estão incorretas?</strong></p>

          <p><strong style="color:darkorange;">B</strong> – Não há exigência de <u>2 cm</u> de epitélio colunar para diagnóstico. ACG 2022: requer <strong>≥1 cm</strong> de mucosa colunar acima da junção gastroesofágica, com <strong>metaplasia intestinal</strong> (células caliciformes) na biópsia. Segmentos &lt;1 cm são “linha Z irregular”, não EB. O tamanho mínimo de 2 cm está <u>errado</u> e desatualizado. Referências: ACG 2022; BSG 2014/2018; Harrison’s.</p>

          <p><strong style="color:darkorange;">C</strong> – O tempo de inspeção recomendado é <strong>maior</strong> que o proposto. Evidências e ACG 2022 sugerem <u>pelo menos 1 minuto por centímetro</u> de extensão do EB para melhorar a detecção de áreas suspeitas, associado ao protocolo de biópsias de Seattle (quadrantes a cada 2 cm em EB sem displasia; a cada 1 cm se displasia). “1 minuto para cada 5 cm” é <u>insuficiente</u>.</p>

          <p><strong style="color:darkorange;">D</strong> – Em <strong>lesão visível com displasia de baixo grau</strong> (DBG), a conduta <u>não</u> é apenas acompanhar. O recomendado é <strong>terapia endoscópica de erradicação</strong>: ressecção endoscópica da lesão (EMR/ESD) seguida de ablação (ex.: RFA). A vigilância sem tratamento (ex.: a cada 6–12 meses) pode ser considerada apenas quando a DBG é <u>confirmada</u>, não há lesão visível e o paciente recusa terapia. Diretrizes: ACG 2022; BSG.</p>

          <p><strong style="color:darkblue;">Dicas de prova e raciocínio:</strong></p>
          <ul>
            <li>Diagnóstico de EB: endoscopia com <strong>Prague C&amp;M</strong> para extensão e biópsias confirmando <u>metaplasia intestinal</u>.</li>
            <li>Vigilância EB sem displasia: endoscopia a cada <strong>3–5 anos</strong> com protocolo de Seattle.</li>
            <li>DBG confirmada: <strong>preferir erradicação endoscópica</strong>; vigilância é alternativa selecionada.</li>
            <li>Use técnicas de <u>imagem aprimorada</u> (NBI) e aumente o tempo de inspeção para melhorar a detecção de displasia.</li>
          </ul>

          <p><em>Referências essenciais:</em> ACG Clinical Guideline: Diagnosis and Management of Barrett’s Esophagus (2022); BSG Guidelines (2014/2018); UpToDate (acesso 2024); Harrison’s Principles of Internal Medicine.</p>

          <p><strong>Gabarito: A</strong></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

