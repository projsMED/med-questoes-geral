        enunciado: 'A Doença do Refluxo Gastroesofágico (DRGE) ocorre quando o Refluxo Gastroesofágico (RGE) causa manifestações clínicas cuja gravidade é variável, podendo estar associada a complicações com dano tissular e inflamação, como esofagite, complicação respiratória e/ou comprometimento do ganho de peso, ou seja, com a presença de sinais de alarme. Sobre essa doença, assinale a alternativa correta:'
        alternativas:
