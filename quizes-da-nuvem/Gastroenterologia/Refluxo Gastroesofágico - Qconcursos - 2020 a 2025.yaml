        gabarito: V
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><strong style="color:darkorange;">Tema central:</strong> <span style="color: #003366"><u>Indicação de cirurgia antirrefluxo na Doença do Refluxo Gastroesofágico (DRGE)</u></span></p>

          <p>A <strong>DRGE</strong> é caracterizada pelo refluxo do conteúdo gástrico para o esôfago, produzindo sintomas típicos como <strong>pirose</strong> (azia) e <strong>regurgitação ácida</strong>. O diagnóstico é confirmado por sintomas e exames como <strong>endoscopia digestiva alta</strong>, que pode mostrar <span style="color: #003366"><strong>esofagite erosiva</strong></span>, como visto no caso.</p>

          <p>O <strong>tratamento inicial</strong> consiste em mudanças de estilo de vida (perda de peso, evitar refeições volumosas à noite) e <strong>medicação, principalmente inibidores da bomba de próton (IBP)</strong>. Entretanto, <u>há situações em que a cirurgia antirrefluxo pode ser indicada</u>.</p>

          <p><span style="color:darkorange;"><strong>Justificativa da alternativa correta (C)</strong>:</span></p>
          <p>Segundo as diretrizes brasileiras da FBG (2024): <span style="color: #003366">“A cirurgia antirrefluxo pode ser indicada tanto para pacientes que não respondem adequadamente à terapia medicamentosa quanto para aqueles que, mesmo respondendo, desejam uma solução definitiva para os sintomas e pretendem suspender o uso prolongado de medicamentos.”</span></p>
          <p>Ou seja, <strong style="color:darkorange;">mesmo pacientes com boa resposta ao IBP podem optar pela cirurgia</strong> — especialmente se forem jovens e não desejam uso crônico de fármacos. A fundoplicatura laparoscópica é o procedimento-padrão recomendado, com altos índices de sucesso (<span style="color: #003366">Calado et al., 2014</span>).</p>

          <p><span style="color:darkorange;"><strong>Análise da alternativa incorreta (E)</strong>:</span></p>
          <p>Considerar a alternativa “Errado” indicaria que a cirurgia só seria opção para não respondedores, o que está <u>em desacordo com as diretrizes atuais</u> e com a prática clínica estabelecida.</p>

          <p><span style="color: #003366"><u>Pontos-chave para provas</u>:</span></p>
          <ul>
            <li><strong>Atenção às alternativas:</strong> Algumas bancas trazem pegadinhas, dando a entender que cirurgia é só para caso refratário. Observe termos absolutos como “sempre” ou “apenas”.</li>
            <li><strong>Destaque no enunciado:</strong> Jovem, com sintomatologia típica, já com diagnóstico endoscópico e resposta insatisfatória ao IBP: cirurgia é válida tanto para refratários quanto para os que respondem mas têm desejo de suspensão de drogas.</li>
          </ul>

          <p><span style="color:darkorange;"><strong>Resumo:</strong></span> <span style="color: #003366"><strong>Correta</strong> a afirmação de que cirurgia antirrefluxo é indicada para pacientes com resposta à terapia de supressão ácida, desde que desejem solução definitiva e estejam informados sobre riscos e benefícios.</span></p>

          <p><em>Gostou do comentário? Deixe sua avaliação aqui embaixo!</em></p>
          </div>

