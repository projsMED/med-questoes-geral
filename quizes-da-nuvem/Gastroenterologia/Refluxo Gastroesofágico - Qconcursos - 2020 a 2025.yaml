        enunciado: Paciente de 50 anos, com sintomas de doença do refluxo gastroesofágico, realizou duas endoscopias digestiva alta (EDA) consecutivas, com alterações no esôfago distal, sugestivas de esôfago de Barrett, com extensão de 2cm da transição esofagogástrica. Foram realizadas biópsias desta região, com exame histopatológico compatível com metaplasia intestinal, sem displasia, nos dois exames consecutivos. Tendo em vista a alteração encontrada no exame anatomopatológico, assinale a alternativa correta.
        alternativas:
          - id: alt_A
            texto: Deve-se realizar EDA anualmente para seguimento de esôfago de Barrett
          - id: alt_B
            texto: Paciente não necessita de acompanhamento com EDA
          - id: alt_C
            texto: Paciente precisa realizar EDA a cada 2 anos
          - id: alt_D
            texto: Paciente precisa realizar EDA a cada 3-5 anos
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange; font-weight:bold;">Tema central:</span> O foco da questão está na <b><u>conduta de vigilância</u></b> para um paciente com <b>esôfago de Barrett</b> comprovado histologicamente (<i>metaplasia intestinal</i>) e <b>ausência de displasia</b> em dois exames consecutivos.</p>

          <p><span style="color:darkblue; font-weight:bold;">Explicação didática:</span> O <b>esôfago de Barrett</b> é uma complicação da DRGE caracterizada pela substituição do epitélio escamoso por epitélio colunar, aumentando o risco de <span style="color:darkorange;"><b>adenocarcinoma esofágico</b></span>. O diagnóstico deve ser confirmado histologicamente, com metaplasia intestinal em biópsias endoscópicas.</p>

          <p><b>Critérios diagnósticos:</b> História clínica sugestiva de refluxo, alteração endoscópica do esôfago distal e confirmação por histologia (metaplasia intestinal).</p>

          <p><span style="color:darkorange; font-weight:bold;">Frequência de vigilância:</span> Diretrizes como as da AMB e ASENEM indicam que, em <span style="color:darkblue;"><b>pacientes sem displasia</b></span>, a <b>taxa de progressão para câncer é baixa</b> (0,1% - 0,4% ao ano). Assim, a realização de <span style="color:darkorange; font-weight:bold;">EDA a cada 3-5 anos</span> é considerada adequada para detectar progressão sem causar excesso de procedimentos.</p>

          <p><span style="color:darkblue; font-weight:bold;">Análise das alternativas:</span></p>

          <p>
          <span style="color:darkorange;"><b>A)</b></span> <u>Incorreta</u>. EDA <b>anualmente</b> é indicada para casos com <b>displasia de baixo grau</b>, mas não para ausência de displasia, pois aumentaria custos e riscos sem benefício comprovado.<br>
          <span style="color:darkorange;"><b>B)</b></span> <u>Incorreta</u>. O <b>Barrett sem displasia requer vigilância periódica</b> devido ao potencial de malignização.<br>
          <span style="color:darkorange;"><b>C)</b></span> <u>Incorreta</u>. O intervalo de 2 anos é preconizado em alguns protocolos para Barrett curto, mas o padrão mais aceito é <span style="color:darkorange; font-weight:bold;">3-5 anos</span> para ausência de displasia.<br>
          <span style="color:darkorange;"><b>D)</b></span> <u><b>Correta</b></u>. Segue as <span style="color:darkblue;"><b>diretrizes nacionais e internacionais</b></span> ao recomendar EDA a <span style="color:darkorange; font-weight:bold;">cada 3-5 anos</span> para pacientes sem displasia (<i>AMB Projeto Diretrizes, ASENEM</i>).
          </p>

          <p><span style="color:darkblue; font-weight:bold;">Dica para provas futuras:</span> Ao ler alternativas que propõem intervalos curtos (<u>anual</u>) para lesões de baixo risco, desconfie! Verifique sempre a presença de displasia para decidir a vigilância.</p>

          <p><b>Resumo:</b> O <span style="color:darkorange;">esôfago de Barrett sem displasia</span> deve ser acompanhado com EDA a cada <b>3-5 anos</b>, em consonância com o baixo risco de progressão (<span style="color:darkorange;">D</span> é a correta).</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

