            <strong>Relaxaçãos transitórias do EEI</strong>: importantes na patogênese da DRGE.

            <strong>H. pylori</strong> não é fator causal da DRGE.

            <strong>Sintomas atípicos</strong> da DRGE: faringite, rouquidão, sinusite.

