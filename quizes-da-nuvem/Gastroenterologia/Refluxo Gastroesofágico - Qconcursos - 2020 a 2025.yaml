        enunciado: |-
          Uma paciente de 32 anos de idade passou a sentir dor epigástrica em queimação, associada às alimentações.
          Refere, ainda, disfagia e odinofagia. Nega outras doenças. O exame físico mostrou-se sem alterações. Em virtude do quadro de dor torácica, foi indicada endoscopia digestiva alta. Na endoscopia, a paciente apresentava uma ou mais erosões de até 5 mm, sem massas ou lesões suspeitas para neoplasia.

          A respeito desse caso clínico e tendo em vista os conhecimentos médicos correlatos, julgue o item a seguir.

          Esofagite de refluxo é uma complicação possível desse caso.
        gabarito: V
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><strong>Alternativa Correta:</strong> <span style="color: darkorange;">C - certo</span></p>

          <p>A questão apresentada refere-se a um quadro clínico típico de <strong style="color: darkblue;">esofagite de refluxo</strong>. A paciente, com 32 anos, relata sintomas de dor epigástrica em queimação associada à alimentação, além de disfagia (dificuldade para engolir) e odinofagia (dor ao engolir). Tais sintomas são frequentemente associados ao <span style="color: darkorange;">refluxo gastroesofágico</span>, onde o conteúdo ácido do estômago retorna para o esôfago, causando irritação na mucosa esofágica.</p>

          <p>No exame de endoscopia digestiva alta, foram observadas <strong style="color: darkblue;">erosões</strong> de até 5 mm no esôfago. Este achado é característico de esofagite de refluxo, pois o contato repetido do ácido gástrico com o revestimento esofágico pode levar a erosões na mucosa.</p>

          <p>É importante destacar que a presença de erosões na endoscopia sem a detecção de massas ou lesões suspeitas para neoplasia reforça o diagnóstico de esofagite de refluxo. Isso ocorre porque, em condições como esofagite de refluxo, a mucosa é danificada, mas geralmente não há formação de massas ou lesões que sugiram câncer.</p>

          <p><strong>Justificativa da Alternativa Correta:</strong> A alternativa <span style="color: darkorange;">C - certo</span> está correta, pois os achados clínicos e endoscópicos são compatíveis com esofagite de refluxo, uma complicação comum em pacientes com sintomas de refluxo gastroesofágico.</p>

          <p>As alternativas incorretas, se existissem, falhariam em considerar a correlação direta entre os sintomas e os achados endoscópicos com um diagnóstico comum e bem documentado, como a esofagite de refluxo.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A afirmação é correta. A paciente apresenta sintomas clássicos de esofagite de refluxo, como dor epigástrica em queimação, disfagia e odinofagia, que são agravados após as refeições. A endoscopia mostrou erosões no esôfago, o que é compatível com o diagnóstico de esofagite de refluxo. É importante destacar que essa condição é uma complicação comum do refluxo gastroesofágico, que ocorre quando o ácido do estômago retorna para o esôfago, irritando sua mucosa. O tratamento deve ser individualizado, incluindo mudanças no estilo de vida, como evitar alimentos irritantes, perda de peso e uso de medicamentos para controlar a acidez estomacal.
