            texto: A pHmetria na EoE encontra-se normal no esôfago distal.
          - id: alt_B
            texto: Na EoE, os sintomas de disfunsão esofágica são tipicamente intermitentes.
          - id: alt_C
            texto: Na DRGE, a terapêutica com inibidores da bomba de prótons apresenta melhora significativa.
          - id: alt_D
            texto: Na EoE, a biópsia da mucosa esofágica apresenta <10 eosinófilos por CGA (campo de grande ampliação).
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange;"><b>Tema central da questão:</b></span> O tema é o <b>diagnóstico diferencial entre esofagite eosinofílica (EoE) e doença do refluxo gastroesofágico (DRGE)</b>, condição clínica corriqueira em concursos de Gastroenterologia. Saber distinguir essas afecções é estratégico, pois ambas podem cursar com sintomas semelhantes, mas a abordagem e o tratamento diferem radicalmente.</p>

          <p><span style="color:darkorange;"><b>Justificativa para a alternativa correta</b></span> (<b>D</b>):<br>
          A alternativa <b>D</b> (<i>“Na EoE, a biópsia da mucosa esofágica apresenta &lt;10 eosinófilos por CGA (campo de grande ampliação).”</i>) está <span style="color:darkblue;"><u>incorreta</u></span>: <u><b>O diagnóstico histológico da EoE exige ≥15 eosinófilos por campo de grande ampliação</b></u>, conforme a Sociedade Brasileira de Pediatria e protocolos internacionais. Biópsias abaixo desse número afastam a hipótese, logo, a assertiva não se encaixa nos critérios diagnósticos e configura a resposta correta.</p>

          <p><span style="color:darkorange;"><b>Análise das alternativas incorretas:</b></span></p>

          <p><b>A)</b> <u>Correta</u> para o diagnóstico diferencial: A <span style="color:darkblue;">pHmetria do esôfago distal é normalmente <b>normal na EoE</b></span>. Na DRGE, há episódios de refluxo ácidos detectados. Estratégia de prova: atente-se para exames funcionais indicando distinção das patologias.</p>

          <p><b>B)</b> <u>Correta</u>: Na <b>EoE</b>, sintomas como <span style="color:darkblue;">disfagia</span> são geralmente <u>intermitentes</u> e flutuantes, alternando períodos sintomáticos e assintomáticos, diferentemente do padrão mais contínuo visto na DRGE.</p>

          <p><b>C)</b> <u>Correta</u>: Na <b>DRGE</b>, há clara resposta aos <span style="color:darkblue;">inibidores de bomba de prótons (IBP)</span>. Em contraste, pacientes com EoE geralmente <u>não melhoram significativamente</u> apenas com IBP, exigindo tratamentos específicos (ex: corticosteroides tópicos, dieta de exclusão).</p>

          <p><span style="color:darkorange;"><b>Destaques estratégicos e diretrizes:</b></span></p>
          <p>• <b>Dica de prova</b>: Palavras como “<span style="color:darkorange;">menos de 10 eosinófilos</span>” devem soar alerta, pois fogem aos critérios clássicos.<br>
          • <b>Protocolo SBP (2021)</b>: “O diagnóstico da EoE é baseado em sintomas clínicos compatíveis e presença de ≥15 eosinófilos por campo de grande ampliação em pelo menos uma biópsia esofágica.”<br>
          • <b>Harrison’s Principles of Internal Medicine (20ª ed.)</b>: EoE é “definida histologicamente por infiltrado ≥15 eosinófilos por campo de grande aumento”.</p>

          <p><span style="color:darkgreen;"><i>Resumo prático:</i></span> Em casos de dúvida, sempre revise os critérios quantitativos para diagnóstico histológico e associe-os aos principais exames laboratoriais e resposta ao tratamento.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

