        enunciado: |-
          Paciente 52 anos, masculino, IMC 35kg/m2, tabagista, realiza endoscopia digestiva alta evidenciando achados compatíveis com esofagite erosiva péptica grau B de Los Angeles e área de epitélio de cor rosa salmão no esôfago distal. Foram realizadas biópsias do local.

          Sobre o caso apresentado, analise as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa.

          ( ) Segundo o Consenso de Lyon, esse paciente pode ou não apresentar critério endoscópico conclusivo para DRGE, a depender do resultado histopatológico.
          ( ) Seria indicado esse paciente realizar pHmetria em vigência de inibidor de prótons, caso o histopatológico venha inconclusivo.
          ( ) São complicações possíveis da doença do refluxo gastroesofágico: as úlceras de esôfago e estenose péptica.
          ( ) O paciente apresenta pelo menos quatro fatores de risco para progressão de displasia para adenocarcinoma esofágico, caso o histopatológico confirme a suspeita endoscópica.
          ( ) Caso o histopatológico apresente displasia de baixo grau, esse paciente deverá realizar tratamento cirúrgico.

          As afirmativas são, respectivamente,
        alternativas:
          - id: alt_A
            texto: V – V – V – F – V.
          - id: alt_B
            texto: V – F – F – V – F.
          - id: alt_C
            texto: F – V – F – F – V.
          - id: alt_D
            texto: V – F – V – V – F.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color: #0B254B; font-weight: bold;">Tema central:</span> A questão aborda diagnóstico, complicações e manejo do <u>esôfago de Barrett</u> e da <u>doença do refluxo gastroesofágico (DRGE)</u>, incluindo fatores de risco e conduta frente à displasia detectada em biópsia.</p>

          <p><span style="color: #D2691E; font-weight: bold;">Justificativa da alternativa correta – D (V – F – V – V – F):</span></p>

          <p><b>1. (V) Consenso de Lyon e DRGE:</b> De acordo com o Consenso de Lyon (2018), a <span style="color: #0B254B;">esofagite erosiva grau B</span> de Los Angeles não é critério definitivo para DRGE. Já achados como esofagite grau C ou D, Barrett comprovado ou tempo de exposição ácida &gt;6% são conclusivos. Assim, <span style="color: #D2691E; font-weight: bold;">pode ou não ser DRGE, a depender da histologia</span> (diretriz, p. 12).</p>

          <p><b>2. (F) pHmetria sob IBP:</b> A <span style="color: #0B254B;">pHmetria esofágica</span> deve ser feita <u>fora do uso de IBP</u> para diagnóstico convencional, pois o medicamento pode mascarar o padrão de refluxo (UpToDate, PCDT DRGE).</p>

          <p><b>3. (V) Complicações da DRGE:</b> Úlceras e estenose péptica são complicações clássicas da DRGE (<span style="color: #D2691E;">Manuais MSD</span>).</p>

          <p><b>4. (V) Fatores de risco para adenocarcinoma:</b> O paciente reúne pelo menos quatro fatores: <span style="color: #0B254B;">idade &gt;50 anos</span>, <span style="color: #0B254B;">sexo masculino</span>, <span style="color: #0B254B;">IMC elevado</span> e <span style="color: #0B254B;">tabagismo</span>. Todos aumentam o risco de progressão do esôfago de Barrett para adenocarcinoma (MSD, UpToDate).</p>

          <p><b>5. (F) Conduta frente à displasia de baixo grau:</b> <span style="text-decoration: underline; color: #D2691E;">Cirurgia não é indicada</span> de rotina no Barrett com displasia de baixo grau—primeiro, reforça-se vigilância endoscópica rigorosa e opção por terapias endoscópicas seguras (SBAD, UpToDate).</p>

          <p><span style="color: #0B254B; font-weight: bold;">Análise das alternativas incorretas:</span></p>

          <p><b>A e C</b> – Apresentam erro de juízo quanto à conduta cirúrgica e à realização de pHmetria sob IBP (não recomendado).
          <br><b>B</b> – Indica incorretamente que as complicações citadas não são possíveis.</p>

          <p><span style="color: #D2691E;">Dicas de prova:</span> Atenção a detalhes como <b>critério diagnóstico definitivo</b> (Lyon) e <b>condutas frente à displasia</b>. Pegadinha importante: evitar a indicação precoce de cirurgia em displasia de baixo grau.</p>

          <p><span style="color: #0B254B;">Referências:</span> Protocolo Clínico e Diretrizes Terapêuticas da DRGE, Consenso de Lyon 2018, Manuais MSD, UpToDate, SBAD.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A questão apresentada aborda o cenário clínico de um paciente com esofagite erosiva e possível esôfago de Barrett, que pode ser uma consequência da doença do refluxo gastroesofágico (DRGE). Vamos analisar cada afirmativa:

            (1) V: Segundo o Consenso de Lyon, a endoscopia pode ou não apresentar critérios conclusivos para DRGE. No caso descrito, há evidência de esofagite erosiva, que é um critério endoscópico para DRGE, mas a confirmação pode depender dos resultados histopatológicos, especialmente se houver suspeita de esôfago de Barrett.

            (2) F: A pHmetria seria indicada, por exemplo, para avaliar a presença de refluxo ácido em pacientes com sintomas atípicos ou refratários ao tratamento, mas não necessariamente em pacientes já com achados endoscópicos de esofagite e potencial esôfago de Barrett. A pHmetria não é realizada em vigência de inibidores de prótons porque esses medicamentos suprimem a acidez gástrica, o que interferiria no resultado do exame. Portanto, a pHmetria é geralmente realizada após a suspensão temporária do uso desses medicamentos.

            (3) V: Complicações da doença do refluxo gastroesofágico podem incluir úlceras de esôfago e estenose péptica, que são consequências do dano crônico causado pelo ácido gastresofágico no esôfago.

            (4) V: O paciente apresenta fatores de risco para progressão de displasia para adenocarcinoma esofágico, que incluem idade avançada, obesidade (IMC 35kg/m²), tabagismo e achados endoscópicos compatíveis com esofagite erosiva e possível esôfago de Barrett.

            (5) F: A presença de displasia de baixo grau no esôfago não é uma indicação direta para tratamento cirúrgico. A abordagem inicial geralmente inclui vigilância endoscópica e tratamento médico com inibidores de prótons. O tratamento cirúrgico ou procedimentos endoscópicos são considerados para casos selecionados, especialmente na presença de displasia de alto grau ou câncer confirmado.

            Portanto, a sequência correta é: (V) (F) (V) (V) (F), o que corresponde à alternativa D.
          </div>
