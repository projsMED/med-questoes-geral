          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="font-weight: bold; color: darkorange;">Alternativa correta:</span> D - Paciente com menos de 40 anos que apresentam manifestações típicas, sem sinais ou sintomas de alerta, podem receber teste terapêutico com inibidor da bomba de prótons.</p>

          <p><span style="font-weight: bold; color: darkblue;">Tema central da questão:</span> A questão aborda o manejo de um paciente com sintomas típicos de doença do refluxo gastroesofágico (DRGE), considerando os procedimentos diagnósticos e terapêuticos adequados. Para solucioná-la, é necessário compreender os critérios para diagnóstico de DRGE e as circunstâncias em que testes adicionais ou tratamentos empíricos são indicados.</p>

          <p><span style="font-weight: bold; color: darkorange;">Justificativa para a alternativa correta:</span> A alternativa D é correta porque, em pacientes jovens (menos de 40 anos) com sintomas clássicos de DRGE, como queimação retroesternal, e sem sinais de alerta (como perda de peso, anemia ou disfagia), é comum iniciar um teste terapêutico com inibidores da bomba de prótons (IBP). Essa estratégia ajuda a confirmar o diagnóstico por meio da resposta ao tratamento, sem necessidade imediata de exames invasivos adicionais.</p>

          <p><span style="font-weight: bold; color: darkorange;">Análise das alternativas incorretas:</span></p>

          <p><span style="font-weight: bold; color: darkblue;">A -</span> "Pacientes com DRGE não apresentam EDA normal." Esta alternativa está incorreta porque muitos pacientes com DRGE podem ter uma endoscopia digestiva alta (EDA) normal. A EDA é útil para excluir outras condições e avaliar complicações, mas não é necessária para o diagnóstico de DRGE.</p>

          <p><span style="font-weight: bold; color: darkblue;">B -</span> "A obesidade não é fator de risco para DRGE." Esta afirmação é incorreta. A obesidade é, na verdade, um fator de risco significativo para DRGE, pois o excesso de peso pode aumentar a pressão intra-abdominal e favorecer o refluxo do conteúdo gástrico para o esôfago.</p>

          <p><span style="font-weight: bold; color: darkblue;">C -</span> "A impedâncio-pHmetria esofágica é indispensável para o diagnóstico da DRGE." Esta alternativa está errada porque a impedâncio-pHmetria é um exame útil, mas não é indispensável para o diagnóstico de DRGE. É geralmente reservada para casos em que o diagnóstico é incerto ou para avaliar a eficácia dos tratamentos em pacientes refratários.</p>

          <p><span style="font-weight: bold;">Gostou do comentário? Deixe sua avaliação aqui embaixo!</span></p>
          </div>

