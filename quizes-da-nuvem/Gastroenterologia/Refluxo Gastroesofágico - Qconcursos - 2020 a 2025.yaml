      - tipo: ME
        id: 121026-1655-22-8SLYyS
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Na Doença do Refluxo Gastroesofágico (DRGE), deve-se recorrer à Endoscopia Digestiva Alta (EDA) em casos
          I. de sintomas e/ou sinais de alarme. II. de rastreio de doentes de alto risco (idade > 45 anos). III. sem resposta a Inibidores de Bomba de Prótons (IBP), pelo menos, 2 semanas com toma correta.

          É correto o que se afirma em
        alternativas:
          - id: alt_A
            texto: I e II, apenas.
          - id: alt_B
            texto: I e III, apenas.
          - id: alt_C
            texto: II e III, apenas.
          - id: alt_D
            texto: I, II e III.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color: darkorange; font-weight: bold;">Tema central da questão:</span> <b>Indicação de Endoscopia Digestiva Alta (EDA) na Doença do Refluxo Gastroesofágico (DRGE).</b> Trata-se de questão extremamente importante na prática clínica, pois saber o momento correto para solicitar EDA evita exames desnecessários e permite diagnóstico precoce de complicações.</p>

          <p><span style="color: #003366; font-weight: bold;">Justificativa da alternativa correta (D - I, II e III):</span></p>

          <p><b>I. Sintomas e/ou sinais de alarme:</b> Pacientes com DRGE e sinais de alarme, como disfagia, perda ponderal inexplicada, anemia ferropriva, sangramento ou odinofagia, <span style="text-decoration: underline; color: darkorange;">sempre</span> demandam EDA, pois podem indicar lesões graves (neoplasias ou estenoses). Conforme o Protocolo de Gastroenterologia de ES: <span style="color: darkorange;">"a presença de sinais de alarme justifica encaminhamento para EDA imediato".</span></p>

          <p><b>II. Rastreamento de doentes de alto risco (idade &gt; 45 anos):</b> Embora idade sozinha não seja critério absoluto, <span style="color: #003366;">a associação de idade avançada com sintomas de DRGE prolongados aumenta o risco de neoplasias e esôfago de Barrett</span>. Diretrizes recomendam rastreamento individualizado nesses casos, especialmente se houver outros fatores de risco (como tabagismo e obesidade).</p>

          <p><b>III. Falha à terapia com IBP após uso correto:</b> O não controle dos sintomas após ao menos 2 semanas com IBP de uso adequado <b>deve levantar suspeita de doença refratária ou diagnósticos diferenciais</b>, indicando EDA para pesquisa de outras causas e complicações. Segundo o Protocolo de Gastroenterologia: <span style="color: darkorange;">"DRGE não controlada com IBP por até 2 meses indica EDA".</span> A questão trouxe 2 semanas, o que pode ser uma <span style="text-decoration: underline; color: #003366;">pegadinha</span>, pois muitos protocolos sugerem 4-8 semanas. No entanto, mesmo em 2 semanas, a ausência total de resposta já pode justificar investigação caso o quadro seja importante.</p>

          <p><span style="color: darkorange; font-weight: bold;">Análise crítica das alternativas:</span></p>

          <p><b>A, B e C estão incorretas</b> pois <u>excluem pelo menos um critério</u> que recebe respaldo na prática clínica e nas <b>diretrizes brasileiras</b>. A alternativa D é a única a considerar todos os cenários em que a EDA deve ser considerada, em consonância com as recomendações do Ministério da Saúde e protocolos estaduais.</p>

          <p><span style="color: #003366;"><b>Ponto de atenção e estratégia de prova:</b></span> Fique atento à redação da questão: termos como “alto risco” e “falha terapêutica” costumam ser abordados de forma abrangente em provas de concursos. Sempre fundamente sua resposta pelo que as diretrizes e protocolos atuais indicam.</p>

          <p><span style="color: darkorange;"><b>Em resumo:</b></span> A EDA está indicada na DRGE diante de sinais de alarme, falha terapêutica e em situações de alto risco. Tal conduta está respaldada em protocolos estaduais e nacionais, bem como em literatura como <span style="color: #003366;">Harrison’s e Whitebook</span>.</p>

          <p><i>Gostou do comentário? Deixe sua avaliação aqui embaixo!</i></p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (0 likes):</b>

            A resposta correta é a alternativa D - I, II e III. Na Doença do Refluxo Gastroesofágico (DRGE), a Endoscopia Digestiva Alta (EDA) é recomendada nos casos de sintomas e/ou sinais de alarme, como dor torácica, sangue nas fezes, dificuldade em engolir, perda de peso, entre outros (opção I). Além disso, também deve ser realizada em pacientes com idade superior a 45 anos, como medida de rastreamento (opção II). Por fim, a EDA também é recomendada quando o paciente não respondeu ao tratamento com Inibidores de Bomba de Prótons (IBP), pelo menos, duas semanas com toma correta (opção III). Portanto, todas as opções estão corretas.
          </div>

      - tipo: ME
        id: 121026-1655-23-lNO5rt
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Homem de 63 anos com histórico de doença do refluxo gastroesofágico realiza uma endoscopia digestiva alta para vigilância para esôfago de Barrett com os seguintes achados: ausência de lesões visíveis; biópsias mostram histologia consistente com esôfago de Barrett e com evidência de displasia de baixo grau em três amostras (achados confirmados por um segundo patologista especialista).

          Nesse sentido, a conduta correta é:
        alternativas:
          - id: alt_A
            texto: indicar a esofagectomia laparoscópica.
          - id: alt_B
            texto: repetir a endoscopia em seis meses.
          - id: alt_C
            texto: indicar a remoção do esôfago de Barret por radiofrequência.
          - id: alt_D
            texto: indicar a ressecção endoscópica do esôfago de Barrett.
          - id: alt_E
            texto: repetir a endoscopia em dois anos.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>A alternativa correta para esta questão é a <strong><span style="color:darkorange;">B - repetir a endoscopia em seis meses</span></strong>.</p>

          <p>O tema central da questão é o manejo do esôfago de Barrett com displasia de baixo grau. O esôfago de Barrett é uma condição em que o revestimento do esôfago é substituído por um tecido que é semelhante ao revestimento do intestino, um processo chamado de metaplasia intestinal. Essa condição é uma complicação do refluxo gastroesofágico crônico e pode aumentar o risco de desenvolver adenocarcinoma esofágico.</p>

          <p>No caso apresentado, o paciente já foi submetido a uma endoscopia que confirmou a presença de displasia de baixo grau. A displasia de baixo grau é uma alteração celular que indica um risco aumentado de progressão para câncer, mas não é um câncer em si.</p>

          <p><strong><span style="color:darkorange;">Justificativa da alternativa B:</span></strong> A repetição da endoscopia em seis meses é a conduta recomendada para monitorar a progressão da displasia. Esse acompanhamento regular permite identificar qualquer progressão para displasia de alto grau ou carcinoma esofágico, que exigiria intervenções mais agressivas.</p>

          <p><strong><span style="color:darkorange;">Análise das alternativas incorretas:</span></strong></p>

          <p><strong>A - indicar a esofagectomia laparoscópica:</strong> A esofagectomia é uma cirurgia invasiva geralmente reservada para casos de câncer esofágico ou displasia de alto grau que não responde ao tratamento. Não é recomendada como primeira linha para displasia de baixo grau.</p>

          <p><strong>C - indicar a remoção do esôfago de Barrett por radiofrequência:</strong> Embora a ablação por radiofrequência possa ser utilizada, é mais comumente indicada para displasia de alto grau. Para displasia de baixo grau, a vigilância é prioritária.</p>

          <p><strong>D - indicar a ressecção endoscópica do esôfago de Barrett:</strong> A ressecção endoscópica é geralmente usada em casos onde há suspeita de carcinoma ou lesões focais de displasia de alto grau, não sendo indicada para displasia de baixo grau em ausência de lesões visíveis.</p>

          <p><strong>E - repetir a endoscopia em dois anos:</strong> Este intervalo é muito longo para um paciente com displasia de baixo grau confirmada, pois o risco de progressão é maior e requer uma vigilância mais próxima.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa;">
            <b>Comentário 01 (1 like):</b>

            <strong style="color: green; "><em>questão sobre conduta em esôfago de Barrett com displasia de baixo grau</em></strong>

            <span style="color: green; ">alternativa correta: [B] </span><strong style="color: green; ">repetir a endoscopia em seis meses.</strong>

            justificativa

            Em pacientes com esôfago de Barrett e displasia de baixo grau, a abordagem inicial envolve a vigilância regular para monitorar possíveis progressões para displasia de alto grau ou carcinoma. O tratamento não é imediatamente necessário em casos de displasia de baixo grau, mas a repetição da endoscopia após <strong>seis meses</strong> é recomendada, de acordo com as diretrizes de acompanhamento, para avaliar possíveis alterações. Caso não haja progressão, o acompanhamento pode ser ajustado para intervalos mais longos.

            análise das demais alternativas

            [A]: [incorreta] A esofagectomia laparoscópica é indicada para casos avançados com displasia de alto grau ou carcinoma, não sendo necessária para displasia de baixo grau.

            [C]: [incorreta] A ablação por radiofrequência é indicada para displasia de alto grau ou em casos em que há progressão para lesões mais avançadas, não sendo recomendada para displasia de baixo grau.

            [D]: [incorreta] A ressecção endoscópica do esôfago de Barrett é indicada em casos de displasia de alto grau ou câncer invasivo, não para displasia de baixo grau isolada.

            [E]: [incorreta] A repetição da endoscopia em dois anos é uma abordagem mais conservadora e pode ser considerada em casos sem progressão significativa, mas para displasia de baixo grau, o acompanhamento em seis meses é o padrão recomendado.

            resumo: A conduta adequada para esôfago de Barrett com displasia de baixo grau é realizar uma nova endoscopia com biópsias após <strong>seis meses</strong>, para acompanhar possíveis progressões para displasia de alto grau ou carcinoma.

            pontos chave

            ◊ Em casos de esôfago de Barrett com displasia de baixo grau, a recomendação é repetir a endoscopia em <strong>seis meses</strong> para monitoramento.

            ◊ A esofagectomia e tratamentos mais invasivos são reservados para displasia de alto grau ou carcinoma invasivo.

            ◊ Caso a displasia de baixo grau não progrida, a vigilância pode ser ajustada para intervalos mais longos.

            ◊ A vigilância regular é fundamental para detectar a progressão precoce para lesões mais graves.
