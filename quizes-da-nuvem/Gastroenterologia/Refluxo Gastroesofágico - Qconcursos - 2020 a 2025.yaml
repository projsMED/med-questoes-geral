          - Refluxo Gastroesofágico
        enunciado: Em pacientes com refluxo gastroesofágico crônico, qual alteração sugere esôfago de Barret?
        alternativas:
          - id: alt_A
            texto: Displasia colunar no terço médio do esôfago.
          - id: alt_B
            texto: Presença de Helicobacter pylori no esôfago distal.
          - id: alt_C
            texto: Úlceras múltiplas no esôfago distal.
          - id: alt_D
            texto: Estenose péptica no esôfago distal.
          - id: alt_E
            texto: Metaplasia intestinal especializada no esôfago distal.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>O tema central desta questão é o <span style="color: darkorange;"><strong>esôfago de Barrett</strong></span>, uma condição que pode surgir em pacientes com refluxo gastroesofágico crônico. O esôfago de Barrett é caracterizado pela substituição do epitélio escamoso normal do esôfago distal por um epitélio de tipo intestinal, um processo conhecido como <span style="color: darkorange;"><strong>metaplasia intestinal</strong></span>. Essa transformação é uma adaptação ao dano contínuo causado pelo ácido gástrico e é considerada uma condição precursora de adenocarcinoma esofágico.</p>

          <p><span style="color: darkblue;"><strong>Justificativa para a alternativa correta (E):</strong></span> A presença de <span style="color: darkorange;"><strong>metaplasia intestinal especializada no esôfago distal</strong></span> é o achado histológico que define o esôfago de Barrett. Durante a endoscopia, biópsias são realizadas para confirmar a presença de células caliciformes, típicas do epitélio intestinal, no esôfago distal. Este achado é essencial para o diagnóstico e é uma indicação de vigilância devido ao risco aumentado de progressão para câncer.</p>

          <p><span style="color: darkblue;"><strong>Análise das alternativas incorretas:</strong></span></p>

          <p><strong>A - Displasia colunar no terço médio do esôfago:</strong> A displasia pode ocorrer em casos de esôfago de Barrett, mas a metaplasia intestinal usualmente ocorre no esôfago distal, não no terço médio. Além disso, a presença de displasia não é necessária para o diagnóstico de Barrett, mas sim para o risco de progressão para adenocarcinoma.</p>

          <p><strong>B - Presença de Helicobacter pylori no esôfago distal:</strong> A infecção por <em>Helicobacter pylori</em> está mais comumente associada a gastrite e úlceras pépticas no estômago, não ao esôfago de Barrett. A presença de H. pylori não é indicativa de metaplasia intestinal.</p>

          <p><strong>C - Úlceras múltiplas no esôfago distal:</strong> Úlceras podem resultar de esofagite severa, mas não são características do esôfago de Barrett. O diagnóstico de Barrett depende da identificação de metaplasia intestinal.</p>

          <p><strong>D - Estenose péptica no esôfago distal:</strong> A estenose pode ser uma complicação do refluxo crônico, mas não é um marcador diagnóstico para o esôfago de Barrett. A presença de estenose indica cicatrização e estreitamento, não metaplasia.</p>

          <p>Para estudar mais sobre o esôfago de Barrett, recomenda-se consultar fontes como o <em>Harrison's Principles of Internal Medicine</em> e diretrizes atualizadas de gastroenterologia, como as da <em>American College of Gastroenterology</em> e <em>British Society of Gastroenterology</em>, que fornecem uma base sólida sobre diagnóstico e manejo dessa condição.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1655-3-MlZxhU
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Sobre a indicação de biópsias na investigação da esofagite por refluxo gastroesofágico, assinale a afirmativa incorreta.
        alternativas:
          - id: alt_A
            texto: Está sempre indicada.
            comentario: A alternativa A está errada porque transforma a biópsia em etapa obrigatória de toda investigação de esofagite por refluxo, o que não corresponde ao papel real da histologia nesse cenário. Na DRGE/esofagite erosiva típica, o diagnóstico costuma se apoiar na clínica e/ou na endoscopia; a biópsia passa a ter indicação quando há úlcera, estenose, acometimento proximal/atípico ou necessidade de excluir outras etiologias, como esofagite eosinofílica. Portanto, o erro da alternativa é a generalização indevida pelo termo “sempre”.
          - id: alt_B
            texto: Está indicada na presença de úlceras.
            comentario: 'Não é a incorreta, porque úlcera esofágica justifica biópsia. Lesão ulcerada não deve ser atribuída automaticamente ao refluxo: é preciso investigação histológica para afastar outras etiologias e complicações, inclusive neoplasia.'
          - id: alt_C
            texto: Está indicada na presença de estenose.
            comentario: Não é a incorreta, porque estenose esofágica exige definição etiológica. Embora refluxo possa causar estenose péptica, esse achado também impõe exclusão de outras causas estruturais, inclusive malignidade; por isso, a indicação de biópsia é compatível com o raciocínio da questão.
          - id: alt_D
            texto: Está indicada na distribuição proximal da esofagite.
            comentario: Não é a incorreta, porque distribuição proximal da esofagite é achado atípico para refluxo simples. Essa topografia amplia o diagnóstico diferencial com etiologias não pépticas, como causas infecciosas, medicamentosas, cáusticas e eosinofílicas, justificando investigação histológica.
          - id: alt_E
            texto: Está indicada no diagnóstico diferencial de esofagite eosinofílica
            comentario: Não é a incorreta, porque esofagite eosinofílica é diagnóstico histológico. Quando ela entra no diferencial de esofagite, a biópsia deixa de ser opcional do ponto de vista diagnóstico, já que a confirmação depende do exame anatomopatológico.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: A</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Na esofagite por refluxo típica, a biópsia esofágica não é exame de rotina e fica reservada para úlcera, estenose, acometimento proximal/atípico ou diagnóstico diferencial, como esofagite eosinofílica. Como o enunciado pede a alternativa incorreta e a letra A afirma indicação universal (“sempre”), ela contraria esse critério e é o gabarito.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Indicação de biópsia esofágica</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explorou duas confusões reais: o enunciado pede a afirmativa incorreta, e a palavra “sempre” na alternativa A exagera uma conduta que, na prática, é seletiva. As demais opções descrevem justamente os cenários em que a biópsia pode estar indicada.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em DRGE típica, pense primeiro em diagnóstico clínico/endoscópico; biópsia não é automática.</li><li>Valorize achados complicados ou de alarme, como úlcera e estenose, porque eles mudam a necessidade de investigação histológica.</li><li>Topografia atípica, especialmente proximal, deve acender o diagnóstico diferencial e favorecer biópsia.</li><li>Se a alternativa mencionar esofagite eosinofílica, o critério decisivo é que esse diagnóstico depende de biópsia.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-4-SnRvVv
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'Em relação ao lactente que apresenta episódios frequentes de regurgitação nos primeiros meses de vida, situação que comumente gera preocupação nos cuidadores, o pediatra deve saber diferenciar entre refluxo fisiológico e Doença do Refluxo Gastroesofágico (DRGE). Considerando as características clínicas típicas dessa faixa etária e as recomendações atuais, assinale a alternativa correta:'
        alternativas:
          - id: alt_A
            texto: A ausência de sintomas respiratórios descarta DRGE.
            comentario: Está errada porque a ausência de sintomas respiratórios não exclui DRGE. O diagnóstico não depende obrigatoriamente de manifestações respiratórias; a avaliação se baseia no conjunto clínico e na repercussão do refluxo.
          - id: alt_B
            texto: O diagnóstico de DRGE é sempre confirmado por exames complementares.
            comentario: Está errada porque o diagnóstico de DRGE em pediatria não é sempre confirmado por exames complementares. Em muitos lactentes, a avaliação é predominantemente clínica, e exames não são obrigatórios de rotina.
          - id: alt_C
            texto: Todo lactente que regurgita apresenta DRGE.
            comentario: Está errada porque iguala regurgitação a DRGE. Regurgitação isolada é comum nos primeiros meses de vida e pode ser fisiológica; portanto, não autoriza diagnosticar doença em todos os casos.
          - id: alt_D
            texto: Lactentes com regurgitação leve, sem sinais de alerta, geralmente necessitam de inibidor de bomba de prótons.
            comentario: Está errada porque regurgitação leve sem sinais de alerta não indica inibidor de bomba de prótons de rotina. Nessa situação, a base sustenta orientação, medidas conservadoras e acompanhamento.
          - id: alt_E
            texto: Regurgitações em lactentes menores de 6 meses podem ser fisiológicas.
            comentario: A alternativa E está correta porque regurgitação em lactentes pequenos é frequente e geralmente benigna, podendo ocorrer sem doença associada. Nos primeiros meses de vida, esse achado pode ser fisiológico. DRGE não é definida pela regurgitação isolada, mas por sintomas relevantes e/ou complicações.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: E</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Em lactentes nos primeiros meses de vida, regurgitação frequente isolada pode ser fisiológica e não configura DRGE. Como o enunciado pede a diferenciação entre refluxo fisiológico e DRGE nessa faixa etária, a alternativa correta é a que reconhece que regurgitações em menores de 6 meses podem ser fisiológicas.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Refluxo fisiológico do lactente</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre refluxo/regurgitação fisiológica do lactente e DRGE, levando o candidato a patologizar um sintoma muito comum nos primeiros meses de vida.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Não trate regurgitação isolada em lactente jovem como sinônimo de DRGE; procure repercussão clínica ou complicações.</li><li>Exames complementares não são exigência universal no diagnóstico de DRGE em pediatria; muitos casos são definidos clinicamente.</li><li>Em regurgitação leve sem sinais de alerta, descarte a ideia de IBP de rotina e pense primeiro em conduta conservadora.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-5-NNLDUn
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Um paciente se apresenta para avaliação de doença do refluxo gastroesofageano.

          Nesse caso, são considerados sintomas de alarme
        alternativas:
          - id: alt_A
            texto: pirose e regurgitação.
            comentario: Pirose e regurgitação são os sintomas clássicos da DRGE. Justamente por serem manifestações típicas do refluxo, não são classificados como sintomas de alarme.
          - id: alt_B
            texto: anemia e disfagia.
            comentario: A alternativa B está correta porque disfagia e anemia não representam apenas manifestações habituais do refluxo. Disfagia sugere lesão estrutural ou complicação esofágica, e anemia funciona como sinal de possível sangramento crônico ou outra doença orgânica relevante. Na semiologia da DRGE, esses achados mudam a interpretação do quadro por indicarem maior gravidade ou diagnóstico alternativo, ao contrário dos sintomas típicos e das manifestações extraesofágicas.
          - id: alt_C
            texto: globus faríngeo e tosse.
            comentario: Globus faríngeo e tosse podem aparecer como sintomas associados ou manifestações extraesofágicas do refluxo, mas não indicam, por si, complicação estrutural, sangramento ou maior gravidade. Por isso, não são sinais de alarme.
          - id: alt_D
            texto: regurgitação e brocoespasmo.
            comentario: Regurgitação é sintoma típico de DRGE, e broncoespasmo pode ocorrer como manifestação associada. O problema é que nenhum dos dois constitui marcador clássico de alarme, porque não aponta diretamente para obstrução, sangramento ou complicação esofágica estrutural.
          - id: alt_E
            texto: eructação e rouquidão.
            comentario: Eructação é inespecífica, e rouquidão pode ser manifestação extraesofágica do refluxo. Nenhuma dessas queixas, isoladamente, é classificada como sintoma de alarme na DRGE, porque não sugere gravidade estrutural nem sangramento.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O critério que resolve a questão é distinguir sintomas típicos ou extraesofágicos da DRGE dos sintomas de alarme. Como o enunciado pede especificamente sinais de alarme, devem ser escolhidos achados que sugiram complicação estrutural, sangramento crônico ou diagnóstico alternativo; nesse contexto, disfagia e anemia são os marcadores decisivos, o que torna a alternativa B a correta.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Alarme na DRGE</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca misturou sintomas típicos da DRGE e manifestações extraesofágicas com verdadeiros sinais de alarme, para induzir a confusão entre sintomas associados ao refluxo e achados que exigem investigação por sugerirem complicação ou outro diagnóstico.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Separe mentalmente três grupos: sintomas típicos, manifestações extraesofágicas e sintomas de alarme.</li><li>Em DRGE, disfagia e sinais de sangramento/anemia devem ser reconhecidos como alarme, não como manifestação comum.</li><li>Tosse, rouquidão e broncoespasmo podem se associar ao refluxo, mas isso não os transforma em sinais de gravidade.</li><li>Não confunda frequência do sintoma com gravidade: pirose e regurgitação são típicos, não alarmantes.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-6-rGHyID
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'De acordo com a classificação Fenotípica da DRGE (Doença do Refluxo Gastro Esofageano) em pediatria, podemos afirmar que:'
        alternativas:
          - id: alt_A
            texto: Na Azia Funcional, a criança apresenta uma exposição ácida normal, sem correlação com sintomas.
            comentario: A alternativa A está correta porque descreve a azia funcional como um fenótipo com exposição ácida normal e sem correlação sintoma-refluxo, que é o critério definidor cobrado na questão.
          - id: alt_B
            texto: Na DRGE não erosiva, a criança apresenta Endoscopia digestiva alta anormal e Phmetria anormal.
            comentario: 'Está errada porque a DRGE não erosiva se caracteriza por ausência de erosões à endoscopia, embora haja evidência objetiva de refluxo patológico. Atribuir EDA anormal erosiva a esse fenótipo troca o critério que o define. O núcleo da DRGE não erosiva é: sintomas, endoscopia sem erosões e demonstração objetiva de refluxo.'
          - id: alt_C
            texto: Na DRGE erosiva, a criança apresenta EDA alterada e Phmetria 24 horas normal.
            comentario: Está errada porque a DRGE erosiva é definida pela presença de erosões esofágicas à endoscopia, e não por pHmetria 24 horas normal. A lesão erosiva documenta o fenótipo; dizer que pHmetria normal o caracteriza introduz um critério que não define essa categoria.
          - id: alt_D
            texto: Os fenótipos da DRGE em crianças maiores e adolescentes são baseados apenas na sintomatologia.
            comentario: Está errada porque a classificação fenotípica não é baseada apenas em sintomas. Ela exige integração entre sintomatologia, endoscopia, exposição ácida e associação sintoma-refluxo. A palavra 'apenas' torna a alternativa incompatível com o critério diagnóstico cobrado.
          - id: alt_E
            texto: No Esôfago Hipersensível, a paciente apresenta exposição ácida normal sem correlação com os sintomas.
            comentario: Está errada porque no esôfago hipersensível a exposição ácida é normal, mas existe associação positiva entre sintomas e episódios de refluxo. A alternativa descreve ausência de correlação, o que corresponde à azia funcional, não ao esôfago hipersensível.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: A</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Na classificação fenotípica, a azia funcional é definida por exposição ácida esofágica normal e ausência de associação entre episódios de refluxo e sintomas; por isso, apenas a alternativa A corresponde ao fenótipo descrito.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Fenótipos da DRGE</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre azia funcional e esôfago hipersensível: ambos podem ter exposição ácida normal, mas o desempate é a correlação sintoma-refluxo, ausente na azia funcional e presente no esôfago hipersensível.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Separe os fenótipos por três eixos: erosões na endoscopia, exposição ácida e associação sintoma-refluxo.</li><li>Azia funcional e esôfago hipersensível têm exposição ácida normal; o critério decisivo entre eles é a correlação dos sintomas com refluxo.</li><li>DRGE não erosiva não significa ausência de refluxo, e sim ausência de erosões endoscópicas com evidência objetiva de refluxo.</li><li>Se a alternativa disser que a classificação é feita apenas por sintomas, a tendência é estar errada.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-7-C57RYY
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Assinale a alternativa que representa uma indicação apropriada para realização de endoscopia em pacientes com doença do refluxo gastroesofágico (DRGE).
        alternativas:
          - id: alt_A
            texto: Sintomas leves de DRGE com boa resposta a inibidores de bomba de próton (IBP).
          - id: alt_B
            texto: Screening de esôfago de Barrett em pacientes com DRGE, independentemente de fatores de risco.
          - id: alt_C
            texto: Sintomas de DRGE persistentes ou progressivos, apesar de terapia médica adequada.
          - id: alt_D
            texto: Perda de peso de 2% do peso corporal, sem outros sintomas associados.
          - id: alt_E
            texto: Investigação inicial de DRGE em pacientes jovens sem sinais de alarme.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>O tema central desta questão é a <strong>indicação de endoscopia em pacientes com Doença do Refluxo Gastroesofágico (DRGE)</strong>. A DRGE é uma condição onde o conteúdo do estômago retorna ao esôfago, causando sintomas como azia e regurgitação. Entender quando realizar uma endoscopia é crucial para o manejo adequado da doença e prevenção de complicações.</p>

          <p><strong style="color: darkorange;">Alternativa C: "Sintomas de DRGE persistentes ou progressivos, apesar de terapia médica adequada."</strong> é a resposta correta. Segundo diretrizes médicas, a endoscopia é indicada em casos onde os sintomas persistem ou progridem mesmo após tratamento com inibidores de bomba de próton (IBP). Isso é importante para descartar complicações como esofagite erosiva, estenoses ou esôfago de Barrett, que podem não responder à terapia medicamentosa.</p>

          <p>Vamos analisar por que as outras alternativas estão incorretas:</p>

          <p><strong>Alternativa A:</strong> Sintomas leves de DRGE com boa resposta a IBP geralmente não requerem endoscopia, pois o tratamento está sendo eficaz. A endoscopia é reservada para casos onde há suspeita de complicações ou falha terapêutica.</p>

          <p><strong>Alternativa B:</strong> O <em>screening</em> para esôfago de Barrett não é indicado em todos os pacientes com DRGE. É recomendado apenas para aqueles com fatores de risco adicionais, como idade avançada, duração prolongada dos sintomas, obesidade, entre outros.</p>

          <p><strong>Alternativa D:</strong> Perda de peso de apenas 2% sem outros sintomas associados não justifica a realização de uma endoscopia. A perda de peso significativa e inexplicada poderia ser um sinal de alarme, mas 2% é geralmente considerado clinicamente insignificante sem outros sintomas.</p>

          <p><strong>Alternativa E:</strong> A investigação inicial de DRGE em pacientes jovens sem sinais de alarme não requer endoscopia, a menos que haja suspeita de outra condição ou risco para complicações. O tratamento empírico com IBP costuma ser o primeiro passo.</p>

          <p>De acordo com o <em>Harrison’s Principles of Internal Medicine</em> e diretrizes como as da Sociedade Brasileira de Endoscopia Digestiva, as indicações para endoscopia incluem sintomas refratários ao tratamento, sinais de alarme (como disfagia, anemia, perda de peso inexplicada) ou vigilância de condições pré-cancerígenas, como o esôfago de Barrett.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1655-8-QPNdBl
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Em qual dos seguintes pacientes pediátricos com suspeita de doença do refluxo gastroesofágico (DRGE) a indicação de endoscopia é apropriada?
        alternativas:
          - id: alt_A
            texto: Lactente eutrófico com refluxo.
          - id: alt_B
            texto: Pré-escolar com DRGE em uso de terapia farmacológica sem sintomas.
          - id: alt_C
            texto: Pré-escolar com anemia de causa inexplicada.
          - id: alt_D
            texto: Criança com refluxo intermitente sem outros sintomas.
          - id: alt_E
            texto: Pré-adolescente com suspeita de DRGE não diagnosticada endoscopicamente.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><strong>Tema central da questão:</strong> A questão aborda a indicação de endoscopia em pacientes pediátricos com suspeita de Doença do Refluxo Gastroesofágico (DRGE). A DRGE é uma condição em que o conteúdo do estômago é regurgitado para o esôfago, causando sintomas como azia e, potencialmente, complicações mais graves.</p>

          <p><strong>Justificativa para a alternativa correta (C):</strong></p>

          <p>A alternativa <span style="color:darkorange;"><strong>C</strong></span>, que menciona um pré-escolar com anemia de causa inexplicada, é a escolha correta. A anemia inexplicada pode indicar sangramento gastrointestinal oculto, uma complicação potencial da DRGE, justificando a realização de uma endoscopia. Segundo as diretrizes da Sociedade Brasileira de Pediatria (SBP) e outras referências, a endoscopia está indicada quando há suspeita de complicações, como esofagite erosiva ou anemia por perda crônica de sangue.</p>

          <p><strong>Análise das alternativas incorretas:</strong></p>

          <p><strong>A - Lactente eutrófico com refluxo:</strong> Refluxo em lactentes, também conhecido como "regurgitação funcional", é comum e geralmente não é um sinal de DRGE patológica. Em lactentes eutróficos e sem outros sintomas alarmantes, a endoscopia não é indicada, pois o refluxo tende a ser autolimitado e resolve-se com o tempo.</p>

          <p><strong>B - Pré-escolar com DRGE em uso de terapia farmacológica sem sintomas:</strong> Se o paciente está sem sintomas sob terapia, isso indica que a condição está controlada. A endoscopia não é necessária a menos que haja complicações ou falha terapêutica.</p>

          <p><strong>D - Criança com refluxo intermitente sem outros sintomas:</strong> Refluxo intermitente sem sintomas alarmantes não justifica uma endoscopia. A avaliação clínica e o tratamento sintomático são geralmente suficientes.</p>

          <p><strong>E - Pré-adolescente com suspeita de DRGE não diagnosticada endoscopicamente:</strong> A suspeita de DRGE não é, por si só, uma indicação para endoscopia. A endoscopia é reservada para casos com sintomas alarmantes ou quando há suspeita de complicações, como a alternativa <span style="color:darkorange;"><strong>C</strong></span>.</p>

          <p><strong>Considerações finais:</strong> É crucial que os profissionais de saúde reconheçam quando a endoscopia é necessária para evitar procedimentos invasivos desnecessários em crianças. Diretrizes médicas, como as da SBP, fornecem orientações claras sobre quando esses exames são apropriados.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1655-9-lzP60F
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'Uma das complicações da Doença do Refluxo Gastroesofágico (DRGE) é o esôfago de Barrett, quanto à essa complicação, pode-se afirmar:'
        alternativas:
          - id: alt_A
            texto: A fundoplicatura ideal no esôfago de Barrett é a fundoplicatura parcial, uma vez que estes pacientes apresentam grande prevalência de dismotilidade esofágica.
            comentario: Está errada por transformar em regra universal uma escolha técnica que depende de avaliação funcional individual. A presença de Barrett, isoladamente, não define que a fundoplicatura ideal seja parcial, e a suposta dismotilidade não pode ser presumida sem documentação funcional.
          - id: alt_B
            texto: O tratamento cirúrgico da doença do refluxo, em pacientes com esôfago de Barrett, pode estabilizar o epitélio colunar e reduzir o risco de desenvolvimento de adenocarcinoma, porém, o seguimento endoscópico dos pacientes operados deve ser mantido segundo protocolos específicos.
            comentario: 'A alternativa B está correta porque descreve o ponto clínico essencial do Barrett: o tratamento cirúrgico do refluxo pode reduzir a agressão ácida e favorecer estabilização do epitélio colunar, com possível redução da progressão neoplásica, mas não elimina de forma confiável o potencial carcinogênico do segmento de Barrett já estabelecido. Por isso, o seguimento endoscópico deve continuar conforme protocolos de vigilância.'
          - id: alt_C
            texto: O tratamento cirúrgico do refluxo gastroesofágico, nos pacientes com esôfago de Barrett, libera esses pacientes do seguimento endoscópico, uma vez que, diminui a inflamação do epitélio e o risco de carcinogênese.
            comentario: Está errada porque afirma que a cirurgia libera o paciente do seguimento endoscópico. Melhorar o refluxo e a inflamação não equivale a abolir o risco de displasia ou adenocarcinoma no Barrett já instalado, de modo que a vigilância deve ser mantida.
          - id: alt_D
            texto: A pH-metria de 24 horas deve ser realizada em todos os pacientes com esôfago de Barrett para a programação do tratamento adequado.
            comentario: Está errada pelo caráter absoluto da afirmação. A pHmetria de 24 horas é útil em cenários selecionados, especialmente para confirmação objetiva do refluxo e planejamento pré-operatório, mas não deve ser realizada obrigatoriamente em todos os pacientes com Barrett.
        gabarito: B
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: B</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> No esôfago de Barrett, o ponto decisivo é que o controle cirúrgico do refluxo não extingue o risco de progressão para displasia ou adenocarcinoma; por isso, mesmo após a cirurgia antirrefluxo, a vigilância endoscópica deve ser mantida, o que torna a alternativa B correta.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Esôfago de Barrett</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre controlar o refluxo e eliminar o risco oncológico do Barrett. A cirurgia pode melhorar o mecanismo agressor da DRGE, mas isso não autoriza interromper a vigilância endoscópica.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Em Barrett, diferencie sempre controle do refluxo de eliminação do risco neoplásico: não são sinônimos.</li><li>Desconfie de alternativas com termos universais como "em todos" ou "libera do seguimento" quando o tema envolve vigilância oncológica.</li><li>Na cirurgia antirrefluxo, a técnica não é escolhida apenas pelo diagnóstico de Barrett, mas pela avaliação funcional esofágica.</li><li>pHmetria em Barrett é exame de indicação contextual, não obrigação automática.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-10-fyQo5B
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Na Doença do Refluxo Gastroesofágico podem ocorrer sintomas como a disfagia e a odinofagia.

          Assinale a alternativa que descreve corretamente esses sintomas:
        alternativas:
          - id: alt_A
            texto: Disfagia é vômito em jato, e odinofagia é azia retroesternal.
            comentario: 'Está incorreta porque troca sintomas distintos. Disfagia não é vômito em jato: vômito é eliminação do conteúdo gástrico, não dificuldade para engolir. Odinofagia também não é azia retroesternal: azia corresponde a pirose, enquanto odinofagia é dor provocada pela deglutição.'
          - id: alt_B
            texto: Disfagia é dor abdominal difusa, e odinofagia é náusea intensa.
            comentario: Está incorreta porque atribui aos termos sintomas gastrointestinais inespecíficos sem relação definidora com a deglutição. Disfagia não é dor abdominal difusa, e odinofagia não é náusea intensa.
          - id: alt_C
            texto: Disfagia é tosse seca persistente, e odinofagia é rouquidão.
            comentario: Está incorreta porque confunde manifestações associadas ao refluxo com definições semiológicas. Tosse seca persistente e rouquidão podem ocorrer como manifestações extraesofágicas da DRGE, mas não definem disfagia nem odinofagia.
          - id: alt_D
            texto: Disfagia é dificuldade de deglutição, e odinofagia é dor ao deglutir.
            comentario: 'A alternativa D está correta porque corresponde exatamente à nomenclatura semiológica consolidada: disfagia é dificuldade na progressão do alimento ou líquido durante a deglutição, e odinofagia é dor desencadeada pelo ato de deglutir. A questão depende dessa distinção conceitual direta, não da etiologia dos sintomas.'
          - id: alt_E
            texto: Disfagia é diarreia crônica, e odinofagia é constipação intestinal.
            comentario: Está incorreta porque diarreia crônica e constipação intestinal são alterações do hábito intestinal, não sintomas relacionados ao ato de deglutir. Portanto, não correspondem às definições de disfagia nem de odinofagia.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: D</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> Pela semiologia digestiva clássica, disfagia é dificuldade de deglutição e odinofagia é dor ao deglutir; como o enunciado cobra exatamente a definição desses termos, a alternativa D é a única compatível com a base de decisão médica.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Definição semiológica de disfagia e odinofagia</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca usa o contexto de DRGE para induzir confusão entre definições semiológicas e sintomas associados ao refluxo, como pirose, tosse e rouquidão. O ponto decisivo era reconhecer que a pergunta cobrava o conceito de disfagia e odinofagia, não manifestações gerais da doença.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se a pergunta pedir o significado de termos como disfagia e odinofagia, resolva pela definição semiológica exata, sem se deixar levar pela doença citada no enunciado.</li><li>Separe sintomas do ato de deglutir de outros sintomas digestivos: disfagia é dificuldade para engolir; odinofagia é dor ao engolir.</li><li>Não confunda manifestações associadas à DRGE, como pirose, tosse e rouquidão, com a definição formal dos sintomas esofágicos.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-11-U415Ej
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          O texto seguinte servirá de base para responder à questão.

          Renata, mulher cis negra, 45 anos, apresenta queixa de azia e regurgitação ácida frequentes, especialmente após grandes refeições e ao deitar-se.
          Relata também dor retroesternal em queimação, piora à noite e alívio temporário com antiácidos. A endoscopia digestiva alta revelou esofagite de grau A segundo a classificação de Los Angeles.

          Autoria Própria

          Considerando o diagnóstico de doença do refluxo gastroesofágico (DRGE) no caso clínico, qual é o principal mecanismo fisiopatológico envolvido no desenvolvimento da doença?
        alternativas:
          - id: alt_A
            texto: Aumento da produção de ácido gástrico devido à hiperatividade das células parietais.
          - id: alt_B
            texto: Produção excessiva de muco gástrico que favorece o refluxo ácido para o esôfago.
          - id: alt_C
            texto: Deficiência no esvaziamento gástrico, resultando em refluxo de alimentos e ácido para o esôfago.
          - id: alt_D
            texto: Relaxamento inadequado do esfíncter esofágico inferior (EEI), permitindo o refluxo de conteúdo gástrico.
          - id: alt_E
            texto: Aumento na pressão intra-abdominal, forçando o conteúdo gástrico para o esôfago.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>A questão apresentada aborda a <span style="color: darkorange;"><strong>doença do refluxo gastroesofágico (DRGE)</strong></span>, que é uma condição comum caracterizada pelo retorno do conteúdo gástrico para o esôfago, causando sintomas como azia e regurgitação. Vamos analisar o mecanismo fisiopatológico central da DRGE.</p>

          <p>De acordo com o caso clínico, Renata apresenta sintomas típicos de DRGE, e a endoscopia revelou esofagite de grau A, conforme a <strong>classificação de Los Angeles</strong>, que é usada para avaliar a gravidade da esofagite. Esta classificação ajuda a determinar a extensão do dano esofágico causado pelo ácido gástrico.</p>

          <p><u>Alternativa Correta: D - Relaxamento inadequado do esfíncter esofágico inferior (EEI)</u></p>

          <p><span style="color: darkblue;">O esfíncter esofágico inferior (EEI)</span> é uma estrutura muscular que atua como uma barreira entre o esôfago e o estômago. O relaxamento inadequado ou a diminuição do tônus do EEI é o principal mecanismo fisiopatológico da DRGE. Isso permite que o conteúdo gástrico, incluindo ácido, suba para o esôfago, resultando nos sintomas descritos.</p>

          <p><strong>Análise das Alternativas Incorretas:</strong></p>

          <p><strong>A - Aumento da produção de ácido gástrico devido à hiperatividade das células parietais:</strong> Embora o ácido gástrico desempenhe um papel nos sintomas, o problema central na DRGE é o relaxamento do EEI, e não o excesso de produção de ácido.</p>

          <p><strong>B - Produção excessiva de muco gástrico que favorece o refluxo ácido para o esôfago:</strong> O muco gástrico serve para proteger o revestimento do estômago, mas não está diretamente relacionado ao mecanismo de refluxo esofágico.</p>

          <p><strong>C - Deficiência no esvaziamento gástrico, resultando em refluxo de alimentos e ácido para o esôfago:</strong> Embora o esvaziamento gástrico lento possa exacerbar os sintomas, ele não é o mecanismo primário da DRGE.</p>

          <p><strong>E - Aumento na pressão intra-abdominal, forçando o conteúdo gástrico para o esôfago:</strong> A pressão intra-abdominal aumentada pode contribuir para os sintomas, mas não é o mecanismo principal da DRGE.</p>

          <p>Portanto, a alternativa <strong>D</strong> é a correta, pois identifica o <span style="color: darkorange;">principal mecanismo fisiopatológico</span> envolvido na DRGE, que é o relaxamento inadequado do EEI.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1655-12-XPi3Re
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'Na investigação da Doença do Refluxo Gastroesofágico (DRGE), o exame considerado padrão-ouro para a caracterização e quantificação da exposição ácida esofágica é:'
        alternativas:
          - id: alt_A
            texto: Endoscopia digestiva alta com cromoscopia.
            comentario: A endoscopia digestiva alta com cromoscopia avalia mucosa e complicações, como esofagite ou Barrett, mas não mede a frequência nem a duração dos episódios de refluxo ácido. Portanto, não quantifica a exposição ácida esofágica.
          - id: alt_B
            texto: Esofagomanometria de alta resolução.
            comentario: A esofagomanometria de alta resolução avalia motilidade esofágica e função do esfíncter esofagiano inferior. É útil para distúrbios motores, mas não mede acidificação esofágica nem quantifica refluxo ácido.
          - id: alt_C
            texto: pHmetria esofágica de 24 horas.
            comentario: A pHmetria esofágica de 24 horas está correta porque registra objetivamente as quedas do pH no esôfago ao longo do tempo, permitindo quantificar a carga ácida esofágica. É exatamente o exame solicitado pelo enunciado, que pede o padrão-ouro para caracterização e quantificação da exposição ácida.
          - id: alt_D
            texto: Seriografia contrastada do esôfago.
            comentario: A seriografia contrastada do esôfago avalia anatomia e alterações estruturais, como hérnia hiatal e estenoses. Não fornece quantificação objetiva da exposição ácida e não é o método de referência para refluxo ácido.
          - id: alt_E
            texto: Teste terapêutico com IBP em dose plena.
            comentario: O teste terapêutico com IBP em dose plena pode sugerir DRGE em alguns contextos clínicos, mas não é exame confirmatório nem mensura exposição ácida. Resposta ao tratamento não substitui documentação objetiva do refluxo ácido.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: C</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> A questão pede o exame que caracteriza e quantifica a exposição ácida esofágica na DRGE; entre as alternativas, esse papel é da pHmetria esofágica de 24 horas, método clássico de referência para documentar a exposição ácida e definir o gabarito.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> pHmetria esofágica na DRGE</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A questão mistura exames usados na DRGE com o exame que realmente quantifica o refluxo ácido: endoscopia avalia mucosa, manometria avalia motilidade, seriografia avalia anatomia e IBP avalia resposta clínica.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se o enunciado pedir quantificar exposição ácida, pense em pHmetria de 24 horas.</li><li>Separe os papéis: endoscopia avalia mucosa, manometria avalia motilidade e seriografia avalia anatomia.</li><li>Não confunda resposta ao IBP com prova objetiva de refluxo ácido.</li><li>Leia com atenção se a questão quer DRGE em geral ou especificamente exposição ácida esofágica.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-13-NGajWZ
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          A Doença do Refluxo Gastroesofágico (DRGE) pode se manifestar de diferentes formas clínicas.

          Assinale a alternativa que apresenta corretamente os dois sintomas mais típicos da DRGE:
        alternativas:
          - id: alt_A
            texto: Artralgia e rigidez matinal.
            comentario: Artralgia e rigidez matinal pertencem ao campo reumatológico, especialmente de doenças inflamatórias articulares. Não representam manifestação típica de refluxo gastroesofágico. O erro da alternativa é a incompatibilidade semiológica com o quadro esofágico clássico da DRGE.
          - id: alt_B
            texto: Poliúria e polidipsia.
            comentario: Poliúria e polidipsia são sintomas de eixo endócrino-metabólico, classicamente associados a hiperglicemia/diabetes mellitus. Não se relacionam com a apresentação típica da DRGE, que é digestiva alta e esofágica.
          - id: alt_C
            texto: Dispneia e ortopneia.
            comentario: Dispneia e ortopneia são sintomas cardiorrespiratórios, frequentemente ligados a insuficiência cardíaca ou doença pulmonar. A base admite que a DRGE pode ter manifestações extraesofágicas em alguns casos, mas esse par não constitui a apresentação típica da doença. A exclusão aqui depende de não confundir manifestação possível com sintoma clássico.
          - id: alt_D
            texto: Cefaleia e fotofobia.
            comentario: Cefaleia e fotofobia remetem a síndromes neurológicas, como enxaqueca ou meningismo, e não ao espectro semiológico típico da DRGE. A alternativa é eliminada por incompatibilidade clínica com doença esofagogástrica por refluxo.
          - id: alt_E
            texto: Azia (pirose) e regurgitação.
            comentario: Azia (pirose) e regurgitação correspondem diretamente à apresentação clínica esofágica mais característica da DRGE. Esse par semiológico decorre do refluxo do conteúdo gástrico para o esôfago, produzindo sensação de queimação retroesternal e retorno de conteúdo ácido ou alimentar. É a única alternativa que traz exatamente os sintomas típicos e mais frequentes da doença.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: E</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O enunciado pede os dois sintomas mais típicos da DRGE, e a base de decisão médica afirma que esses sintomas são pirose e regurgitação; por isso, a alternativa E é a correta.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Sintomas típicos da DRGE</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre sintomas típicos esofágicos da DRGE e sintomas de outros sistemas, além da tendência de alguns candidatos extrapolarem para manifestações extraesofágicas em vez de marcar o núcleo clínico clássico: pirose e regurgitação.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Se a questão pedir sintomas mais típicos da DRGE, procure primeiro o par pirose e regurgitação.</li><li>Diferencie sintomas esofágicos clássicos de manifestações extraesofágicas ou inespecíficas.</li><li>Elimine alternativas com pares sintomáticos claramente reumatológicos, metabólicos, cardiorrespiratórios ou neurológicos quando o foco for apresentação típica da DRGE.</li></ul></div></div>
          </div>

      - tipo: VF
        id: 121026-1655-14-BhwEKV
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: "Acerca de doenças gastrintestinais e hepáticas, julgue o item a seguir.\_\_\n\nA consequência histológica mais grave da DRGE (doença do refluxo gastroesofágico) é a metaplasia de Barrett, que está associada ao risco aumentado de Acalásia."
        gabarito: F
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b><span style="color:#1f3d7a;">Gabarito:</span> <span style="color:#ff8c00;">E – errado</span></b></p>

          <p><b>Tema central:</b> complicações da <b><span style="color:#1f3d7a;">DRGE</span></b> e significado da <b><u>metaplasia intestinal do esôfago (Esôfago de Barrett)</u></b>.</p>

          <p><b>Justificativa:</b> A <b><span style="color:#1f3d7a;">metaplasia de Barrett</span></b> é a consequência histológica mais relevante da DRGE, pois implica substituição do epitélio escamoso por epitélio colunar com <u>células caliciformes</u>, aumentando o risco de <b><span style="color:#ff8c00;">displasia e adenocarcinoma de esôfago</span></b>. Contudo, o item erra ao relacioná-la a risco de <b><span style="color:#1f3d7a;">Acalásia</span></b>. Acalásia é um <u>distúrbio motor primário</u> (degeneração dos neurônios inibitórios do plexo mioentérico), levando a <i>falha do relaxamento do EEI</i> e <i>aperistalse</i>, e <u>não é complicação da DRGE/Barrett</u>. Logo, a afirmação está incorreta.</p>

          <p><b>Raciocínio clínico e pegadinha:</b> associe sempre <b>Barrett → displasia → adenocarcinoma</b>. Já a <b>acalásia</b> é entidade distinta; quando complica, aumenta risco de <u>carcinoma espinocelular</u> em longo prazo, não decorrente de refluxo. A troca de “adenocarcinoma” por “acalásia” é a armadilha do item.</p>

          <p><b>Diagnóstico essencial:</b></p>
          <p>- <b>Barrett:</b> endoscopia com biópsias confirmando metaplasia intestinal (padrão ouro). Classificação de Praga para extensão; seguimento endoscópico conforme presença de displasia.</p>
          <p>- <b>Acalásia:</b> manometria esofágica de alta resolução (critério: <u>relaxamento incompleto do EEI + ausência de peristalse</u>), esofagografia com “<i>bico de pássaro</i>”.</p>

          <p><b>Condutas de alto rendimento:</b></p>
          <p>- <b>DRGE/Barrett:</b> IBP em dose plena; em Barrett com displasia, <u>ablação endoscópica</u> (RFA/EMR) e vigilância periódica. Cirurgia antirrefluxo em casos selecionados. </p>
          <p>- <b>Acalásia:</b> dilatação pneumática, <u>miotomia de Heller</u> com fundoplicatura ou <u>POEM</u>; toxina botulínica em não candidatos a procedimentos definitivos.</p>

          <p><b>Por que “C” (certo) estaria errado?</b> Porque a primeira parte é verdadeira (Barrett é a complicação histológica mais grave da DRGE), mas a segunda é falsa: a associação correta é com <b><span style="color:#ff8c00;">adenocarcinoma</span></b>, não com acalásia.</p>

          <p><b>Referências úteis para prova:</b> Diretrizes ACG para DRGE e Esôfago de Barrett (2022–2023); UpToDate (Esophageal complications of GERD; Barrett’s esophagus); Harrison’s Principles of Internal Medicine.</p>

          <p><b>Estratégia para a prova:</b> ao ver “Barrett”, pense em <u>metaplasia intestinal</u>, <u>displasia</u>, <u>adenocarcinoma</u> e <u>rastreamento endoscópico</u>; “Acalásia” remete a <u>distúrbio motor</u>, <u>EEI hipertenso</u> e <u>manometria</u>.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1655-15-Qz1KlG
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Paciente do sexo masculino, 39 anos, sem comorbidades, procura atendimento com queixa de pirose 3 a 4 vezes por semana, geralmente após refeições gordurosas. Não apresenta regurgitação noturna ou disfagia. Uso intermitente de antiácido traz alívio parcial. Endoscopia digestiva alta recente é normal.
          pHmetria de 24 horas mostra índice de refluxo (DeMeester) = 12 (normal < 14,7), com correlação sintoma-refluxo positiva (número de sintomas associados a episódios ácidos = 75%).
          Manometria esofágica com esfíncter esofágico inferior (EEI) com pressão normal, peristaltimo preservado, relaxamento completo do EEI durante a deglutição.
          O diagnóstico mais provável é
        alternativas:
          - id: alt_A
            texto: esofagite eosinofílica.
            comentario: 'Esofagite eosinofílica não é o diagnóstico mais provável porque o quadro descrito não traz disfagia nem impactação alimentar, e não há dado histológico compatível. Além disso, os exames funcionais apontam para outra explicação: sintomas relacionados temporalmente a refluxo ácido com exposição ácida global normal.'
          - id: alt_B
            texto: refluxo gastroesofágico não erosivo (DRGE não erosiva).
            comentario: DRGE não erosiva exige sintomas típicos sem erosões, mas com evidência objetiva de refluxo patológico. Aqui isso não existe, porque o DeMeester está dentro da normalidade. A correlação sintoma-refluxo positiva não substitui a prova de exposição ácida anormal; ela aponta, neste contexto, para hipersensibilidade ao refluxo fisiológico.
          - id: alt_C
            texto: doença do refluxo gastroesofágico erosiva (DRGE erosiva).
            comentario: DRGE erosiva fica excluída pela endoscopia normal. Essa alternativa depende da presença de erosões esofágicas ao exame endoscópico, o que o caso explicitamente não mostra.
          - id: alt_D
            texto: refluxo fisiológico com hipersensibilidade esofagiana.
            comentario: A alternativa D está correta porque o conjunto endoscopia normal + DeMeester normal + associação temporal positiva entre sintomas e episódios de refluxo corresponde ao padrão de hipersensibilidade esofagiana ao refluxo fisiológico. O dado decisivo é que há relação entre sintoma e refluxo, mas sem carga ácida patológica global. Portanto, o problema não é excesso objetivo de refluxo ácido, e sim percepção sintomática aumentada de episódios dentro da faixa fisiológica.
          - id: alt_E
            texto: acalásia.
            comentario: Acalásia é incompatível com a manometria apresentada. O caso mostra peristaltismo preservado e relaxamento completo do EEI, enquanto a acalásia tipicamente cursa com aperistalse e relaxamento incompleto do EEI. A ausência de disfagia também vai contra esse diagnóstico.
        gabarito: D
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <div style="margin:0 auto;line-height:1.625"><h3 style="font-size:1.5rem;font-weight:700;color:rgb(249 112 21);margin-bottom:2.5rem">Gabarito: D</h3><div style="margin-bottom:2.5rem"><p style="margin-bottom:1rem"><strong>Fundamento decisivo:</strong> O dado decisivo é a pHmetria com exposição ácida esofágica normal (DeMeester 12, abaixo do limite de anormalidade) associada a correlação sintoma-refluxo positiva. Esse conjunto favorece hipersensibilidade esofagiana/refluxo fisiológico sintomático e não DRGE por refluxo patológico.</p></div><div style="border-left:3px solid rgb(26 110 244);padding-left:1.25rem;margin-bottom:2.5rem;font-weight:500;color:rgb(26 110 244)"><strong>Tema central:</strong> Interpretação da pHmetria</div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Pegadinha da questão</div><div style="font-style:italic;">A banca explora a confusão entre DRGE não erosiva e hipersensibilidade esofagiana: pirose com endoscopia normal sugere DRGE não erosiva, mas a pHmetria normal impede esse diagnóstico e a correlação sintoma-refluxo positiva redireciona para refluxo fisiológico com hipersensibilidade.</div></div><div style="margin-bottom:2.5rem"><div style="font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;color:rgb(100 106 120)">Dica para questões semelhantes</div><ul style="padding-left:1.25rem"><li>Separe primeiro exposição ácida anormal de exposição ácida normal; isso define DRGE objetiva versus hipersensibilidade ao refluxo.</li><li>Correlação sintoma-refluxo positiva só ganha sentido depois de olhar a carga ácida global na pHmetria.</li><li>Endoscopia normal exclui a forma erosiva, mas não diferencia sozinha DRGE não erosiva de hipersensibilidade esofagiana.</li><li>Em distúrbio motor, a manometria decide: peristalse preservada e relaxamento completo do EEI afastam acalásia.</li></ul></div></div>
          </div>

      - tipo: ME
        id: 121026-1655-16-fQ93nU
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: 'Na doença do refluxo gastroesofágico (o conteúdo estomacal), incluindo ácido e bile, retorna do estômago para o esôfago, o que provoca inflamação no esôfago e dores na parte inferior do tórax. Sobre este assunto, analise as alternativas e assinale a incorreta:'
        alternativas:
          - id: alt_A
            texto: Os inibidores da bomba de prótons, os medicamentos menos potentes para redução da produção de ácido gástrico, normalmente constituem o tratamento menos eficaz para o refluxo gastroesofágico e para a esofagite e a esofagite erosiva causadas por refluxo gastroesofágico. Geralmente, os medicamentos precisam ser administrados por um período de quatro a doze semanas para a cura. A administração desses medicamentos pode continuar por um longo período, mas se for necessário, o médico tenta utilizar uma dose maior.
          - id: alt_B
            texto: Algumas pessoas apresentam hemorragia, normalmente discreta, mas que pode ser intensa. O sangue pode ser vomitado ou passar através do trato digestivo, resultando em fezes negras com aparência de borra de café (melena) ou fezes com sangue vermelho vivo, se o sangramento for suficientemente grande. Hemorragia leve de longa duração pode causar anemia ferropriva.
          - id: alt_C
            texto: O refluxo do ácido e da bile para dentro do esôfago ocorre quando o esfíncter esofágico inferior não está funcionando adequadamente. Quando uma pessoa está em pé ou sentada, a gravidade ajuda a prevenir o refluxo do conteúdo do estômago para o esôfago, o que explica por que o refluxo pode piorar quando a pessoa afetada está deitada.
          - id: alt_D
            texto: A doença do refluxo gastroesofágico (DRGE) é comum. Ela ocorre em 10 a 20% dos adultos. Ela também ocorre com frequência em bebês, às vezes já desde o nascimento.
          - id: alt_E
            texto: O esfíncter esofágico inferior é o anel de músculos que mantém a parte inferior do esôfago fechada para evitar o refluxo de alimentos e ácido gástrico para dentro do esôfago. Quando a pessoa engole, esse esfíncter geralmente relaxa para permitir que os alimentos passem para dentro do estômago.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p style="text-align: justify;">A questão aborda a <strong>Doença do Refluxo Gastroesofágico (DRGE)</strong>, uma condição comum em que o conteúdo do estômago retorna para o esôfago, causando sintomas como azia e inflamação esofágica. Vamos analisar cada alternativa para identificar a incorreta.</p>

          <p><span style="color: darkorange;"><strong>A - Análise da Alternativa:</strong></span> A alternativa A está incorreta. A descrição dos <strong>inibidores da bomba de prótons (IBPs)</strong> como "menos potentes" está equivocada. Na verdade, os IBPs são os medicamentos <strong>mais eficazes</strong> usados para reduzir a produção de ácido gástrico e tratar a DRGE e a esofagite erosiva, sendo recomendados como tratamento de primeira linha. De acordo com as diretrizes, eles são utilizados por períodos de 4 a 8 semanas, podendo ser prolongados com a menor dose eficaz para manutenção. Este erro conceitual torna a alternativa errada.</p>

          <p><span style="color: darkblue;"><strong>B - Análise da Alternativa:</strong></span> A alternativa B está correta. Ela descreve possíveis complicações da DRGE, como hemorragia digestiva, que pode resultar em melena ou hematêmese. A <strong>anemia ferropriva</strong> é uma consequência esperada de hemorragia crônica e discreta, o que é coerente com o quadro clínico da DRGE.</p>

          <p><span style="color: darkblue;"><strong>C - Análise da Alternativa:</strong></span> A alternativa C está correta. Ela explica adequadamente como o <strong>esfíncter esofágico inferior (EEI)</strong> deficiente e a gravidade podem influenciar o refluxo. O refluxo é mais comum em posições que não favorecem a ação da gravidade, como deitado, o que está de acordo com o conhecimento médico sobre a fisiopatologia da DRGE.</p>

          <p><span style="color: darkblue;"><strong>D - Análise da Alternativa:</strong></span> A alternativa D está correta. Ela afirma que a DRGE é comum, afetando 10 a 20% dos adultos, e também pode ocorrer em bebês. Esses dados são consistentes com a literatura médica atual.</p>

          <p><span style="color: darkblue;"><strong>E - Análise da Alternativa:</strong></span> A alternativa E está correta. Descreve o funcionamento normal do esfíncter esofágico inferior, que relaxa durante a deglutição para permitir a passagem dos alimentos. Este mecanismo é bem compreendido na fisiologia do trato gastrointestinal.</p>

          <p>Em resumo, a alternativa A é a única <span style="color: darkorange;">incorreta</span> devido ao erro conceitual sobre a eficácia dos inibidores da bomba de prótons no tratamento da DRGE. É importante reconhecer que os IBPs são fundamentais no manejo desta condição.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: VF
        id: 121026-1655-17-Irv8pa
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Paciente do sexo masculino, com 37 anos de idade, professor, vem apresentando pirose retroesternal após o almoço, aproximadamente 3 vezes por semana, nos últimos dois meses.
          Relata estar mais estressado ultimamente, tendo engordado 8 kg no último ano. Não apresenta outros sintomas relevantes nem nenhum antecedente patológico ou relato de uso de medicações.
          Exames laboratoriais de rotina realizados pelo paciente em uma unidade básica de saúde (UBS) há 1 mês não mostram nenhuma alteração.

          A partir do caso clínico hipotético precedente, julgue o item que se segue.

          Para esse paciente, é adequado tratamento farmacológico com um inibidor de bomba de prótons em dose plena durante 8 semanas, não havendo a necessidade de realização de endoscopia digestiva alta para o diagnóstico de doença do refluxo gastroesofágico.
        gabarito: V
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkblue;"><b>Tema central:</b></span> manejo inicial da doença do refluxo gastroesofágico (DRGE) com sintomas típicos e sem sinais de alarme, e a indicação (ou não) de endoscopia digestiva alta (EDA).</p>

          <p><span style="color:darkblue;"><b>Raciocínio clínico:</b></span> Homem, 37 anos, pirose retroesternal típica 3x/semana há 2 meses, ganho ponderal, sem disfagia, odinofagia, anemia, sangramento, perda ponderal ou vômitos. Exames básicos normais. Esse quadro é <b>altamente sugestivo de DRGE não complicada</b>. O ganho de peso e refeições volumosas pós-almoço são fatores de risco.</p>

          <p><span style="color:darkblue;"><b>Conduta recomendada:</b></span> Em pacientes com <u>síntomas típicos sem sinais de alarme</u>, a diretriz da ACG (2022) e o UpToDate recomendam <b>teste terapêutico com IBP em dose plena por 8 semanas</b> (ex.: omeprazol 20–40 mg, pantoprazol 40 mg, esomeprazol 40 mg, 1x/dia, 30–60 min antes do café da manhã). <b>EDA não é necessária inicialmente</b>. Medidas de estilo de vida ajudam: <i>perda de peso</i>, evitar refeições 2–3h antes de deitar, elevar cabeceira, reduzir álcool, frituras e vestimentas apertadas. (ACG 2022; Harrison’s; UpToDate)</p>

          <p><span style="color:darkblue;"><b>Por que a alternativa C (certo) está correta:</b></span> Corresponde exatamente às diretrizes: <b>IBP por 8 semanas</b> e <b>sem EDA inicial</b> quando não há alarme e os sintomas são típicos. A resposta clínica ao IBP reforça o diagnóstico de DRGE.</p>

          <p><span style="color:darkorange;"><b>Por que a alternativa E (errado) está incorreta:</b></span> Sugerir EDA de rotina para diagnosticar DRGE nesse cenário contraria as diretrizes, aumenta custos e não muda a conduta. EDA é indicada apenas se houver <b>sinais de alarme</b>, <b>fracasso do IBP por 8 semanas</b>, suspeita de <i>Barrett</i> em alto risco (sintomas crônicos, &gt;50 anos, homem, obeso) ou antes de cirurgia antirrefluxo.</p>

          <p><span style="color:darkorange;"><b>Pegadinhas de prova:</b></span></p>
          <p>- <b>Idade &lt; 60 anos</b> sem alarme: <u>não</u> pedir EDA inicialmente.</p>
          <p>- <b>On-demand</b> (IBP/H2) pode servir a casos muito leves; porém o padrão ouro inicial é <b>IBP diário por 8 semanas</b>.</p>
          <p>- <b>H. pylori</b>: não é rotina em DRGE típica sem dispepsia predominante.</p>

          <p><span style="color:darkblue;"><b>Quando reavaliar:</b></span> Se persistirem sintomas após 8 semanas: confirmar adesão/tempo de tomada; considerar aumentar dose, trocar IBP, solicitar EDA e, se necessário, pHmetria-impedanciometria.</p>

          <p><span style="color:darkblue;"><b>Referências essenciais:</b></span> ACG Clinical Guideline: Diagnosis and Management of GERD (2022); UpToDate: Clinical manifestations and diagnosis of GERD; Harrison’s Principles of Internal Medicine.</p>

          <p><b>Gabarito: C</b></p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1655-18-lD10XP
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Uma mulher de 50 anos procura atendimento relatando sensação de queimação no peito, principalmente ao se deitar, e regurgitação de alimentos. Ela observa que elevar a cabeceira da cama alivia seus sintomas e que a perda de peso tem melhorado sua condição.

          Sobre o refluxo gastroesofágico em adultos, é INCORRETO afirmar que
        alternativas:
          - id: alt_A
            texto: a esofagite pode ocorrer como complicação do refluxo não tratado.
          - id: alt_B
            texto: a obesidade é um fator de risco para o refluxo gastroesofágico.
          - id: alt_C
            texto: o refluxo gastroesofágico nunca está associado a complicações estruturais.
          - id: alt_D
            texto: modificações no estilo de vida são parte importante do manejo terapêutico.
          - id: alt_E
            texto: a terapia com inibidores da bomba de prótons é recomendada para controle dos sintomas.
        gabarito: C
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><b><span style="color:#1f4e79">Tema central</span>:</b> Doença do Refluxo Gastroesofágico (DRGE) em adultos — quadro típico (pirose e regurgitação), piora em decúbito e melhora com elevação da cabeceira e perda de peso.</p>

          <p><b><span style="color:#d35400">Gabarito (INCORRETA): Alternativa C</span></b>. A DRGE <u>pode</u> cursar com complicações estruturais; portanto, afirmar que “nunca está associada” é falso. Complicações bem reconhecidas incluem <b>esofagite erosiva</b>, <b>estenose péptica</b>, <b>esôfago de Barrett</b> e até <b>adenocarcinoma de esôfago</b> (risco aumentado no Barrett). Referências: Diretriz ACG 2022/2023; UpToDate; Harrison’s.</p>

          <p><b><span style="color:#1f4e79">Como interpretar o caso</span></b>: Pirose e regurgitação que pioram ao deitar são altamente sugestivos de DRGE. A melhora com <b>elevação da cabeceira</b> e <b>perda de peso</b> reforça o diagnóstico provável. Em ausência de “sinais de alarme” (disfagia progressiva, sangramento, anemia, perda de peso não intencional, vômitos persistentes), pode-se instituir <b>teste terapêutico com IBP</b>.</p>

          <p><b><span style="color:#1f4e79">Fisiopatologia resumida</span></b>: Exposição ácida esofágica por <b>relaxamentos transitórios do EEI</b>, <b>hipotonia do EEI</b> e/ou <b>hérnia hiatal</b>, somada a fatores como <b>obesidade</b> e refeições volumosas/noturnas.</p>

          <p><b><span style="color:#1f4e79">Comentário das alternativas</span></b>:</p>
          <p><b>A (Verdadeira)</b> – <b>Esofagite erosiva</b> é complicação clássica da DRGE não tratada; pode causar dor, sangramento e levar a <b>estenose</b>. (ACG, UpToDate)</p>
          <p><b>B (Verdadeira)</b> – <b>Obesidade</b> aumenta a pressão intra-abdominal e o relaxamento do EEI, elevando o risco de DRGE e de esôfago de Barrett. (Harrison’s; ACG)</p>
          <p><b>C (Falsa)</b> – Já discutido: existem complicações <u>estruturais</u> (esofagite, estenose, Barrett, adenocarcinoma). O uso de “<b>nunca</b>” é uma <span style="color:#d35400"><b>pegadinha</b></span> frequente em provas.</p>
          <p><b>D (Verdadeira)</b> – <b>Medidas de estilo de vida</b> são base do manejo: <u>perda de peso</u> (maior evidência), <u>elevar cabeceira</u>, evitar refeições noturnas/volumosas, reduzir álcool e tabaco, identificar gatilhos individuais. (ACG 2022)</p>
          <p><b>E (Verdadeira)</b> – <b>Inibidores da Bomba de Prótons (IBP)</b> são primeira linha para sintomas típicos: teste terapêutico por 8 semanas, preferir dose matinal 30–60 min antes da refeição; depois, <b>step-down</b> para a menor dose eficaz. (ACG; UpToDate)</p>

          <p><b><span style="color:#1f4e79">Diagnóstico e conduta prática</span></b>: Em sintomas típicos sem alarme, iniciar <b>IBP + medidas comportamentais</b>. Realizar <b>endoscopia</b> se houver sinais de alarme, refratariedade, idade avançada com fatores de risco ou suspeita de complicações. pH-metria/impedâncio-pH em casos refratários ou pré-cirúrgicos.</p>

          <p><b><span style="color:#d35400">Estratégia para provas</span></b>: Desconfie de termos absolutos (“<u>nunca</u>”, “<u>sempre</u>”). Relacione sintomas típicos com melhora por medidas posturais/dieta para reconhecer DRGE rapidamente.</p>

          <p>Referências: American College of Gastroenterology Guideline for GERD (2022/2023); UpToDate – Clinical manifestations and diagnosis of GERD; Harrison’s Principles of Internal Medicine.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

      - tipo: ME
        id: 121026-1655-19-LLpUh7
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: Um homem de 45 anos apresenta pirose retroesternal há 6 meses, especialmente após refeições volumosas e à noite. Ele relata melhora parcial ao elevar a cabeceira da cama e usar antiácidos esporadicamente. Sem sinais de alarme ao exame físico. O médico suspeita de doença do refluxo gastroesofágico (DRGE). Dentre as condutas iniciais, qual a mais adequada segundo as recomendações atuais?
        alternativas:
          - id: alt_A
            texto: Reforçar medidas comportamentais e iniciar terapia empírica com IBP por 4 a 8 semanas.
          - id: alt_B
            texto: Solicitar endoscopia digestiva alta imediatamente, mesmo sem fatores de risco adicionais.
          - id: alt_C
            texto: Iniciar antagonista H2 isoladamente, sem necessidade de medidas dietéticas.
          - id: alt_D
            texto: Associar procinético de rotina antes de qualquer tentativa de IBP.
          - id: alt_E
            texto: Encaminhar para cirurgia antirrefluxo sem teste terapêutico prévio.
        gabarito: A
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><strong>Tema central da questão:</strong> A questão aborda a conduta inicial para um paciente com suspeita de <span style="color:darkorange"><strong>Doença do Refluxo Gastroesofágico (DRGE)</strong></span>. DRGE é uma condição comum onde o ácido do estômago volta para o esôfago, causando sintomas como pirose (azia) e regurgitação. A abordagem inicial geralmente envolve mudanças no estilo de vida e tratamento medicamentoso.</p>

          <p><strong>Justificativa da alternativa correta (A):</strong> A opção A sugere <span style="color:darkorange"><strong>reforçar medidas comportamentais</strong></span> e iniciar terapia empírica com <span style="color:darkorange"><strong>Inibidores da Bomba de Prótons (IBP)</strong></span> por 4 a 8 semanas. Segundo as diretrizes atuais, esta é a conduta inicial recomendada para o manejo de DRGE em pacientes sem sinais de alarme, como perda de peso inexplicada ou sangramento gastrointestinal. Medidas comportamentais incluem elevar a cabeceira da cama, evitar refeições volumosas antes de deitar e reduzir alimentos que pioram os sintomas. O uso de IBP, como omeprazol, é eficaz na redução da produção de ácido gástrico, aliviando os sintomas. Diretrizes como as da American College of Gastroenterology suportam essa abordagem.</p>

          <p><strong>Análise das alternativas incorretas:</strong></p>

          <ul>
            <li><strong>B - Solicitar endoscopia digestiva alta imediatamente:</strong> A endoscopia é indicada para pacientes com sinais de alarme ou quando não há resposta ao tratamento inicial. Para um paciente sem fatores de risco adicionais, iniciar tratamento empírico com IBP é mais custo-efetivo (Harrison's Principles of Internal Medicine).</li>

            <li><strong>C - Iniciar antagonista H2 isoladamente:</strong> Antagonistas H2, como ranitidina, são menos eficazes que IBPs no controle dos sintomas de DRGE. Além disso, medidas dietéticas são fundamentais no manejo inicial.</li>

            <li><strong>D - Associar procinético de rotina antes de qualquer tentativa de IBP:</strong> Procinéticos, como metoclopramida, não são recomendados rotineiramente devido a efeitos adversos e eficácia limitada. IBP é a primeira linha de tratamento.</li>

            <li><strong>E - Encaminhar para cirurgia antirrefluxo sem teste terapêutico prévio:</strong> A cirurgia é reservada para casos refratários ao tratamento clínico ou em pacientes que preferem evitar medicação a longo prazo. O manejo inicial é sempre não-cirúrgico.</li>
          </ul>

          <p>É essencial seguir diretrizes atualizadas e basear-se em evidências para garantir o melhor cuidado ao paciente. A escolha da alternativa A reflete um manejo adequado e alinhado com as práticas clínicas recomendadas.</p>

          <p><em>Gostou do comentário? Deixe sua avaliação aqui embaixo!</em></p>
          </div>

