          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color: #1a237e; font-weight: bold; text-decoration: underline;">Tema central:</span> A questão aborda a <b>Doença do Refluxo Gastroesofágico (DRGE)</b>, comum na prática clínica, exigindo que o candidato saiba reconhecer sua <u>fisiopatologia</u>, sintomas típicos e atípicos, papel do <i>H. pylori</i> e as limitações dos exames diagnósticos.</p>

          <p><span style="color: #e65100; font-weight: bold;">Item I:</span> <b>Correto.</b> A principal alteração fisiopatológica da DRGE são os <span style="color: #1a237e;">relaxamentos transitórios do esfíncter esofagiano inferior (EEI)</span>, que independem da deglutição e permitem o refluxo do conteúdo gástrico para o esôfago. De acordo com o <span style="color: #e65100;">Harrison’s Principles of Internal Medicine</span>, esses relaxamentos são fundamentais na gênese da doença.</p>

          <p><span style="color: #e65100; font-weight: bold;">Item II:</span> <b>Incorreto.</b> Não há indicação em diretrizes para erradicação rotineira do <i>H. pylori</i> visando tratar DRGE. A literatura sugere, inclusive, que a infecção pelo <i>H. pylori</i> pode ser fator protetor, reduzindo a acidez gástrica. Segundo o <span style="color: #1a237e;">PCDT da DRGE do Ministério da Saúde, página 5</span>: “<i>Não é indicada a erradicação do H. pylori com o propósito exclusivo de tratar DRGE</i>.”</p>

          <p><span style="color: #e65100; font-weight: bold;">Item III:</span> <b>Correto.</b> Além do <span style="color: #1a237e;">pirose e regurgitação</span> (sintomas típicos), a DRGE pode causar <span style="color: #e65100;">sintomas extraesofágicos</span> como rouquidão, faringite, tosse crônica, sinusite, e pneumonia recorrente por microaspiração. Essas manifestações estão presentes em literatura de referência e em diretrizes, reforçando a necessidade de atenção clínica ampliada.</p>

          <p><span style="color: #e65100; font-weight: bold;">Item IV:</span> <b>Incorreto.</b> A <b>EDA</b> identifica complicações da DRGE, como esofagite ou esôfago de Barrett, mas em até metade dos pacientes com sintomas típicos a EDA é normal. Isso significa <span style="color: #1a237e;">baixa sensibilidade</span> da EDA para o diagnóstico de DRGE, servindo mais para <span style="color: #e65100;">excluir diagnósticos diferenciais ou avaliar gravidade</span>.</p>

          <p><span style="color: #1a237e; font-weight: bold;">Estratégias de prova:</span> Atente-se sempre a termos absolutos (“grande sensibilidade”) e recomendações não embasadas em consenso de diretrizes. Nos concursos, o conhecimento de detalhes e a leitura atenta das pegadinhas diferencia bons candidatos!</p>

          <p><b><span style="color: #e65100;">Resumo:</span></b> <span style="color: #1a237e;">Itens corretos:</span> I e III.<br>
          <span style="color: #e65100;">Alternativa correta:</span> C – 2 itens certos.</p>

          <p><i>Gostou do comentário? Deixe sua avaliação aqui embaixo!</i></p>
