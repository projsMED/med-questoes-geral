        enunciado: "Quanto à doença do refluxo gastroesofágico (DRGE) e suas complicações, julgue o item que se segue.\_\n\nA estenose péptica é uma complicação grave da DRGE, com indicação de esofagectomia distal."
        gabarito: F
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:darkorange;"><b>Tema central:</b></span> A questão aborda <b>complicações da Doença do Refluxo Gastroesofágico (DRGE)</b>, com enfoque em <b>estenose péptica</b> e seu tratamento.</p>

          <p><span style="color:darkblue;"><b>Análise e explicação:</b></span> A <b>estenose péptica</b> é resultado de inflamação crônica no esôfago distal, provocada pelo refluxo ácido gástrico, levando à formação de tecido cicatricial e estreitamento do lúmen esofágico. Os principais sintomas são <span style="text-decoration: underline;">disfagia progressiva</span> e, em casos mais graves, perda de peso.</p>

          <p><span style="color:darkorange;"><b>Tratamento recomendado:</b></span> Conforme diretrizes reconhecidas, como as da <b>World Gastroenterology Organisation (WGO)</b> e dos <b>Manuais MSD</b>, o tratamento padrão da estenose péptica é:</p>

          <ul>
          <li><b>Dilatações endoscópicas repetidas</b> (como com vela de Savary): método efetivo, minimamente invasivo e de baixa morbidade, indicado para alívio da disfagia e restauração do calibre esofágico.</li>
          <li><b>Terapia medicamentosa agressiva com inibidores da bomba de prótons (IBPs):</b> essencial para controlar a acidez e prevenir recidiva da estenose.</li>
          </ul>

          <p><b><span style="color:darkblue;">Importante:</span></b> <u>A esofagectomia distal não é indicada rotineiramente</u> para estenose péptica. Este procedimento é reservado para poucos casos (<span style="font-weight:bold; color:darkorange;">falha terapêutica, recidivas graves e refratárias, ou suspeita de malignidade</span>), devido a seu risco cirúrgico elevado.</p>

          <p><span style="color:darkorange;"><b>Diretrizes e evidências:</b></span> Nas <b>Diretrizes Globais da WGO sobre Disfagia</b> (seção estenose esofágica péptica): <i>“A dilatação progressiva… constitui o tratamento escolhido. O tratamento anti-refluxo agressivo com inibidores da bomba de prótons… melhora a disfagia e reduz a necessidade de dilatações subsequentes.”</i></p>

          <p><span style="color:darkblue;"><b>Analisando as alternativas:</b></span></p>
          <ul>
          <li><b>C (certo):</b> Incorreto. Propõe uma conduta não baseada nas melhores práticas e diverge das diretrizes nacionais e internacionais.</li>
          <li><b>E (errado):</b> <span style="font-weight:bold; color:darkorange;">Correta</span>. Fosso conceitual entre estenose péptica (tratável de modo conservador) e necessidade de cirurgia de resgate extrema como esofagectomia distal.</li>
          </ul>

          <p><span style="color:darkblue;"><b>Dica de prova:</b></span> Atenção com afirmações que indicam cirurgias radicais como primeira escolha em doenças geralmente controláveis clinicamente. Sempre busque respaldo em protocolos e diretrizes.</p>

          <p><b>Gostou do comentário? Deixe sua avaliação aqui embaixo!</b></p>
          </div>

      - tipo: VF
        id: 121026-1653-16-KkulO4
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: "Quanto à doença do refluxo gastroesofágico (DRGE) e suas complicações, julgue o item que se segue.\_\n\nA biópsia esofágica sempre é indicada nos casos de DRGE em fase aguda de esofagite erosiva."
        gabarito: F
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>Para resolver a questão sobre a <span style="color: darkorange;"><strong>doença do refluxo gastroesofágico (DRGE)</strong></span> e a indicação de biópsia esofágica, é essencial entender que a DRGE é uma condição onde o conteúdo do estômago volta para o esôfago, causando sintomas e, em casos mais graves, danos ao revestimento esofágico.</p>

          <p><span style="color: darkblue;"><strong>Alternativa correta: E - errado</strong></span></p>

          <p>A afirmação de que a <strong>biópsia esofágica sempre é indicada</strong> em casos de DRGE na fase aguda de esofagite erosiva está <span style="color: darkorange;">incorreta</span>. A biópsia esofágica não é necessária em todos os casos de esofagite erosiva causada por DRGE.</p>

          <p>A indicação para biópsia é mais comum quando há <strong>dúvidas sobre o diagnóstico</strong>, se suspeita de condições como esofagite eosinofílica ou quando há complicações, como a suspeita de esôfago de Barrett, onde há risco aumentado de câncer.</p>

          <p>Portanto, uma abordagem baseada apenas na presença de esofagite erosiva não justifica a realização <strong>sempre</strong> da biópsia. A avaliação clínica e endoscópica geralmente é suficiente para o manejo inicial.</p>

          <p><span style="color: darkorange;"><strong>Por que a opção "C - certo" está incorreta?</strong></span></p>

          <p>Essa opção está incorreta porque pressupõe que a biópsia é um procedimento de rotina para todos os casos de DRGE em fase aguda de esofagite erosiva, o que, como explicado, não é verdade. A indicação de biópsia deve ser baseada em fatores clínicos específicos e suspeitas diagnósticas, não de forma generalizada.</p>

          <p>Em resumo, <span style="color: darkblue;"><strong>entender quando a biópsia é indicada</strong></span> ajuda a evitar procedimentos desnecessários e focar em um tratamento adequado baseado em evidências clínicas.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

      - tipo: ME
        id: 121026-1653-17-UJvvII
        tags:
          - Comentário Oficial
          - Refluxo Gastroesofágico
        enunciado: |-
          Paciente de 20 anos com índice de massa corpórea (IMC) de 40, refere rouquidão, tosse seca e pirose retroesternal.

          Supondo que esses sintomas possam estar associados à doença do refluxo gastro-esofágico, a primeira abordagem deveria
        alternativas:
          - id: alt_A
            texto: solicitar, imediatamente, esofagomanometria.
          - id: alt_B
            texto: solicitar endoscopia digestiva alta.
          - id: alt_C
            texto: indicar cirurgia bariátrica /metabólica.
          - id: alt_D
            texto: indicar correção cirúrgica do refluxo gastro-esofágico.
          - id: alt_E
            texto: indicar mudanças comportamentais e dietéticas.
        gabarito: E
        comentario_geral: |-
          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p><span style="color:#003366;"><b>Tema central:</b></span> Doença do Refluxo Gastroesofágico (DRGE) em paciente jovem e obeso, com sintomas típicos (pirose) e extraesofágicos (rouquidão, tosse seca). A obesidade (IMC 40) aumenta a pressão intra-abdominal, favorecendo relaxamentos transitórios do EEI e o refluxo.</p>

          <p><span style="color:#cc5500;"><b>Alternativa correta: E — indicar mudanças comportamentais e dietéticas.</b></span></p>

          <p><b>Justificativa:</b> Em adulto jovem, sem <u>sinais de alarme</u> (disfagia, perda ponderal, anemia, sangramento, vômitos persistentes), a <b>primeira abordagem</b> da DRGE é conservadora: <b>perda de peso</b> (forte recomendação em obesos), <b>elevação da cabeceira</b>, evitar refeições 2–3h antes de deitar, reduzir alimentos gatilho (gorduras, chocolate, café, álcool, menta, cítricos), parar tabagismo e evitar roupas apertadas. Diretrizes ACG 2022 e UpToDate recomendam iniciar com medidas de estilo de vida; pode-se associar teste terapêutico com IBP, mas como não é opção, a melhor escolha é E. (ACG Clinical Guideline: GERD, 2022; Harrison’s Principles of Internal Medicine; UpToDate)</p>

          <p><span style="color:#003366;"><b>Análise das alternativas incorretas</b></span></p>

          <p><b>A) Esofagomanometria</b>: não diagnostica DRGE; avalia <i>motilidade</i> (acalasia, espasmo) e é usada <u>pré-operatório</u> ou quando se suspeita distúrbio motor. Não é o primeiro exame em quadro típico sem alarme. (ACG/AGA)</p>

          <p><b>B) Endoscopia digestiva alta</b>: indicada se houver <u>alarme</u>, falha após 8 semanas de IBP, suspeita de complicações (esofagite grave, estenose) ou rastreio de Barrett em alto risco. Neste caso (20 anos, sem alarme), não é a primeira conduta. (ACG 2022)</p>

          <p><b>C) Cirurgia bariátrica/metabólica</b>: IMC ≥40 é indicação potencial, mas após avaliação multidisciplinar e tentativa de medidas conservadoras. Além disso, nem toda técnica melhora DRGE (ex.: sleeve pode piorar; bypass em Y de Roux tende a melhorar). Não é abordagem inicial para os sintomas apresentados.</p>

          <p><b>D) Correção cirúrgica do refluxo</b> (fundoplicatura): reservada a DRGE <u>comprovada</u>, refratária a tratamento otimizado, ou por preferência do paciente com evidência objetiva. Requer avaliação prévia com pH-impedanciometria e manometria. Não é inicial.</p>

          <p><span style="color:#cc5500;"><b>Dicas para prova</b></span>: Diante de pirose típica em jovem sem alarme, pense em <b>conduta conservadora</b>. Palavras-chave como “<u>primeira abordagem</u>” orientam a evitar exames invasivos e cirurgia. A presença de <i>extraesofágicos</i> (rouquidão/tosse) não muda a prioridade inicial sem alarme.</p>

          <p><b>Resumo prático:</b> Comece com <span style="color:#003366;"><b>mudanças de estilo de vida</b></span>; se disponível na prova, <b>teste com IBP</b> é apropriado. Reserve endoscopia e exames funcionais para falha terapêutica ou sinais de alarme.</p>

          <p>Gostou do comentário? Deixe sua avaliação aqui embaixo!</p>
          </div>

