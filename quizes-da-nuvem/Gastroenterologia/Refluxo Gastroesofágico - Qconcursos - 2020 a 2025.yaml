          <div class="qc-gabarito-professor" style="border: 2px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #ffffff;">
            <p>O tema central da questão é a <strong>doença do refluxo gastroesofágico (DRGE)</strong> em pediatria, um problema comum que causa preocupações significativas em lactentes e crianças.</p>

          <p><strong>Justificativa para a alternativa correta:</strong></p>

          <p><span style="color: darkorange;"><strong>Alternativa D:</strong></span> "É fundamental a prescrição de medicamentos para os lactentes que simplesmente vomitam." Esta é a alternativa incorreta. A prescrição de medicamentos para refluxo em lactentes deve ser criteriosa. Muitos lactentes apresentam regurgitação fisiológica, que é normal e não requer tratamento medicamentoso. A intervenção farmacológica é reservada para casos em que há complicações ou persistência de sintomas que afetam o bem-estar da criança, como esofagite ou sintomas respiratórios graves associados ao refluxo. Este manejo está de acordo com as diretrizes de tratamento pediátrico da <em>Sociedade Brasileira de Pediatria (SBP)</em>.</p>

          <p><strong>Análise das alternativas incorretas:</strong></p>

          <p><span style="color: darkorange;"><strong>Alternativa A:</strong></span> "Denomina-se DRGE quando o retorno do conteúdo gástrico causa sintomas prejudiciais ao bem-estar do indivíduo e/ou complicações clínicas." Esta afirmação está correta, pois a DRGE é definida pela presença de sintomas ou complicações decorrentes do refluxo, como esofagite, que afetam a qualidade de vida.</p>

          <p><span style="color: darkorange;"><strong>Alternativa B:</strong></span> "Os principais sintomas são: regurgitação ou vômitos associados com irritabilidade, odinofagia; anorexia ou recusa alimentar; baixo ganho de peso; dor abdominal; distúrbios do sono; sintomas respiratórios, como: tosse e chiado." Esta alternativa está correta, pois descreve um conjunto de sintomas comuns associados à DRGE em crianças.</p>

          <p><span style="color: darkorange;"><strong>Alternativa C:</strong></span> "O aleitamento materno exclusivo é de fundamental importância e deve ser mantido sempre que possível. Reduzir os intervalos entre as mamadas parece contribuir para a melhora dos sintomas." Esta afirmação está correta. O aleitamento materno é recomendado e pode ser benéfico, e ajustar os intervalos das mamadas pode ajudar a reduzir regurgitações em alguns casos.</p>

          <p>Para concluir, a questão destaca a importância de diferenciar entre refluxo fisiológico e DRGE em lactentes, evitando o uso indiscriminado de medicamentos. Isso enfatiza o uso de diretrizes atualizadas e o emprego de medidas não farmacológicas como primeira linha de intervenção.</p>

